name: Costruisci l'APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparo il progetto
        run: |
          unzip -q coach-pacchetto.zip
          cd coach-repo/android
          SITO="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          sed -i "s|https://ESEMPIO.github.io/coach/|$SITO|" app/src/main/res/values/strings.xml
          sed -i "s/version '8.7.3'/version '8.5.2'/" build.gradle
          sed -i "s/compileSdk 35/compileSdk 34/; s/targetSdk 35/targetSdk 34/" app/build.gradle
          sed -i "/androidx.webkit/d; /androidx.core:core/d" app/build.gradle
          sed -i "s/appcompat:1.7.0/appcompat:1.6.1/" app/build.gradle
          printf '\nconfigurations.all {\n    exclude group: %s, module: %s\n}\n' "'androidx.annotation'" "'annotation-jvm'" >> app/build.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilo
        working-directory: coach-repo/android
        run: gradle assembleDebug --no-daemon

      - name: Pubblico il link per scaricarlo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp coach-repo/android/app/build/outputs/apk/debug/app-debug.apk ./Coach.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ./Coach.apk --title "Coach" --notes "Ultima versione dell'app"
          echo "## Scarica qui" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/download/apk/Coach.apk" >> $GITHUB_STEP_SUMMARY
