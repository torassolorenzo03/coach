name: Costruisci l'APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apro il pacchetto e metto l'indirizzo
        run: |
          unzip -q coach-pacchetto.zip
          SITO="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Aprirà $SITO"
          sed -i "s|https://ESEMPIO.github.io/coach/|$SITO|" coach-repo/android/app/src/main/res/values/strings.xml
          cat coach-repo/android/app/src/main/res/values/strings.xml
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilo
        working-directory: coach-repo/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Coach-APK
          path: coach-repo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
