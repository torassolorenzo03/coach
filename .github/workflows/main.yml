name: Costruisci l'APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparo il progetto
        run: |
          unzip -q coach-pacchetto.zip
          cd coach-repo/android
          SITO="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          sed -i "s|https://ESEMPIO.github.io/coach/|$SITO|" app/src/main/res/values/strings.xml
          sed -i "s/version '8.7.3'/version '8.5.2'/" build.gradle
          sed -i "s/compileSdk 35/compileSdk 34/; s/targetSdk 35/targetSdk 34/" app/build.gradle
          sed -i "/androidx.webkit/d; /androidx.core:core/d" app/build.gradle
          sed -i "s/appcompat:1.7.0/appcompat:1.6.1/" app/build.gradle
          printf '\nconfigurations.all {\n    exclude group: %s, module: %s\n}\n' "'androidx.annotation'" "'annotation-jvm'" >> app/build.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "--- app/build.gradle ---"; cat app/build.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilo
        working-directory: coach-repo/android
        run: gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      - name: Se è andata male, scrivo l'errore qui
        if: failure()
        run: |
          {
            echo "## ERRORE"
            echo '```'
            sed -n '/FAILURE: Build failed/,/^\* Tr
