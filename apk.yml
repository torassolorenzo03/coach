name: Costruisci l'APK

# Un file solo: si scrive da sé tutto il progetto Android e compila l'APK.
# L'indirizzo del sito lo calcola da solo, non devi toccare niente.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Scrivo il progetto Android
        run: |
          set -e
          mkdir -p android/app android/app/src/main android/app/src/main/java/it/coach/app android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/values android/app/src/main/res/values-night
          echo '' | base64 -d > android/settings.gradle
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > android/build.gradle
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==' | base64 -d > android/gradle.properties
          echo '' | base64 -d > android/app/build.gradle
          echo '' | base64 -d > android/app/src/main/AndroidManifest.xml
          echo '' | base64 -d > android/app/src/main/res/values/themes.xml
          echo '' | base64 -d > android/app/src/main/res/values-night/themes.xml
          echo '' | base64 -d > android/app/src/main/java/it/coach/app/MainActivity.java
          echo '' | base64 -d > android/app/src/main/java/it/coach/app/Ponte.java
          echo '' | base64 -d > android/app/src/main/java/it/coach/app/Avvisi.java
          echo '' | base64 -d > android/app/src/main/java/it/coach/app/Avvisatore.java
          echo '' | base64 -d > android/app/src/main/java/it/coach/app/Riavvio.java
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          SITO="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "L'app aprirà: $SITO"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <string name="app_name">Coach</string>' "    <string name=\"indirizzo_app\">$SITO</string>" '</resources>' > android/app/src/main/res/values/strings.xml
          cat android/app/src/main/res/values/strings.xml

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilo
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ecco l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Coach-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
