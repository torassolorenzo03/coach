/* segna il valore di oggi */
function openHealthValue(id){
  const v = S.health.find(x => x.id === id); if (!v) return;
  const T = today();
  const cur = hVal(T, v.id);
  const w = document.createElement("div");
  w.className = "sheet";
  let body = "";
  if (v.type === "sonno"){
    body = `<div class="field"><label>A letto e sveglia</label>
      <div class="two">
        <input type="time" id="h-a" value="${cur ? cur.from : "23:30"}">
        <input type="time" id="h-b" value="${cur ? cur.to : "07:00"}">
      </div>
      <div class="hint" id="h-calc"></div></div>`;
  } else if (v.type === "durata"){
    body = `<div class="field"><label>Minuti</label>
      <input type="number" id="h-n" min="0" step="5" value="${cur ?? 30}"></div>`;
  } else if (v.type === "numero"){
    body = `<div class="field"><label>Quanto</label>
      <input type="number" id="h-n" min="0" value="${cur ?? 0}"></div>`;
  } else {
    body = `<div class="field"><label>Oggi</label>
      <div class="chips" id="h-yn">
        <button class="chip ${cur === true ? "on" : ""}" data-v="1">Sì</button>
        <button class="chip ${cur === false ? "on" : ""}" data-v="0">No</button>
      </div></div>`;
  }
  w.innerHTML = `
  <div class="sheetin">
    <h3>${esc(v.name)}</h3>
    ${body}
    <div class="btnrow">
      <button class="btn primary" id="h-save" style="flex:2">Salva</button>
      <button class="btn ghost" id="h-cancel">Annulla</button>
    </div>
    ${cur !== undefined ? `<div class="btnrow"><button class="btn danger wide" id="h-clear">Cancella il dato di oggi</button></div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  let yn = cur === true ? 1 : (cur === false ? 0 : null);
  if (v.type === "sino"){
    const calc = () => {};
    w.querySelectorAll("#h-yn .chip").forEach(c => c.onclick = () => {
      yn = +c.dataset.v;
      w.querySelectorAll("#h-yn .chip").forEach(x => x.classList.toggle("on", x === c));
    });
  }
  if (v.type === "sonno"){
    const a = w.querySelector("#h-a"), b = w.querySelector("#h-b"), out = w.querySelector("#h-calc");
    const calc = () => {
      if (!a.value || !b.value){ out.textContent = "Metti tutti e due gli orari."; return; }
      let m = toMin(b.value) - toMin(a.value);
      if (m <= 0) m += 1440;                     // si dorme oltre la mezzanotte
      out.textContent = `Fanno ${durLabel(m)}.`;
    };
    a.oninput = calc; b.oninput = calc; calc();
  }

  w.querySelector("#h-cancel").onclick = () => w.remove();
  if (cur !== undefined) armDelete(w.querySelector("#h-clear"), "Cancella il dato di oggi", () => {
    if (S.hlog[T]) delete S.hlog[T][v.id];
    save(); w.remove(); render();
  });
  w.querySelector("#h-save").onclick = () => {
    let val;
    if (v.type === "sonno"){
      const from = w.querySelector("#h-a").value, to = w.querySelector("#h-b").value;
      if (!from || !to){ w.remove(); return; }
      let m = toMin(to) - toMin(from);
      if (m <= 0) m += 1440;
      val = { from, to, min: m };
    } else if (v.type === "sino"){
      if (yn === null){ w.remove(); return; }
      val = yn === 1;
    } else {
      val = Math.max(0, +w.querySelector("#h-n").value || 0);
    }
    S.hlog[T] = S.hlog[T] || {};
    S.hlog[T][v.id] = val;
    save(); w.remove(); render();
  };
}

function bindOpzioni(){
  const q = id => el.querySelector("#" + id);
  const on = (id, ev, fn) => { const x = q(id); if (x) x[ev] = fn; };
  on("optback", "onclick", () => { OPTSUB = null; render(); });

  // la giornata
  on("op-wake", "onchange", e => { S.wake = e.target.value || "07:00"; save(); render(); });
  on("op-sleep", "onchange", e => { S.sleepH = Math.min(14, Math.max(3, +e.target.value || 7)); save(); render(); });
  const us = el.querySelector("[data-usesleep]");
  if (us) us.onclick = () => { S.sleepH = Math.round((+us.dataset.usesleep / 60) * 2) / 2; save(); render(); };
  on("closeat", "onchange", e => { S.closeAt = e.target.value || "21:00"; save(); });
  on("op-metti-sveglia", "onclick", () => {
    const ora = q("op-sveglia") ? q("op-sveglia").value : S.wake;
    if (!svegliaTelefono(ora, "Coach")) alert("Non sono riuscito ad aprire l'orologio del telefono.");
  });

  // notifiche
  on("op-push", "onclick", () => { S.push.on = !S.push.on; save(); render(); });
  on("op-pushora", "onchange", e => { S.push.ora = e.target.value || "08:00"; save(); render(); });
  on("op-pushatt", "onclick", () => { S.push.attivita = !S.push.attivita; save(); render(); });
  on("op-pushsera", "onclick", () => { S.push.sera = !S.push.sera; save(); render(); });
  on("op-prova", "onclick", () => provaNotifica());
  on("op-esatte", "onclick", () => { try { NAT.apriImpostazioniSveglie(); } catch(e){} });
  el.querySelectorAll("[data-avdef]").forEach(b => b.onclick = () => openAvvisoDef(b.dataset.avdef));
  on("op-frigo", "onchange", e => { S.fridgeWarn = Math.max(0, Math.min(30, Math.round(+e.target.value || 0))); save(); render(); });
  on("op-ledage", "onchange", e => { S.ledgerAge = Math.max(0, Math.min(365, Math.round(+e.target.value || 0))); save(); render(); });

  // calendario
  on("gtog", "onclick", () => {
    S.gcalOn = !S.gcalOn;
    save();
    if (S.gcalOn && gcalSupported()){
      let ok = false; try { ok = NAT.calendarioConcesso(); } catch(e){}
      if (!ok){ gcalAsk(); return; }
    }
    gcalStart();
  });
  on("gc-perm", "onclick", () => gcalAsk());
  on("gc-app", "onclick", () => { try { NAT.apriImpostazioniApp(); } catch(e){} });
  on("gc-read", "onclick", () => gcalStart());
  el.querySelectorAll("[data-gcal]").forEach(b => b.onclick = () => {
    const id = String(b.dataset.gcal);
    S.gcalOff = S.gcalOff.includes(id) ? S.gcalOff.filter(x => x !== id) : [...S.gcalOff, id];
    save(); gcalStart();
  });

  // pausa
  on("op-pause", "onclick", () => { if (isPaused()) endPause(); else openPause(""); });

  // dati
  on("op-export", "onclick", () => esportaBackup());
  on("op-import", "onclick", () => importaBackup());
  on("op-sync", "onclick", () => {
    S.sync.repo = q("op-repo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$/, "");
    S.sync.token = q("op-token").value.trim();
    S.sync.sha = null;
    save();
    sincronizza();
  });
  on("op-syncauto", "onclick", () => { S.sync.auto = !S.sync.auto; save(); render(); });

  // aspetto
  el.querySelectorAll("[data-skin]").forEach(b => b.onclick = () => { S.skin = b.dataset.skin; save(); applyTheme(); render(); });
  el.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { S.mode = b.dataset.mode; save(); applyTheme(); render(); });

  // riparti da zero
  const rs = q("rs-stats"); if (rs) armDelete(rs, "Azzera le statistiche", () => { resetStats(); render(); });
  const ra = q("rs-all");   if (ra) armDelete(ra, "Svuota tutto", () => { resetAll(); TAB = "oggi"; OPTSUB = null; render(); });
}

function oneoffList(){
  const T = today();
  return S.oneoffs.filter(o => (o.endDate || o.date) >= T)
    .sort((a,b) => a.date.localeCompare(b.date) || (a.start||"").localeCompare(b.start||""));
}

/* ---------- APPUNTAMENTI ED EVENTI ---------- */
// quelli di oggi (anche se durano più giorni e sono cominciati prima)
function eventsOn(d){
  return S.oneoffs.filter(o => d >= o.date && d <= (o.endDate || o.date))
    .sort((a,b) => (a.allDay?1:0) - (b.allDay?1:0) || (a.start||"").localeCompare(b.start||""));
}
// quelli che arrivano, dentro la finestra di preavviso che hai scelto per ognuno
function eventsSoon(d){
  return S.oneoffs.filter(o => {
    if (o.date <= d) return false;
    const g = avvisoOf(o, "avviso", "evento").giorni;
    return g.length && daysBetween(d, o.date) <= Math.max(...g);
  }).sort((a,b) => a.date.localeCompare(b.date));
}

function evWhen(o, d){
  const fine = o.endDate || o.date;
  const piuGiorni = fine !== o.date;
  if (o.allDay) return piuGiorni ? `tutto il giorno · fino al ${prettyDate(fine)}` : "tutto il giorno";
  if (!piuGiorni) return `${o.start}–${o.end}`;
  if (d === o.date) return `dalle ${o.start} · fino al ${prettyDate(fine)}`;
  if (d === fine)   return `fino alle ${o.end}`;
  return `tutto il giorno · fino al ${prettyDate(fine)}`;
}

function eventRow(o, d, futuro){
  const dd = futuro ? daysBetween(d, o.date) : 0;
  return `
  <button class="actrow" data-ev="${o.id}">
    <div class="imp" style="min-height:34px;background:${futuro ? "var(--line)" : "var(--accent)"}"></div>
    <div class="rbody">
      <div class="rtitle">${esc(o.label)}</div>
      <div class="rmeta">${futuro
        ? `${GG3[dow(o.date)]} ${prettyDate(o.date)} · ${dd === 1 ? "domani" : `fra ${dd} giorni`}${o.allDay ? "" : ` · ${o.start}`}`
        : evWhen(o, d)}${o.place ? `<span class="dot">·</span>${esc(o.place)}` : ""}${o.busy === false && !o.allDay ? `<span class="dot">·</span>non occupa il tempo` : ""}</div>
      ${o.note ? `<div class="rmeta" style="color:var(--ink-faint)">${esc(o.note)}</div>` : ""}
    </div>
  </button>`;
}

function eventsHTML(T){
  const oggi = eventsOn(T), presto = eventsSoon(T);
  if (!oggi.length && !presto.length) return "";
  return `
  ${oggi.length ? `<h2>Oggi hai</h2>
  <div class="card">${oggi.map(o => eventRow(o, T, false)).join("")}</div>` : ""}
  ${presto.length ? `<h2>Sta arrivando</h2>
  <div class="card">${presto.map(o => eventRow(o, T, true)).join("")}</div>` : ""}`;
}

    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  let allDay = !!o.allDay, busyO = o.busy !== false, showO = o.showInMonth !== false;
  const oShow = w.querySelector("#o-show"), oBusy = w.querySelector("#o-busy");
  function paintEv(){
    w.querySelectorAll("#o-kind .chip").forEach(b => b.classList.toggle("on", (b.dataset.a === "1") === allDay));
    w.querySelector("#o-timebox").style.display = allDay ? "none" : "";
    oBusy.classList.toggle("on", busyO && !allDay);
    oBusy.style.opacity = allDay ? .45 : 1;
    oShow.classList.toggle("on", showO);
  }
  w.querySelectorAll("#o-kind .chip").forEach(b => b.onclick = () => { allDay = b.dataset.a === "1"; paintEv(); });
  pAv.bind(w);
  // IL CONSIGLIO: com'è messo quel giorno, cosa si sovrappone, e i giorni più liberi
  const adv = w.querySelector("#o-advice");
  function consigliaEv(){
    const d = w.querySelector("#o-d").value;
    if (!d){ adv.innerHTML = ""; return; }
    const L = dayLoad(d);
    const s0 = toMin(w.querySelector("#o-s").value || "00:00"), e0 = toMin(w.querySelector("#o-e").value || "00:00");
    const sopra = allDay ? [] : busyLabeled(d).filter(b => b.s < e0 && b.e > s0 && !(b.src === "singolo" && b.label === o.label));
    const pieno = L.word === "piena" || sopra.length;
    let html = `<div class="rtitle" style="font-size:14px">${esc(dayChip(d))}</div>
      <div class="rmeta" style="margin-top:4px;${pieno ? "color:var(--warn)" : ""}">${esc(loadLine(L))}.</div>`;
    if (sopra.length) html += `<div class="rmeta" style="color:var(--warn);margin-top:4px">Si sovrappone a: ${sopra.map(b => `${esc(b.label)} ${toHHMM(b.s)}–${toHHMM(b.e)}`).join(", ")}.</div>`;
    if (pieno){
      const dur = allDay ? 0 : Math.max(0, e0 - s0);
      const alt = suggestDays({ from: today(), days: 14, dur, win: allDay ? null : { start: w.querySelector("#o-s").value, end: w.querySelector("#o-e").value } })
        .filter(x => x.fits && x.d !== d).slice(0, 3);
      if (alt.length) html += `<div class="rmeta" style="margin-top:9px;color:var(--ink)">Se puoi sceglierlo tu, quelli più liberi${allDay ? "" : " a quell'ora"}:</div>
        <div class="why" style="margin-top:6px">${alt.map(x => `<button data-od="${x.d}">${esc(dayChip(x.d))} · ${x.L.word}</button>`).join("")}</div>`;
    }
    adv.innerHTML = html;
    adv.querySelectorAll("[data-od]").forEach(b => b.onclick = () => {
      const dd = b.dataset.od, d1 = w.querySelector("#o-d"), d2 = w.querySelector("#o-d2");
      const lung = Math.max(0, daysBetween(d1.value, d2.value || d1.value));
      d1.value = dd; d2.value = addDays(dd, lung); consigliaEv();
    });
  }
  ["#o-d","#o-s","#o-e"].forEach(sel => w.querySelector(sel).addEventListener("change", consigliaEv));
  w.querySelectorAll("#o-kind .chip").forEach(b => b.addEventListener("click", consigliaEv));
  oBusy.onclick = () => { if (allDay) return; busyO = !busyO; paintEv(); };
  oShow.onclick = () => { showO = !showO; paintEv(); };
  paintEv();
  consigliaEv();

  w.querySelector("#o-cancel").onclick = () => w.remove();
  if (id) armDelete(w.querySelector("#o-del"), "Elimina evento", () => {
    S.oneoffs = S.oneoffs.filter(x => x.id !== id);
    runEngine(); save(); w.remove(); render();
  });
  w.querySelector("#o-save").onclick = () => {
    const label = w.querySelector("#o-l").value.trim();
    const date = w.querySelector("#o-d").value;
    let fine = w.querySelector("#o-d2").value || date;
    const s = w.querySelector("#o-s").value, e = w.querySelector("#o-e").value;
    if (!label){ alert("Serve un nome."); return; }
    if (!date){ alert("Serve un giorno."); return; }
    if (fine < date) fine = date;
    if (!allDay && fine === date && toMin(e) <= toMin(s)){ alert("L'orario finisce prima di iniziare."); return; }
    const next = { ...o, label, date, endDate: fine, start:s, end:e, allDay,
                   busy: allDay ? false : busyO, avviso: pAv.value(),
                   place: w.querySelector("#o-p").value.trim(),
                   note: w.querySelector("#o-n").value.trim(),
                   showInMonth: showO };
    const i = S.oneoffs.findIndex(x => x.id === o.id);
    if (i >= 0) S.oneoffs[i] = next; else S.oneoffs.push(next);
    runEngine(); save(); w.remove(); render();
  };
}

/* ---------- la giornata sveglio ----------
   Il tempo libero non è "dalle 7 alle 23" per tutti: dipende da quanto
   dormi. Da qui esce sia il conto delle ore libere sia la barra di Oggi. */
function awakeFrom(){ return toMin(S.wake || "07:00"); }
function awakeTo(){
  const h = Math.min(14, Math.max(3, S.sleepH || 7));
  return Math.min(1440, awakeFrom() + Math.round((24 - h) * 60));
}

function freeMinutesOn(d){
  const a = awakeFrom(), b = awakeTo();
  const occupato = busyOn(d)
    .map(([s,e]) => [Math.max(s,a), Math.min(e,b)])
    .filter(([s,e]) => e > s)
    .reduce((sum,[s,e]) => sum + (e - s), 0);
  return Math.max(0, (b - a) - occupato);
}

function weekFreeHTML(){
  const T = today();
  return [0,1,2,3,4,5,6].map(i => {
    const d = addDays(T, i);
    return `<div class="stat"><span>${GG[dow(d)]} ${prettyDate(d)}</span><span>${durLabel(freeMinutesOn(d))} liberi</span></div>`;
  }).join("");
}

// quanto hai dormito davvero, dalla scheda Salute
function sonnoMedio(){
  const v = S.health.find(x => x.type === "sonno");
  if (!v) return null;
  const T = today(), vals = [];
  for (let i = 1; i <= 14; i++){
    const x = hVal(addDays(T, -i), v.id);
    if (x && x.min) vals.push(x.min);
  }
  if (vals.length < 3) return null;
  return { min: Math.round(vals.reduce((s,x)=>s+x,0) / vals.length), n: vals.length };
}

/* ============================================================
   SALVADANAIO — obiettivi di denaro, aggiornati a mano
   ============================================================ */
const piggySaved = x => (x.moves || []).reduce((s,m) => s + (+m.amount || 0), 0);
const piggyLeft  = x => Math.max(0, (+x.target || 0) - piggySaved(x));
const piggyPct   = x => (+x.target > 0) ? Math.min(100, Math.round(piggySaved(x) / x.target * 100)) : 0;

// quanto mettere via al mese per arrivarci entro la data
function piggyRate(x){
  if (!x.due) return null;
  const gg = daysBetween(today(), x.due);
  if (gg <= 0 || piggyLeft(x) <= 0) return null;
  const mesi = Math.max(1, Math.round(gg / 30));
  return { mesi, al: Math.ceil(piggyLeft(x) / mesi) };
}

function piggyBar(x){
  const q = piggyPct(x);
  return `<div style="height:7px;border-radius:4px;background:var(--surface-2);margin-top:8px;overflow:hidden">
    <div style="height:100%;width:${q}%;background:${q >= 100 ? "var(--done)" : "var(--accent)"};border-radius:4px"></div>
  </div>`;
}

function piggyRow(x){
  const r = piggyRate(x);
  const fatto = piggyLeft(x) <= 0;
  return `
  <button class="actrow" data-pig="${x.id}" style="display:block">
    <div class="rbody">
      <div class="rtitle">${esc(x.name)}${fatto ? " · raggiunto" : ""}</div>

      ${piggyBar(x)}

}

/* ============================================================
   INVESTIMENTI — cosa hai messo dove, quando paga, quando scade
   L'app non legge i mercati: i numeri sono quelli che scrivi tu.
   ============================================================ */
const IKIND = { obbligazione:"Obbligazione", azione:"Azione", etf:"ETF", fondo:"Fondo",
                conto:"Conto deposito", pac:"Piano di accumulo", altro:"Altro" };
const IPAY  = { nessuna:"Non paga niente", cedola:"Cedola", dividendo:"Dividendo", interessi:"Interessi" };
const IEVERY = { 1:"ogni mese", 3:"ogni 3 mesi", 6:"ogni 6 mesi", 12:"una volta l'anno" };

function addMonths(sIso, n){
  const d = fromIso(sIso), giorno = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(giorno, ultimo));
  return iso(d);
}

const investOpen = () => S.invest.filter(x => !x.closed);
const investCashed = x => (x.payments || []).reduce((s,m) => s + (+m.amount || 0), 0);

function investTotals(){
  let messo = 0, incassato = 0;
  for (const x of investOpen()) messo += (+x.amount || 0);
  for (const x of S.invest) incassato += investCashed(x);
  return { messo, incassato };
}

// il prossimo appuntamento: una cedola da incassare o una scadenza
function investNext(x){
  const T = today(), out = [];
  if (x.nextPay && x.nextPay >= T) out.push({ d:x.nextPay, k:"pagamento" });
  if (x.maturity && x.maturity >= T) out.push({ d:x.maturity, k:"scadenza" });
  out.sort((a,b) => a.d.localeCompare(b.d));
  return out[0] || null;
}

function investAlerts(T){
  const out = [];
  const soglia = (x, campo, tipo, def) => { const g = avvisoOf(x, campo, tipo).giorni; return g.length ? Math.max(...g) : def; };
  for (const x of investOpen()){
    if (x.nextPay){
      const dd = daysBetween(T, x.nextPay);
      if (dd >= 0 && dd <= soglia(x, "avvisoPay", "pagamento", 7)) out.push({ id:x.id, t:`${x.name}: ${IPAY[x.payType] || "pagamento"} ${dd === 0 ? "oggi" : dd === 1 ? "domani" : `fra ${dd} giorni`}` });
      else if (dd < 0) out.push({ id:x.id, t:`${x.name}: ${IPAY[x.payType] || "pagamento"} era il ${prettyDate(x.nextPay)}, da segnare` });
    }
    if (x.maturity){
      const dd = daysBetween(T, x.maturity);
      if (dd >= 0 && dd <= soglia(x, "avvisoMat", "scadenzaInv", 30)) out.push({ id:x.id, t:`${x.name} scade ${dd === 0 ? "oggi" : `fra ${dd} giorni`}` });
    }
  }
  return out;
}

function investRow(x){
  const T = today();
  const nx = investNext(x);
  const inc = investCashed(x);
  return `
  <button class="actrow" data-inv="${x.id}">
    <div class="imp" style="min-height:38px;background:${x.closed ? "var(--line)" : "var(--accent)"}"></div>
    <div class="rbody">

/* ============================================================
   USCITE — abbonamenti, spese fisse e uscite straordinarie
   ============================================================ */
const OGNI = {
  w:    { nome:"Ogni settimana", mesi:0,  giorni:7 },
  m:    { nome:"Ogni mese",      mesi:1 },
  "2m": { nome:"Ogni 2 mesi",    mesi:2 },
  "3m": { nome:"Ogni 3 mesi",    mesi:3 },
  "6m": { nome:"Ogni 6 mesi",    mesi:6 },
  y:    { nome:"Una volta l'anno", mesi:12 },
  once: { nome:"Una tantum",     mesi:0 }
};
const BCAT = ["Casa","Telefono e internet","Streaming","Assicurazioni","Auto","Salute","Sport","Lavoro","Altro"];

const billsOpen = () => S.bills.filter(b => !b.closed);

// quanto pesa al mese: tutto ridotto alla stessa misura
function billMonthly(b){
  const a = +b.amount || 0;
  if (b.every === "w") return a * 4.345;
  if (b.every === "once") return 0;
  const m = OGNI[b.every] ? OGNI[b.every].mesi : 1;
  return m ? a / m : 0;
}

function billTotals(){
  let mese = 0, anno = 0, unaTantum = 0;
  for (const b of billsOpen()){
    if (b.every === "once"){ unaTantum += +b.amount || 0; continue; }
    mese += billMonthly(b);
  }
  anno = mese * 12;
  return { mese: Math.round(mese * 100) / 100, anno: Math.round(anno), unaTantum };
}

function billNextDate(b){
  if (!b.next) return "";
  if (b.every === "w") return addDays(b.next, 7);
  const m = OGNI[b.every] ? OGNI[b.every].mesi : 0;
  return m ? addMonths(b.next, m) : "";
}

// fino a quanti giorni prima una spesa si fa vedere in cima all'app
function billSoglia(b){ const g = avvisoOf(b, "avviso", "uscita").giorni; return g.length ? Math.max(...g) : 0; }

function billAlerts(T){
  const out = [];
  for (const b of billsOpen()){
    if (!b.next) continue;
    const dd = daysBetween(T, b.next);
    const soglia = billSoglia(b);
    if (dd < 0) out.push({ id:b.id, t:`${b.name}: ${euro(+b.amount||0)} era il ${prettyDate(b.next)}` });
    else if (dd <= soglia) out.push({ id:b.id, t:`${b.name}: ${euro(+b.amount||0)} ${dd === 0 ? "oggi" : dd === 1 ? "domani" : `fra ${dd} giorni`}` });
  }
  return out;
}

function billRow(b, T){
  const dd = b.next ? daysBetween(T, b.next) : null;
  const vicino = dd !== null && dd <= billSoglia(b);
  return `
  <button class="actrow" data-bill="${b.id}">
    <div class="imp" style="min-height:38px;background:${b.closed ? "var(--line)" : vicino ? "var(--warn)" : "var(--busy)"}"></div>
    <div class="rbody">
      <div class="rtitle"${b.closed ? ` style="color:var(--ink-faint)"` : ""}>${esc(b.name)} · ${euro(+b.amount || 0)}</div>
      <div class="rmeta">${OGNI[b.every] ? OGNI[b.every].nome.toLowerCase() : ""}${b.cat ? `<span class="dot">·</span>${esc(b.cat)}` : ""}${b.method ? `<span class="dot">·</span>${esc(b.method)}` : ""}</div>
      <div class="rmeta" style="color:${vicino && !b.closed ? "var(--warn)" : "var(--ink-faint)"}">
        ${b.closed ? `disdetto il ${prettyDate(b.closed.d)}`
          : b.next ? `${dd < 0 ? `scaduta da ${-dd} ${-dd === 1 ? "giorno" : "giorni"}` : dd === 0 ? "esce oggi" : dd === 1 ? "esce domani" : `esce fra ${dd} giorni`} · ${prettyDate(b.next)}`
                   : "senza data"}${b.every !== "once" && !b.closed ? `<span class="dot">·</span>${euro(Math.round(billMonthly(b) * 100) / 100)} al mese` : ""}</div>
    </div>
  </button>`;
}

  paintW();
  w.querySelector("#wn-cancel").onclick = () => w.remove();
  if (id) armDelete(w.querySelector("#wn-del"), "Elimina", () => {
    S.wines = S.wines.filter(y => y.id !== id); save(); w.remove(); render();
  });
  w.querySelector("#wn-save").onclick = () => {
    const name = w.querySelector("#wn-n").value.trim();
    if (!name){ alert("Serve almeno il nome."); return; }
    const next = { ...x, name, type: tipo, rating: voto,
      region: w.querySelector("#wn-r").value.trim(),

      producer: w.querySelector("#wn-p").value.trim(),

      note: w.querySelector("#wn-note").value.trim() };

    if (i >= 0) S.wines[i] = next; else S.wines.push(next);
    save(); w.remove(); render();
  };
}

/* ============================================================
   GLI AVVISI — quando il telefono ti avvisa
   Per ogni cosa con una data (una cedola, un'uscita, un evento, un obiettivo)
   scegli quanti giorni prima, anche più di una volta, e a che ora.
   Se non scegli niente valgono quelli delle impostazioni.
   ============================================================ */
const AV_GIORNI = [[0,"Il giorno stesso"],[1,"1 giorno prima"],[2,"2 giorni prima"],[3,"3 giorni prima"],
                   [7,"1 settimana prima"],[14,"2 settimane prima"],[30,"1 mese prima"]];
const AV_PRIMA  = [[0,"No"],[15,"15 min"],[30,"30 min"],[60,"1 ora"],[120,"2 ore"]];

function avvisoOf(obj, campo, tipo){
  const base = { ...AVVISI_DEF[tipo], ...((S.avvisiDef && S.avvisiDef[tipo]) || {}) };
  const x = obj && obj[campo];
  const src = x || base;
  return { giorni: (src.giorni || []).slice(), ora: src.ora || base.ora || "09:00", prima: +(src.prima || 0) };
}

const giorniPrimaLabel = g => g === 0 ? "il giorno stesso" : g === 1 ? "il giorno prima" : g === 7 ? "una settimana prima"
  : g === 14 ? "due settimane prima" : g === 30 ? "un mese prima" : `${g} giorni prima`;

function avvisoLabel(av, conPrima){
  const parti = av.giorni.slice().sort((a,b) => b - a).map(giorniPrimaLabel);
  let s = parti.length ? `${parti.join(", ")}, alle ${av.ora}` : "";
  if (conPrima && av.prima) s += (s ? " · " : "") + `${durLabel(av.prima)} prima dell'inizio`;
  return s || "nessun avviso";
}

const fraLabel = g => g === 0 ? "oggi" : g === 1 ? "domani" : g === 7 ? "fra una settimana" : g === 30 ? "fra un mese" : `fra ${g} giorni`;

// Il pezzo di modulo per scegliere gli avvisi. Si usa così:
//   const p = avvisoPicker("id", avviso, { prima:true }); ... p.html ... p.bind(foglio); p.value()
function avvisoPicker(uid, av, opts){
  opts = opts || {};
  const st = { giorni: (av.giorni || []).slice(), ora: av.ora || "09:00", prima: +(av.prima || 0) };
  const html = `
    <div id="${uid}">
      <div class="chips" data-avg></div>
      <div class="segline" style="margin-top:9px">
        <input type="number" data-avn min="1" max="365" placeholder="Altro: quanti giorni prima" style="flex:1">
        <button class="btn" data-avadd style="flex:0 0 auto">Aggiungi</button>
      </div>
      <div class="segline" style="margin-top:2px">
        <span style="flex:1;font-size:13.5px;color:var(--ink-soft)">A che ora</span>
        <input type="time" data-avora value="${st.ora}" style="flex:0 0 120px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">
      </div>
      ${opts.prima ? `<div style="font-size:13.5px;color:var(--ink-soft);margin:4px 0 7px">E prima che cominci</div><div class="chips" data-avp></div>` : ""}
      <div class="hint" data-avh></div>
    </div>`;
  let root = null;
  function paint(){
    if (!root) return;
    const box = root.querySelector("[data-avg]");
    const extra = st.giorni.filter(g => !AV_GIORNI.some(([v]) => v === g));
    box.innerHTML = AV_GIORNI.map(([v,l]) => `<button class="chip${st.giorni.includes(v) ? " on" : ""}" data-g="${v}">${l}</button>`).join("")
      + extra.map(g => `<button class="chip on" data-g="${g}">${g} giorni prima &times;</button>`).join("");
    box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      const g = +b.dataset.g;
      st.giorni = st.giorni.includes(g) ? st.giorni.filter(x => x !== g) : [...st.giorni, g];
      paint();
    });
    const pb = root.querySelector("[data-avp]");
    if (pb){
      pb.innerHTML = AV_PRIMA.map(([v,l]) => `<button class="chip${st.prima === v ? " on" : ""}" data-p="${v}">${l}</button>`).join("");
      pb.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { st.prima = +b.dataset.p; paint(); });
    }
    root.querySelector("[data-avh]").textContent = "Ti avviso: " + avvisoLabel(st, !!opts.prima) + ".";
  }
  return {
    html,
    bind(w){
      root = w.querySelector("#" + uid);
      root.querySelector("[data-avora]").onchange = e => { st.ora = e.target.value || "09:00"; paint(); };
      root.querySelector("[data-avadd]").onclick = () => {
        const inp = root.querySelector("[data-avn]");
        const g = Math.round(+inp.value);
        if (g > 0 && !st.giorni.includes(g)) st.giorni.push(g);
        inp.value = ""; paint();
      };
      paint();
    },
    value(){ return { giorni: [...new Set(st.giorni)].sort((a,b) => b - a), ora: st.ora, prima: opts.prima ? st.prima : 0 }; }
  };
}

// Programma le notifiche di una cosa con una data.
function schedAvviso(metti, idBase, data, av, titolo, testo, forte, inizioMin){
  for (const g of av.giorni){
    metti(`${idBase}-g${g}`, alle(addDays(data, -g), av.ora), titolo, testo(g, false), forte);
  }
  if (av.prima && inizioMin !== undefined && inizioMin !== null)
    metti(`${idBase}-p`, alle(data, "00:00") + (inizioMin - av.prima) * 60000, titolo, testo(0, true), forte);
}

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

/* ============================================================
   IL TELEFONO — notifiche, sveglie e timer, quando l'app gira
   dentro l'involucro Android. Nel browser questo pezzo dorme.
   ============================================================ */
const NAT = (typeof window !== "undefined" && window.CoachNativo) ? window.CoachNativo : null;
const inApp = () => { try { return !!(NAT && NAT.disponibile()); } catch(e){ return false; } };

const alle = (d, hhmm) => {
  const [h,m] = (hhmm || "08:00").split(":").map(Number);
  const x = fromIso(d); x.setHours(h, m, 0, 0);
  return x.getTime();
};

/* Tutto quello che merita una notifica nel prossimo mese. Si riprogramma
   ogni volta che l'app si apre o salva qualcosa. */
function avvisiDaProgrammare(){
  const T = today(), ora = Date.now(), out = [];
  const limite = ora + 31 * 86400000;
  const metti = (id, quando, titolo, testo, forte) => {
    if (quando > ora + 60000 && quando < limite) out.push({ id, quando, titolo, testo, forte: !!forte });
  };

  for (let i = 0; i < 14; i++){
    const d = addDays(T, i);
    const acts = planFor(d);

    // il riassunto del mattino
    if (S.push.on){
      const rem = remindersOn(d).length, gct = gcalTodosOn(d).length;
      const mr = i === 0 ? missedList().length : 0;
      const pezzi = [];
      if (acts.length + gct) pezzi.push(`${acts.length + gct} ${acts.length + gct === 1 ? "cosa da fare" : "cose da fare"}`);
      if (rem) pezzi.push(`${rem} promemoria`);
      if (mr) pezzi.push(`${mr} da ridecidere`);
      if (pezzi.length) metti("giorno-" + d, alle(d, S.push.ora), "La giornata", pezzi.join(", ") + ".");
    }

    // le attività, all'inizio della loro fascia
    if (S.push.attivita && i < 7) for (const a of acts){
      if (isDone(d, a.id)) continue;
      metti(`act-${a.id}-${d}`, alle(d, a.win.start), a.name, `Adesso, fino alle ${a.win.end} · ${durLabel(a.dur)}.`, a.imp === 1);
    }

    // la chiusura serale
    if (S.push.sera && !S.closes[d])
      metti("chiusura-" + d, alle(d, S.closeAt || "21:00"), "Chiudi la giornata", "Due minuti per dire com'è andata.");

    // la spesa
    if (shopDay(d) && shopLeft())
      metti("spesa-" + d, alle(d, "17:30"), "Spesa", `${shopLeft()} ${shopLeft() === 1 ? "cosa" : "cose"} in lista.`);

    // la valigia, la sera prima
    for (const t of S.trips){
      const restano = t.items.filter(x => !tripDone(t.id, x.id)).length;
      if (daysBetween(d, t.date) === 1 && restano) metti("vg-" + t.id, alle(d, "20:00"), "Valigia · " + t.name,
        `${restano} ${restano === 1 ? "cosa" : "cose"} da mettere: si parte domani.`, true);
    }

    // frigo: quello che scade quel giorno
    const scad = S.fridge.filter(f => f.exp === d).map(f => f.name);
    if (scad.length) metti("frigo-" + d, alle(d, "10:00"), "Frigo",
      `${scad.slice(0,3).join(", ")} ${scad.length === 1 ? "scade" : "scadono"} oggi.`);
  }

  // eventi scritti qui
  for (const o of S.oneoffs){
    if ((o.endDate || o.date) < T) continue;
    const av = avvisoOf(o, "avviso", "evento");
    const quando = o.allDay ? "tutto il giorno" : `alle ${o.start}`;
    schedAvviso(metti, "ev-" + o.id, o.date, o.allDay ? { ...av, prima:0, giorni: av.giorni.length ? av.giorni : [0] } : av, o.label,
      (g, prima) => prima ? `Fra ${durLabel(av.prima)}${o.place ? " · " + o.place : ""}.`
                          : `${g === 0 ? "Oggi" : cap(fraLabel(g))}, ${quando}${o.place ? " · " + o.place : ""}.`,
      true, o.allDay ? null : toMin(o.start));
  }

  // eventi di Google a cui hai aggiunto un avviso
  if (S.gcalOn) for (const g of GCAL.list){
    const ex = gcxOf(g.key);
    if (!ex.avviso || g.date < T) continue;
    const av = avvisoOf(ex, "avviso", "evento");
    schedAvviso(metti, `gc-${g.key}-${g.date}`, g.date, av, g.label,
      (n, prima) => prima ? `Fra ${durLabel(av.prima)}${g.place ? " · " + g.place : ""}.`
                          : `${n === 0 ? "Oggi" : cap(fraLabel(n))}${g.allDay ? "" : `, alle ${g.start}`}${ex.note ? " · " + ex.note : ""}.`,
      ex.imp === 1, g.allDay ? null : g.s);
  }

  // uscite in arrivo
  for (const b of billsOpen()){
    if (!b.next || b.next < T) continue;
    schedAvviso(metti, "bill-" + b.id, b.next, avvisoOf(b, "avviso", "uscita"), b.name,
      g => `${euro(+b.amount || 0)} ${fraLabel(g)}${b.method ? " · " + b.method : ""}.`, false);
  }

  // investimenti: cedole, dividendi, interessi e scadenze
  for (const x of investOpen()){
    if (x.nextPay && x.nextPay >= T)
      schedAvviso(metti, "inv-" + x.id, x.nextPay, avvisoOf(x, "avvisoPay", "pagamento"), x.name,
        g => `${IPAY[x.payType] || "Pagamento"} ${fraLabel(g)}.`, true);
    if (x.maturity && x.maturity >= T)
      schedAvviso(metti, "invm-" + x.id, x.maturity, avvisoOf(x, "avvisoMat", "scadenzaInv"), x.name,
        g => `Scade ${fraLabel(g)}.`, true);
  }

  // obiettivi non ancora fatti
  for (const g of S.goals){
    if (goalDone(g)) continue;
    const fine = goalDue(g);
    if (!fine || fine < T) continue;
    schedAvviso(metti, `goal-${g.id}-${fine}`, fine, avvisoOf(g, "avviso", "obiettivo"), g.name,
      n => n === 0 ? "Ultimo giorno utile." : `Scade ${fraLabel(n)}.`, false);
  }

  // dare e avere con una scadenza
  for (const e of ledgerOpen()){
    if (!e.due || e.due < T) continue;
    const cosa = e.kind === "soldi" ? euro(ledgerLeft(e)) : e.what;
    const verso = e.dir === "avere" ? `${e.who} ti deve ${cosa}` : `Devi ${cosa} a ${e.who}`;
    schedAvviso(metti, "led-" + e.id, e.due, avvisoOf(e, "avviso", "conti"), "Dare e avere",
      n => `${verso}: scade ${fraLabel(n)}.`, false);
  }

  return out.sort((a,b) => a.quando - b.quando).slice(0, 150);
}

let PUSHTIMER = null;

/* ============================================================
   BACKUP — un file con dentro tutto, da tenere da parte
   ============================================================ */
function esportaBackup(){
  const dati = JSON.stringify(S);
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Backup</h3>
    <div class="hint" style="margin-bottom:14px">Due strade: salvi il file, oppure copi il testo e lo incolli dove ti serve.</div>
    <div class="btnrow" style="margin-top:0">
      <button class="btn primary" id="bk-file" style="flex:1">Scarica il file</button>
      <button class="btn" id="bk-copia" style="flex:1">Copia il testo</button>
    </div>
    <div class="field" style="margin-top:16px"><label>Il tuo backup</label>
      <textarea id="bk-t" rows="8" readonly
        style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
               font-size:11px;font-family:ui-monospace,monospace;resize:vertical">${esc(dati)}</textarea>
      <div class="hint" id="bk-stato">${(dati.length/1024).toFixed(0)} kB · tutto quello che c'è dentro l'app.</div></div>
    <div class="btnrow"><button class="btn ghost wide" id="bk-chiudi">Chiudi</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  const stato = w.querySelector("#bk-stato");
  w.querySelector("#bk-chiudi").onclick = () => w.remove();
  w.querySelector("#bk-file").onclick = () => {
    // nell'app Android il file va nella cartella Download del telefono
    if (inApp() && typeof NAT.salvaFile === "function"){
      const r = NAT.salvaFile(b64(dati), "application/json", `coach-${today()}.json`);
      stato.textContent = r === "ok" ? `Salvato in Download come coach-${today()}.json.` : "Non ci sono riuscito: " + r + ". Usa il copia.";
      return;
    }
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([dati], { type:"application/json" }));
      a.download = `coach-${today()}.json`;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      stato.textContent = "Se non è comparso niente, qui dentro i download sono bloccati: usa il copia.";
    } catch(e){ stato.textContent = "Download non riuscito: usa il copia."; }
  };
  w.querySelector("#bk-copia").onclick = async () => {
    const t = w.querySelector("#bk-t");
    try {
      await navigator.clipboard.writeText(dati);
      stato.textContent = "Copiato.";
    } catch(e){
      t.removeAttribute("readonly"); t.focus(); t.select();
      try { document.execCommand("copy"); stato.textContent = "Copiato."; }
      catch(e2){ stato.textContent = "Tieni premuto sul testo e copia a mano."; }
      t.setAttribute("readonly", "readonly");
    }
  };
}

function rimettiBackup(testo){
  try {
    const dati = JSON.parse(testo);
    if (!dati || typeof dati !== "object" || !dati.v) throw new Error("non è un backup");
    if (!confirm("Rimetto dentro questo backup al posto di quello che c'è adesso?")) return false;
    const sync = S.sync;
    S = dati; migrate();
    if (sync && sync.token && !(S.sync && S.sync.token)) S.sync = sync;   // il token resta di questo dispositivo
    applyTheme(); runEngine(); save(); render();
    alert("Fatto: i tuoi dati sono dentro.");
    return true;
  } catch(e){ alert("Questo non è un backup del Coach."); return false; }
}

function importaBackup(){
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Rimetti dentro un backup</h3>
    <div class="hint" style="margin-bottom:14px">Scegli il file che avevi salvato, oppure incolla il testo che avevi copiato.</div>
    <div class="btnrow" style="margin-top:0"><button class="btn primary wide" id="im-file">Scegli il file</button></div>
    <div class="field" style="margin-top:16px"><label>Oppure incolla qui</label>
      <textarea id="im-t" rows="6" placeholder='{"v":1,...'
        style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
               font-size:11px;font-family:ui-monospace,monospace;resize:vertical"></textarea></div>
    <div class="btnrow">
      <button class="btn primary" id="im-ok" style="flex:2">Rimetti dentro</button>
      <button class="btn ghost" id="im-chiudi">Annulla</button>
    </div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#im-chiudi").onclick = () => w.remove();
  w.querySelector("#im-ok").onclick = () => {
    const t = w.querySelector("#im-t").value.trim();
    if (!t){ alert("Incolla il backup, oppure scegli il file."); return; }
    if (rimettiBackup(t)) w.remove();
  };
  w.querySelector("#im-file").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { if (rimettiBackup(r.result)) w.remove(); };
      r.readAsText(f);
    };
    inp.click();
  };
}

/* ============================================================
   SINCRONIZZAZIONE — i dati vivono in un file dentro un tuo
   deposito GitHub privato: così due telefoni vedono le stesse cose
   e ogni salvataggio lascia una copia nello storico.
   ============================================================ */
const SYNCFILE = "stato.json";
let SYNCSTATO = "fermo";
let SYNCTIMER = null;

const syncPronto = () => !!(S.sync && S.sync.repo && S.sync.token);

function b64(testo){
  const byte = new TextEncoder().encode(testo);
  let s = "";
  byte.forEach(b => s += String.fromCharCode(b));
  return btoa(s);
}
function unb64(dati){
  const bin = atob(dati.replace(/\n/g, ""));
  const byte = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(byte);
}

async function ghChiama(metodo, corpo){
  const url = `https://api.github.com/repos/${S.sync.repo}/contents/${SYNCFILE}`;
  const r = await fetch(url, {
    method: metodo,
    headers: {
      "Authorization": "Bearer " + S.sync.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  return r;
}

async function syncScarica(){
  const r = await ghChiama("GET");
  if (r.status === 404) return { vuoto:true };
  if (!r.ok) throw new Error("GitHub ha risposto " + r.status);
  const j = await r.json();
  S.sync.sha = j.sha;
  return { dati: JSON.parse(unb64(j.content)), sha: j.sha };
}

async function syncCarica(messaggio){
  const corpo = {
    message: messaggio || ("coach " + new Date().toISOString()),
    content: b64(JSON.stringify(S))
  };
  if (S.sync.sha) corpo.sha = S.sync.sha;
  let r = await ghChiama("PUT", corpo);
  if (r.status === 409 || r.status === 422){          // qualcuno ha scritto prima di noi
    const giu = await syncScarica();
    if (!giu.vuoto && (giu.dati.updatedAt || 0) > (S.updatedAt || 0)){
      S = giu.dati; migrate(); applyTheme(); runEngine(); render();
      return "preso";
    }
    corpo.sha = S.sync.sha;
    r = await ghChiama("PUT", corpo);
  }
  if (!r.ok) throw new Error("GitHub ha risposto " + r.status);
  const j = await r.json();
  S.sync.sha = j.content && j.content.sha;
  return "mandato";
}

async function sincronizza(forzaInvio){
  if (!syncPronto() || SYNCSTATO === "in corso") return;
  SYNCSTATO = "in corso";
  if (TAB === "opzioni") render();
  try {
    const giu = await syncScarica();
    if (!giu.vuoto && !forzaInvio && (giu.dati.updatedAt || 0) > (S.updatedAt || 0) + 500){
      const sha = S.sync.sha, sync = { ...S.sync };
      S = giu.dati; migrate();
      S.sync = sync; S.sync.sha = sha;
      applyTheme(); runEngine();
      S.sync.last = Date.now();
      salvaSolo();
      SYNCSTATO = "preso";
      render();
      return;
    }
    await syncCarica();
    S.sync.last = Date.now();
    salvaSolo();
    SYNCSTATO = "a posto";
  } catch(e){
    SYNCSTATO = "errore: " + (e && e.message ? e.message : e);
  }
  if (TAB === "opzioni") render();
}

// salva senza far ripartire il giro della sincronizzazione
function salvaSolo(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
}

function syncDopoIlSalvataggio(){
  if (!syncPronto() || !S.sync.auto) return;
  clearTimeout(SYNCTIMER);
  SYNCTIMER = setTimeout(() => sincronizza(true), 4000);
}

   6. BOOT
   ============================================================ */
window.addEventListener("error", e => {
  let bar = document.getElementById("errbar");
  if (!bar){
    bar = document.createElement("div");
    bar.id = "errbar";
    bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#8C2F1A;color:#fff;"
      + "font-size:12px;padding:9px 12px;line-height:1.35";
    document.body.appendChild(bar);
  }
  bar.textContent = "Errore: " + (e.message || e) + " — mandalo a Claude.";
});

document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => { PROGSUB = null; OPTSUB = null; TAB = b.dataset.tab; render(); });
document.getElementById("fab").onclick = () => openQuick();

// l'ora in testata si aggiorna da sola, senza ridisegnare niente
setInterval(() => {
  const o = document.getElementById("tb-ora");
  if (o) o.textContent = toHHMM(nowMin());
}, 20000);

// se segui il telefono e lui passa a scuro, cambia con lui
try {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onMq = () => { if (S && S.mode === "auto"){ applyTheme(); if (TAB === "opzioni") render(); } };
  mq.addEventListener ? mq.addEventListener("change", onMq) : mq.addListener(onMq);
} catch(e){}

// il guardiano offline: c'è solo quando l'app vive su un sito vero
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

(async () => {
  await loadState();
  gcalRead();
  runEngine();
  render();
  // con l'app nuova, la prima volta il permesso del calendario lo chiedo io
  if (S.gcalOn && GCAL.status === "permesso" && !S.gcalAsked){
    S.gcalAsked = true; salvaSolo();
    setTimeout(gcalAsk, 800);
  }
  riprogrammaAvvisi();
  if (syncPronto()) sincronizza().then(() => docPrefetch());
  // il calendario si rilegge ogni dieci minuti mentre l'app è aperta
  setInterval(() => {
    if (document.hidden || !S.gcalOn || !gcalSupported()) return;
    gcalRead(); runEngine();
    if (!document.querySelector(".sheet") && TAB !== "opzioni") render();
  }, 10 * 60 * 1000);
})();

// tornando dentro dopo un po': ricontrolla se un altro dispositivo ha scritto
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (syncPronto() && S.sync.auto && (!S.sync.last || Date.now() - S.sync.last > 60000)) sincronizza();
});

// re-run the engine when the app comes back into view after midnight
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (RUN && !RUN.paused){ RUN.mark = Date.now() - 0; keepAwake(true); drawRun(); }
  if (S && S.lastRun !== today()){ runEngine(); render(); }
});
