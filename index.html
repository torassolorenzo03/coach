<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6F63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E8E3;
  --surface:#F4F5F2;
  --surface-2:#DDE0DA;
  --ink:#18211E;
  --ink-soft:#5C6862;
  --ink-faint:#7A847E;
  --line:#C8CEC7;
  --accent:#1F6F63;
  --accent-ink:#FFFFFF;
  --warn:#A6522B;
  --done:#4E7A4A;
  --busy:#B9C0B8;
  --radius:14px;
  --pad:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A18; --surface:#1D2523; --surface-2:#273331;
    --ink:#E8EAE6; --ink-soft:#9AA49F; --ink-faint:#6E7A75;
    --line:#2F3A37; --accent:#3FA090; --accent-ink:#0B1211;
    --warn:#D08A5C; --done:#7FB073; --busy:#333F3C;
  }
}
:root[data-theme="dark"]{
  --bg:#141A18; --surface:#1D2523; --surface-2:#273331;
  --ink:#E8EAE6; --ink-soft:#9AA49F; --ink-faint:#6E7A75;
  --line:#2F3A37; --accent:#3FA090; --accent-ink:#0B1211;
  --warn:#D08A5C; --done:#7FB073; --busy:#333F3C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad)}

/* ---- header ---- */
header{padding:26px 0 14px;display:flex;align-items:flex-start;gap:14px}
.h-left{flex:1;min-width:0}
.dayname{font-size:13px;color:var(--ink-soft);letter-spacing:.02em}
.datebig{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.greet{font-size:14px;color:var(--ink-soft);margin-top:6px}
.ring{flex:0 0 66px;width:66px;height:66px;position:relative}
.ring svg{display:block}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;letter-spacing:-.02em}

/* ---- testata: data e ora, notifiche, chiudi giornata, torta ---- */
.topbar{display:flex;gap:9px;align-items:stretch;padding:22px 0 10px}
.tb-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.tb-side{flex:0 0 66px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:9px 4px;
  font-size:10px;font-weight:600;color:var(--ink-soft);letter-spacing:-.01em}
.tb-side svg{display:block}
.tb-side.done{border-color:var(--done);color:var(--done)}
.ora{font-variant-numeric:tabular-nums}
.tb-note{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);margin-top:7px}
.badge{flex:0 0 auto;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;
  padding:1px 7px;font-weight:600;font-variant-numeric:tabular-nums}
.notif{margin:2px 0 4px}
.notif .row{padding:11px 14px}
.notif .rtitle{font-size:14px;font-weight:400}
.nkind{font-size:11px;color:var(--ink-faint);text-transform:lowercase}

/* ---- il blocco promemoria che scorre ---- */
.rem-foot{display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid var(--line)}
.rem-foot .btn{padding:8px 12px;font-size:13px}
.rem-foot .dots{flex:1;margin:0}

/* ---- mattonelle del programma ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);
  padding:14px 13px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile svg{color:var(--accent)}
.tname{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tnote{font-size:12.5px;color:var(--ink-soft);line-height:1.35}
.tile.hot{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.hotdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}

/* ---- il tasto del crono, sempre lì ---- */
.cronobtn{flex:0 0 84px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:12px 6px;font-size:11.5px;font-weight:600;letter-spacing:-.01em}
.dobtn{width:100%;border:1px solid var(--accent);background:transparent;color:var(--accent);
  border-radius:var(--radius);padding:16px;font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:2px}

/* ---- sections ---- */
h2{font-size:13px;font-weight:600;color:var(--ink-soft);margin:26px 0 10px;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}

/* ---- spine ---- */
.spine{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 14px 10px}
.spine-col{flex:0 0 62px;position:relative}
.spine-track{position:relative;width:100%;height:100%;min-height:260px}
.spine-rail{position:absolute;left:44px;top:0;bottom:0;width:8px;background:var(--surface-2);border-radius:4px}
.blk{position:absolute;left:44px;width:8px;background:var(--busy);border-radius:4px}
.hourlab{position:absolute;left:0;width:36px;text-align:right;font-size:11px;color:var(--ink-faint);transform:translateY(-6px)}
.nowline{position:absolute;left:36px;right:-100%;height:2px;background:var(--accent);opacity:.85}
.nowdot{position:absolute;left:44px;width:8px;height:8px;border-radius:50%;background:var(--accent);transform:translate(0,-3px)}
.slots{flex:1;position:relative;min-height:260px}
.slot{position:absolute;left:0;right:0;border-radius:9px;padding:6px 9px;font-size:12.5px;line-height:1.25;overflow:hidden;
  background:var(--accent);color:var(--accent-ink)}
.slot.free{background:transparent;border:1px dashed var(--line);color:var(--ink-faint)}
.slot small{display:block;opacity:.85;font-size:11px}

/* ---- task rows ---- */
.row{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tick{flex:0 0 24px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-faint);
  background:transparent;display:flex;align-items:center;justify-content:center;padding:0;margin-top:1px;transition:background .15s,border-color .15s}
.tick svg{opacity:0;transition:opacity .15s}
.row.done .tick{background:var(--done);border-color:var(--done)}
.row.done .tick svg{opacity:1}
.row.done .rtitle{text-decoration:line-through;color:var(--ink-faint)}
.rbody{flex:1;min-width:0}
.rtitle{font-size:15.5px;font-weight:500;letter-spacing:-.01em}
.rmeta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.rmeta .dot{opacity:.45;padding:0 5px}
.flag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;margin-top:6px;
  background:var(--surface-2);color:var(--ink-soft)}
.flag.moved{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.imp{flex:0 0 3px;align-self:stretch;border-radius:2px;background:var(--line)}
.imp.i1{background:var(--warn)}
.imp.i2{background:var(--accent)}
.imp.i3{background:var(--line)}

.empty{padding:22px 16px;color:var(--ink-soft);font-size:14px}

/* ---- anteprima dei temi ---- */
.swatch{flex:0 0 46px;width:46px;height:34px;border-radius:8px;border:1px solid;
  display:flex;align-items:center;justify-content:center;gap:3px;padding:0 5px}
.swatch span{flex:1;height:16px;border-radius:3px}

/* ---- quello che il coach ha capito ---- */
.advice{padding:11px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);
  line-height:1.45;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.advice b{color:var(--ink);font-weight:600}
.advice button{display:block;margin-top:8px;border:1px solid var(--accent);background:transparent;
  color:var(--accent);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:500}

/* ---- notices ---- */
.notice{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:10px;background:var(--surface);font-size:13.5px;color:var(--ink-soft);margin-bottom:8px}
.notice b{color:var(--ink);font-weight:600}

/* ---- buttons ---- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:11px 15px;font-size:14.5px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.btnrow{display:flex;gap:9px;margin-top:14px}

/* ---- il tasto + ---- */
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:45;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  border:0;padding:0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 22%,transparent)}
.fab:active{transform:scale(.94)}

/* ---- nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:40}
.navin{max-width:560px;margin:0 auto;display:flex}
.navbtn{flex:1;min-width:0;background:none;border:0;padding:7px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-faint);font-size:10px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.navbtn svg{width:18px;height:18px}
.navbtn.on{color:var(--accent)}
.navbtn svg{display:block}

/* ---- form ---- */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field input[type=time],.field select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13.5px;min-width:46px;text-align:center}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.two{display:flex;gap:10px}
.two>*{flex:1}
.hint{font-size:12.5px;color:var(--ink-faint);margin-top:6px;line-height:1.4}

.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);
  z-index:50;overflow-y:auto;padding:0 0 40px}
.sheetin{max-width:560px;margin:0 auto;padding:22px var(--pad) 0}
.sheet h3{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px}

.actrow{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.actrow:last-child{border-bottom:0}
.stat{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border-bottom:0}
.stat span:last-child{color:var(--ink-soft)}

/* ---- pager giornata / mese ---- */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin-top:9px}
.dot2{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dot2.on{background:var(--accent)}
.swipehint{font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:6px}
.monthday{padding:11px 14px;border-bottom:1px solid var(--line)}
.monthday:last-child{border-bottom:0}
.monthday b{font-size:13px;font-weight:600}
.mev{display:flex;gap:9px;font-size:13.5px;color:var(--ink-soft);margin-top:4px}
.mev span:first-child{flex:0 0 88px;font-variant-numeric:tabular-nums}

/* ---- chiusura serale ---- */
.closecard{border:1px solid var(--accent);border-radius:var(--radius);background:var(--surface);
  padding:15px;display:flex;gap:12px;align-items:center;margin-top:4px}
.closecard .rbody{flex:1}
.why{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.why button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:7px 12px;font-size:13px}
.why button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.why button.vuoto{border-style:dashed;color:var(--ink-soft)}
.why button.vuoto.on{background:var(--done);border-color:var(--done);border-style:solid;color:#fff}

/* ---- crono ---- */
.runner{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:26px;text-align:center}
.runner.rest{background:var(--surface-2)}
.r-name{font-size:13px;color:var(--ink-soft)}
.r-seg{font-size:19px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.r-time{font-size:74px;font-weight:300;letter-spacing:-.045em;line-height:1;margin:14px 0 4px;
  font-variant-numeric:tabular-nums}
.r-next{font-size:13.5px;color:var(--ink-soft);min-height:20px}
.r-bar{width:min(320px,86%);height:5px;border-radius:3px;background:var(--surface-2);margin:22px 0 4px;overflow:hidden}
:root[data-theme] .r-bar,.runner.rest .r-bar{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.r-fill{height:100%;background:var(--accent);border-radius:3px;width:0}
.r-steps{display:flex;gap:5px;width:min(320px,86%);margin-top:12px}
.r-step{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.r-step.on{background:var(--accent)}
.r-step.past{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.r-ctrl{display:flex;gap:11px;margin-top:30px}
.r-ctrl .btn{min-width:96px}
.segline{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.segline select{flex:1.2}
.segline input{flex:1}
.segline button{border:1px solid var(--line);background:var(--surface);border-radius:9px;
  width:42px;height:42px;flex:0 0 42px;color:var(--warn);font-size:19px;line-height:1;padding:0}
/* i bottoni con una parola dentro (Aggiungi, Segna, Sposta lì) non devono restare quadratini */
.segline button.btn{width:auto;height:auto;flex:0 0 auto;padding:11px 15px;font-size:14.5px;line-height:1.2;color:var(--ink)}
.segline button.btn.primary{color:var(--accent-ink)}
.totline{font-size:13px;color:var(--ink-soft);margin-top:4px}
</style>
</head>
<body>

<div id="app"></div>

<button class="fab" id="fab" aria-label="Aggiungi">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav>
  <div class="navin">
    <button class="navbtn" data-tab="oggi">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      Oggi</button>
    <button class="navbtn" data-tab="base">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      Base</button>
    <button class="navbtn" data-tab="salute">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 3 10 2-5h7"/></svg>
      Salute</button>
    <button class="navbtn" data-tab="opzioni">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-1-1.4 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.4-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg>
      Impostazioni</button>
  </div>
</nav>

<script>
/* ============================================================
   1. DATE / TIME HELPERS
   ============================================================ */
const GG = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const GG3 = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const MM = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((fromIso(b)-fromIso(a))/86400000);
const dow = s => fromIso(s).getDay();
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const toHHMM = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const today = () => iso(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60+d.getMinutes(); };
const prettyDate = s => { const d = fromIso(s); return `${d.getDate()} ${MM[d.getMonth()]}`; };
const durLabel = m => m >= 60 ? (m%60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m/60}h`) : `${m} min`;

/* ============================================================
   2. STATE
   ============================================================ */
const DEFAULT_STATE = {
  v: 1,

function scuroOra(){
  const t = THEMES[(S && S.skin) || "salvia"];
  if (t.soloScuro) return true;
  const m = (S && S.mode) || "auto";
  if (m === "light") return false;
  if (m === "dark") return true;
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches; } catch(e){ return false; }
}

function applyTheme(){
  const t = THEMES[(S && S.skin) || "salvia"] || THEMES.salvia;
  const scuro = scuroOra();
  const set = scuro ? t.dark : t.light;
  const r = document.documentElement;
  for (const k in set) r.style.setProperty("--" + k, set[k]);
  r.dataset.theme = scuro ? "dark" : "light";
}

async function loadState(){

  S = local || structuredClone(DEFAULT_STATE);
  migrate();
  applyTheme();
  render();
  // then try the shared store, which wins if it is newer
  try {
    DB = await claude.use("db");
    if (DB){
      const snap = await DB.doc("app/state").get();
      const remote = snap && (snap.data || snap);
      if (remote && remote.v && (remote.updatedAt||0) > (S.updatedAt||0)){
        S = remote; migrate(); applyTheme(); runEngine(); render();

}

/* ============================================================
   3. IL MOTORE — la segretaria
   Le attività cadono nei giorni che hai scelto tu. Il motore non sposta
   niente da solo: quando una cosa resta indietro la mette fra quelle
   "da ridecidere" e ti propone due o tre giorni, dicendoti perché.
   Decidi sempre tu.
   ============================================================ */

// Everything that occupies the day: recurring commitments, one-off ones,
// and the events read from Google Calendar on the phone.
function busyLabeled(dateStr){
  const d = dow(dateStr);
  const out = S.fixed.filter(f => f.days.includes(d))
                     .map(f => ({ s: toMin(f.start), e: toMin(f.end), label: f.label, src: "fisso" }));
  for (const o of S.oneoffs){
    if (o.busy === false || o.allDay) continue;          // gli eventi di un giorno intero non bloccano
    const fine = o.endDate || o.date;
    if (dateStr < o.date || dateStr > fine) continue;
    const a = dateStr === o.date ? toMin(o.start) : 0;   // nei giorni di mezzo occupa tutto
    const b = dateStr === fine ? toMin(o.end) : 1439;
    if (b > a) out.push({ s:a, e:b, label:o.label, src:"singolo" });
  }
  if (S.gcalOn) for (const g of (GCAL.byDay[dateStr] || [])){
    if (!gcBusy(g)) continue;
    out.push({ s: g.s, e: g.e, label: g.label, src: "gcal" });
  }
  return out.sort((a,b) => a.s - b.s);
}

// Same thing as merged numeric intervals — what the engine reasons on.
function busyOn(dateStr){
  const raw = busyLabeled(dateStr).map(x => [x.s, x.e]).sort((a,b)=>a[0]-b[0]);
  const out = [];
  for (const [s,e] of raw){
    const last = out[out.length-1];
    if (last && s <= last[1]) last[1] = Math.max(last[1], e);
    else out.push([s,e]);
  }
  return out;
}

// Largest free run (minutes) inside [winStart, winEnd] on that date.
function freeRoom(dateStr, win){
  let a = toMin(win.start);
  const b = toMin(win.end);
  if (dateStr === today()) a = Math.max(a, nowMin());     // oggi conta solo il tempo che resta
  if (b <= a) return 0;
  let cuts = busyOn(dateStr).map(([s,e]) => [Math.max(s,a), Math.min(e,b)]).filter(([s,e]) => e > s);
  let best = 0, cursor = a;
  for (const [s,e] of cuts){ best = Math.max(best, s - cursor); cursor = Math.max(cursor, e); }
  return Math.max(best, b - cursor);
}

/* ---------- quando capita un'attività ----------
   Ogni attività ha i suoi giri: giorni fissi della settimana, ogni tot giorni
   da una data, un giorno del mese, date dell'anno, oppure una volta sola.
   Un giro si può spostare (moves) o saltare (skips): sempre per scelta tua. */
const maxD = (a, b) => a > b ? a : b;
const actFrom = a => a.from || "2000-01-01";

function mondayOf(d){ const x = fromIso(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return iso(x); }
function monthsBetween(a, b){
  const A = fromIso(a), B = fromIso(b);
  return (B.getFullYear() - A.getFullYear()) * 12 + B.getMonth() - A.getMonth();
}
function isLeap(y){ return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function mdMatch(md, d){
  if (d.slice(5) === md) return true;
  // il 29 febbraio, negli anni che non ce l'hanno, diventa il 28
  return md === "02-29" && d.slice(5) === "02-28" && !isLeap(+d.slice(0,4));
}

// Il giorno d è un giro "naturale" dell'attività, prima di spostamenti e salti?
function nativeOn(a, d){
  if (d < actFrom(a)) return false;
  const r = a.rec || { type:"weekly", n:1 };
  const n = Math.max(1, +r.n || 1);
  const anchor = r.start || actFrom(a);
  switch (r.type){
    case "once":  return d === r.date;
    case "weekly": {
      if (!(a.days || []).includes(dow(d))) return false;
      if (n === 1) return true;
      const w = Math.round(daysBetween(mondayOf(anchor), mondayOf(d)) / 7);
      return w >= 0 && w % n === 0;
    }
    case "everyNDays": {
      const k = daysBetween(anchor, d);
      return k >= 0 && k % n === 0;
    }
    case "monthly": {
      const giorno = Math.min(31, Math.max(1, +r.day || 1));
      const dt = fromIso(d);
      const ultimo = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
      if (dt.getDate() !== Math.min(giorno, ultimo)) return false;
      const m = monthsBetween(anchor, d);
      return m >= 0 && m % n === 0;
    }
    case "yearly": return !!r.md && mdMatch(r.md, d);
    case "dates":  return (r.dates || []).some(md => mdMatch(md, d));
  }
  return false;
}

// I giri che cadono in un giorno: i naturali non toccati, più quelli spostati lì.
// Restituisce le date "di origine" dei giri, che sono il loro nome.
function occOn(a, d){
  const out = [];
  const mv = a.moves || {}, sk = a.skips || {};
  if (nativeOn(a, d) && !mv[d] && !sk[d]) out.push(d);
  for (const o in mv) if (mv[o] === d && o !== d && !sk[o]) out.push(o);
  return out;
}
const actsOn = d => S.activities.filter(a => occOn(a, d).length);
const todaysActs = () => isPaused() ? [] : actsOn(today());

// se il giro di quel giorno era stato spostato lì da un altro giorno, da quale
function movedFrom(a, d){
  const mv = a.moves || {};
  for (const o in mv) if (mv[o] === d && o !== d) return o;
  return null;
}

// il prossimo giorno in cui l'attività c'è, a partire da `from` (compreso)
function nextOcc(a, from, limit){
  const lim = limit || 400;
  for (let i = 0; i <= lim; i++){
    const d = addDays(from, i);
    if (occOn(a, d).length) return d;
  }
  return null;
}

function isDone(dateStr, id){ return !!(S.log[dateStr] && S.log[dateStr][id]); }

// Sposta un giro: dal giorno in cui doveva cadere a quello che scegli tu.
function moveOcc(a, orig, to){
  a.moves = a.moves || {};
  if (to === orig) delete a.moves[orig]; else a.moves[orig] = to;
  if (a.handled) delete a.handled[orig];
}
function skipOcc(a, orig){
  a.skips = a.skips || {};
  a.skips[orig] = true;
  a.skipCount = (a.skipCount || 0) + 1;
}

/* ---------- le cose rimaste indietro ----------
   Per ogni attività si guarda il giro più recente prima di oggi. Se non è
   stato fatto e nessun altro giro l'ha già superato, è "da ridecidere".
   I giri superati da uno più nuovo contano come saltati, e basta. */
function missedOf(a, T){
  const start = maxD(actFrom(a), addDays(T, -30));
  for (let d = addDays(T, -1); d >= start; d = addDays(d, -1)){
    const giri = occOn(a, d);
    if (!giri.length) continue;
    if (S.pausedDays[d] || isDone(d, a.id)) return null;
    const o = giri.find(x => !(a.handled && a.handled[x]));
    return o ? { orig:o, day:d } : null;
  }
  return null;
}

function missedList(){
  if (isPaused()) return [];
  const T = today(), out = [];
  for (const a of S.activities){
    const m = missedOf(a, T);
    if (!m) continue;
    // se oggi c'è già un giro nuovo, quello vecchio è superato: niente da decidere
    if (occOn(a, T).length) continue;
    out.push({ a, orig: m.orig, day: m.day });
  }
  return out.sort((x,y) => (x.a.imp - y.a.imp) || x.day.localeCompare(y.day));
}

/* ---------- QUANDO SEI VIA ----------
   Con la pausa accesa il coach non chiede niente, non segna saltate e non
   chiede la chiusura serale. Quei giorni restano fuori dalle medie. */
function isPaused(){
  if (!S.pause) return false;
  const T = today();
  if (T < S.pause.from) return false;
  if (S.pause.to && T > S.pause.to) return false;
  return true;
}

function pauseDays(){
  if (!S.pause) return 0;
  return Math.max(1, daysBetween(S.pause.from, today()) + 1);
}

function startPause(from, to, label){
  S.pause = { from, to: to || null, label: label || "" };
  S.resume = null;
  runEngine(); save(); render();
}

// Chiude la pausa e mette da parte tutto quello che è rimasto indietro.
function endPause(){
  const p = S.pause;
  if (!p) return;
  const T = today();
  let fine = p.to && p.to < T ? p.to : addDays(T, -1);
  for (let d = p.from, i = 0; d <= fine && i < 400; d = addDays(d, 1), i++) S.pausedDays[d] = true;

  // per ogni attività, l'ultimo giro caduto mentre eri via e non fatto
  const acts = [];
  for (const a of S.activities){
    for (let d = fine; d >= p.from; d = addDays(d, -1)){
      const giri = occOn(a, d);
      if (!giri.length) continue;
      if (!isDone(d, a.id)) acts.push({ id:a.id, name:a.name, orig:giri[0], from:d, giorni: daysBetween(d, T) });
      break;
    }
  }

  const rems = S.reminders
    .filter(r => r.when && r.when.type === "date" && r.when.date >= p.from && r.when.date < T && !readToday(r.when.date, r.id))
    .map(r => ({ id:r.id, text:r.text, date:r.when.date }));

  const goals = [];
  for (const g of S.goals){
    if (g.per === "d"){
      if (g.due && g.due >= p.from && g.due < T && !goalDone(g)) goals.push({ id:g.id, name:g.name, per:"d" });
      continue;
    }
    const k = pKey(g.per, p.from);
    if (k !== pKey(g.per, T) && !(g.done && g.done[k])) goals.push({ id:g.id, name:g.name, per:g.per });
  }

  const fridge = S.fridge
    .filter(f => f.exp >= p.from && f.exp < T)
    .map(f => ({ id:f.id, name:f.name, exp:f.exp }));

  S.pause = null;
  S.resume = (acts.length || rems.length || goals.length || fridge.length)
    ? { from: p.from, to: fine, label: p.label || "", acts, rems, goals, fridge }
    : null;
  runEngine(); save(); render();
}

// Cosa fare di un'attività rimasta ferma durante la pausa.
function resumeAct(id, mode){
  const a = S.activities.find(x => x.id === id);
  const r = S.resume && S.resume.acts.find(x => x.id === id);
  if (a && r && mode === "recupera"){ openReplan(a.id, r.orig, { dopo: () => dropResumeAct(id) }); return; }
  dropResumeAct(id);
}
function dropResumeAct(id){
  if (S.resume){
    S.resume.acts = S.resume.acts.filter(x => x.id !== id);
    if (!S.resume.acts.length && !S.resume.rems.length && !S.resume.goals.length && !S.resume.fridge.length) S.resume = null;
  }
  save(); render();
}

function runEngine(){
  const T = today();
  // la pausa con una data di fine si chiude da sola quando quel giorno è passato
  if (S.pause && S.pause.to && T > S.pause.to){ endPause(); return; }
  if (isPaused()){
    S.pausedDays[T] = true;
    S.notices = [];
    S.lastRun = T;
    save();
    return;
  }
  const notices = [];

  // i giri superati da uno più nuovo passano fra i saltati, senza chiedere niente
  for (const a of S.activities){
    a.handled = a.handled || {};
    const start = maxD(actFrom(a), addDays(T, -30));
    let visto = false;                        // ho già incontrato un giro più recente?
    let superate = 0;
    for (let d = T; d >= start; d = addDays(d, -1)){
      const giri = occOn(a, d);
      if (!giri.length) continue;
      if (d < T && visto){
        for (const o of giri){
          if (isDone(d, a.id) || a.handled[o] || S.pausedDays[d]) continue;
          a.handled[o] = "superata";
          a.skipCount = (a.skipCount || 0) + 1;
          superate++;
        }
      }
      visto = true;
    }
    if (superate) notices.push({ kind:"skipped", id:a.id,
      text: superate === 1 ? `«${a.name}»: un giro è passato senza farla, ormai c'è già quello dopo.`
                           : `«${a.name}»: ${superate} giri sono passati senza farla, ormai c'è già quello dopo.` });
    // pulizia: le cose vecchie non servono più
    const vecchio = addDays(T, -90);
    for (const o in a.handled) if (o < vecchio) delete a.handled[o];
    for (const o in (a.skips || {})) if (o < vecchio) delete a.skips[o];
    for (const o in (a.moves || {})) if (o < vecchio && a.moves[o] < vecchio) delete a.moves[o];
  }

  // le notizie restano per la giornata: si accumulano, non si cancellano a ogni giro
  const prima = (S.lastRun === T ? S.notices : []).filter(n => !notices.some(m => m.text === n.text));
  S.notices = prima.concat(notices);
  S.lastRun = T;
  S.dayPlan[T] = todaysActs().map(a => a.id);
  const cutoff = addDays(T, -60);
  for (const k in S.dayPlan) if (k < cutoff) delete S.dayPlan[k];
  save();
}

/* ============================================================
   IL CONSIGLIO — quanto è carica una giornata, e perché
   Serve quando crei qualcosa e quando una cosa resta indietro:
   il coach non decide, ti dice dove starebbe meglio.
   ============================================================ */
function dayLoad(d, skipActId){
  const a0 = awakeFrom(), a1 = awakeTo();
  const busy = busyLabeled(d).filter(b => b.e > a0 && b.s < a1);
  const busyMin = busyOn(d).map(([s,e]) => [Math.max(s,a0), Math.min(e,a1)])
    .filter(([s,e]) => e > s).reduce((t,[s,e]) => t + e - s, 0);
  const acts = actsOn(d).filter(a => a.id !== skipActId);
  const actMin = acts.reduce((t,a) => t + (+a.dur || 30), 0);
  const evs = eventsOn(d).length + gcalSingles(d).length;
  const tot = Math.max(60, a1 - a0);
  const free = Math.max(0, tot - busyMin - actMin);
  const q = (busyMin + actMin) / tot;
  return { d, busy, busyMin, acts, actMin, evs, free, q,
           score: busyMin + actMin * 1.3 + acts.length * 25 + evs * 30,
           word: q < .3 ? "leggera" : q < .6 ? "normale" : "piena" };
}

// "lavoro 8:30–12:30 e 15:00–19:00, dentista 17:00"
function busySummary(L){
  if (!L.busy.length) return "";
  const per = {};
  for (const b of L.busy){
    const k = b.label || "impegno";
    (per[k] = per[k] || []).push(`${toHHMM(b.s)}–${toHHMM(b.e)}`);
  }
  const parti = Object.entries(per).map(([k,v]) => `${k.toLowerCase()} ${v.join(" e ")}`);
  return parti.length > 2 ? `${parti.slice(0,2).join(", ")} e altro` : parti.join(", ");
}

function loadLine(L){
  const bits = [`giornata ${L.word}`];
  const bs = busySummary(L);
  bits.push(bs || "nessun impegno");
  if (L.acts.length) bits.push(`${L.acts.length} ${L.acts.length === 1 ? "attività" : "attività"}`);
  bits.push(`${durLabel(Math.round(L.free / 30) * 30 || 0)} liberi`);
  return bits.join(" · ");
}

// I giorni migliori per fare una cosa, dal più consigliato.
// opts: { from, days, dur, win, actId, allowed:[giorni della settimana preferiti] }
function suggestDays(opts){
  const out = [];
  const n = opts.days || 7;
  for (let i = 0; i < n; i++){
    const d = addDays(opts.from, i);
    if (S.pause && d >= S.pause.from && (!S.pause.to || d <= S.pause.to)) continue;
    const L = dayLoad(d, opts.actId);
    const room = opts.win ? freeRoom(d, opts.win) : L.free;
    const fits = room >= (+opts.dur || 0);
    if (d === today() && !fits) continue;                    // oggi solo se ci sta davvero
    let score = L.score + i * 30 + (fits ? 0 : 5000);
    if (opts.allowed && opts.allowed.length && !opts.allowed.includes(dow(d))) score += 300;
    out.push({ d, L, room, fits, score });
  }
  return out.sort((a,b) => a.score - b.score);
}

function whyDay(x, win){
  const L = x.L;
  const parti = [];
  if (!x.fits && win) parti.push(`nella fascia ${win.start}–${win.end} sei già occupato`);
  parti.push(loadLine(L));
  return parti.join(" · ");
}

const dayChip = d => {
  const T = today();
  if (d === T) return "Oggi";
  if (d === addDays(T, 1)) return "Domani";
  return `${GG3[dow(d)]} ${prettyDate(d)}`;
};

// Per le attività a giorni fissi: quali giorni della settimana sono i più liberi
// nella fascia scelta, guardando le prossime quattro settimane.
function weekdayAdvice(win, dur, actId){
  const T = today(), res = [];
  for (let g = 0; g < 7; g++){
    let d = T;
    while (dow(d) !== g) d = addDays(d, 1);
    let tot = 0, fitsN = 0, primo = null;
    for (let k = 0; k < 4; k++){
      const dd = addDays(d, 7 * k);
      const L = dayLoad(dd, actId);
      if (!primo) primo = L;
      tot += L.score;
      if (freeRoom(dd, win) >= dur) fitsN++;
    }
    res.push({ g, score: tot / 4 + (4 - fitsN) * 400, fitsN, L: primo });
  }
  return res.sort((a,b) => a.score - b.score);
}

/* ============================================================
   4. VIEW MODEL
   ============================================================ */

// Una fascia può scavalcare la mezzanotte (22:00–01:00). In quel caso
// "dentro la fascia" vuol dire: dopo l'inizio, oppure prima della fine.
const fasciaWrap = r => toMin(r.end) <= toMin(r.start);
function inFascia(r, n){
  const s = toMin(r.start), e = toMin(r.end);
  return fasciaWrap(r) ? (n >= s || n <= e) : (n >= s && n <= e);
}
// A che giornata appartengono le spunte di una fascia: se stiamo vivendo la
// coda dopo mezzanotte di una fascia che scavalca, valgono per ieri.
function fasciaDay(r){
  const T = today();
  if (r && fasciaWrap(r) && nowMin() <= toMin(r.end)) return addDays(T, -1);
  return T;
}
function currentFascia(){
  const n = nowMin();
  return S.routines.find(r => inFascia(r, n)) || null;
}
function nextFascia(){
  const n = nowMin();
  const dopo = S.routines.filter(r => toMin(r.start) > n).sort((a,b)=>toMin(a.start)-toMin(b.start));
  if (dopo.length) return dopo[0];
  return S.routines.slice().sort((a,b)=>toMin(a.start)-toMin(b.start))[0] || null;
}
const rDone = (d,id) => !!(S.rlog[d] && S.rlog[d][id]);
const allRoutineItems = () => S.routines.flatMap(r => r.items.map(i => ({...i, fascia:r})));

const W_ACT = { 1: 6, 2: 4, 3: 2 };   // alta / media / bassa
const W_ROUT = 1;                     // una voce di routine
const W_REM = 2;                      // un promemoria letto
const W_TRIP = 1;                     // una voce della valigia

const readToday = (d,id) => !!(S.remlog[d] && S.remlog[d][id]);

// Un promemoria può valere ogni giorno, solo in certi giorni della settimana,
// oppure una data sola. Fuori da lì non compare e non pesa sulla percentuale.
function remActive(r, d){
  const wn = r.when || { type:"always" };
  if (wn.type === "date") return wn.date === d;
  if (wn.type === "days") return (wn.days || []).includes(dow(d));
  return true;
}
const remindersOn = d => S.reminders.filter(r => remActive(r, d));
function remWhenLabel(r){
  const wn = r.when || { type:"always" };
  if (wn.type === "date"){
    if (!wn.date) return "senza data";
    const d = wn.date, T = today();
    if (d === T) return "solo oggi";
    if (d < T) return `scaduto il ${prettyDate(d)}`;
    return `solo ${GG3[dow(d)]} ${prettyDate(d)}`;
  }
  if (wn.type === "days"){
    const g = (wn.days || []).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));
    if (!g.length) return "nessun giorno scelto";
    if (g.length === 7) return "ogni giorno";
    return g.map(x => GG3[x]).join(" ");
  }
  return "ogni giorno";
}

// Cosa c'era (o c'è) da fare in un giorno. Oggi e i giorni futuri si leggono
// dai giri delle attività; per quelli passati vale quello che era in programma allora.
function planFor(d){
  const T = today();
  if (d >= T) return d === T ? todaysActs() : actsOn(d);
  if (S.dayPlan[d]) return S.dayPlan[d].map(id => S.activities.find(a => a.id === id)).filter(Boolean);
  return actsOn(d);
}

// `picks` è facoltativo: serve alla chiusura serale per mostrare subito
// l'effetto di "non c'era nulla da fare", che vale come completata.
function progressOn(d, picks){
  const vuoto = id => picks && picks[id] === R_VUOTO;
  // le attività, più le cose di Google Calendar che hai segnato "da spuntare"
  const acts = planFor(d).map(a => ({ id:a.id, imp:a.imp })).concat(gcalTodosOn(d).map(x => ({ id:x.id, imp:x.imp })));
  const items = allRoutineItems();
  let tot = 0, got = 0;
  for (const a of acts){ const w = W_ACT[a.imp] || 3; tot += w; if (isDone(d, a.id) || vuoto(a.id)) got += w; }
  for (const i of items){ tot += W_ROUT; if (rDone(d, i.id)) got += W_ROUT; }
  const rem = remindersOn(d);
  for (const r of rem){ tot += W_REM; if (readToday(d, r.id)) got += W_REM; }
  const pack = tripItemsOn(d);
  for (const t of pack){ tot += W_TRIP; if (tripDone(t.tripId, t.id)) got += W_TRIP; }
  if (!tot) return { pct: 0, done: 0, total: 0 };
  const doneCount = acts.filter(a => isDone(d,a.id) || vuoto(a.id)).length
    + items.filter(i => rDone(d,i.id)).length
    + rem.filter(r => readToday(d,r.id)).length
    + pack.filter(t => tripDone(t.tripId, t.id)).length;
  return { pct: Math.round(got / tot * 100), done: doneCount, total: acts.length + items.length + rem.length + pack.length };
}

const progress = () => progressOn(today());

function greeting(){
  const m = nowMin();
  if (m < 12*60) return "Buongiorno. Ecco com'è fatta la giornata.";
  if (m < 18*60) return "Pomeriggio. Vediamo cosa resta.";
  return "Sera. Chiudiamo la giornata.";
}

function armDelete(btn, label, onYes){

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Ridisegna la scheda. Torna in cima solo quando cambi scheda: se resti

/* ============================================================
   OGGI — la schermata di casa
   Testata: data e ora, notifiche, chiudi giornata, torta.
   Poi: promemoria, la giornata, la routine, le attività.
   ============================================================ */

/* la fetta della torta: quanto della giornata è fatto */
function piePath(pct, r){
  const q = Math.max(0, Math.min(100, pct));
  if (q <= 0) return "";
  if (q >= 100) return `M${r},${r} m${-r},0 a${r},${r} 0 1,0 ${r*2},0 a${r},${r} 0 1,0 ${-r*2},0`;
  const a = 2 * Math.PI * (q / 100) - Math.PI / 2;
  const x = r + r * Math.cos(a), y = r + r * Math.sin(a);
  return `M${r},${r} L${r},0 A${r},${r} 0 ${q > 50 ? 1 : 0},1 ${x},${y} Z`;
}

function pieHTML(p, pausa){
  const R = 19;
  return `
  <svg width="${R*2}" height="${R*2}" viewBox="0 0 ${R*2} ${R*2}">
    <circle cx="${R}" cy="${R}" r="${R}" fill="var(--surface-2)"/>
    <path id="pie-arc" d="${pausa ? "" : piePath(p.pct, R)}" fill="var(--accent)"/>
    <circle cx="${R}" cy="${R}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1"/>
  </svg>
  <span id="ring-pct">${pausa ? "via" : p.pct + "%"}</span>`;
}

/* ---------- LE NOTIFICHE ----------
   Per ora raccolgono quello che l'app sa già: le mosse del motore, gli eventi,
   la valigia, il frigo, i conti in sospeso, gli obiettivi agli sgoccioli. */
let NOTIF_OPEN = false;

function notifiche(){
  const T = today(), out = [];
  if (S.resume) out.push({ k:"rientro", t:"Hai un riepilogo del rientro da sistemare" });
  for (const n of S.notices) out.push({ k:"programma", t:n.text });
  const mr = missedList().length;
  if (mr) out.push({ k:"da ridecidere", t:`${mr === 1 ? "Un'attività è rimasta indietro" : `${mr} attività sono rimaste indietro`}: ti propongo io quando rifarle` });
  if (S.gcalOn && (GCAL.status === "permesso" || GCAL.status === "vecchia"))
    out.push({ k:"google calendar", t: GCAL.status === "permesso" ? "Per leggere il calendario serve il tuo permesso: Impostazioni → Google Calendar" : "Per leggere il calendario installa l'app Android nuova" });
  const gn = gcalNew().length;
  if (gn) out.push({ k:"google calendar", t:`${gn === 1 ? "Una cosa nuova" : `${gn} cose nuove`} sul calendario: puoi aggiungere i dettagli` });
  for (const o of eventsOn(T)) out.push({ k:"oggi", t:`${o.label}${o.allDay ? " · tutto il giorno" : ` · ${o.start}`}${o.place ? ` · ${o.place}` : ""}` });
  if (S.gcalOn) for (const g of gcalOnDay(T)) if (!g.recurring)
    out.push({ k:"oggi", t:`${g.label}${g.allDay ? " · tutto il giorno" : ` · ${toHHMM(g.s)}`}${g.inst.place ? ` · ${g.inst.place}` : ""}` });
  for (const o of eventsSoon(T)){
    const dd = daysBetween(T, o.date);
    out.push({ k:"in arrivo", t:`${o.label} ${dd === 1 ? "domani" : `fra ${dd} giorni`}` });
  }
  for (const t of tripsOn(T)){
    const n = t.items.filter(i => !tripDone(t.id, i.id)).length;
    if (n) out.push({ k:"valigia", t:`${t.name}: ${n} ${n === 1 ? "cosa" : "cose"} ancora da mettere` });
  }
  if (shopDay(T)) out.push({ k:"spesa", t: shopLeft() ? `Oggi spesa · ${shopLeft()} ${shopLeft() === 1 ? "cosa" : "cose"} in lista` : "Oggi spesa · la lista è vuota" });
  for (const x of billAlerts(T)) out.push({ k:"uscite", t:x.t });
  for (const x of investAlerts(T)) out.push({ k:"investimenti", t:x.t });
  for (const f of fridgeSoon(T)){
    const st = fridgeState(f, T);
    if (st.k === "scaduto" || st.k === "oggi") out.push({ k:"frigo", t:`${f.name} ${st.label}` });
  }
  for (const e of ledgerOpen()){
    const a = ledgerAlert(e, T);
    if (a) out.push({ k:"dare e avere", t:`${e.who} · ${e.kind === "soldi" ? euro(ledgerLeft(e)) : e.what} · ${a}` });
  }
  for (const g of S.goals){
    if (goalDone(g)) continue;
    const l = goalLeft(g);
    if (l <= 2 && l >= -30) out.push({ k:"obiettivo", t:`${g.name}: ${goalMeta(g)}` });
  }
  return out;
}

function notifHTML(){
  const n = notifiche();
  if (!n.length) return "";
  return `<div class="card notif"${NOTIF_OPEN ? "" : " hidden"} id="notifbox">
    ${n.map(x => `<div class="row"><div class="rbody">
      <div class="nkind">${esc(x.k)}</div>
      <div class="rtitle">${esc(x.t)}</div>
    </div></div>`).join("")}

/* ---------- PROMEMORIA: oggi, domani, tutti ---------- */
const REMPAGES = ["Oggi", "Domani", "Tutti"];

function remRow(r, d, modo){
  if (modo === "oggi") return reminderHTML(r, d);
  const letto = modo === "domani" ? false : readToday(today(), r.id);
  return `
  <button class="actrow" data-remprev="${r.id}">
    <div class="tick" style="border-style:dashed"></div>
    <div class="rbody">
      <div class="rtitle" style="color:var(--ink-soft)">${esc(r.text)}</div>
      <div class="rmeta">${modo === "domani" ? "domani" : esc(remWhenLabel(r))}${modo === "tutti" && letto ? "<span class=\"dot\">·</span>letto oggi" : ""}</div>
    </div>
  </button>`;
}

function remPage(lista, d, modo, vuoto){
  return `<div class="page">${lista.length ? lista.map(r => remRow(r, d, modo)).join("") : `<div class="empty">${vuoto}</div>`}</div>`;
}

function remindersBlock(T){
  const oggi = remindersOn(T);
  const dom = addDays(T, 1);
  const domani = remindersOn(dom);
  const letti = oggi.filter(r => readToday(T, r.id)).length;
  return `
  <h2 id="h-rem">Promemoria${oggi.length ? ` · ${letti}/${oggi.length} letti` : ""}</h2>
  <div class="card">
    <div class="pager" id="rempager" style="align-items:flex-start;transition:height .25s">
      ${remPage(oggi, T, "oggi", "Niente da leggere oggi.")}
      ${remPage(domani, dom, "domani", "Domani niente.")}
      ${remPage(S.reminders, T, "tutti", "Nessun promemoria. Aggiungine uno: per chiudere la giornata al 100% dovrai aprirlo e leggerlo.")}
    </div>
    <div class="rem-foot">
      <button class="btn ghost" id="remnext">Domani</button>
      <div class="dots" id="remdots">
        <div class="dot2 on"></div><div class="dot2"></div><div class="dot2"></div>
      </div>
      <button class="btn ghost" id="addrem">Aggiungi</button>
    </div>
  </div>`;
}

/* ogni mattonella dice come sta messa, e si accende quando ha qualcosa da farti fare */
function baseVoci(){
  const T = today();
  const rvoci = S.routines.reduce((n,r) => n + r.items.length, 0);
  const cur = currentFascia();
  const rRestano = cur ? cur.items.filter(i => !rDone(fasciaDay(cur), i.id)).length : 0;
  const attRestano = todaysActs().filter(a => !isDone(T, a.id)).length;
  const prossimoEv = oneoffList()[0];
  const evOggi = eventsOn(T).length;
  const prossimoVg = S.trips.filter(t => t.date >= T).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const scaduti = fridgeSoon(T).filter(f => fridgeState(f,T).k !== "presto").length;
  const scad = fridgeSoon(T).length;
  const tl = ledgerTotals();
  const contiVivi = ledgerOpen().filter(e => ledgerAlert(e, T)).length;
  const it = investTotals();
  const invVivi = investAlerts(T).length;
  const messoVia = S.piggy.reduce((n,x) => n + piggySaved(x), 0);
  const obScad = S.goals.filter(g => !goalDone(g) && goalLeft(g) <= 2).length;
  const vgOggi = tripsOn(T).reduce((n,t) => n + t.items.filter(i => !tripDone(t.id, i.id)).length, 0);

  return [
    { id:"attivita", ico:"attivita", nome:"Attività", hot: attRestano > 0,
      nota: attRestano ? `${attRestano} da fare oggi` : S.activities.length ? `${S.activities.length} ricorrenti · oggi a posto` : "nessuna ancora" },
    { id:"routine", ico:"routine", nome:"Routine", hot: rRestano > 0,
      nota: rRestano ? `${esc(cur.name)}: ${rRestano} da spuntare` : `${S.routines.length} fasce · ${rvoci} ${rvoci === 1 ? "voce" : "voci"}` },
    { id:"spesa", ico:"spesa", nome:"Spesa", hot: shopDay(T) && shopLeft() > 0,
      nota: shopLeft() ? `${shopLeft()} in lista · ${shopWhenLabel()}` : `lista vuota · ${shopWhenLabel()}` },
    { id:"eventi", ico:"eventi", nome:"Eventi", hot: evOggi > 0,
      nota: evOggi ? `${evOggi} oggi` : prossimoEv ? `${esc(prossimoEv.label)}, ${prettyDate(prossimoEv.date)}` : "niente in programma" },
    { id:"viaggi", ico:"viaggi", nome:"Viaggi", hot: vgOggi > 0,
      nota: vgOggi ? `valigia: ${vgOggi} da mettere` : prossimoVg ? `${esc(prossimoVg.name)}, ${prettyDate(prossimoVg.date)}` : "nessun viaggio" },
    { id:"frigo", ico:"frigo", nome:"Frigo", hot: scaduti > 0,
      nota: S.fridge.length ? `${S.fridge.length} dentro${scad ? ` · ${scad} in scadenza` : ""}` : "vuoto" },
    { id:"obiettivi", ico:"obiettivi", nome:"Obiettivi", hot: obScad > 0,
      nota: S.goals.length ? `${S.goals.filter(goalDone).length}/${S.goals.length} fatti` : "nessuno" },
    { id:"impegni", ico:"impegni", nome:"Impegni fissi", hot:false,
      nota: `${S.fixed.length} ${S.fixed.length === 1 ? "impegno" : "impegni"} di ogni settimana` },
    { id:"conti", ico:"conti", nome:"Dare e avere", hot: contiVivi > 0,
      nota: (tl.avere || tl.dare) ? `${euro(tl.avere)} da avere · ${euro(tl.dare)} da dare` : "niente in sospeso" },
    { id:"piggy", ico:"piggy", nome:"Salvadanaio", hot:false,
      nota: S.piggy.length ? `${euro(messoVia)} messi via · ${S.piggy.length} ${S.piggy.length === 1 ? "obiettivo" : "obiettivi"}` : "nessun obiettivo" },
    { id:"invest", ico:"invest", nome:"Investimenti", hot: invVivi > 0,
      nota: investOpen().length ? `${euro(it.messo)} in ${investOpen().length} ${investOpen().length === 1 ? "posizione" : "posizioni"}` : "niente segnato" },
    { id:"uscite", ico:"uscite", nome:"Uscite", hot: billAlerts(T).length > 0,
      nota: billsOpen().length ? `${euro(billTotals().mese)} al mese · ${billsOpen().length} ${billsOpen().length === 1 ? "voce" : "voci"}` : "niente segnato" },
    { id:"diario", ico:"diario", nome:"Diario", hot:false,
      nota: (S.diary[T] || "").trim() ? "oggi hai scritto" : diaryDays().length ? `${diaryDays().length} ${diaryDays().length === 1 ? "pagina" : "pagine"} · ultima ${prettyDate(diaryDays()[0])}` : "pagina bianca" },
    { id:"vini", ico:"vini", nome:"Vini", hot:false,
      nota: S.wines.length ? `${S.wines.length} in cantina` : "nessuno segnato" }
  ];
}

      <div class="stat"><span>Devi</span><span style="color:var(--warn)">${euro(t.dare)}</span></div>

      ${chiusi.slice(0,40).map(e => ledgerLine(e, T)).join("")}
    </details>` : ""}`;
  }

  else if (v === "piggy"){
    nome = "Salvadanaio"; sotto = "Quanto hai messo via e quanto manca. Tocca un obiettivo per aggiornare la cifra.";
    const messo = S.piggy.reduce((n,x) => n + piggySaved(x), 0);
    const obiettivo = S.piggy.reduce((n,x) => n + (+x.target || 0), 0);
    corpo = `
    ${S.piggy.length ? `<div class="card">
      <div class="stat"><span>Messo via in tutto</span><span style="color:var(--done)">${euro(messo)}</span></div>
      <div class="stat"><span>Obiettivo totale</span><span>${euro(obiettivo)}</span></div>

    <h2>${S.piggy.length ? "I tuoi obiettivi" : "Niente ancora"}</h2>
    <div class="card">
      ${S.piggy.length ? S.piggy.map(x => piggyRow(x)).join("")
        : `<div class="empty">Un obiettivo di denaro: quanto vuoi mettere da parte, per cosa ed entro quando. I versamenti li segni tu, l'app non guarda i tuoi conti.</div>`}

  }

  else if (v === "invest"){
    nome = "Investimenti"; sotto = "Cosa hai messo dove, quando paga, quando scade. Tocca per registrare un incasso.";
    const it = investTotals();
    const aperti = investOpen().slice().sort((a,b) => {
      const A = investNext(a), B = investNext(b);
      if (A && B) return A.d.localeCompare(B.d);
      return A ? -1 : B ? 1 : a.name.localeCompare(b.name);
    });
    const chiusi = S.invest.filter(x => x.closed);
    const av = investAlerts(T);
    corpo = `
    ${S.invest.length ? `<div class="card">
      <div class="stat"><span>Messo dentro</span><span>${euro(it.messo)}</span></div>
      <div class="stat"><span>Incassato finora</span><span style="color:var(--done)">${euro(it.incassato)}</span></div>
      <div class="stat"><span>Posizioni aperte</span><span>${investOpen().length}</span></div>
    </div>` : ""}
    ${av.length ? `<h2>A giorni</h2><div class="card">
      ${av.map(x => `<button class="actrow" data-inv="${x.id}"><div class="imp" style="min-height:26px;background:var(--warn)"></div>
        <div class="rbody"><div class="rtitle" style="font-size:14px">${esc(x.t)}</div></div></button>`).join("")}
    </div>` : ""}
    <h2>${aperti.length ? "Aperti" : "Niente ancora"}</h2>
    <div class="card">
      ${aperti.length ? aperti.map(x => investRow(x)).join("")
        : `<div class="empty">Segna cosa hai comprato, quanto ci hai messo, quando ti paga e quando scade. Ti avviso a giorni dalla cedola e un mese prima della scadenza.</div>`}
      <div class="row"><button class="btn ghost wide" id="addinv">Aggiungi investimento</button></div>
    </div>
    ${chiusi.length ? `<details class="card" style="margin-top:16px">
      <summary style="padding:13px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer">Chiusi · ${chiusi.length}</summary>
      ${chiusi.map(x => investRow(x)).join("")}
    </details>` : ""}`;
  }

  else if (v === "uscite"){
    nome = "Uscite"; sotto = "Abbonamenti, spese fisse e uscite straordinarie. Quanto esce ogni mese, e cosa sta per uscire.";
    const t = billTotals();
    const av = billAlerts(T);
    const attive = billsOpen().slice().sort((a,b) => (a.next || "9999").localeCompare(b.next || "9999"));
    const chiuse = S.bills.filter(b => b.closed);
    const perCat = {};
    for (const b of billsOpen()) if (b.every !== "once") perCat[b.cat || "Altro"] = (perCat[b.cat || "Altro"] || 0) + billMonthly(b);
    const cats = Object.entries(perCat).sort((a,b) => b[1] - a[1]);
    corpo = `
    ${billsOpen().length ? `<div class="card">
      <div class="stat"><span>Ogni mese</span><span style="color:var(--warn)">${euro(t.mese)}</span></div>
      <div class="stat"><span>In un anno</span><span>${euro(t.anno)}</span></div>
      ${t.unaTantum ? `<div class="stat"><span>Una tantum in arrivo</span><span>${euro(t.unaTantum)}</span></div>` : ""}
    </div>` : ""}

    ${av.length ? `<h2>A giorni</h2><div class="card">
      ${av.map(x => `<button class="actrow" data-bill="${x.id}">
        <div class="imp" style="min-height:26px;background:var(--warn)"></div>
        <div class="rbody"><div class="rtitle" style="font-size:14px">${esc(x.t)}</div></div></button>`).join("")}
    </div>` : ""}

    <h2>${attive.length ? "Attive" : "Niente ancora"}</h2>
    <div class="card">
      ${attive.length ? attive.map(b => billRow(b, T)).join("")
        : `<div class="empty">Segna quello che esce da solo tutti i mesi: streaming, telefono, palestra, assicurazioni. Ti dico quanto pesa al mese e ti avviso prima che esca.</div>`}
      <div class="row"><button class="btn ghost wide" id="addbill">Aggiungi uscita</button></div>
    </div>

    ${cats.length > 1 ? `<h2>Dove va il fisso</h2>
    <div class="card" style="padding:14px">
      ${barHTML(cats.map(([k,x]) => ({ k, v: Math.round(x) })))}
      <div class="hint" style="margin-top:2px">Euro al mese, categoria per categoria.</div>
    </div>` : ""}

    ${chiuse.length ? `<details class="card" style="margin-top:16px">
      <summary style="padding:13px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer">Disdette · ${chiuse.length}</summary>
      ${chiuse.map(b => billRow(b, T)).join("")}
    </details>` : ""}`;

  else if (v === "diario"){
    nome = "Diario"; sotto = "Una pagina al giorno. Scrivi e basta: si salva da solo.";
    const passate = diaryDays().filter(d => d !== T);
    corpo = `
    <div class="card" style="padding:14px">
      <textarea id="di-today" rows="10" placeholder="Com'è andata oggi…"
        style="width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
               resize:vertical;font-size:16px;line-height:1.6">${esc(S.diary[T] || "")}</textarea>
      <div class="hint" id="di-stato">Si salva da solo mentre scrivi.</div>
    </div>
    ${passate.length ? `<h2>Le pagine di prima</h2>
    <div class="card">
      ${passate.slice(0, 60).map(d => `
        <button class="actrow" data-diary="${d}">
          <div class="rbody">
            <div class="rtitle" style="font-size:14px">${GG3[dow(d)]} ${prettyDate(d)} ${d.slice(0,4)}</div>
            <div class="rmeta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((S.diary[d] || "").replace(/\n/g, " · ").slice(0, 90))}</div>

    </div>` : ""}`;
  }

  else if (v === "vini"){
    nome = "Vini"; sotto = "Quelli che hai assaggiato, da che parte vengono e con cosa stanno bene.";
    const lista = WFILTER === "tutti" ? S.wines : S.wines.filter(x => x.type === WFILTER);
    corpo = `
    <div class="chips" id="wn-filtro" style="margin-bottom:12px">
      <button class="chip${WFILTER === "tutti" ? " on" : ""}" data-wf="tutti">Tutti</button>
      ${Object.entries(WTYPE).map(([k,t]) => `<button class="chip${WFILTER === k ? " on" : ""}" data-wf="${k}">${t.nome}</button>`).join("")}
    </div>
    <div class="card">
      ${lista.length ? lista.slice().sort((a,b) => (b.rating||0) - (a.rating||0) || a.name.localeCompare(b.name)).map(x => wineRow(x)).join("")
        : `<div class="empty">${S.wines.length ? "Nessuno di questo tipo." : "Segna un vino che ti è piaciuto: nome, da dove viene, con cosa lo berresti. La prossima volta al ristorante te lo ricordi."}</div>`}
      <div class="row"><button class="btn ghost wide" id="addwine">Aggiungi vino</button></div>
    </div>`;
  }

  el.innerHTML = `<div class="wrap">${baseTitolo(nome, sotto)}${corpo}<div style="height:20px"></div></div>`;
  bindAll();
  if (v === "spesa") bindSpesa();
  if (v === "diario") bindDiario();
}

let WFILTER = "tutti";
let DITIMER = null;

function bindDiario(){
  const t = el.querySelector("#di-today"), stato = el.querySelector("#di-stato");
  if (!t) return;
  t.oninput = () => {
    clearTimeout(DITIMER);
    if (stato) stato.textContent = "sto scrivendo…";
    DITIMER = setTimeout(() => {
      saveDiary(today(), t.value);
      if (stato) stato.textContent = `salvato alle ${toHHMM(nowMin())}`;
    }, 700);
  };
}

// i comandi della pagina spesa: giorni, data, aggiunta rapida
function bindSpesa(){
  const wn = S.shop.when;
  const paint = () => {
    el.querySelectorAll("#sh-mode .chip").forEach(b => b.classList.toggle("on", b.dataset.m === wn.type));
    el.querySelectorAll("[data-shd]").forEach(b => b.classList.toggle("on", (wn.days||[]).includes(+b.dataset.shd)));
    el.querySelector("#sh-days").style.display = wn.type === "days" ? "" : "none";
    el.querySelector("#sh-date").style.display = wn.type === "date" ? "" : "none";
  };
  el.querySelectorAll("#sh-mode .chip").forEach(b => b.onclick = () => {
    wn.type = b.dataset.m;
    if (wn.type === "date" && !wn.date) wn.date = today();
    save(); paint();
  });
  el.querySelectorAll("[data-shd]").forEach(b => b.onclick = () => {
    const g = +b.dataset.shd;
    wn.days = wn.days || [];
    wn.days = wn.days.includes(g) ? wn.days.filter(x => x !== g) : [...wn.days, g];
    save(); paint();
  });
  const dt = el.querySelector("#sh-dt");
  if (dt) dt.onchange = () => { wn.date = dt.value; save(); };
  const aggiungi = () => {
    const t = el.querySelector("#sh-new"), q = el.querySelector("#sh-qty");
    if (!t.value.trim()) return;
    addShopItem(t.value, q.value);
    render();
  };
  const ab = el.querySelector("#sh-add"); if (ab) ab.onclick = aggiungi;
  const ti = el.querySelector("#sh-new");
  if (ti) ti.onkeydown = e => { if (e.key === "Enter") aggiungi(); };
  paint();
}

function doRow(a, T){
  const fatta = isDone(T, a.id);
  return `
  <div class="row ${fatta ? "done" : ""}" data-row="${a.id}">
    <div class="imp i${a.imp}"></div>
    <button class="tick" data-tick="${a.id}" aria-label="Segna come fatta">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </button>
    <div class="rbody">
      <div class="rtitle">${esc(a.name)}</div>
      <div class="rmeta">${a.win.start}–${a.win.end}<span class="dot">·</span>${durLabel(a.dur)}<span class="dot">·</span>${esc(a.cat)}</div>
      ${timeOn(T, a.id) ? `<span class="flag">${durLabel(timeOn(T, a.id))} registrati oggi</span>` : ""}
      ${movedFrom(a, T) ? `<span class="flag moved">spostata da ${GG3[dow(movedFrom(a, T))]} ${prettyDate(movedFrom(a, T))}</span>` : ""}
    </div>
    ${fatta ? "" : `<button class="btn ghost" data-do-act="${a.id}" style="min-width:44px;padding:8px 0" aria-label="Fai adesso">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>`}
  </div>`;
}

function openDo(){
  const T = today();
  const oggi = todaysActs().filter(a => !isDone(T, a.id));
  const dopo = S.activities
    .map(a => ({ a, d: nextOcc(a, addDays(T, 1), 13) }))
    .filter(x => x.d)
    .sort((x,y) => x.d.localeCompare(y.d)).slice(0, 12);
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Cosa fai adesso?</h3>
    <div class="hint" style="margin-bottom:14px">Puoi anche portarti avanti con una dei prossimi giorni.</div>
    <h2 style="margin-top:0">Oggi</h2>
    <div class="card">
      ${oggi.length ? oggi.map(a => `
        <button class="actrow" data-pick="${a.id}">
          <div class="imp i${a.imp}" style="min-height:32px"></div>
          <div class="rbody"><div class="rtitle">${esc(a.name)}</div>
            <div class="rmeta">${a.win.start}–${a.win.end}<span class="dot">·</span>${durLabel(a.dur)}</div></div>
        </button>`).join("")
      : `<div class="empty">Oggi non resta niente.</div>`}
    </div>
    ${dopo.length ? `<h2>Nei prossimi giorni</h2>
    <div class="card">
      ${dopo.map(({a, d}) => `
        <button class="actrow" data-pick="${a.id}" data-day="${d}">
          <div class="imp i${a.imp}" style="min-height:32px"></div>
          <div class="rbody"><div class="rtitle">${esc(a.name)}</div>
            <div class="rmeta">${GG3[dow(d)]} ${prettyDate(d)}<span class="dot">·</span>${durLabel(a.dur)}</div></div>
        </button>`).join("")}
    </div>` : ""}
    <div class="btnrow"><button class="btn ghost wide" id="do-cancel">Chiudi</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#do-cancel").onclick = () => w.remove();
  w.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { w.remove(); openDoAct(b.dataset.pick, b.dataset.day); });
}

function openDoAct(id, day){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  const T = today();
  const giorno = day || (occOn(a, T).length ? T : nextOcc(a, T, 60));
  const anticipo = giorno && giorno > T;          // la fai oggi al posto di un giorno che deve ancora venire
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>${esc(a.name)}</h3>
    <div class="card" style="margin-bottom:18px">
      <div class="stat"><span>Quando</span><span>${giorno === T ? "oggi" : giorno ? `${GG3[dow(giorno)]} ${prettyDate(giorno)}` : "—"}, ${a.win.start}–${a.win.end}</span></div>
      <div class="stat"><span>Quanto dura</span><span>${durLabel(a.dur)}</span></div>
      ${timeOn(T, a.id) ? `<div class="stat"><span>Già registrati oggi</span><span>${durLabel(timeOn(T, a.id))}</span></div>` : ""}
    </div>

    <div class="field"><label>Usi il crono?</label>
      ${S.cycles.length ? `<div class="card">
        ${S.cycles.map(c => `<button class="actrow" data-runc="${c.id}">
          <div class="rbody"><div class="rtitle">${esc(c.name)}</div>
            <div class="rmeta">${c.kind === "crono" ? "cronometro, conta in avanti" : `${c.segs.length} fasi · ${durLabel(cycleTotal(c))}`}</div></div>
        </button>`).join("")}
      </div>`
      : `<div class="hint">Non hai ancora nessun ciclo. Creane uno dal tasto Crono e potrai far partire il tempo da qui.</div>`}
    </div>

    <div class="btnrow">
      <button class="btn primary" id="da-done" style="flex:2">${isDone(T, a.id) ? "Toglila da fatte" : anticipo ? "Fatta oggi, in anticipo" : "Segnala fatta"}</button>
      <button class="btn ghost" id="da-no">Senza crono</button>
    </div>
    <div class="btnrow"><button class="btn ghost wide" id="da-edit">Modifica l'attività</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelectorAll("[data-runc]").forEach(b => b.onclick = () => {
    if (anticipo){ moveOcc(a, occOn(a, giorno)[0] || giorno, T); save(); }
    w.remove(); startRun(b.dataset.runc, { id:a.id, name:a.name });
  });
  w.querySelector("#da-no").onclick = () => w.remove();
  w.querySelector("#da-done").onclick = () => {
    // portarsi avanti: il giro di quel giorno viene spostato a oggi e segnato fatto
    if (anticipo && !isDone(T, a.id)) moveOcc(a, occOn(a, giorno)[0] || giorno, T);
    w.remove(); toggleDone(a.id); render();
  };
  w.querySelector("#da-edit").onclick = () => { w.remove(); openForm(a.id); };
}

function openCrono(){
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Crono</h3>
    <div class="hint" style="margin-bottom:14px">Cicli di lavoro e pausa, o un cronometro che conta in avanti. Il tempo di lavoro finisce registrato su quello che scegli.</div>

        <div class="row">
          <div class="rbody">

            <div class="rmeta">${c.kind === "crono" ? "Cronometro · conta in avanti"

    ${inApp() ? `<div class="btnrow"><button class="btn wide" id="cr-timer">Timer nell'orologio del telefono</button></div>` : ""}

/* ============================================================
   OBIETTIVI A SCADENZA — una volta entro la settimana, il mese, l'anno,
   oppure entro una data precisa
   ============================================================ */
const GPER = { w:"questa settimana", m:"questo mese", y:"quest'anno", d:"" };

function periodEnd(per, d){
  const dt = fromIso(d);
  if (per === "w"){ dt.setDate(dt.getDate() + (7 - ((dt.getDay()+6)%7) - 1)); return iso(dt); }
  if (per === "m"){ dt.setMonth(dt.getMonth()+1, 0); return iso(dt); }
  dt.setMonth(11, 31); return iso(dt);
}
// con una data precisa l'obiettivo si fa una volta sola; gli altri ripartono a ogni periodo
const goalKey  = g => g.per === "d" ? "d" : pKey(g.per, today());
const goalDone = g => !!(g.done && g.done[goalKey(g)]);
const goalDue  = g => g.per === "d" ? (g.due || null) : periodEnd(g.per, today());
const goalLeft = g => { const f = goalDue(g); return f ? daysBetween(today(), f) : 999; };

function goalMeta(g){
  const done = goalDone(g), left = goalLeft(g);
  if (g.per === "d"){
    if (done) return `fatto${typeof g.done.d === "string" ? ` il ${prettyDate(g.done.d)}` : ""} · era entro il ${prettyDate(g.due)}`;
    if (left < 0) return `scaduto da ${-left} ${-left === 1 ? "giorno" : "giorni"} · era entro il ${prettyDate(g.due)}`;
    return `${left === 0 ? "ultimo giorno utile" : left === 1 ? "manca 1 giorno" : `mancano ${left} giorni`} · entro ${GG3[dow(g.due)].toLowerCase()} ${prettyDate(g.due)}`;
  }
  if (done) return `fatto ${GPER[g.per]}`;
  return `${left === 0 ? "ultimo giorno utile" : left === 1 ? "manca 1 giorno" : `mancano ${left} giorni`} · ${GPER[g.per]}`;
}

function goalsHTML(){
  if (!S.goals.length) return `<div class="card">
    <div class="empty">Cose da fare una volta entro la settimana, il mese, l'anno o una data che scegli tu. Il coach ti dice quanto manca e ti avvisa.</div>
    <div class="row"><button class="btn ghost wide" id="addgoal">Aggiungi obiettivo</button></div></div>`;
  const T = today();
  // quelli con data, fatti da più di due settimane, vanno in archivio
  const vivi = S.goals.filter(g => !(g.per === "d" && goalDone(g) && g.due && daysBetween(g.due, T) > 14));
  const archivio = S.goals.filter(g => !vivi.includes(g));
  const sorted = [...vivi].sort((a,b) => (goalDone(a)?1:0) - (goalDone(b)?1:0) || goalLeft(a) - goalLeft(b));
  const riga = g => {
    const done = goalDone(g), left = goalLeft(g);
    const urgente = !done && left <= 3;
    return `<div class="row ${done ? "done" : ""}" data-row="${g.id}">
      <button class="tick" data-gtick="${g.id}" aria-label="Segna come fatto">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>

        <div class="rtitle">${esc(g.name)}</div>
        <div class="rmeta" style="${urgente ? "color:var(--warn)" : ""}">${esc(goalMeta(g))}</div>
        ${timeOn(T, g.id) ? `<span class="flag">${durLabel(timeOn(T, g.id))} registrati oggi</span>` : ""}
      </div>
      <button class="btn ghost" data-gedit="${g.id}" style="min-width:40px;padding:8px 0" aria-label="Modifica">&#9881;</button>
    </div>`;
  };
  return `<div class="card">
    ${sorted.map(riga).join("")}
    <div class="row"><button class="btn ghost wide" id="addgoal">Aggiungi obiettivo</button></div>
  </div>
  ${archivio.length ? `<details class="card" style="margin-top:16px">
    <summary style="padding:13px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer">Fatti · ${archivio.length}</summary>
    ${archivio.map(riga).join("")}
  </details>` : ""}`;
}

function toggleGoal(id){
  const g = S.goals.find(x => x.id === id); if (!g) return;
  const k = goalKey(g);
  g.done = g.done || {};
  if (g.done[k]) delete g.done[k]; else g.done[k] = g.per === "d" ? today() : true;
  save();
  markRow(id, g.done[k]);
  const row = document.querySelector(`[data-row="${id}"] .rmeta`);
  if (row){
    row.textContent = goalMeta(g);
    row.style.color = (!g.done[k] && goalLeft(g) <= 3) ? "var(--warn)" : "";
  }
  patchToday();
}

/* ---------- PROSSIMI 30 GIORNI ---------- */
function monthHTML(){
  const T = today();
  const days = [];
  for (let i = 0; i < 30; i++){
    const d = addDays(T, i);
    const evs = [];
    for (const o of S.oneoffs){
      if (o.showInMonth === false) continue;
      const fine = o.endDate || o.date;
      if (d < o.date || d > fine) continue;
      evs.push({ t: o.allDay ? "tutto il dì" : `${d === o.date ? o.start : "00:00"}–${d === fine ? o.end : "24:00"}`, n:o.label });
    }
    for (const f of S.fixed) if (f.showInMonth && f.days.includes(dow(d)))
      evs.push({ t:`${f.start}–${f.end}`, n:f.label });
    // da Google: gli eventi sempre, gli impegni ripetuti solo se l'hai chiesto
    if (S.gcalOn) for (const g of gcalOnDay(d)){
      if (g.recurring && !gcxOf(g.key).showInMonth) continue;
      evs.push({ t: g.allDay ? "tutto il dì" : `${toHHMM(g.s)}–${toHHMM(g.e)}`, n:g.label });
    }
    for (const a of actsOn(d))
      evs.push({ t:`${a.win.start}–${a.win.end}`, n:a.name });
    for (let k = evs.length - 1; k >= 0; k--) if (S.hidden.includes(evs[k].n)) evs.splice(k,1);
    if (evs.length){
      evs.sort((x,y) => x.t.localeCompare(y.t));
      days.push({ d, evs });
    }
  }
  const restore = S.hidden.length
    ? `<div class="row"><button class="btn ghost wide" id="unhideall">Rimetti i ${S.hidden.length} nascosti</button></div>` : "";
  if (!days.length) return `<div class="card"><div class="empty">Nessun impegno nei prossimi 30 giorni.</div>${restore}</div>`;
  return `<div class="card" style="max-height:314px;overflow-y:auto">${restore}
    ${days.map(x => `
      <div class="monthday">
        <b>${GG3[dow(x.d)]} ${prettyDate(x.d)}</b>
        ${x.evs.map(e => `<div class="mev"><span>${e.t}</span><span style="flex:1">${esc(e.n)}</span><button data-hide="${esc(e.n)}" style="background:none;border:0;color:var(--ink-faint);font-size:15px;padding:0 4px" aria-label="Nascondi">&times;</button></div>`).join("")}
      </div>`).join("")}
  </div>`;
}

/* ---------- DA RIDECIDERE ----------
   Le attività rimaste indietro. Il coach guarda i prossimi giorni, ti dice
   dove starebbero meglio e perché. Finché non scegli, resta tutto com'è. */
function replanTip(a){
  const T = today();
  const prossimo = nextOcc(a, T, 60);
  const gg = prossimo ? daysBetween(T, prossimo) : null;
  // si cerca prima del prossimo giro: dopo non avrebbe senso recuperare
  const quanti = gg === null ? 7 : Math.max(1, Math.min(7, gg));
  const sugg = suggestDays({ from:T, days:quanti, dur:a.dur, win:a.win, actId:a.id, allowed:a.days });
  return { prossimo, gg, sugg, best: sugg.find(x => x.fits) || null };
}

function replanRow(m){
  const { a, orig, day } = m;
  const tip = replanTip(a);
  const saltaMeglio = tip.gg !== null && tip.gg <= 2;
  let consiglio, primo;
  if (saltaMeglio || !tip.best){
    consiglio = saltaMeglio
      ? `Il prossimo giro è già ${tip.gg === 1 ? "domani" : "dopodomani"}: ti consiglio di saltare questo.`
      : `Prima del prossimo giro non trovo spazio nella fascia ${a.win.start}–${a.win.end}. Puoi scegliere un giorno a mano o saltarla.`;
    primo = `<button class="on" data-rpskip="${a.id}" data-o="${orig}">Salta questo giro</button>`;
  } else {
    consiglio = `Ti consiglio <b>${esc(dayChip(tip.best.d).toLowerCase())}</b>: ${esc(whyDay(tip.best))}.`;
    primo = `<button class="on" data-rpmove="${a.id}" data-o="${orig}" data-d="${tip.best.d}">Spostala a ${esc(dayChip(tip.best.d).toLowerCase())}</button>`;
  }
  return `
  <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="rbody">
      <div class="rtitle">${esc(a.name)}</div>
      <div class="rmeta">non fatta ${GG[dow(day)].toLowerCase()} ${prettyDate(day)}${day !== orig ? ` (l'avevi spostata dal ${prettyDate(orig)})` : ""}${tip.prossimo ? `<span class="dot">·</span>prossimo giro ${esc(dayChip(tip.prossimo).toLowerCase())}` : ""}</div>
      <div class="rmeta" style="color:var(--ink);margin-top:6px">${consiglio}</div>
    </div>
    <div class="why" style="margin-top:0">
      ${primo}
      <button data-rpopen="${a.id}" data-o="${orig}">Altre date</button>
      ${saltaMeglio || !tip.best ? "" : `<button data-rpskip="${a.id}" data-o="${orig}">Salta</button>`}
    </div>
  </div>`;
}

function replanHTML(T){
  const lista = missedList();
  if (!lista.length) return "";
  return `<h2 id="h-replan">Da ridecidere · ${lista.length}</h2>
  <div class="card">${lista.map(replanRow).join("")}</div>`;
}

function doMoveOcc(id, orig, d){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  moveOcc(a, orig, d);
  runEngine(); save(); render();
}
function doSkipOcc(id, orig){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  skipOcc(a, orig);
  runEngine(); save(); render();
}

// Il foglio con tutte le possibilità: i giorni consigliati, un giorno a scelta,
// "l'avevo fatta", "salta".
function openReplan(id, orig, opts){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  opts = opts || {};
  const T = today();
  const giorno = (a.moves && a.moves[orig]) || orig;
  const tip = replanTip(a);
  const tutti = suggestDays({ from:T, days:14, dur:a.dur, win:a.win, actId:a.id, allowed:a.days });
  // prima i giorni che vengono prima del prossimo giro; quelli dopo solo se non c'è altro
  const prima = tutti.filter(x => x.fits && (!tip.prossimo || x.d < tip.prossimo));
  const top = (prima.length ? prima : tutti.filter(x => x.fits && x.d !== tip.prossimo)).slice(0, 4);
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>${esc(a.name)}</h3>
    <div class="hint" style="margin-bottom:16px">Doveva essere ${GG[dow(giorno)].toLowerCase()} ${prettyDate(giorno)}, nella fascia ${a.win.start}–${a.win.end}, ${durLabel(a.dur)}.${tip.prossimo ? ` Il prossimo giro normale è ${dayChip(tip.prossimo).toLowerCase()}.` : ""}</div>

    <h2 style="margin-top:0">I giorni che ti consiglio</h2>
    <div class="card">
      ${top.length ? top.map((x,i) => `
        <button class="actrow" data-go="${x.d}">
          <div class="imp" style="min-height:34px;background:${i === 0 ? "var(--accent)" : "var(--line)"}"></div>
          <div class="rbody">
            <div class="rtitle">${esc(dayChip(x.d))}${tip.prossimo && x.d >= tip.prossimo ? ` <span style="font-weight:400;color:var(--ink-faint)">· dopo il prossimo giro</span>` : ""}</div>
            <div class="rmeta">${esc(whyDay(x))}</div>
          </div>
        </button>`).join("")
      : `<div class="empty">Nelle prossime due settimane la fascia ${a.win.start}–${a.win.end} è sempre occupata. Scegli un giorno qui sotto: puoi comunque farla quando vuoi.</div>`}
    </div>

    <div class="field" style="margin-top:16px"><label>Un altro giorno</label>
      <div class="segline">
        <input type="date" id="rp-d" min="${T}" value="${addDays(T, 1)}" style="flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">
        <button class="btn" id="rp-go" style="flex:0 0 auto">Sposta lì</button>
      </div>
      <div class="hint" id="rp-load"></div></div>

    <div class="btnrow"><button class="btn wide" id="rp-done">L'avevo fatta, non l'avevo segnata</button></div>
    <div class="btnrow"><button class="btn ghost wide" id="rp-skip">Salta questo giro</button></div>
    <div class="btnrow"><button class="btn ghost wide" id="rp-close">Decido dopo</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  const fine = () => { w.remove(); if (opts.dopo) opts.dopo(); else { runEngine(); save(); render(); } };
  const inp = w.querySelector("#rp-d"), load = w.querySelector("#rp-load");
  const anteprima = () => {
    const d = inp.value;
    if (!d){ load.textContent = ""; return; }
    const L = dayLoad(d, a.id);
    const room = freeRoom(d, a.win);
    load.textContent = `${loadLine(L)}${room >= a.dur ? "" : ` · nella fascia ${a.win.start}–${a.win.end} non c'è spazio`}.`;
  };
  inp.oninput = anteprima; anteprima();
  w.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { moveOcc(a, orig, b.dataset.go); fine(); });
  w.querySelector("#rp-go").onclick = () => {
    const d = inp.value;
    if (!d || d < T){ alert("Scegli un giorno da oggi in avanti."); return; }
    moveOcc(a, orig, d); fine();
  };
  w.querySelector("#rp-done").onclick = () => {
    S.log[giorno] = S.log[giorno] || {};
    S.log[giorno][a.id] = true;
    a.doneCount = (a.doneCount || 0) + 1;
    if (!a.lastDone || giorno > a.lastDone) a.lastDone = giorno;
    fine();
  };
  w.querySelector("#rp-skip").onclick = () => { skipOcc(a, orig); fine(); };
  w.querySelector("#rp-close").onclick = () => w.remove();
}

function openPause(label){

    <h3>Ferma il coach</h3>

    <div class="field"><label>Da</label>
      <input type="date" id="pa-f" value="${T}" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"></div>

      <div class="chips" id="pa-mode">

      <div id="pa-tobox" style="margin-top:9px;display:none">
        <input type="date" id="pa-t" value="${addDays(T,7)}" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">

    <div class="field"><label>Perché</label>

  </div>`;

    w.querySelector("#pa-tobox").style.display = mode === "date" ? "" : "none";
