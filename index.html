/* ---------- CHIUSURA SERALE ---------- */
const REASONS = [
  ["tempo",  "Non ho avuto tempo"],
  ["voglia", "Non ne avevo voglia"],
  ["altro",  "Si è incastrato altro"],
  ["giorno", "Non era il giorno giusto"]
];
// Caso a parte: la cosa non andava fatta. Non è un fallimento tuo ma della
// programmazione, quindi conta come completata e il coach se ne ricorda.
const R_VUOTO = "vuoto";
const R_VUOTO_LABEL = "Non c'era nulla da fare";

function undoneToday(T){
  const out = [];
  for (const a of planFor(T)) if (!isDone(T, a.id)) out.push({ id:a.id, name:a.name, kind:"attività" });
  for (const x of gcalTodosOn(T)) if (!isDone(T, x.id)) out.push({ id:x.id, name:x.name, kind:"dal calendario" });
  for (const i of allRoutineItems()) if (!rDone(T, i.id)) out.push({ id:i.id, name:i.text, kind:"routine" });
  for (const r of remindersOn(T)) if (!readToday(T, r.id)) out.push({ id:r.id, name:r.text, kind:"promemoria" });
  for (const t of tripItemsOn(T)) if (!tripDone(t.tripId, t.id)) out.push({ id:t.id, name:t.text, kind:"valigia · " + t.tripName });
  return out;
}

// La chiusura si può fare dall'ora scelta fino alle 3 di notte.
// Dopo mezzanotte riguarda il giorno appena finito, non quello appena iniziato.
function closeTarget(){
  if (isPaused() || S.resume) return null;
  const n = nowMin();
  if (n < 3 * 60) return addDays(today(), -1);
  if (n >= toMin(S.closeAt)) return today();
  return null;
}

function closeHTML(){
  const d = closeTarget();
  if (!d) return "";
  const ieri = d !== today();
  const done = S.closes[d];
  if (done) return `<div class="closecard"><div class="rbody">
      <div class="rtitle">${ieri ? "Ieri chiuso" : "Giornata chiusa"} al ${done.pct}%</div>
      <div class="rmeta">Ci si rivede stasera.</div></div>
      <button class="btn ghost" id="reopen">Riapri</button></div>`;
  const p = progressOn(d);
  return `<div class="closecard"><div class="rbody">
      <div class="rtitle">Chiudi ${ieri ? "la giornata di ieri" : "la giornata"}</div>
      <div class="rmeta" id="close-meta">${ieri ? `${GG[dow(d)]} ${prettyDate(d)} · ` : ""}${p.pct}%, ${p.done} cose su ${p.total}.</div></div>
      <button class="btn primary" id="doclose">Chiudi</button></div>`;
}

function openClose(){
  const T = closeTarget() || today();
  const left = undoneToday(T);
  const picks = {};
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Come è andata${closeTarget() && closeTarget() !== today() ? " ieri" : " oggi"}</h3>
    <div style="font-size:15px;color:var(--ink-soft);margin-bottom:20px" id="cl-top"></div>
    <div id="cl-list">
      ${left.map(x => `
        <div class="card" style="padding:13px 14px;margin-bottom:9px">
          <div class="rtitle">${esc(x.name)}</div>
          <div class="rmeta">${x.kind}</div>
          <div class="why" data-for="${x.id}">
            ${REASONS.map(([k,l]) => `<button data-r="${k}">${l}</button>`).join("")}
            ${x.kind === "attività" ? `<button data-r="${R_VUOTO}" class="vuoto">${R_VUOTO_LABEL}</button>` : ""}
          </div>
        </div>`).join("")}
    </div>
    <div class="field" style="margin-top:4px"><label>Due righe sulla giornata</label>
      <textarea id="cl-note" rows="3" placeholder="Come è andata, cosa è successo…"
        style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical"></textarea></div>
    <div class="btnrow">
      <button class="btn primary wide" id="cl-save">Chiudi la giornata</button>
    </div>
    <div class="btnrow"><button class="btn ghost wide" id="cl-cancel">Non adesso</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  // "Non c'era nulla da fare" vale come fatta: la percentuale si aggiorna subito.
  const top = w.querySelector("#cl-top");
  function refreshTop(){
    const vuoti = Object.values(picks).filter(r => r === R_VUOTO).length;
    const q = progressOn(T, picks);
    const resta = left.length - vuoti;
    top.textContent = `${q.pct}% della giornata, ${q.done} cose su ${q.total}.`
      + (resta ? ` Restano ${resta} cose. Dimmi perché, con un tocco.`
               : left.length ? " Niente rimasto indietro." : " Non è rimasto niente indietro.");
  }
  refreshTop();

  w.querySelectorAll(".why").forEach(g => {
    g.querySelectorAll("button").forEach(b => b.onclick = () => {
      const id = g.dataset.for, r = b.dataset.r;
      if (picks[id] === r) delete picks[id]; else picks[id] = r;
      g.querySelectorAll("button").forEach(x => x.classList.toggle("on", picks[id] === x.dataset.r));
      refreshTop();
    });
  });
  w.querySelector("#cl-cancel").onclick = () => w.remove();
  w.querySelector("#cl-save").onclick = () => {
    // le cose segnate "non c'era nulla da fare" entrano nel registro come completate
    S.log[T] = S.log[T] || {};
    for (const id in picks) if (picks[id] === R_VUOTO) S.log[T][id] = true;
    const q = progressOn(T);
    S.closes[T] = { pct: q.pct, at: Date.now(), reasons: picks,
                    note: (w.querySelector("#cl-note").value || "").trim() };
    save(); w.remove(); render();
  };
}

/* ============================================================
   STATISTICHE — quello che i dati sanno dire, niente di più
   ============================================================ */
const REASON_LABEL = Object.fromEntries(REASONS);

// quanti degli ultimi n giorni erano in pausa: non sono giornate andate male
function pausedIn(n){
  const T = today();
  let c = 0;
  for (let i = 1; i <= n; i++) if (S.pausedDays[addDays(T, -i)]) c++;
  return c;
}

function closedDays(n){
  const T = today(), out = [];
  for (let i = 1; i <= n; i++){
    const d = addDays(T, -i);
    if (S.closes[d]) out.push({ d, c: S.closes[d] });
  }
  return out;
}

function barHTML(rows){
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `
    <div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px">
        <span>${esc(r.k)}</span><span style="color:var(--ink-soft)">${r.v}</span>
      </div>
      <div style="height:6px;border-radius:3px;background:var(--surface-2);margin-top:4px">
        <div style="height:100%;width:${Math.round(r.v/max*100)}%;background:var(--accent);border-radius:3px"></div>
      </div>
    </div>`).join("");
}

function openStats(){
  const T = today();
  const last30 = closedDays(30), last7 = closedDays(7);
  const avg = a => a.length ? Math.round(a.reduce((s,x)=>s+x.c.pct,0)/a.length) : null;

  // motivi
  const rc = {}, vuoti = {};
  for (const x of last30) for (const id in (x.c.reasons||{})){
    const r = x.c.reasons[id];
    if (r === R_VUOTO){
      const a = S.activities.find(y => y.id === id);
      const nm = a ? a.name : "una cosa tolta";
      vuoti[nm] = (vuoti[nm] || 0) + 1;
    } else rc[r] = (rc[r]||0)+1;
  }
  const reasonRows = Object.entries(rc).map(([k,v]) => ({ k: REASON_LABEL[k] || k, v }))
                           .sort((a,b) => b.v - a.v);
  const vuotoRows = Object.entries(vuoti).map(([k,v]) => ({ k, v })).sort((a,b) => b.v - a.v);

  // attività più saltate
  const skipped = S.activities.filter(a => a.skipCount).sort((a,b) => b.skipCount - a.skipCount).slice(0,5);

  // tempo registrato negli ultimi 30 giorni
  const tt = {};
  for (let i = 0; i < 30; i++){
    const d = addDays(T, -i);
    for (const id in (S.timeLog[d] || {})){
      const a = S.activities.find(x => x.id === id) || S.goals.find(x => x.id === id) || S.oneoffs.find(x => x.id === id);
      const nm = a ? (a.name || a.label) : "altro";
      tt[nm] = (tt[nm] || 0) + S.timeLog[d][id];
    }
  }
  const timeRows = Object.entries(tt).map(([k,v]) => ({ k, v: Math.round(v) })).sort((a,b)=>b.v-a.v).slice(0,6);

  // sonno nei giorni buoni e in quelli storti
  let sleepLine = "";
  const sonno = S.health.find(v => v.type === "sonno");
  if (sonno && last30.length >= 6){
    const media = avg(last30);
    const sopra = [], sotto = [];
    for (const x of last30){
      const s = hVal(x.d, sonno.id);
      if (!s) continue;
      (x.c.pct >= media ? sopra : sotto).push(s.min);
    }
    if (sopra.length >= 3 && sotto.length >= 3){
      const m = a => Math.round(a.reduce((s,x)=>s+x,0)/a.length);
      sleepLine = `Nei giorni chiusi sopra la tua media dormi ${durLabel(m(sopra))}. In quelli sotto, ${durLabel(m(sotto))}.`;
    }
  }

  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Statistiche</h3>

    <h2 style="margin-top:0">Chiusure</h2>
    <div class="card">
      <div class="stat"><span>Media ultimi 7 giorni</span><span>${avg(last7) ?? "—"}${avg(last7)!==null?"%":""}</span></div>
      <div class="stat"><span>Media ultimi 30 giorni</span><span>${avg(last30) ?? "—"}${avg(last30)!==null?"%":""}</span></div>
      <div class="stat"><span>Giorni chiusi su 30</span><span>${last30.length}</span></div>
      ${pausedIn(30) ? `<div class="stat"><span>Giorni in pausa</span><span>${pausedIn(30)}</span></div>` : ""}
    </div>
    ${last30.length < 5 ? `<div class="hint">Servono almeno cinque sere chiuse perché questi numeri dicano qualcosa.</div>` : ""}

    ${(S.fridgeStats.usati || S.fridgeStats.buttati) ? `
    <h2>Frigo</h2>
    <div class="card">
      <div class="stat"><span>Consumato in tempo</span><span>${S.fridgeStats.usati||0}</span></div>
      <div class="stat"><span>Buttato</span><span>${S.fridgeStats.buttati||0}</span></div>
      <div class="stat"><span>Dentro adesso</span><span>${S.fridge.length}</span></div>
    </div>` : ""}

    <h2>Perché le cose restano indietro</h2>
    <div class="card" style="padding:14px">
      ${reasonRows.length ? barHTML(reasonRows)
        : `<div style="color:var(--ink-soft);font-size:14px">Ancora nessun motivo registrato.</div>`}
    </div>
    ${reasonRows.length >= 3 ? `<div class="hint">Il motivo più frequente dice che tipo di problema hai: il tempo si risolve spostando, la voglia no.</div>` : ""}

    ${vuotoRows.length ? `
    <h2>Programmate quando non servivano</h2>
    <div class="card" style="padding:14px">${barHTML(vuotoRows)}</div>
    <div class="hint">Non è roba che hai saltato: era il programma sbagliato. Se una torna spesso, abbassale la frequenza dalla scheda Attività.</div>` : ""}

    <h2>Dove è finito il tempo</h2>
    <div class="card" style="padding:14px">
      ${timeRows.length ? barHTML(timeRows.map(r => ({ k:r.k, v:r.v })))
        : `<div style="color:var(--ink-soft);font-size:14px">Nessun tempo registrato. Fai partire un ciclo dal Crono scegliendo su cosa lavori.</div>`}
    </div>

    <h2>Attività più saltate</h2>
    <div class="card">
      ${skipped.length ? skipped.map(a => `
        <div class="stat"><span>${esc(a.name)}</span><span>${a.skipCount} volte</span></div>`).join("")
        : `<div class="empty">Nessuna attività saltata. Buon segno.</div>`}
    </div>

    ${sleepLine ? `<h2>Sonno e giornate</h2><div class="card"><div class="empty" style="color:var(--ink)">${esc(sleepLine)}</div></div>
      <div class="hint">È solo una coincidenza nei numeri, non una spiegazione.</div>` : ""}

    ${last30.some(x => x.c.note) ? `
    <h2>Le tue note</h2>
    <div class="card">
      ${last30.filter(x => x.c.note).slice(0,10).map(x => `
        <div class="monthday"><b>${GG3[dow(x.d)]} ${prettyDate(x.d)} · ${x.c.pct}%</b>
          <div class="mev"><span style="flex:1">${esc(x.c.note)}</span></div></div>`).join("")}
    </div>` : ""}

    <h2>Riparti da zero</h2>
    <div class="card">
      <div class="row">
        <div class="rbody">
          <div class="rtitle">Azzera le statistiche</div>

/* ---------- RESET ---------- */

// Cancella solo lo storico: quello che hai costruito resta.
function resetStats(){
  S.log = {};       // spunte delle attività
  S.rlog = {};      // routine
  S.remlog = {};    // promemoria letti
  S.tlog = {};      // conteggi Extra
  S.hlog = {};      // salute
  S.timeLog = {};   // tempo registrato dal Crono
  S.durLog = {};    // quanto ci metti davvero
  S.closes = {};    // chiusure serali e note
  S.dayPlan = {};
  S.notices = [];
  const T0 = today();
  S.activities.forEach(a => {
    a.doneCount = 0; a.skipCount = 0; a.lastDone = null;
    a.handled = {}; a.skips = {};
    // gli spostamenti già decisi per i prossimi giorni restano
    const mv = {};
    for (const o in (a.moves || {})) if (a.moves[o] >= T0) mv[o] = a.moves[o];
    a.moves = mv;
    // da oggi si riparte: niente giri "saltati" nel passato
    if (!a.from || a.from < T0) a.from = T0;
  });
  S.goals.forEach(g => { g.done = {}; });
  S.lastRun = null;
  runEngine();
  save();
}

// Riporta l'app a com'era appena aperta: via tutto.
function resetAll(){
  const fresh = structuredClone(DEFAULT_STATE);
  fresh.gcalOn = S.gcalOn;        // il collegamento al calendario resta com'era
  fresh.skin = S.skin;            // e anche i colori che hai scelto
  fresh.mode = S.mode;
  fresh.updatedAt = Date.now();
  S = fresh;
  S.lastRun = null;
  runEngine();
  save();
}

/* ============================================================
   VALIGIA — la lista di un viaggio, che esce da sola il giorno prima
   ============================================================ */
const tripDone = (tid, iid) => !!(S.triplog[tid] && S.triplog[tid][iid]);

// Quando si vede: dal numero di giorni prima che hai scelto (di norma uno solo),
// e il giorno della partenza solo se è rimasto qualcosa da mettere in valigia.
function tripVisible(t, d){
  if (!t.date || !(t.items || []).length) return false;
  const dd = daysBetween(d, t.date);
  const lead = Math.max(1, t.lead || 1);
  if (dd >= 1 && dd <= lead) return true;
  if (dd === 0) return t.items.some(i => !tripDone(t.id, i.id));
  return false;
}
const tripsOn = d => S.trips.filter(t => tripVisible(t, d))
                            .sort((a,b) => a.date.localeCompare(b.date));
const tripItemsOn = d => tripsOn(d).flatMap(t => t.items.map(i => ({ ...i, tripId:t.id, tripName:t.name })));

function tripWhenLabel(t, d){
  const dd = daysBetween(d, t.date);
  if (dd === 0) return "si parte oggi";
  if (dd === 1) return "si parte domani";
  return `si parte fra ${dd} giorni`;
}

function tripHTML(T){
  const viaggi = tripsOn(T);
  if (!viaggi.length) return "";
  return viaggi.map(t => {
    const fatte = t.items.filter(i => tripDone(t.id, i.id)).length;
    return `
    <h2 id="h-trip-${t.id}">Valigia · ${esc(t.name)} · ${tripWhenLabel(t, T)} · ${fatte}/${t.items.length}</h2>
    <div class="card">
      ${t.items.map(i => `
        <div class="row ${tripDone(t.id, i.id) ? "done" : ""}" data-row="${i.id}">
          <button class="tick" data-ttick="${i.id}" data-trip="${t.id}" aria-label="Segna come messa in valigia">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
          <div class="rbody"><div class="rtitle">${esc(i.text)}</div></div>
        </div>`).join("")}
      ${(t.docs || []).length ? docsListHTML(t, false) : ""}
      <div class="row"><button class="btn ghost wide" data-tedit="${t.id}">Modifica la lista</button></div>
    </div>`;
  }).join("");
}

function toggleTripItem(tid, iid){

/* ============================================================
   DOCUMENTI DEI VIAGGI — biglietti, prenotazioni, PDF, foto
   Il file vive nel tuo deposito privato (lo stesso della sincronizzazione),
   così lo ritrovi su ogni dispositivo. Una copia resta anche qui dentro,
   per aprirlo senza rete: in aeroporto non si sa mai.
   ============================================================ */
const DOCDB = { db: null };

function docDb(){
  if (DOCDB.db) return Promise.resolve(DOCDB.db);
  return new Promise((ok, ko) => {
    try {
      const r = indexedDB.open("coach-documenti", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("file");
      r.onsuccess = () => { DOCDB.db = r.result; ok(r.result); };
      r.onerror = () => ko(r.error);
    } catch(e){ ko(e); }
  });
}
async function docPut(id, blob){
  const db = await docDb();
  return new Promise((ok, ko) => {
    const t = db.transaction("file", "readwrite");
    t.objectStore("file").put(blob, id);
    t.oncomplete = () => ok(true); t.onerror = () => ko(t.error);
  });
}
async function docGet(id){
  try {
    const db = await docDb();
    return await new Promise((ok) => {
      const r = db.transaction("file").objectStore("file").get(id);
      r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null);
    });
  } catch(e){ return null; }
}
async function docDel(id){
  try {
    const db = await docDb();
    db.transaction("file", "readwrite").objectStore("file").delete(id);
  } catch(e){}
}

const blobToB64 = blob => new Promise((ok, ko) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => ko(r.error);
  r.readAsDataURL(blob);
});

const kb = n => n >= 1048576 ? `${(n / 1048576).toFixed(1).replace(".", ",")} MB` : `${Math.max(1, Math.round(n / 1024))} kB`;
const docPathSafe = s => String(s || "documento").replace(/[^\w.\-]+/g, "_").slice(-80);

async function ghDoc(metodo, path, corpo, raw){
  const url = `https://api.github.com/repos/${S.sync.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
  return fetch(url, {
    method: metodo,
    headers: {
      "Authorization": "Bearer " + S.sync.token,
      "Accept": raw ? "application/vnd.github.raw" : "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
}

// Aggiunge un file a un viaggio: copia qui, poi su GitHub se la sincronizzazione c'è.
async function docAdd(trip, file){
  const id = "doc" + Date.now() + Math.floor(Math.random() * 999);
  const doc = { id, name: file.name || "documento", type: file.type || "application/octet-stream", size: file.size || 0, at: Date.now() };
  await docPut(id, file);
  if (syncPronto()){
    const path = `documenti/viaggi/${trip.id}/${id}-${docPathSafe(doc.name)}`;
    const r = await ghDoc("PUT", path, { message: `documento ${doc.name}`, content: await blobToB64(file) });
    if (!r.ok) throw new Error(`GitHub ha risposto ${r.status}`);
    const j = await r.json();
    doc.path = path; doc.sha = j.content && j.content.sha;
  } else doc.local = true;
  trip.docs = trip.docs || [];
  trip.docs.push(doc);
  return doc;
}

// Il file: dalla copia qui dentro se c'è, altrimenti da GitHub (e poi resta qui).
async function docBlob(doc){
  let b = await docGet(doc.id);
  if (b) return b;
  if (!doc.path || !syncPronto()) return null;
  const r = await ghDoc("GET", doc.path, null, true);
  if (!r.ok) throw new Error(`GitHub ha risposto ${r.status}`);
  b = await r.blob();
  if (doc.type) b = new Blob([b], { type: doc.type });
  try { await docPut(doc.id, b); } catch(e){}
  return b;
}

async function docOpen(doc){
  try {
    const b = await docBlob(doc);
    if (!b){ alert(doc.local ? "Questo documento è rimasto sull'altro dispositivo: era stato aggiunto senza sincronizzazione." : "Non riesco a scaricarlo: serve la rete e la sincronizzazione accesa."); return; }
    if (inApp() && typeof NAT.apriFile === "function"){
      const r = NAT.apriFile(await blobToB64(b), doc.type || b.type || "", doc.name);
      if (r && r !== "ok") alert("Non riesco ad aprirlo: " + r);
      return;
    }
    const u = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = u; a.target = "_blank"; a.rel = "noopener";
    if (!/^(application\/pdf|image\/)/.test(doc.type || "")) a.download = doc.name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 60000);
  } catch(e){ alert("Non riesco ad aprirlo: " + (e && e.message || e)); }
}

async function docRemove(trip, docId){
  const doc = (trip.docs || []).find(x => x.id === docId);
  trip.docs = (trip.docs || []).filter(x => x.id !== docId);
  docDel(docId);
  if (doc && doc.path && doc.sha && syncPronto()){
    try { await ghDoc("DELETE", doc.path, { message: `tolto ${doc.name}`, sha: doc.sha }); } catch(e){}
  }
}

// Prima di partire i documenti si scaricano da soli, così ci sono anche offline.
async function docPrefetch(){
  if (!syncPronto()) return;
  const T = today();
  for (const t of S.trips){
    if (daysBetween(T, t.date) > 14 || daysBetween(T, t.date) < -30) continue;
    for (const d of (t.docs || [])){
      if (await docGet(d.id)) continue;
      try { await docBlob(d); } catch(e){}
    }
  }
}

function docsListHTML(t, modificabile){

  return docs.map(d => `

      </div>

// segna quali documenti sono già qui, pronti anche senza rete
async function docMarkOffline(root){
  for (const n of root.querySelectorAll("[data-docstato]")){

}

function bindDocs(root, dopo){
  root.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => {
    const t = S.trips.find(x => x.id === b.dataset.trip);
    const d = t && (t.docs || []).find(x => x.id === b.dataset.doc);
    if (d){ b.textContent = "…"; docOpen(d).finally(() => { b.textContent = "Apri"; }); }
  });
  root.querySelectorAll("[data-docx]").forEach(b => {
    armDelete(b, "×", async () => {
      const t = S.trips.find(x => x.id === b.dataset.trip);
      if (t){ await docRemove(t, b.dataset.docx); save(); }
      if (dopo) dopo();
    });
  });
  docMarkOffline(root);
}

/* ============================================================
   FRIGO — cosa c'è dentro e quando scade
   Non pesa sulla percentuale della giornata: è un avviso, non un compito.
   ============================================================ */
const fridgeSorted = () => S.fridge.slice().sort((a,b) => a.exp.localeCompare(b.exp));
const fridgeWarnDays = () => (S.fridgeWarn >= 0 ? S.fridgeWarn : 3);

function fridgeState(it, T){
  const dd = daysBetween(T, it.exp);
  if (dd < 0)  return { k:"scaduto", dd, label: dd === -1 ? "scaduto ieri" : `scaduto da ${-dd} giorni` };
  if (dd === 0) return { k:"oggi",   dd, label:"scade oggi" };
  if (dd === 1) return { k:"presto", dd, label:"scade domani" };
  return { k: dd <= fridgeWarnDays() ? "presto" : "ok", dd, label:`scade fra ${dd} giorni` };
}
const fridgeSoon = T => fridgeSorted().filter(it => daysBetween(T, it.exp) <= fridgeWarnDays());

function fridgeRowHTML(it, T){
  const st = fridgeState(it, T);
  const col = st.k === "scaduto" ? "var(--warn)" : st.k === "oggi" ? "var(--warn)" : st.k === "presto" ? "var(--accent)" : "var(--line)";
  return `
  <button class="actrow" data-fr="${it.id}">
    <div class="imp" style="min-height:30px;background:${col}"></div>
    <div class="rbody">
      <div class="rtitle">${esc(it.name)}${it.qty ? ` <span style="color:var(--ink-faint);font-weight:400">· ${esc(it.qty)}</span>` : ""}</div>
      <div class="rmeta" style="${st.k === "scaduto" || st.k === "oggi" ? "color:var(--warn)" : ""}">${st.label}<span class="dot">·</span>${prettyDate(it.exp)}</div>
      ${it.note ? `<div class="rmeta" style="color:var(--ink-faint)">${esc(it.note)}</div>` : ""}
    </div>
  </button>`;
}

function fridgeHTML(T){
  const soon = fridgeSoon(T);
  const scaduti = soon.filter(x => daysBetween(T, x.exp) < 0).length;
  return `

/* ============================================================
   DARE E AVERE — soldi e cose in sospeso con le persone
   Non entra nella percentuale della giornata: è un promemoria, non un compito.
   ============================================================ */
const euro = n => (Math.round(n * 100) / 100).toString().replace(".", ",") + " €";
const ledgerOpen = () => S.ledger.filter(e => !e.closed);
const paid = e => (e.moves || []).reduce((s, m) => s + (+m.amount || 0), 0);
const ledgerLeft = e => e.kind === "soldi" ? Math.max(0, (+e.amount || 0) - paid(e)) : (e.closed ? 0 : 1);

// Quando una voce torna a farsi vedere: vicino alla scadenza, oppure —
// per le cose prestate senza scadenza — quando è in giro da troppo tempo.
function ledgerAlert(e, T){
  if (e.closed) return null;
  if (e.snooze && T < e.snooze) return null;
  if (e.due){
    const dd = daysBetween(T, e.due);
    if (dd < 0)  return `in ritardo di ${-dd} ${-dd === 1 ? "giorno" : "giorni"}`;
    if (dd === 0) return "scade oggi";
    if (dd <= 3) return `scade fra ${dd} giorni`;
    return null;
  }
  const eta = daysBetween(e.date, T);
  if (S.ledgerAge > 0 && eta >= S.ledgerAge) return `in giro da ${eta} giorni`;
  return null;
}

function ledgerTotals(){
  let avere = 0, dare = 0, cose = 0;
  for (const e of ledgerOpen()){
    if (e.kind === "soldi"){ if (e.dir === "avere") avere += ledgerLeft(e); else dare += ledgerLeft(e); }
    else cose++;
  }
  return { avere, dare, cose };
}

function ledgerLine(e, T){
  const al = ledgerAlert(e, T);
  const resto = ledgerLeft(e);
  const parziale = e.kind === "soldi" && paid(e) > 0 && !e.closed;
  const segno = e.kind === "soldi"
    ? (e.dir === "avere" ? "ti deve" : "gli devi")
    : (e.dir === "avere" ? "deve restituirtela" : "devi restituirla");
  return `
  <button class="actrow" data-led="${e.id}">
    <div class="imp" style="min-height:34px;background:${e.closed ? "var(--line)" : (e.dir === "avere" ? "var(--done)" : "var(--warn)")}"></div>
    <div class="rbody">
      <div class="rtitle"${e.closed ? ` style="color:var(--ink-faint)"` : ""}>${esc(e.who)} · ${e.kind === "soldi" ? esc(euro(e.closed ? (+e.amount||0) : resto)) : esc(e.what)}</div>
      <div class="rmeta">${e.closed ? `chiuso il ${prettyDate(e.closed.d)}` : segno}<span class="dot">·</span>dal ${prettyDate(e.date)}${e.due && !e.closed ? `<span class="dot">·</span>entro ${prettyDate(e.due)}` : ""}</div>
      ${parziale ? `<div class="rmeta" style="color:var(--ink-faint)">già rientrati ${euro(paid(e))} su ${euro(+e.amount||0)}</div>` : ""}
      ${al ? `<span class="flag moved">${al}</span>` : ""}
    </div>
  </button>`;
}

function ledgerHTML(T){
  const t = ledgerTotals();
  const sveglie = ledgerOpen().filter(e => ledgerAlert(e, T));
  const testa = (t.avere || t.dare || t.cose)
    ? ` · ${t.avere ? `ti devono ${euro(t.avere)}` : ""}${t.avere && t.dare ? " · " : ""}${t.dare ? `devi ${euro(t.dare)}` : ""}${(t.avere || t.dare) && t.cose ? " · " : ""}${t.cose ? `${t.cose} ${t.cose === 1 ? "cosa" : "cose"}` : ""}`
    : "";
  return `
  <h2 id="h-led">Dare e avere${testa}</h2>
  <div class="card">
    ${sveglie.length ? sveglie.map(e => ledgerLine(e, T)).join("")
      : `<div class="empty">${ledgerOpen().length
          ? "Niente da ricordarti adesso. Le voci si fanno vive quando si avvicina la scadenza o quando sono in giro da troppo."
          : "Soldi prestati, soldi presi, cose date via. Segnali qui e non ci pensi più: te le ricordo io."}</div>`}
    <div class="row" style="gap:9px">
      <button class="btn ghost" id="addled" style="flex:2">Aggiungi</button>
      ${S.ledger.length ? `<button class="btn ghost" id="allled" style="flex:1">Apri tutto · ${ledgerOpen().length}</button>` : ""}
    </div>
  </div>`;
}

  const T = today();

  const chiusi = S.ledger.filter(e => e.closed)

    ${id ? `<div class="btnrow"><button class="btn danger wide" id="l-del">Elimina voce</button></div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  function paint(){
    w.querySelectorAll("#l-kind .chip").forEach(b => b.classList.toggle("on", b.dataset.k === kind));
    w.querySelectorAll("#l-dir .chip").forEach(b => b.classList.toggle("on", b.dataset.d === dir));
    w.querySelector("#l-soldibox").style.display = kind === "soldi" ? "" : "none";
    w.querySelector("#l-cosabox").style.display = kind === "cosa" ? "" : "none";
    w.querySelector("#l-avbox").style.display = w.querySelector("#l-due").value ? "" : "none";
  }
  pAv.bind(w);
  w.querySelector("#l-due").onchange = () => paint();
  w.querySelectorAll("#l-kind .chip").forEach(b => b.onclick = () => { kind = b.dataset.k; paint(); });
  w.querySelectorAll("#l-dir .chip").forEach(b => b.onclick = () => { dir = b.dataset.d; paint(); });
  w.querySelectorAll("#l-nomi .chip").forEach(b => b.onclick = () => { w.querySelector("#l-who").value = b.dataset.n; });
  paint();

  const mvAdd = w.querySelector("#l-mvadd");
  if (mvAdd) mvAdd.onclick = () => {
    const v = +w.querySelector("#l-mv").value;
    if (!(v > 0)) return;
    e.moves = e.moves || [];
    e.moves.push({ d: today(), amount: v });
    if (ledgerLeft(e) <= 0) e.closed = { d: today() };
    save(); w.remove(); render();
    if (!e.closed) openLedgerItem(id);
  };
  w.querySelectorAll("[data-mx]").forEach(b => b.onclick = () => {
    e.moves.splice(+b.dataset.mx, 1); save(); w.remove(); openLedgerItem(id);
  });

  w.querySelector("#l-cancel").onclick = () => w.remove();
  const dn = w.querySelector("#l-done");
  if (dn) dn.onclick = () => { e.closed = { d: today() }; save(); w.remove(); render(); };
  const sn = w.querySelector("#l-snooze");
  if (sn) sn.onclick = () => { w.remove(); snoozeLedger(e.id, 7); };
  const ro = w.querySelector("#l-reopen");
  if (ro) ro.onclick = () => { e.closed = null; e.snooze = null; save(); w.remove(); render(); };
  if (id) armDelete(w.querySelector("#l-del"), "Elimina voce", () => {
    S.ledger = S.ledger.filter(x => x.id !== id);
    save(); w.remove(); render();
  });
  w.querySelector("#l-save").onclick = () => {
    const who = w.querySelector("#l-who").value.trim();
    if (!who){ alert("Serve un nome."); return; }
    const amt = +w.querySelector("#l-amt").value || 0;
    const what = w.querySelector("#l-what").value.trim();
    if (kind === "soldi" && !(amt > 0)){ alert("Serve un importo."); return; }
    if (kind === "cosa" && !what){ alert("Serve di che cosa si tratta."); return; }
    const next = { ...e, who, kind, dir, amount: kind === "soldi" ? amt : "", what: kind === "cosa" ? what : "",
                   date: w.querySelector("#l-date").value || today(),
                   due: w.querySelector("#l-due").value || "",
                   note: w.querySelector("#l-note").value.trim(),
                   avviso: pAv.value(),
                   snooze: null };
    const i = S.ledger.findIndex(x => x.id === e.id);
    if (i >= 0) S.ledger[i] = next; else S.ledger.push(next);
    save(); w.remove(); render();
  };
}

/* ---------- EXTRA: conteggi personali ---------- */
const PER_LABEL = { d:"al giorno", w:"a settimana", m:"al mese", y:"all'anno" };
const PER_PREV  = { d:"ieri", w:"settimana scorsa", m:"mese scorso", y:"anno scorso" };

function pKey(per, d){
  if (per === "w"){ const dt = fromIso(d); dt.setDate(dt.getDate() - ((dt.getDay()+6)%7)); return "W" + iso(dt); }
  if (per === "m") return d.slice(0,7);
  if (per === "y") return d.slice(0,4);
  return d;
}
function pPrevDate(per, d){
  const dt = fromIso(d);
  if (per === "w"){ dt.setDate(dt.getDate()-7); return iso(dt); }
  if (per === "m"){ dt.setMonth(dt.getMonth()-1);  return iso(dt); }
  if (per === "y"){ dt.setFullYear(dt.getFullYear()-1); return iso(dt); }
  dt.setDate(dt.getDate()-1); return iso(dt);
}
const trVal  = (t,d) => (S.tlog[pKey(t.per||"d", d)] || {})[t.id] || 0;
function trNote(t, T){
  const prev = (S.tlog[pKey(t.per||"d", pPrevDate(t.per||"d", T))] || {})[t.id];
  let s = PER_LABEL[t.per||"d"];
  s += prev === undefined ? " · primo periodo" : ` · ${PER_PREV[t.per||"d"]} ${prev}`;
  if (t.dir !== "none" && t.target !== "" && t.target != null)
    s += ` · ${t.dir === "giu" ? "max" : "min"} ${t.target}`;
  return s;
}

function trackerHTML(t, T){
  const v = trVal(t, T);
  let cls = "";
  if (t.dir === "giu" && t.target !== "" && t.target != null && v > t.target) cls = "color:var(--warn)";
  if (t.dir === "su"  && t.target !== "" && t.target != null && v >= t.target) cls = "color:var(--done)";
  return `
  <div class="row" data-trrow="${t.id}">
    <div class="rbody">
      <div class="rtitle">${esc(t.name)}</div>
      <div class="rmeta" data-trnote="${t.id}">${trNote(t, T)}</div>
    </div>
    <div style="display:flex;align-items:center;gap:7px">
      <button class="btn" data-tr="${t.id}" data-by="-1" style="min-width:40px;padding:8px 0">&minus;</button>
      <input type="number" inputmode="numeric" data-trin="${t.id}" value="${v}"
        style="width:58px;text-align:center;font-size:19px;font-weight:600;padding:7px 2px;
               border:1px solid var(--line);border-radius:9px;background:var(--surface);${cls}">
      <button class="btn" data-tr="${t.id}" data-by="1" style="min-width:40px;padding:8px 0">+</button>
      <button class="btn ghost" data-tredit="${t.id}" style="min-width:40px;padding:8px 0" aria-label="Modifica o elimina">&#9881;</button>
    </div>
  </div>`;
}

// updates only this row, so the page does not jump
function paintTracker(id){
  const t = S.trackers.find(x => x.id === id); if (!t) return;
  const T = today(), v = trVal(t, T);
  const inp = document.querySelector(`[data-trin="${id}"]`);
  const note = document.querySelector(`[data-trnote="${id}"]`);
  if (inp){
    inp.value = v;
    inp.style.color = "";
    if (t.dir === "giu" && t.target !== "" && t.target != null && v > t.target) inp.style.color = "var(--warn)";
    if (t.dir === "su"  && t.target !== "" && t.target != null && v >= t.target) inp.style.color = "var(--done)";
  }
  if (note) note.textContent = trNote(t, T);
}

function setTracker(id, val){
  const t = S.trackers.find(x => x.id === id); if (!t) return;
  const k = pKey(t.per || "d", today());
  S.tlog[k] = S.tlog[k] || {};
  S.tlog[k][id] = Math.max(0, Math.round(val) || 0);
  save(); paintTracker(id);
}
function bumpTracker(id, by){
  const t = S.trackers.find(x => x.id === id); if (!t) return;
  setTracker(id, trVal(t, today()) + by);
}

/* the day spine: work blocks on the rail, activities beside it */
function spineHTML(T, acts){
  const H0 = Math.floor(awakeFrom() / 60), H1 = Math.min(24, Math.ceil(awakeTo() / 60));
  const SPAN = Math.max(60, (H1 - H0) * 60), PX = 300;
  const y = m => Math.max(0, Math.min(PX, (m - H0*60) / SPAN * PX));
  const busy = busyOn(T);

  let rail = "";
  for (let h = H0; h <= H1; h += 3) rail += `<div class="hourlab" style="top:${y(h*60)}px">${String(h).padStart(2,"0")}:00</div>`;
  rail += busy.map(([s,e]) => `<div class="blk" style="top:${y(s)}px;height:${Math.max(6,y(e)-y(s))}px"></div>`).join("");

  const n = nowMin();
  if (n >= H0*60 && n <= H1*60){
    rail += `<div class="nowline" style="top:${y(n)}px"></div><div class="nowdot" style="top:${y(n)}px"></div>`;
  }

  let slots = busyLabeled(T)
    .slice()
    .sort((a,b) => (b.e - b.s) - (a.e - a.s))     // i lunghi per primi: i corti restano leggibili sopra
    .map(b => {
      const lungo = (b.e - b.s) >= 8 * 60;
      return `<div class="slot" style="top:${y(b.s)}px;height:${Math.max(26,y(b.e)-y(b.s))}px${lungo ? ";opacity:.5" : ""}">${esc(b.label || "Impegno")}<small>${toHHMM(b.s)}–${toHHMM(b.e)}</small></div>`;
    }).join("");

  slots += acts.map(a => {
    const s = toMin(a.win.start), e = toMin(a.win.end);
    const done = isDone(T, a.id);
    return `<div class="slot free" style="top:${y(s)}px;height:${Math.max(26,y(e)-y(s))}px;${done?"opacity:.45":""}">${esc(a.name)}<small>${a.win.start}–${a.win.end}</small></div>`;
  }).join("");

  return `<div class="spine">
    <div class="spine-col"><div class="spine-track" style="height:${PX+14}px"><div class="spine-rail"></div>${rail}</div></div>
    <div class="slots" style="height:${PX+14}px">${slots}</div>
  </div>`;
}

/* ---------- aggiornamenti mirati ----------
   Spuntare qualcosa cambia una riga e qualche numero: ridisegnare tutta
   la pagina la faceva saltare in cima. Qui si tocca solo quello che cambia. */

function markRow(id, done){
  const row = document.querySelector(`[data-row="${id}"]`);
  if (row) row.classList.toggle("done", !!done);
}

function patchToday(){
  const T = today(), p = progress();
  const pct = document.getElementById("ring-pct");
  if (pct && !isPaused()) pct.textContent = p.pct + "%";
  const arc = document.getElementById("pie-arc");
  if (arc && !isPaused()) arc.setAttribute("d", piePath(p.pct, 19));
  const acts = todaysActs();
  const ha = document.getElementById("h-acts");
  if (ha) ha.textContent = "Da fare oggi" + (acts.length ? ` · ${acts.filter(a=>isDone(T,a.id)).length}/${acts.length}` : "");
  const hr = document.getElementById("h-rem");
  const rem = remindersOn(T);
  if (hr) hr.textContent = "Promemoria" + (rem.length ? ` · ${rem.filter(r=>readToday(T,r.id)).length}/${rem.length} letti` : "");
  patchTripHead();
  const hc = document.getElementById("h-gctodo");
  if (hc){ const l = gcalTodosOn(T); hc.textContent = `Dal calendario · ${l.filter(x => isDone(T, x.id)).length}/${l.length}`; }
  const hg = document.getElementById("h-goals");
  if (hg) hg.textContent = "Obiettivi" + (S.goals.length ? ` · ${S.goals.filter(goalDone).length}/${S.goals.length}` : "");
  const cm = document.getElementById("close-meta");
  if (cm){
    const d = closeTarget();
    if (d){ const q = progressOn(d); cm.textContent = `${d !== T ? `${GG[dow(d)]} ${prettyDate(d)} · ` : ""}${q.pct}%, ${q.done} cose su ${q.total}.`; }
  }
}

function toggleDone(id){
  const T = today();
  S.log[T] = S.log[T] || {};
  const a = S.activities.find(x => x.id === id);
  if (S.log[T][id]){
    delete S.log[T][id];
    if (a) a.doneCount = Math.max(0, (a.doneCount||0) - 1);
  } else {
    S.log[T][id] = true;
    if (a){ a.doneCount = (a.doneCount||0) + 1; a.lastDone = T; }
  }
  save();
  markRow(id, S.log[T][id]);
  patchToday();
}

function toggleRoutine(id){
  const fascia = S.routines.find(x => x.items.some(i => i.id === id));

    const name = w.querySelector("#r-name").value.trim();
    if (!name){ alert("Serve un nome."); return; }
    const s = w.querySelector("#r-s").value, e = w.querySelector("#r-e").value;
    if (toMin(e) === toMin(s)){ alert("Inizio e fine sono alla stessa ora."); return; }
    const next = { ...r, name, start:s, end:e, items: items.filter(i => i.text.trim()) };
    const i = S.routines.findIndex(x => x.id === r.id);
    if (i >= 0) S.routines[i] = next; else S.routines.push(next);
    S.routines.sort((a,b) => toMin(a.start) - toMin(b.start));
    save(); w.remove(); render();
  };
}

/* quello che il coach ha capito da solo su un'attività */
function adviceHTML(a){
  const out = [];
  const s = durSuggestion(a);
  if (s) out.push(`<div class="advice">
    Cronometrata ${s.n} volte: di solito ci metti <b>${durLabel(s.min)}</b>, non ${durLabel(a.dur)}.
    <button data-fixdur="${a.id}">Correggi a ${durLabel(s.min)}</button></div>`);
  const v = vuotoCount(a.id);
  if (v >= 2) out.push(`<div class="advice">
    ${v} volte non c'era nulla da fare. Forse è programmata troppo spesso.
    <button data-openact="${a.id}">Cambia ogni quanto</button></div>`);
  return out.join("");
}

const MM3 = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const mdLabel = md => `${+md.slice(3)} ${MM3[+md.slice(0,2) - 1]}`;

const GGL = ["dom","lun","mar","mer","gio","ven","sab"];
const giorniLabel = days => (days || []).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(x => GGL[x]).join(", ");

function recLabel(r, days){
  const n = r.n || 1;
  if (r.type === "weekly")     return (n === 1 ? "ogni settimana" : `ogni ${n} settimane`) + (days && days.length ? `: ${giorniLabel(days)}` : "");
  if (r.type === "everyNDays") return n === 1 ? "ogni giorno" : `ogni ${n} giorni`;
  if (r.type === "yearly")     return r.md ? `una volta l'anno, il ${mdLabel(r.md)}` : "una volta l'anno";
  if (r.type === "monthly")    return `${n === 1 ? "ogni mese" : `ogni ${n} mesi`}, il ${r.day || 1}`;
  if (r.type === "dates")      return (r.dates || []).length ? `nelle date: ${(r.dates||[]).slice().sort().map(mdLabel).join(", ")}` : "date da scegliere";
  if (r.type === "once")       return r.date ? `una volta sola, ${prettyDate(r.date)}` : "una volta sola";
  return "una volta sola";
}

    <div class="field" id="f-daysbox"><label>Giorni</label>
      <div class="chips" id="f-days">
        ${[1,2,3,4,5,6,0].map(d => `<button class="chip ${a.days.includes(d) && a.rec.type === "weekly" ? "on" : ""}" data-v="${d}">${GG3[d]}</button>`).join("")}
      </div></div>

    <div class="card" id="f-advice" style="padding:13px 14px;margin-bottom:15px;border-color:var(--accent)"></div>

    <div class="btnrow">

      <button class="btn ghost" id="f-cancel">Annulla</button>

    ${id ? `<div class="btnrow"><button class="btn danger wide" id="f-del">Elimina attività</button></div>` : ""}

  });
  const daySel = new Set(a.rec.type === "weekly" ? a.days : []);
  function paintDays(){ w.querySelectorAll("#f-days .chip").forEach(c => c.classList.toggle("on", daySel.has(+c.dataset.v))); }
  w.querySelectorAll("#f-days .chip").forEach(c => c.onclick = () => {
    const v = +c.dataset.v;
    daySel.has(v) ? daySel.delete(v) : daySel.add(v);
    paintDays(); consiglia();
  });

  let dateList = (a.rec.dates || []).slice();
  const rt = q("#f-rt");
  function drawDates(){
    const box = q("#f-dateschips");
    box.innerHTML = dateList.slice().sort().map(md =>
      `<button class="chip on" data-md="${md}">${mdLabel(md)} &times;</button>`).join("")
      || `<span class="hint" style="margin:0">Nessuna data ancora.</span>`;
    box.querySelectorAll("[data-md]").forEach(b => b.onclick = () => {
      dateList = dateList.filter(x => x !== b.dataset.md); drawDates(); consiglia();
    });
  }
  function paintRec(){
    const t = rt.value;
    const mostra = (sel, si) => { const x = q(sel); if (x) x.style.display = si ? "" : "none"; };
    mostra("#f-nbox", t === "weekly" || t === "everyNDays" || t === "monthly");
    mostra("#f-daybox", t === "monthly");
    mostra("#f-mdbox", t === "yearly");
    mostra("#f-datesbox", t === "dates");
    mostra("#f-oncebox", t === "once");
    mostra("#f-startbox", t === "weekly" || t === "everyNDays" || t === "monthly");
    mostra("#f-daysbox", t === "weekly");
    const h = q("#f-nhint");
    if (h) h.textContent = t === "weekly" ? "ogni quante settimane (1 = tutte)" : t === "everyNDays" ? "ogni quanti giorni"
      : t === "monthly" ? "ogni quanti mesi" : "";
    consiglia();
  }

  // l'attività come sarebbe se salvassi adesso: serve per i consigli
  function bozza(){
    const tipo = rt.value;
    const rec = { type: tipo, n: Math.max(1, +q("#f-rn").value || 1) };
    if (tipo === "monthly") rec.day = Math.min(31, Math.max(1, +q("#f-day").value || 1));
    if (tipo === "yearly") rec.md = (q("#f-md").value || "").slice(5);
    if (tipo === "dates") rec.dates = dateList.slice().sort();
    if (tipo === "once") rec.date = q("#f-once").value || T;
    const start = q("#f-start").value || T;
    if (tipo === "weekly" || tipo === "everyNDays" || tipo === "monthly") rec.start = start;
    return { ...a, rec, days: tipo === "weekly" ? [...daySel].sort() : [0,1,2,3,4,5,6],
             dur: Math.max(5, +q("#f-dur").value || 30),
             win: { start: q("#f-ws").value || "21:00", end: q("#f-we").value || "22:00" },
             from: tipo === "once" ? rec.date : maxD(start, id ? T : start),
             moves:{}, skips:{} };
  }

  // IL CONSIGLIO: dove starebbe meglio, e perché. Non decide niente.
  const adv = q("#f-advice");
  function consiglia(){
    const b = bozza();
    const win = b.win, dur = b.dur;
    if (toMin(win.end) <= toMin(win.start)){ adv.innerHTML = `<div class="rmeta" style="color:var(--warn)">La fascia oraria finisce prima di iniziare.</div>`; return; }
    if (toMin(win.end) - toMin(win.start) < dur){ adv.innerHTML = `<div class="rmeta" style="color:var(--warn)">La fascia ${win.start}–${win.end} è più corta della durata (${durLabel(dur)}).</div>`; return; }
    const t = b.rec.type;
    let html = "";
    if (t === "weekly"){
      const lista = weekdayAdvice(win, dur, a.id);
      const k = Math.max(1, daySel.size);
      const top = lista.slice(0, k).map(x => x.g);
      const nomi = g => GGL[g];
      html += `<div class="rtitle" style="font-size:14px">Il consiglio</div>
        <div class="rmeta" style="color:var(--ink);margin-top:4px">Nella fascia ${win.start}–${win.end} ${k === 1 ? "il giorno più libero è" : "i giorni più liberi sono"} <b>${top.map(nomi).join(", ")}</b>, guardando le prossime quattro settimane.</div>`;
      const pesanti = [...daySel].filter(g => { const x = lista.find(y => y.g === g); return x && (x.fitsN <= 2 || x.L.word === "piena"); });
      for (const g of pesanti){
        const x = lista.find(y => y.g === g);
        html += `<div class="rmeta" style="color:var(--warn);margin-top:6px">${GG[g]}: ${x.fitsN <= 2 ? `nella fascia c'è spazio solo ${x.fitsN} ${x.fitsN === 1 ? "volta" : "volte"} su 4` : "giornata piena"} · ${esc(loadLine(x.L))}.</div>`;
      }
      const uguali = top.length === daySel.size && top.every(g => daySel.has(g));
      if (!uguali) html += `<div class="why" style="margin-top:9px"><button class="on" id="f-usa">Usa ${top.map(nomi).join(" e ")}</button></div>`;
      if (!daySel.size) html += `<div class="hint">Scegli tu i giorni: l'attività cadrà sempre lì. Se una volta la salti, ti propongo io quando recuperarla.</div>`;
    } else if (t === "once"){
      const L = dayLoad(b.rec.date, a.id);
      const room = freeRoom(b.rec.date, win);
      const sugg = suggestDays({ from:T, days:14, dur, win, actId:a.id }).filter(x => x.fits).slice(0, 3);
      html += `<div class="rtitle" style="font-size:14px">${esc(dayChip(b.rec.date))}</div>
        <div class="rmeta" style="margin-top:4px;${room < dur || L.word === "piena" ? "color:var(--warn)" : ""}">${esc(loadLine(L))}${room < dur ? ` · nella fascia ${win.start}–${win.end} non c'è spazio` : ""}.</div>`;
      if (sugg.length) html += `<div class="rmeta" style="margin-top:9px;color:var(--ink)">I giorni più liberi nelle prossime due settimane:</div>
        <div class="why" style="margin-top:6px">${sugg.map(x => `<button data-sd="${x.d}" class="${x.d === b.rec.date ? "on" : ""}">${esc(dayChip(x.d))} · ${x.L.word}</button>`).join("")}</div>`;
    } else {
      const primo = nextOcc(b, maxD(T, b.from), 400);
      if (!primo){ adv.innerHTML = `<div class="rmeta">Scegli quando torna e ti dico com'è quel giorno.</div>`; return; }
      const L = dayLoad(primo, a.id);
      const room = freeRoom(primo, win);
      html += `<div class="rtitle" style="font-size:14px">Il prossimo giro: ${esc(dayChip(primo).toLowerCase())}</div>
        <div class="rmeta" style="margin-top:4px;${room < dur || L.word === "piena" ? "color:var(--warn)" : ""}">${esc(loadLine(L))}${room < dur ? ` · nella fascia ${win.start}–${win.end} non c'è spazio` : ""}.</div>`;
      if (t === "everyNDays"){
        const sugg = suggestDays({ from:T, days:Math.min(14, Math.max(3, +b.rec.n || 1)), dur, win, actId:a.id }).filter(x => x.fits).slice(0, 3);
        if (sugg.length) html += `<div class="rmeta" style="margin-top:9px;color:var(--ink)">Per partire, i giorni più liberi:</div>
          <div class="why" style="margin-top:6px">${sugg.map(x => `<button data-st="${x.d}" class="${x.d === b.rec.start ? "on" : ""}">${esc(dayChip(x.d))} · ${x.L.word}</button>`).join("")}</div>`;
      } else if (room < dur || L.word === "piena"){
        html += `<div class="hint">Le date fisse restano quelle: quando arriva il giorno, se non riesci, ti propongo io quando recuperare.</div>`;
      }
    }
    adv.innerHTML = html;
    const usa = adv.querySelector("#f-usa");
    if (usa) usa.onclick = () => {
      const k = Math.max(1, daySel.size);
      const top = weekdayAdvice(b.win, b.dur, a.id).slice(0, k).map(x => x.g);
      daySel.clear(); top.forEach(g => daySel.add(g));
      paintDays(); consiglia();
    };
    adv.querySelectorAll("[data-sd]").forEach(x => x.onclick = () => { q("#f-once").value = x.dataset.sd; consiglia(); });
    adv.querySelectorAll("[data-st]").forEach(x => x.onclick = () => { q("#f-start").value = x.dataset.st; consiglia(); });
  }

  rt.onchange = paintRec;
  ["#f-ws","#f-we","#f-dur","#f-rn","#f-day","#f-md","#f-once","#f-start"].forEach(s => { const x = q(s); if (x) x.addEventListener("change", consiglia); });
  drawDates(); paintDays(); paintRec();
  q("#f-dateadd").onclick = () => {
    const v = q("#f-datenew").value;
    if (!v) return;
    const md = v.slice(5);
    if (!dateList.includes(md)) dateList.push(md);
    drawDates(); consiglia();
  };

  q("#f-cancel").onclick = () => w.remove();
  if (id) armDelete(q("#f-del"), "Elimina attività", () => {
    S.activities = S.activities.filter(x => x.id !== id);
    save(); w.remove(); render();
  });

  q("#f-save").onclick = () => {
    const name = q("#f-name").value.trim();
    if (!name){ alert("Serve un nome."); return; }
    const b = bozza();
    const tipo = b.rec.type;
    if (tipo === "weekly" && !daySel.size){ alert("Scegli almeno un giorno."); return; }
    if (tipo === "dates" && !dateList.length){ alert("Aggiungi almeno una data."); return; }
    if (tipo === "yearly" && !b.rec.md){ alert("Scegli il giorno."); return; }
    if (toMin(b.win.end) <= toMin(b.win.start)){ alert("La fascia oraria finisce prima di iniziare."); return; }

    // se cambi le regole di un'attività che esiste già, il passato resta com'era:
    // le nuove regole valgono da oggi, così non spuntano giri "saltati" che non c'erano
    const cambiata = id && (JSON.stringify(a.rec) !== JSON.stringify(b.rec) || JSON.stringify(a.days) !== JSON.stringify(b.days));
    const next = {
      ...a,
      name, cat: q("#f-cat").value.trim() || "Varie",
      imp: impSel.v, dur: b.dur, rec: b.rec, days: b.days, win: b.win,
      from: tipo === "once" ? b.rec.date : (id ? (cambiata ? maxD(b.rec.start || T, T) : (a.from || T)) : (b.rec.start || T)),
      moves: a.moves || {}, skips: a.skips || {}, handled: a.handled || {}
    };
    delete next.scheduledFor; delete next.moved; delete next.maxDays;
    const i = S.activities.findIndex(x => x.id === a.id);
    if (i >= 0) S.activities[i] = next; else S.activities.push(next);
    runEngine(); save(); w.remove(); render();
  };
}

/* ============================================================
   CRONO — cicli di timer e cronometri
   ============================================================ */
const clock = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`
           : `${m}:${String(x).padStart(2,"0")}`;
};
const cycleTotal = c => (c.segs||[]).reduce((s,g)=>s+g.min,0);

function openCycle(id){
  const c = id ? S.cycles.find(x => x.id === id)
               : { id:"c"+Date.now(), name:"", kind:"timer",
                   segs:[{kind:"lavoro",min:30},{kind:"pausa",min:10}] };
  const segs = c.segs.map(s => ({...s}));
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>${id ? "Modifica ciclo" : "Nuovo ciclo"}</h3>
    <div class="field"><label>Nome</label>
      <input type="text" id="c-name" value="${esc(c.name)}" placeholder="Lavoro serale, allenamento…"></div>
    <div class="field"><label>Tipo</label>
      <select id="c-kind">
        <option value="timer" ${c.kind=="timer"?"selected":""}>Timer a fasi — conta alla rovescia</option>
        <option value="crono" ${c.kind=="crono"?"selected":""}>Cronometro — conta in avanti, senza fine</option>
      </select></div>
    <div id="c-segwrap">
      <div class="field"><label>Fasi, in ordine</label>
        <div id="c-segs"></div>
        <button class="btn wide ghost" id="c-addseg" style="margin-top:4px">Aggiungi fase</button>
        <div class="totline" id="c-tot"></div>
        <div class="hint">Per ripetere, aggiungi di nuovo le stesse fasi: 30 lavoro, 10 pausa, 30 lavoro, 10 pausa, 30 lavoro, 30 pausa.</div>
      </div>
    </div>
    <div class="btnrow">
      <button class="btn primary" id="c-save" style="flex:2">Salva</button>
      <button class="btn ghost" id="c-cancel">Annulla</button>
    </div>
    ${id ? `<div class="btnrow"><button class="btn danger wide" id="c-del">Elimina ciclo</button></div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  const kindSel = w.querySelector("#c-kind");
  const segWrap = w.querySelector("#c-segwrap");
  const segBox = w.querySelector("#c-segs");

  function drawSegs(){
    segBox.innerHTML = segs.map((s,i) => `
      <div class="segline">
        <select data-k="${i}">
          <option value="lavoro" ${s.kind=="lavoro"?"selected":""}>Lavoro</option>
          <option value="pausa"  ${s.kind=="pausa"?"selected":""}>Pausa</option>
        </select>
        <input type="number" min="1" max="240" data-m="${i}" value="${s.min}">
        <button data-x="${i}" aria-label="Togli fase">×</button>
      </div>`).join("");
    w.querySelector("#c-tot").textContent = segs.length
      ? `Durata totale: ${durLabel(segs.reduce((a,b)=>a+b.min,0))}` : "";
    segBox.querySelectorAll("[data-k]").forEach(s => s.onchange = () => segs[+s.dataset.k].kind = s.value);
    segBox.querySelectorAll("[data-m]").forEach(s => s.onchange = () => {
      segs[+s.dataset.m].min = Math.max(1, +s.value || 1); drawSegs();
    });
    segBox.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { segs.splice(+b.dataset.x,1); drawSegs(); });
  }
  drawSegs();

  const syncKind = () => segWrap.style.display = kindSel.value === "crono" ? "none" : "";
  kindSel.onchange = syncKind; syncKind();

  w.querySelector("#c-addseg").onclick = () => {
    const last = segs[segs.length-1];
    segs.push(last && last.kind === "lavoro" ? {kind:"pausa",min:10} : {kind:"lavoro",min:30});
    drawSegs();
  };
  w.querySelector("#c-cancel").onclick = () => w.remove();
  if (id) armDelete(w.querySelector("#c-del"), "Elimina ciclo", () => {
    S.cycles = S.cycles.filter(x => x.id !== id);
    save(); w.remove(); render();
  });
  w.querySelector("#c-save").onclick = () => {
    const name = w.querySelector("#c-name").value.trim();
    if (!name){ alert("Serve un nome."); return; }
    const kind = kindSel.value;
    if (kind === "timer" && !segs.length){ alert("Aggiungi almeno una fase."); return; }
    const next = { ...c, name, kind, segs: kind === "crono" ? [] : segs };
    const i = S.cycles.findIndex(x => x.id === c.id);
    if (i >= 0) S.cycles[i] = next; else S.cycles.push(next);
    save(); w.remove(); render();
  };
}

/* ---- the runner ---- */
let RUN = null, RUNTICK = null, WAKE = null;

function beep(times){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ac = new Ctx();
    for (let i = 0; i < times; i++){
      const o = ac.createOscillator(), g = ac.createGain();
      const t = ac.currentTime + i * 0.33;
      o.frequency.value = 660; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.3);
    }
    setTimeout(() => { try{ ac.close(); }catch(e){} }, times * 400 + 600);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(times > 1 ? [250,120,250,120,250] : [220]); }catch(e){}
}

async function keepAwake(on){
  try{
    if (on && "wakeLock" in navigator && !WAKE) WAKE = await navigator.wakeLock.request("screen");
    if (!on && WAKE){ await WAKE.release(); WAKE = null; }
  }catch(e){ WAKE = null; }
}

// cose su cui si può registrare il tempo: attività di oggi, obiettivi, appuntamenti di oggi
function runTargets(){
  const T = today(), d = dow(T);
  const out = [], seen = new Set();
  const push = (id, name, kind) => {
    if (!name || seen.has(id)) return;
    seen.add(id); out.push({ id, name, kind });
  };
  for (const a of todaysActs()) push(a.id, a.name, "attività di oggi");
  for (const g of S.goals) if (!goalDone(g)) push(g.id, g.name, "obiettivo");
  for (const o of S.oneoffs) if (o.date === T) push(o.id, o.label, "appuntamento di oggi");
  for (const f of S.fixed) if (f.days.includes(d)) push(f.id, f.label, "impegno fisso");
  if (S.gcalOn) for (const g of gcalOnDay(T)) push("gc:" + g.key, g.label, "dal calendario");
  for (const r of S.reminders) push(r.id, r.text, "promemoria");
  for (const a of S.activities) if (!occOn(a, T).length) push(a.id, a.name, "altra attività");
  for (const o of S.oneoffs) if (o.date > T) push(o.id, o.label, `appuntamento ${prettyDate(o.date)}`);
  return out;
}

function askTarget(id){
  const list = runTargets();
  if (!list.length){ startRun(id, null); return; }
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Su cosa stai lavorando?</h3>
    <div class="hint" style="margin-bottom:14px">Il tempo di lavoro finisce registrato lì sopra. Le pause non contano.</div>
    <div class="card" style="max-height:54vh;overflow-y:auto">
      ${list.map(x => `<button class="actrow" data-t="${x.id}" data-n="${esc(x.name)}">
        <div class="rbody"><div class="rtitle">${esc(x.name)}</div><div class="rmeta">${x.kind}</div></div>
      </button>`).join("")}
    </div>
    <div class="btnrow"><button class="btn ghost wide" id="t-none">Su niente in particolare</button></div>
    <div class="btnrow"><button class="btn ghost wide" id="t-cancel">Annulla</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    w.remove(); startRun(id, { id:b.dataset.t, name:b.dataset.n });
  });
  w.querySelector("#t-none").onclick = () => { w.remove(); startRun(id, null); };
  w.querySelector("#t-cancel").onclick = () => w.remove();

function logTime(ref, minutes){
  if (!ref || minutes < 1) return;
  const T = today();
  S.timeLog[T] = S.timeLog[T] || {};
  S.timeLog[T][ref.id] = Math.round((S.timeLog[T][ref.id] || 0) + minutes);
  // se è un'attività, tiene anche la durata di questa singola sessione:
  // è così che l'app impara quanto ci metti davvero
  if (S.activities.some(a => a.id === ref.id)){
    const arr = S.durLog[ref.id] = S.durLog[ref.id] || [];
    arr.push(Math.round(minutes));
    if (arr.length > 12) arr.splice(0, arr.length - 12);
  }
  save();
}
const timeOn = (d, id) => (S.timeLog[d] || {})[id] || 0;

/* ---------- la durata che si tara da sola ----------
   Dopo tre sessioni cronometrate, se la mediana è lontana da quello che
   avevi scritto, l'app te lo dice e si corregge con un tocco.
   Mediana e non media: una sessione dimenticata accesa non falsa tutto. */
function median(a){
  const s = [...a].sort((x,y) => x - y), n = s.length;
  return n % 2 ? s[(n-1)/2] : Math.round((s[n/2 - 1] + s[n/2]) / 2);
}

function durSuggestion(a){
  const arr = S.durLog[a.id] || [];
  if (arr.length < 3) return null;
  const m = Math.max(5, Math.round(median(arr) / 5) * 5);
  if (!a.dur) return null;
  const scarto = Math.abs(m - a.dur) / a.dur;
  if (scarto < 0.25) return null;                 // differenza piccola: non vale disturbarti
  return { min: m, n: arr.length, su: m > a.dur };
}

function applyDur(id){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  const s = durSuggestion(a); if (!s) return;
  a.dur = s.min;
  save(); render();
}

// quante volte, negli ultimi 60 giorni, quella cosa non andava proprio fatta
function vuotoCount(id){
  let n = 0;
  for (const d in S.closes){
    const r = S.closes[d].reasons || {};
    if (r[id] === R_VUOTO) n++;
  }
  return n;
}

function startRun(id, ref){
  const c = S.cycles.find(x => x.id === id);
  if (!c) return;
  RUN = { c, idx:0, paused:false, elapsed:0, mark:Date.now(), ref: ref || null, worked:0 };
  keepAwake(true);
  drawRun();
  clearInterval(RUNTICK);
  RUNTICK = setInterval(tickRun, 200);
}

function segSeconds(){ return RUN.c.segs[RUN.idx].min * 60; }

function tickRun(){
  if (!RUN || RUN.paused) return;
  const now = Date.now();
  const delta = (now - RUN.mark) / 1000;
  RUN.elapsed += delta;
  RUN.mark = now;
  const lavorando = RUN.c.kind !== "timer" || RUN.c.segs[RUN.idx].kind === "lavoro";
  if (lavorando) RUN.worked += delta / 60;
  if (RUN.c.kind === "timer" && RUN.elapsed >= segSeconds()){
    const last = RUN.idx >= RUN.c.segs.length - 1;
    beep(last ? 3 : 1);
    if (last){ finishRun(true); return; }
    RUN.idx++; RUN.elapsed = 0;
  }
  drawRun();
}

function finishRun(done){
  clearInterval(RUNTICK); RUNTICK = null;
  if (RUN && RUN.ref) logTime(RUN.ref, RUN.worked || 0);
  const node = document.querySelector(".runner");
  if (node) node.remove();
  RUN = null;
  keepAwake(false);
  if (done) render();
}

function drawRun(){
  if (!RUN) return;
  const isTimer = RUN.c.kind === "timer";
  const seg = isTimer ? RUN.c.segs[RUN.idx] : null;
  const left = isTimer ? segSeconds() - RUN.elapsed : RUN.elapsed;
  const pct = isTimer ? Math.min(100, RUN.elapsed / segSeconds() * 100) : 0;
  const nextSeg = isTimer && RUN.c.segs[RUN.idx + 1];

  let node = document.querySelector(".runner");
  if (!node){
    node = document.createElement("div");
    node.className = "runner";
    node.innerHTML = `
      <div class="r-name"></div>
      <div class="r-seg"></div>
      <div class="r-time"></div>
      <div class="r-next"></div>
      <div class="r-bar"><div class="r-fill"></div></div>
      <div class="r-steps"></div>
      <div class="r-ctrl">
        <button class="btn primary" data-a="pause">Pausa</button>
        <button class="btn" data-a="skip">Avanti</button>
        <button class="btn ghost" data-a="stop">Chiudi</button>
      </div>`;
    document.body.appendChild(node);
    node.querySelector('[data-a="stop"]').onclick = () => finishRun(false);
    node.querySelector('[data-a="pause"]').onclick = () => {
      RUN.paused = !RUN.paused; RUN.mark = Date.now();
      keepAwake(!RUN.paused); drawRun();
    };
    node.querySelector('[data-a="skip"]').onclick = () => {
      if (!isTimer){ RUN.elapsed = 0; drawRun(); return; }
      if (RUN.idx >= RUN.c.segs.length - 1){ finishRun(true); return; }
      RUN.idx++; RUN.elapsed = 0; drawRun();
    };
  }

  node.classList.toggle("rest", isTimer && seg.kind === "pausa");
  node.querySelector(".r-name").textContent = RUN.ref ? `${RUN.c.name} · ${RUN.ref.name}` : RUN.c.name;
  node.querySelector(".r-seg").textContent = isTimer
    ? (seg.kind === "lavoro" ? "Lavoro" : "Pausa") + ` · fase ${RUN.idx+1} di ${RUN.c.segs.length}`
    : "Cronometro";
  node.querySelector(".r-time").textContent = clock(left);
  node.querySelector(".r-next").textContent = isTimer
    ? (nextSeg ? `poi ${nextSeg.min} minuti di ${nextSeg.kind}` : "ultima fase")
    : "";
  node.querySelector(".r-fill").style.width = pct + "%";
  node.querySelector(".r-steps").innerHTML = isTimer
    ? RUN.c.segs.map((s,i) => `<div class="r-step ${i===RUN.idx?"on":(i<RUN.idx?"past":"")}"></div>`).join("") : "";
  node.querySelector('[data-a="pause"]').textContent = RUN.paused ? "Riprendi" : "Pausa";
  node.querySelector('[data-a="skip"]').textContent = isTimer ? "Avanti" : "Azzera";
}

/* ============================================================
   GOOGLE CALENDAR — letto dal calendario del telefono
   L'app Android legge il calendario di Android, dove Google Calendar è già
   sincronizzato: niente token, funziona anche senza rete. Sola lettura.
   Gli eventi ripetuti sono impegni fissi, quelli singoli sono eventi.
   Qui dentro puoi aggiungerci quello che Google non ha: importanza, note,
   avvisi, se va spuntato per chiudere la giornata.
   ============================================================ */
const GCAL = { byDay:{}, list:[], series:{}, count:0, status:"idle", err:null, at:null, cals:[] };
const gcalSupported = () => inApp() && typeof NAT.leggiCalendario === "function";

function gcxOf(key){ return (S.gcx && S.gcx[key]) || {}; }

// occupa il tempo? Di norma sì, tranne gli eventi di un giorno intero e quelli
// segnati "libero" su Google. Quello che scegli qui dentro vince.
function gcBusy(g){
  if (g.allDay) return false;
  const x = gcxOf(g.key);
  if (x.busy === false) return false;
  if (x.busy === true) return true;
  return !g.free;
}

const isoUTC = ms => { const d = new Date(ms); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`; };

// un calendario si riconosce da account e nome: l'id cambia da un telefono all'altro
const calKey = c => `${c.account || ""}|${c.nome || ""}`;

function gcalIngestNative(arr){
  const byDay = {}, list = [], series = {};
  const calPer = {};
  for (const c of (GCAL.cals || [])) calPer[String(c.id)] = calKey(c);
  for (const ev of (arr || [])){
    if (ev.visibile === false) continue;
    const ck = calPer[String(ev.calendario)] || String(ev.calendario);
    if (S.gcalOff.includes(ck)) continue;
    // la chiave è quella di Google (uguale su ogni dispositivo); in mancanza, quella del telefono
    const key = ev.gserie ? "g:" + ev.gserie : ev.gid ? "g:" + ev.gid : "l:" + String(ev.serie || ev.id);
    const recurring = !!(ev.regola || ev.serie);
    const allDay = !!ev.tuttoIlGiorno;
    let date, endDate, s, e;
    if (allDay){
      // gli eventi di tutto il giorno arrivano a mezzanotte UTC
      date = isoUTC(ev.inizio);
      endDate = isoUTC(Math.max(ev.inizio, ev.fine - 1));
      s = 0; e = 1439;
    } else {
      const A = new Date(ev.inizio), B = new Date(ev.fine);
      date = iso(A); endDate = iso(B);
      s = A.getHours() * 60 + A.getMinutes();
      e = B.getHours() * 60 + B.getMinutes();
      if (endDate > date && e === 0){ endDate = addDays(endDate, -1); e = 1439; }
    }
    const inst = { key, id: String(ev.id), label: (ev.titolo || "").trim() || "Impegno", date, endDate,
      start: toHHMM(s), end: toHHMM(Math.min(e, 1439)), s, e, allDay, recurring,
      rrule: ev.regola || "", place: ev.luogo || "", note: ev.note || "",
      cal: String(ev.calendario), calName: ev.nomeCalendario || "", free: !!ev.libero };
    list.push(inst);
    for (let d = date, i = 0; d <= endDate && i < 62; d = addDays(d, 1), i++){
      const a = d === date ? s : 0;
      const b = d === endDate ? e : 1439;
      if (!allDay && b <= a) continue;
      (byDay[d] = byDay[d] || []).push({ key, label: inst.label, s: a, e: b, allDay, free: inst.free, recurring, inst });
    }
    if (!series[key]) series[key] = { key, label: inst.label, recurring, rrule: inst.rrule, calName: inst.calName, place: inst.place, sample: inst, dates: [] };
    series[key].dates.push(date);
    if (!series[key].rrule && inst.rrule) series[key].rrule = inst.rrule;
  }
  GCAL.byDay = byDay; GCAL.list = list; GCAL.series = series; GCAL.count = list.length;

  // la prima volta non ti riempio di "nuovi": quello che c'è già lo considero visto
  if (!S.gcalSeenInit){
    for (const k in series) S.gcalSeen[k] = true;
    S.gcalSeenInit = true;
    salvaSolo();
  }
}

// Legge adesso. Non ridisegna: lo fa chi la chiama.
function gcalRead(){
  if (!S.gcalOn){ GCAL.status = "spento"; return; }
  if (!gcalSupported()){ GCAL.status = inApp() ? "vecchia" : "browser"; return; }
  let ok = false;
  try { ok = NAT.calendarioConcesso(); } catch(e){}
  if (!ok){ GCAL.status = "permesso"; GCAL.byDay = {}; GCAL.list = []; GCAL.series = {}; GCAL.count = 0; return; }
  const T = today();
  const da = fromIso(addDays(T, -35)).getTime(), a = fromIso(addDays(T, 120)).getTime();
  try { GCAL.cals = JSON.parse(NAT.calendari()) || []; } catch(e){ GCAL.cals = []; }
  let raw;
  try { raw = JSON.parse(NAT.leggiCalendario(da, a)); }
  catch(e){ GCAL.status = "err"; GCAL.err = String(e && e.message || e); return; }
  if (raw && !Array.isArray(raw) && raw.errore){ GCAL.status = "err"; GCAL.err = raw.errore; return; }
  gcalIngestNative(raw);
  GCAL.status = "ok"; GCAL.err = null; GCAL.at = Date.now();
}

function gcalStart(){
  gcalRead();
  runEngine(); render(); riprogrammaAvvisi();
}

function gcalAsk(){
  if (!gcalSupported()) return;
  try { NAT.chiediCalendario(); } catch(e){}
}

// il telefono ci racconta cosa è successo: permesso dato, app riaperta
window.dalTelefono = (cosa, valore) => {
  if (cosa === "calendario"){
    GCAL.negato = valore !== "si";
    if (valore === "si"){ S.gcalOn = true; salvaSolo(); }
    gcalStart();
  }
  if (cosa === "ripreso" && S && S.gcalOn && gcalSupported()){
    // non ridisegno se stai scrivendo in un foglio aperto
    gcalRead(); runEngine();
    if (!document.querySelector(".sheet")) render();
    riprogrammaAvvisi();
  }
};

function gcalMessage(){
  if (!S.gcalOn) return "Spento. Coach usa solo quello che scrivi qui.";
  switch (GCAL.status){
    case "ok": {
      const serie = Object.values(GCAL.series);
      const fissi = serie.filter(x => x.recurring).length, singoli = serie.length - fissi;
      return `Letto ${GCAL.at ? `alle ${new Date(GCAL.at).toTimeString().slice(0,5)}` : ""}: ${fissi} ${fissi === 1 ? "impegno ripetuto" : "impegni ripetuti"} e ${singoli} ${singoli === 1 ? "evento" : "eventi"} nei prossimi quattro mesi.`;
    }
    case "permesso": return GCAL.negato
      ? "Android non ha dato il permesso. Se non compare più la richiesta, aprilo a mano: Impostazioni dell'app → Autorizzazioni → Calendario → Consenti."
      : "Serve il permesso di leggere il calendario del telefono.";
    case "vecchia":  return "Sul telefono c'è ancora l'app Android vecchia, che non sa leggere il calendario: installa l'APK nuovo da github.com/torassolorenzo03/coach/releases.";
    case "browser":  return "Il calendario si legge solo dall'app Android. Nel browser vedi solo quello che scrivi qui.";
    case "err":      return "Non sono riuscito a leggere il calendario: " + (GCAL.err || "errore");
    case "spento":   return "Spento.";
    default:         return "In attesa…";
  }
}

/* ---------- come si mostrano ---------- */
const GIORNI_RR = { MO:1, TU:2, WE:3, TH:4, FR:5, SA:6, SU:0 };
// "ogni settimana: lun, mer" da una regola di ripetizione di Google
function rruleLabel(rr){
  if (!rr) return "si ripete";
  const p = Object.fromEntries(rr.split(";").map(x => x.split("=")));
  const n = +p.INTERVAL || 1;
  const giorni = (p.BYDAY || "").split(",").map(x => GIORNI_RR[x.slice(-2)]).filter(x => x !== undefined);
  if (p.FREQ === "DAILY")   return n === 1 ? "ogni giorno" : `ogni ${n} giorni`;
  if (p.FREQ === "WEEKLY")  return (n === 1 ? "ogni settimana" : `ogni ${n} settimane`) + (giorni.length ? `: ${giorniLabel(giorni)}` : "");
  if (p.FREQ === "MONTHLY") return n === 1 ? "ogni mese" : `ogni ${n} mesi`;
  if (p.FREQ === "YEARLY")  return "ogni anno";
  return "si ripete";
}

function gcalWhen(g, d){
  if (g.allDay) return g.endDate && g.endDate !== g.date ? `tutto il giorno · fino al ${prettyDate(g.endDate)}` : "tutto il giorno";
  if (g.endDate && g.endDate !== g.date) return `dalle ${g.start} del ${prettyDate(g.date)} al ${prettyDate(g.endDate)}`;
  return `${g.start}–${g.end}`;
}

// gli eventi singoli di Google in un giorno (non i ripetuti)
function gcalSingles(d){
  return (GCAL.byDay[d] || []).filter(g => !g.recurring && !gcBusy(g));
}
function gcalOnDay(d){
  const visti = new Set();
  return (GCAL.byDay[d] || []).filter(g => { if (visti.has(g.key)) return false; visti.add(g.key); return true; });
}
function gcalUpcoming(from, days){
  const out = [], visti = new Set();
  for (const g of GCAL.list){
    if (g.recurring) continue;
    if ((g.endDate || g.date) < from || g.date > addDays(from, days)) continue;
    const k = g.key + "@" + g.date;
    if (visti.has(k)) continue;
    visti.add(k); out.push(g);
  }
  return out.sort((a,b) => a.date.localeCompare(b.date) || a.s - b.s);
}

// le cose di Google che hai segnato "da spuntare": entrano nel 100% della giornata
function gcalTodosOn(d){
  if (!S.gcalOn) return [];
  return gcalOnDay(d).filter(g => gcxOf(g.key).todo).map(g => ({ id: "gc:" + g.key, key: g.key, name: g.label, imp: gcxOf(g.key).imp || 2, g }));
}

function gcalTodoHTML(T){

  if (!lista.length) return "";
  const fatte = lista.filter(x => isDone(T, x.id)).length;
  return `<h2 id="h-gctodo">Dal calendario · ${fatte}/${lista.length}</h2>
  <div class="card">${lista.map(x => `
    <div class="row ${isDone(T, x.id) ? "done" : ""}" data-row="${x.id}">
      <div class="imp i${x.imp}"></div>
      <button class="tick" data-tick="${x.id}" aria-label="Segna come fatto">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <div class="rbody">
        <div class="rtitle">${esc(x.name)}</div>
        <div class="rmeta">${esc(gcalWhen(x.g.inst || x.g, T))}${gcxOf(x.key).note ? `<span class="dot">·</span>${esc(gcxOf(x.key).note)}` : ""}</div>
      </div>
      <button class="btn ghost" data-gc="${x.key}" data-gcd="${T}" style="min-width:40px;padding:8px 0" aria-label="Dettagli">&#9881;</button>
    </div>`).join("")}</div>`;
}

// quello che è comparso su Google dall'ultima volta: te lo dico, e se vuoi aggiungi i dettagli
function gcalNew(){
  if (!S.gcalOn || GCAL.status !== "ok") return [];
  const T = today();
  return Object.values(GCAL.series)
    .filter(x => !S.gcalSeen[x.key] && x.dates.some(d => d >= T))
    .sort((a,b) => a.dates[0].localeCompare(b.dates[0]));
}

function gcalNewHTML(T){
  const nuovi = gcalNew();
  if (!nuovi.length) return "";
  return `<h2>Nuovi da Google Calendar · ${nuovi.length}</h2>
  <div class="card">
    ${nuovi.slice(0, 6).map(x => {
      const prossima = x.dates.find(d => d >= T) || x.dates[0];
      return `<button class="actrow" data-gc="${x.key}" data-gcd="${prossima}">

    <div class="hint" style="margin-bottom:16px">Orari, titolo e ripetizione si cambiano su Google Calendar. Qui aggiungi quello che manca: vale ${x.recurring ? "per tutte le volte che si ripete" : "per questo evento"}.</div>

    <div class="field"><label>Importanza</label>
      <div class="chips" id="gc-imp">
        ${[[1,"Alta"],[2,"Media"],[3,"Bassa"],[0,"Nessuna"]].map(([v,l]) => `<button class="chip" data-v="${v}">${l}</button>`).join("")}
      </div></div>

    <div class="field"><label>Come lo tratta Coach</label>
      <div class="chips">
        <button class="chip" id="gc-todo">Da spuntare in giornata</button>
        <button class="chip" id="gc-busy">Occupa il tempo</button>
        ${x.recurring ? `<button class="chip" id="gc-show">Mostra nei prossimi 30 giorni</button>` : ""}
      </div>
      <div class="hint">"Da spuntare" lo mette fra le cose di oggi: per chiudere la giornata al 100% va fatto. "Occupa il tempo" dice al coach che in quelle ore non sei libero.</div></div>

    <div class="field"><label>Nota</label>
      <textarea id="gc-note" rows="3" placeholder="Cosa portare, con chi, cosa preparare…" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical">${esc(ex.note || "")}</textarea></div>

    <div class="field"><label>Avvisami</label>${picker.html}
      <div class="hint">Google ti avvisa già con i suoi promemoria: questi sono in più, solo se li vuoi.</div></div>

    <div class="btnrow">
      <button class="btn primary" id="gc-save" style="flex:2">Salva</button>
      <button class="btn ghost" id="gc-cancel">Chiudi</button>
    </div>
    ${Object.keys(ex).length ? `<div class="btnrow"><button class="btn danger wide" id="gc-clear">Togli i dettagli aggiunti</button></div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  picker.bind(w);
  const paint = () => {
    w.querySelectorAll("#gc-imp .chip").forEach(b => b.classList.toggle("on", +b.dataset.v === imp));
    w.querySelector("#gc-todo").classList.toggle("on", todo);
    const gb = w.querySelector("#gc-busy");
    gb.classList.toggle("on", busy && !g.allDay);
    gb.style.opacity = g.allDay ? .45 : 1;
    const gs = w.querySelector("#gc-show"); if (gs) gs.classList.toggle("on", show);
  };
  w.querySelectorAll("#gc-imp .chip").forEach(b => b.onclick = () => { imp = +b.dataset.v; paint(); });
  w.querySelector("#gc-todo").onclick = () => { todo = !todo; paint(); };
  w.querySelector("#gc-busy").onclick = () => { if (g.allDay) return; busy = !busy; paint(); };
  const gs = w.querySelector("#gc-show"); if (gs) gs.onclick = () => { show = !show; paint(); };
  paint();
  w.querySelector("#gc-cancel").onclick = () => { w.remove(); render(); };
  const clr = w.querySelector("#gc-clear");
  if (clr) armDelete(clr, "Togli i dettagli aggiunti", () => { delete S.gcx[key]; save(); w.remove(); render(); });

    const nota = w.querySelector("#gc-note").value.trim();
    if (nota) nuovo.note = nota;
    if (av.giorni.length || av.prima) nuovo.avviso = av;
    if (Object.keys(nuovo).length) S.gcx[key] = nuovo; else delete S.gcx[key];
    save(); w.remove(); render();
  };
}

const HTYPES = {
  sonno:  "Orari (a letto e sveglia)",
  durata: "Durata in minuti",
  numero: "Un numero",
  sino:   "Fatto o non fatto"
};

const hVal = (d, id) => (S.hlog[d] || {})[id];

function hShow(v, type){
  if (v === undefined || v === null) return "—";
  if (type === "sonno") return `${v.from}–${v.to} · ${durLabel(v.min)}`;
  if (type === "durata") return durLabel(v);
  if (type === "sino") return v ? "sì" : "no";
  return String(v);
}

function hRecap(v){
  const T = today();
  const vals = [];
  for (let i = 1; i <= 7; i++){
    const x = hVal(addDays(T, -i), v.id);
    if (x !== undefined && x !== null) vals.push(x);
  }
  if (!vals.length) return "nessun dato negli ultimi 7 giorni";
  if (v.type === "sonno"){
    const avg = Math.round(vals.reduce((s,x) => s + x.min, 0) / vals.length);
    return `media ultimi ${vals.length} giorni: ${durLabel(avg)}`;
  }
  if (v.type === "durata"){
    return `ultimi 7 giorni: ${durLabel(vals.reduce((s,x)=>s+x,0))} in ${vals.length} ${vals.length===1?"giorno":"giorni"}`;
  }
  if (v.type === "sino"){
    return `${vals.filter(Boolean).length} giorni su 7`;
  }
  return `totale 7 giorni: ${vals.reduce((s,x)=>s+x,0)}`;
}
