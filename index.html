/* ============================================================
   USCITE — abbonamenti, spese fisse e uscite straordinarie
   ============================================================ */
const OGNI = {
  w:    { nome:"Ogni settimana", mesi:0,  giorni:7 },
  m:    { nome:"Ogni mese",      mesi:1 },
  "2m": { nome:"Ogni 2 mesi",    mesi:2 },
  "3m": { nome:"Ogni 3 mesi",    mesi:3 },
  "6m": { nome:"Ogni 6 mesi",    mesi:6 },
  y:    { nome:"Una volta l'anno", mesi:12 },
  once: { nome:"Una tantum",     mesi:0 }
};
const BCAT = ["Casa","Telefono e internet","Streaming","Assicurazioni","Auto","Salute","Sport","Lavoro","Altro"];

const billsOpen = () => S.bills.filter(b => !b.closed);

// quanto pesa al mese: tutto ridotto alla stessa misura
function billMonthly(b){
  const a = +b.amount || 0;
  if (b.every === "w") return a * 4.345;
  if (b.every === "once") return 0;
  const m = OGNI[b.every] ? OGNI[b.every].mesi : 1;
  return m ? a / m : 0;
}

function billTotals(){
  let mese = 0, anno = 0, unaTantum = 0;
  for (const b of billsOpen()){
    if (b.every === "once"){ unaTantum += +b.amount || 0; continue; }
    mese += billMonthly(b);
  }
  anno = mese * 12;
  return { mese: Math.round(mese * 100) / 100, anno: Math.round(anno), unaTantum };
}

function billNextDate(b){
  if (!b.next) return "";
  if (b.every === "w") return addDays(b.next, 7);
  const m = OGNI[b.every] ? OGNI[b.every].mesi : 0;
  return m ? addMonths(b.next, m) : "";
}

// fino a quanti giorni prima una spesa si fa vedere in cima all'app
function billSoglia(b){ const g = avvisoOf(b, "avviso", "uscita").giorni; return g.length ? Math.max(...g) : 0; }

function billAlerts(T){
  const out = [];
  for (const b of billsOpen()){
    if (!b.next) continue;
    const dd = daysBetween(T, b.next);
    const soglia = billSoglia(b);
    if (dd < 0) out.push({ id:b.id, t:`${b.name}: ${euro(+b.amount||0)} era il ${prettyDate(b.next)}` });
    else if (dd <= soglia) out.push({ id:b.id, t:`${b.name}: ${euro(+b.amount||0)} ${dd === 0 ? "oggi" : dd === 1 ? "domani" : `fra ${dd} giorni`}` });
  }
  return out;
}

  const dd = b.next ? daysBetween(T, b.next) : null;

/* ============================================================
   DA FISSARE — gli impegni senza data
   Li scrivi o li detti senza giorno né ora. Ogni giorno la segretaria te ne
   propone uno o due con un orario libero già scelto: se ti va bene lo mette
   su Google Calendar (si apre già compilato, tu tocchi Salva), se no ne
   scegli un altro o te lo richiede più avanti. Quando lo ritrova su Google,
   ci aggiunge i dettagli che le avevi dato.
   ============================================================ */
const FX_DUR = [[15,"15 min"],[30,"30 min"],[60,"1 ora"],[90,"1 ora e mezza"],[120,"2 ore"],[180,"3 ore"],[240,"Mezza giornata"]];
const FX_IMP = [[1,"Alta"],[2,"Media"],[3,"Bassa"]];
const FX_PER_GIORNO = 2;                       // quante te ne chiedo al giorno, al massimo

const fxTutti = () => S.dafissare || [];
const fxAperti = () => fxTutti().filter(x => x.stato === "aperto");
const fxInAttesa = () => fxTutti().filter(x => x.stato === "proposto");

// l'ordine in cui te li chiedo: prima quelli con la scadenza più vicina, poi i più importanti, poi i più vecchi
function fxOrdine(a, b){
  return (a.entro || "9999").localeCompare(b.entro || "9999") || (a.imp || 2) - (b.imp || 2)
    || (a.creato || "").localeCompare(b.creato || "");
}
function fxDaChiedere(d){
  return fxAperti().filter(x => !x.rimandaFino || x.rimandaFino <= d).sort(fxOrdine).slice(0, FX_PER_GIORNO);
}

// le finestre libere di un giorno, in minuti, fra le 8 e le 21 (o fra sveglia e sonno, se è più stretto):
// tolti impegni, eventi che occupano il tempo e fasce delle attività
function fxFinestre(d){
  const a0 = Math.max(awakeFrom() + 60, 8 * 60), a1 = Math.min(awakeTo() - 60, 21 * 60);
  let a = a0;
  if (d === today()) a = Math.max(a, Math.ceil((nowMin() + 60) / 30) * 30);   // oggi: almeno fra un'ora
  if (a1 - a < 15) return [];
  const occ = busyOn(d).concat(actsOn(d).map(x => [toMin(x.win.start), toMin(x.win.end)]))
    .map(([s, e]) => [Math.max(s, a), Math.min(e, a1)]).filter(([s, e]) => e > s).sort((x, y) => x[0] - y[0]);
  const out = [];
  let cur = a;
  for (const [s, e] of occ){ if (s > cur) out.push([cur, s]); cur = Math.max(cur, e); }
  if (a1 > cur) out.push([cur, a1]);
  return out;
}

// i posti buoni per una cosa da fissare: un orario per giorno, dal più consigliato.
// Meglio presto (prestissimo se è importante), fra le 9 e le 19, lontano dal pranzo,
// in una giornata non troppo piena; mai dopo la scadenza.
function fxProposte(x, quante){
  const T = today(), dur = +x.durata || 60;
  const fine = x.entro && x.entro >= T ? x.entro : addDays(T, 20);
  const out = [];
  for (let d = T, i = 0; d <= fine && i < 31; d = addDays(d, 1), i++){
    if (S.pause && d >= S.pause.from && (!S.pause.to || d <= S.pause.to)) continue;
    let migliore = null;
    for (const [a, b] of fxFinestre(d)){
      for (let s = Math.ceil(a / 30) * 30; s + dur <= b; s += 30){
        let punti = 0;
        if (s < 9 * 60 || s + dur > 19 * 60) punti += 90;                    // troppo presto o troppo tardi
        if (s < 14 * 60 && s + dur > 12 * 60 + 30) punti += 40;              // sopra il pranzo
        punti += (s - Math.ceil(a / 30) * 30) / 30 * 4;                      // meglio appena sei libero
        if (!migliore || punti < migliore.punti) migliore = { s, e: s + dur, punti, fin: [a, b] };
      }
    }
    if (!migliore) continue;
    // il buco c'è già: una cosa breve sta bene anche in una giornata piena, una lunga meglio in una leggera;
    // aspettare pesa di più se è importante
    const L = dayLoad(d);
    const peso = 0.3 * Math.min(1, dur / 120), attesa = x.imp === 1 ? 160 : x.imp === 3 ? 25 : 60;
    out.push({ d, s: migliore.s, e: migliore.e, fin: migliore.fin, L, score: L.score * peso + i * attesa + migliore.punti });
  }
  return out.sort((p, q) => p.score - q.score).slice(0, quante || 1);
}

const fxQuando = p => `${dayChip(p.d).toLowerCase()} alle ${toHHMM(p.s)}`;
const fxPerche = p => `giornata ${p.L.word}, libero dalle ${toHHMM(p.fin[0])} alle ${toHHMM(p.fin[1])}`;
const fxMeta = x => [minutiLabel(+x.durata || 60), x.imp === 1 ? "importante" : x.imp === 3 ? "poco importante" : "",
  x.entro ? `entro ${dayChip(x.entro).toLowerCase()}` : "", x.luogo || ""].filter(Boolean).join(" · ");

// "entro la settimana" e simili diventano una data
function fxEntroDa(r){
  const T = today();
  if (r.entro === "d") return r.data || null;
  if (r.entro === "w"){ let d = T; while (dow(d) !== 0) d = addDays(d, 1); return d; }
  if (r.entro === "m"){ const x = fromIso(T); return iso(new Date(x.getFullYear(), x.getMonth() + 1, 0)); }
  if (r.entro === "y") return `${T.slice(0, 4)}-12-31`;
  return null;
}

/* ---------- su Google Calendar ---------- */
function fxLinkGoogle(x, inizio, fine){
  const f = ms => new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const q = new URLSearchParams({ action: "TEMPLATE", text: x.titolo, dates: `${f(inizio)}/${f(fine)}`, details: x.nota || "", location: x.luogo || "" });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}

// Apre Google Calendar già compilato; quando l'evento compare lì, la cosa è fissata.
function fxManda(x, p){
  const inizio = istanteMin(p.d, p.s), fine = istanteMin(p.d, p.e);
  if (inApp()){
    if (typeof NAT.nuovoEventoGoogle !== "function"){ serveAppNuova("Per metterlo su Google Calendar"); return false; }
    try { NAT.nuovoEventoGoogle(x.titolo, inizio, fine, x.luogo || "", x.nota || ""); }
    catch(e){ alert("Google Calendar non si apre: " + e); return false; }
  } else {
    window.open(fxLinkGoogle(x, inizio, fine), "_blank");
  }
  x.stato = "proposto";
  x.proposta = { d: p.d, s: p.s, e: p.e, at: Date.now(), prima: (GCAL.byDay[p.d] || []).map(g => g.key) };
  save();
  return true;
}

const fxNorm = t => senzaAccenti(String(t || "").toLowerCase()).replace(/[^a-z0-9]+/g, " ").trim();

// Dopo ogni lettura del calendario: le cose mandate a Google sono arrivate?
// Le riconosco dal nome, o dall'orario proposto se l'hai cambiato. Aspetto che Google le
// abbia sincronizzate (hanno il loro codice), così i dettagli restano attaccati per sempre.
function fxAbbina(){
  if (!S.gcalOn || GCAL.status !== "ok" || !fxInAttesa().length) return;
  const T = today(), fissati = [];
  let cambiato = false;
  for (const x of fxInAttesa()){
    const p = x.proposta;
    if (!p){ x.stato = "aperto"; cambiato = true; continue; }
    const nome = fxNorm(x.titolo), dal = addDays(iso(new Date(p.at)), -1);
    const cand = GCAL.list.filter(g => !g.recurring && g.date >= dal && (fxNorm(g.label) === nome
      || (g.date === p.d && Math.abs(g.s - p.s) <= 15 && !(p.prima || []).includes(g.key))))
      .sort((a, b) => Math.abs(daysBetween(a.date, p.d)) - Math.abs(daysBetween(b.date, p.d)));
    const g = cand.find(c => c.key.startsWith("g:"));
    if (g){
      x.stato = "fissato";
      x.fissato = { key: g.key, d: g.date, s: g.s, at: Date.now() };
      const ex = { ...gcxOf(g.key), imp: x.imp || 2 };
      if (x.nota && !ex.note) ex.note = x.nota;
      S.gcx[g.key] = ex;
      S.gcOk[g.key] = 1;                    // i dettagli ce li hai già messi: niente grassetto
      S.gcalSeen[g.key] = true;
      fissati.push(`${x.titolo}, ${dayChip(g.date).toLowerCase()} alle ${toHHMM(g.s)}`);
      fxNotizia(`Fissato su Google Calendar: ${x.titolo}, ${dayChip(g.date).toLowerCase()} alle ${toHHMM(g.s)}.`);
      cambiato = true;
    } else if (!cand.length && (p.d < T || Date.now() - p.at > 3 * 86400000)){
      x.stato = "aperto"; x.proposta = null;
      fxNotizia(`«${x.titolo}» non lo trovo su Google Calendar: lo rimetto fra le cose da fissare.`);
      cambiato = true;
    }
  }
  if (cambiato) save();
  if (fissati.length) try { toast(`Fissato: ${fissati.join("; ")}.`); } catch(e){}
}

// le notizie della giornata sulle cose da fissare
function fxNotizia(text){
  const T = today();
  S.fxNotizie = (S.fxNotizie || []).filter(n => n.d === T).concat([{ d: T, text }]);
}

function fxHTML(T){
  const chiedi = fxDaChiedere(T), attesa = fxInAttesa();
  if (!chiedi.length && !attesa.length) return "";
  const altri = fxAperti().length - chiedi.length;
  return `<div class="hrow"><h2>Da fissare</h2><span class="hsub">${fxAperti().length} senza data</span></div>
  <div class="card">
    ${chiedi.map(fxRigaHTML).join("")}
    ${attesa.map(fxAttesaHTML).join("")}
    ${altri > 0 ? `<button class="actrow" data-prog="fissare"><div class="rbody"><div class="rmeta">e ${altri === 1 ? "un'altra" : `altre ${altri}`} nell'Archivio, te le chiedo nei prossimi giorni</div></div></button>` : ""}
  </div>`;
}

// i tasti, ovunque compaiano (Oggi, Archivio)
function bindFx(root){
  const trova = id => fxTutti().find(x => x.id === id);
  root.querySelectorAll("[data-fx]").forEach(b => b.onclick = () => openFx(b.dataset.fx));
  root.querySelectorAll("[data-fxok]").forEach(b => b.onclick = () => {
    const x = trova(b.dataset.fxok); if (!x) return;
    if (fxManda(x, { d: b.dataset.d, s: +b.dataset.s, e: +b.dataset.e })){ render(); toast("Controlla su Google Calendar e tocca Salva."); }
  });
  root.querySelectorAll("[data-fxaltro]").forEach(b => b.onclick = () => openFxOrario(b.dataset.fxaltro));
  root.querySelectorAll("[data-fxdopo]").forEach(b => b.onclick = () => openFxDopo(b.dataset.fxdopo));

  });

  });
  root.querySelectorAll("[data-fxsalvato]").forEach(b => b.onclick = () => {

    save(); render(); toast("Fissato.");

}

// la scheda di una cosa da fissare
function openFx(id){
  const T = today();
  const x = id ? fxTutti().find(y => y.id === id)
               : { id: "fx" + Date.now(), titolo: preNome(), durata: 60, imp: 2, entro: null, luogo: "", nota: "", creato: T, stato: "aperto", ...prendiBozza("fissare") };
  if (!x) return;
  let durata = +x.durata || 60, imp = x.imp || 2;
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `<div class="sheetin">
    <h3>${id ? "Da fissare" : "Nuova cosa da fissare"}</h3>
    <div class="hint" style="margin-bottom:14px">Senza giorno né ora: te la propongo io quando trovo un buco, e se ti va bene la metto su Google Calendar.</div>
    <div class="field"><label for="fx-t">Cosa</label>
      <input type="text" id="fx-t" value="${esc(x.titolo || "")}" placeholder="Chiamare il commercialista, dentista, tagliando…"></div>

      <div class="chips" id="fx-dur"></div>
      <div class="segline" style="margin-top:9px"><input type="number" id="fx-durn" min="5" max="720" placeholder="Altro: minuti" style="flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"></div></div>
    <div class="field"><label>Importanza</label>
      <div class="chips" id="fx-imp">${FX_IMP.map(([v, l]) => `<button class="chip" data-v="${v}">${l}</button>`).join("")}</div></div>
    <div class="field"><label for="fx-entro">Entro quando (se c'è una scadenza)</label>
      <input type="date" id="fx-entro" value="${x.entro || ""}" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"></div>
    <div class="field"><label for="fx-l">Dove</label>
      <input type="text" id="fx-l" value="${esc(x.luogo || "")}" placeholder="Studio, via Roma 12, online…"></div>
    <div class="field"><label for="fx-n">Nota</label>
      <input type="text" id="fx-n" value="${esc(x.nota || "")}" placeholder="Cosa portare, chi chiamare…"></div>
    ${id && x.stato === "fissato" && x.fissato ? `<div class="hint">Fissato ${esc(dayChip(x.fissato.d).toLowerCase())} alle ${toHHMM(x.fissato.s)}.</div>` : ""}
    <div class="btnrow"><button class="btn primary" id="fx-save" style="flex:2">Salva</button><button class="btn ghost" id="fx-x">Annulla</button></div>
    ${id && x.stato !== "fissato" ? `<div class="btnrow"><button class="btn wide" id="fx-ora">Proponimi un orario</button></div>` : ""}
    ${id ? `<div class="btnrow"><button class="btn danger wide" id="fx-del">Elimina</button></div>` : ""}
    <div style="height:30px"></div></div>`;
  document.body.appendChild(w);
  const paint = () => {
    const altri = FX_DUR.some(([v]) => v === durata) ? "" : `<button class="chip on" data-v="${durata}">${minutiLabel(durata)}</button>`;
    w.querySelector("#fx-dur").innerHTML = FX_DUR.map(([v, l]) => `<button class="chip${v === durata ? " on" : ""}" data-v="${v}">${l}</button>`).join("") + altri;
    w.querySelectorAll("#fx-dur .chip").forEach(b => b.onclick = () => { durata = +b.dataset.v; paint(); });
    w.querySelectorAll("#fx-imp .chip").forEach(b => b.classList.toggle("on", +b.dataset.v === imp));
  };
  w.querySelectorAll("#fx-imp .chip").forEach(b => b.onclick = () => { imp = +b.dataset.v; paint(); });
  w.querySelector("#fx-durn").onchange = e => { const m = Math.round(+e.target.value); if (m >= 5){ durata = m; e.target.value = ""; paint(); } };
  paint();
  const leggi = () => {
    const titolo = w.querySelector("#fx-t").value.trim();
    if (!titolo){ alert("Scrivi cosa c'è da fissare."); return null; }
    return { ...x, titolo, durata, imp, entro: w.querySelector("#fx-entro").value || null,
             luogo: w.querySelector("#fx-l").value.trim(), nota: w.querySelector("#fx-n").value.trim() };
  };
  const salva = () => {
    const next = leggi(); if (!next) return null;
    S.dafissare = S.dafissare || [];
    const i = S.dafissare.findIndex(y => y.id === x.id);
    if (i >= 0) S.dafissare[i] = next; else S.dafissare.push(next);
    save();
    return next;
  };
  w.querySelector("#fx-save").onclick = () => { if (salva()){ w.remove(); render(); if (!id) toast("Te lo propongo io nei prossimi giorni."); } };
  w.querySelector("#fx-x").onclick = () => w.remove();
  const ora = w.querySelector("#fx-ora");
  if (ora) ora.onclick = () => { const n = salva(); if (n){ w.remove(); render(); openFxOrario(n.id); } };
  if (id) armDelete(w.querySelector("#fx-del"), "Elimina", () => { S.dafissare = S.dafissare.filter(y => y.id !== x.id); save(); w.remove(); render(); });
}

/* ============================================================
   SCRIVI O DETTA — una frase in italiano diventa la cosa giusta
   "dentista martedì alle 17 in via Roma, portare le lastre" → un evento.
   "ricordami venerdì di pagare il bollo" → un promemoria.
   "latte, uova e pane" → la spesa. "Marco mi deve 20 euro" → dare e avere.
   Capisco quello che posso; il resto lo scegli tu con un tocco.
   ============================================================ */
const NUMERI_IT = { un:1, uno:1, una:1, due:2, tre:3, quattro:4, cinque:5, sei:6, sette:7, otto:8, nove:9, dieci:10,
  undici:11, dodici:12, tredici:13, quattordici:14, quindici:15, venti:20, trenta:30 };
const GIORNI_IT = { domenica:0, lunedi:1, martedi:2, mercoledi:3, giovedi:4, venerdi:5, sabato:6 };
const MESI_IT = { gennaio:1, febbraio:2, marzo:3, aprile:4, maggio:5, giugno:6, luglio:7, agosto:8, settembre:9, ottobre:10, novembre:11, dicembre:12 };
const senzaAccenti = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const numIt = s => /^\d+$/.test(s) ? +s : (NUMERI_IT[s] || null);

// le bozze che il + passa ai moduli quando scegli "modifica prima di salvare"
let BOZZA = null;
function prendiBozza(tipo){
  if (!BOZZA || BOZZA.tipo !== tipo) return {};
  const b = BOZZA.campi; BOZZA = null;
  return b;
}

function capisciFrase(testo){
  const T = today();
  const r = { tipo: null, titolo: "", data: null, ora: null, fine: null, luogo: "", nota: "", importo: null,
              chi: "", dir: "avere", giorni: [], ogni: null, n: 1, giornoMese: null, entro: null, voci: [], durata: null, imp: null };
  let t = " " + String(testo || "").normalize("NFC").replace(/[’‘`]/g, "'").replace(/\s+/g, " ").trim() + " ";
  const cerca = re => senzaAccenti(t).match(re);
  // toglie dal testo il pezzo trovato (stessa posizione: senzaAccenti non cambia le lunghezze)
  const togli = m => { if (m) t = t.slice(0, m.index) + " " + t.slice(m.index + m[0].length); };
  if (!t.trim()) return r;

  // soldi: "20 euro", "€ 20", "20€", "1.450,50 €"
  let m = cerca(/(?:€\s*(\d[\d.]*(?:,\d{1,2})?)|(\d[\d.]*(?:[.,]\d{1,2})?)\s*(?:€|euro\b))/i);
  if (m){ r.importo = +String(m[1] || m[2]).replace(/\.(?=\d{3}\b)/g, "").replace(",", "."); togli(m); }

  // ripetizioni: "ogni lunedì e giovedì", "ogni giorno", "ogni 3 giorni", "ogni mese il 5", "ogni settimana"
  m = cerca(/\bogni\s+((?:lunedi|martedi|mercoledi|giovedi|venerdi|sabato|domenica)(?:\s*(?:,|e)\s*(?:lunedi|martedi|mercoledi|giovedi|venerdi|sabato|domenica))*)\b/i);
  if (m){ r.ogni = "weekly"; r.giorni = m[1].toLowerCase().split(/\s*(?:,|\be\b)\s*/).map(g => GIORNI_IT[g.trim()]).filter(g => g !== undefined); togli(m); }
  if (!r.ogni && (m = cerca(/\bogni\s+giorno\b|\btutti i giorni\b/i))){ r.ogni = "everyNDays"; r.n = 1; togli(m); }
  if (!r.ogni && (m = cerca(/\bogni\s+(\d+|due|tre|quattro|cinque|sei|sette|dieci|quindici)\s+giorni\b/i))){ r.ogni = "everyNDays"; r.n = numIt(m[1].toLowerCase()) || 2; togli(m); }
  if (!r.ogni && (m = cerca(/\bogni\s+(\d+|due|tre|quattro|sei)?\s*mes[ei](?:\s+il\s+(\d{1,2}))?\b/i))){ r.ogni = "monthly"; r.n = m[1] ? numIt(m[1].toLowerCase()) || 1 : 1; r.giornoMese = m[2] ? +m[2] : null; togli(m); }
  if (!r.ogni && (m = cerca(/\bogni\s+settimana\b|\buna volta a settimana\b/i))){ r.ogni = "weekly"; togli(m); }

  // entro quando: "entro venerdì", "entro il 15 novembre", "entro fine mese", "entro la settimana"
  if ((m = cerca(/\bentro\s+(?:la\s+)?(fine\s+)?(settimana|mese|anno)\b/i))){ r.entro = { w:"w", s:"w", m:"m", a:"y" }[m[2][0].toLowerCase()] || "w"; if (m[2].toLowerCase() === "settimana") r.entro = "w"; togli(m); }
  else if ((m = cerca(/\bentro\b/i))){ r.entro = "d"; togli(m); }

  // ore: "dalle 15 alle 17", "alle 17:30", "alle 9 e mezza", "ore 17", "a mezzogiorno"
  const hm = (h, mm, dopo) => {
    let H = +h, M = mm ? +mm : 0;
    if (dopo){ const d = dopo.toLowerCase(); if (/mezza/.test(d)) M = 30; else if (/quarto/.test(d)) M = 15; else if (/\d+/.test(d)) M = +d.match(/\d+/)[0]; }
    return [H, M];
  };
  m = cerca(/\bdalle\s+(\d{1,2})(?:[:.](\d{2}))?(\s+e\s+(?:mezza|un quarto|\d{1,2}))?\s+alle\s+(\d{1,2})(?:[:.](\d{2}))?(\s+e\s+(?:mezza|un quarto|\d{1,2}))?\b/i);
  if (m){ const [a,b] = hm(m[1], m[2], m[3]), [c,d] = hm(m[4], m[5], m[6]); r.ora = a * 60 + b; r.fine = c * 60 + d; togli(m); }
  if (r.ora === null && (m = cerca(/\b(?:alle|ore|verso le|per le)\s+(\d{1,2})(?:[:.](\d{2}))?(\s+e\s+(?:mezza|un quarto|\d{1,2}))?\b/i))){ const [a,b] = hm(m[1], m[2], m[3]); r.ora = a * 60 + b; togli(m); }
  if (r.ora === null && (m = cerca(/\ba\s+mezzogiorno\b|\bmezzogiorno\b/i))){ r.ora = 12 * 60; togli(m); }
  // "17.30" da solo è un'ora; ma in "Marco mi deve 20.50" sono soldi: lo ricordo e decido dopo
  let oraNuda = null;
  if (r.ora === null && (m = cerca(/\b(\d{1,2})[:.](\d{2})\b/))){ r.ora = (+m[1]) * 60 + (+m[2]); oraNuda = m[1] + "." + m[2]; togli(m); }
  // momenti della giornata: correggono le ore piccole ("alle 5 di pomeriggio" = 17)
  let momento = null;
  if ((m = cerca(/\b(?:di|del|nel|in)?\s*(mattina|mattino|pomeriggio|sera|stasera|stamattina|stanotte)\b/i))){ momento = m[1].toLowerCase(); if (!/stasera|stamattina|stanotte/.test(momento)) togli(m); }
  if (r.ora !== null && r.ora < 12 * 60){
    const testoBasso = senzaAccenti(t.toLowerCase());
    // le cose di sera ("cena alle 8" = 20), quelle del mattino restano com'erano ("colazione alle 7")
    const diSera = /\b(cena|cene|aperitivo|apericena|serata|dopocena|cinema|teatro|concerto)\b/.test(testoBasso);
    const diMattina = /\b(colazione|sveglia|alba)\b/.test(testoBasso);
    if (/pomeriggio|sera/.test(momento || "")) r.ora += 12 * 60;
    else if (!momento && !diMattina && r.ora >= 60 && (r.ora < 8 * 60 || diSera)) r.ora += 12 * 60;
  }
  if (r.fine !== null && r.ora !== null && r.fine <= r.ora && r.fine < 12 * 60) r.fine += 12 * 60;
  if (r.ora !== null && (r.ora < 0 || r.ora >= 24 * 60)) r.ora = null;

  // fra poco: "fra due ore", "tra 20 minuti", "fra mezz'ora" → oggi, a quell'ora (arrotondata ai 5 minuti)
  if (r.ora === null && (m = cerca(/\b(?:fra|tra)\s+(mezz' ?ora|un' ?ora|un ora|(\d+|due|tre|quattro|cinque|sei)\s+ore|(\d+)\s*(?:min|minuti))(\s+e\s+mezz[ao])?\b/i))){
    const x = m[1].toLowerCase();
    let min = /^mezz/.test(x) ? 30 : /^un/.test(x) ? 60 : m[2] ? (numIt(m[2].toLowerCase()) || 1) * 60 : +m[3];
    if (m[4]) min += 30;
    const quando = Math.ceil((nowMin() + min) / 5) * 5;
    if (quando < 24 * 60){ r.ora = quando; r.data = T; togli(m); }
  }

  // quanto dura: "per un'ora", "mezz'ora", "2 ore e mezza", "45 minuti" (non "fra due ore")
  if ((m = cerca(/(?<!\b(?:fra|tra)\s)\b(?:per\s+|dura\s+|durata\s+)?(mezz' ?ora|mezzora|un' ?ora|un ora|(\d+|due|tre|quattro|cinque|sei)\s+ore|(\d+)\s*(?:min|minuti))(\s+e\s+mezz[ao])?\b/i))){
    const x = m[1].toLowerCase();
    let min = /^mezz/.test(x) ? 30 : /^un/.test(x) ? 60 : m[2] ? (numIt(m[2].toLowerCase()) || 1) * 60 : +m[3];
    if (m[4]) min += 30;
    if (min >= 5 && min <= 720){ r.durata = min; togli(m); }
  }

  // l'importanza detta in coda: "…, urgente", "…, con calma"
  if ((m = cerca(/,\s*(?:molto\s+)?(poco importante|non urgente|con calma|quando capita|se riesco|importante|urgente|urgentissim[oa]|prioritari[oa])\b/i))){
    r.imp = /poco|non urgente|calma|capita|riesco/i.test(m[1]) ? 3 : 1;
    togli(m);
  }

  // giorni: oggi, stasera, domani, dopodomani, lunedì…, il 15, 15 ottobre, 15/10, fra 3 giorni
  if ((m = cerca(/\b(oggi|stasera|stamattina|stanotte)\b/i))){ r.data = T; if (/stasera/i.test(m[1]) && r.ora === null) r.ora = 20 * 60; togli(m); }
  else if ((m = cerca(/\bdopodomani\b/i))){ r.data = addDays(T, 2); togli(m); }
  else if ((m = cerca(/\bdomani\b/i))){ r.data = addDays(T, 1); togli(m); }
  else if ((m = cerca(/\b(?:fra|tra)\s+(\d+|un|una|due|tre|quattro|cinque|sei|sette|dieci|quindici)\s+(giorni|giorno|settimane|settimana|mesi|mese)\b/i))){
    const q = numIt(m[1].toLowerCase()) || 1, u = m[2].toLowerCase();
    r.data = u.startsWith("giorn") ? addDays(T, q) : u.startsWith("settiman") ? addDays(T, 7 * q) : addMonths(T, q); togli(m);
  }
  else if ((m = cerca(/\bfine\s+mese\b/i))){ const d = fromIso(T); r.data = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); togli(m); }
  else if ((m = cerca(/\b(?:il\s+)?(\d{1,2})\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)(?:\s+(\d{4}))?\b/i))){
    const g = +m[1], me = MESI_IT[m[2].toLowerCase()];
    let y = m[3] ? +m[3] : +T.slice(0, 4);
    let d = `${y}-${String(me).padStart(2, "0")}-${String(g).padStart(2, "0")}`;
    if (!m[3] && d < T) d = `${y + 1}${d.slice(4)}`;
    r.data = d; togli(m);
  }
  else if ((m = cerca(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){
    let y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : +T.slice(0, 4);
    let d = `${y}-${String(+m[2]).padStart(2, "0")}-${String(+m[1]).padStart(2, "0")}`;
    if (!m[3] && d < T) d = `${y + 1}${d.slice(4)}`;
    r.data = d; togli(m);
  }
  else if ((m = cerca(/\b(lunedi|martedi|mercoledi|giovedi|venerdi|sabato|domenica)(\s+prossim[oa])?\b/i))){
    const g = GIORNI_IT[m[1].toLowerCase()];
    let d = addDays(T, 1);
    while (dow(d) !== g) d = addDays(d, 1);
    r.data = d; togli(m);
    if (!r.ogni && r.giorni.length === 0) r.giorni = [g];
  }
  else if ((m = cerca(/\b(?:il|l')\s*(\d{1,2})\b/i))){
    const g = +m[1];
    if (g >= 1 && g <= 31){
      r.data = prossimoGiornoMese(g, T); togli(m);
      if (r.ogni === "monthly" && !r.giornoMese) r.giornoMese = g;
    }
  }

  // il posto: "in via Roma 12", "a piazza Castello", "presso lo studio"
  if ((m = cerca(/\b(?:in|a|al|alla)\s+((?:via|viale|piazza|piazzale|corso|largo|vicolo|strada)\s+[^,;]+?)(?=\s+(?:alle|ore|il|dalle|domani|oggi|per|con)\b|[,;]|\s*$)/i))){ r.luogo = m[1].trim().replace(/^./, c => c.toUpperCase()); togli(m); }
  else if ((m = cerca(/\bpresso\s+([^,;]+?)(?=\s+(?:alle|ore|il|dalle|domani|oggi)\b|[,;]|\s*$)/i))){ r.luogo = m[1].trim(); togli(m); }

  // che cos'è
  let resto = t.replace(/\s+/g, " ").trim();
  const low = senzaAccenti(resto.toLowerCase());
  // un pezzo di "low" riportato sul testo originale (stessa lunghezza, ma con gli accenti e le maiuscole)
  const pezzo = s => { if (!s) return ""; const i = low.indexOf(s); return i < 0 ? s : resto.slice(i, i + s.length); };
  // un numero da solo, senza "euro": in "stipendio 1450 il 27" o "Marco mi deve 20" è l'importo
  const NUDO = /(?:^|\s)(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d{1,2}))?(?=\s|$)/;
  const soloNumero = s => /^\s*(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?\s*$/.test(s || "");
  let mm;
  if ((mm = low.match(/^(.+?)\s+mi\s+deve\s*(.*)$/))){
    r.tipo = "conti"; r.dir = "avere"; r.chi = pezzo(mm[1]).trim(); r.titolo = resto.slice(resto.length - mm[2].length).trim();
  } else if ((mm = low.match(/^devo\s+(?:(dare|ridare|restituire|rendere)\s+)?(?:(.*?)\s+)?(?:(?:a|ad|al|alla|allo|ai|agli|alle)\s+|all')([^\s]+(?:\s+[^\s]+)?)$/))
             && (mm[1] || r.importo || soloNumero(mm[2]) || /\bsoldi\b/.test(mm[2] || ""))){
    // "devo 20 euro a Marco", "devo restituire il libro a Luca"; non "devo andare a Milano"
    r.tipo = "conti"; r.dir = "dare"; r.chi = resto.slice(resto.length - mm[3].length).trim(); r.titolo = pezzo(mm[2]).trim();
  } else if ((mm = low.match(/^ho\s+prestato\s+(.*?)\s+a\s+(.+)$/))){
    r.tipo = "conti"; r.dir = "avere"; r.chi = resto.slice(resto.length - mm[2].length).trim(); r.titolo = pezzo(mm[1]);
  } else if ((mm = low.match(/^(.+?)\s+mi\s+ha\s+prestato\s*(.*)$/))){
    r.tipo = "conti"; r.dir = "dare"; r.chi = pezzo(mm[1]).trim(); r.titolo = pezzo(mm[2]);
  } else if ((mm = low.match(/^(.+?)\s+scad(?:e|ono|ra)\b\s*(.*)$/)) && !/^(il|la|lo)?\s*(bollo|assicurazione|affitto|abbonamento|fattura)/.test(low)){
    r.tipo = "frigo"; r.titolo = resto.slice(0, mm[1].length).trim();
  } else if (/\b(stipendio|pensione|tredicesima|quattordicesima|mi pagano|mi paga|mi arriva|mi arrivano|incasso|entrata|rimborso|fattura da incassare|bonifico in arrivo)\b/.test(low)
             && (r.importo || NUDO.test(low) || /stipendio|pensione|tredicesima|quattordicesima/.test(low))){
    r.tipo = "entrata"; r.titolo = resto.replace(/\b(mi pagano|mi paga|mi arriva|mi arrivano|incasso)\b/ig, "").trim();
    // stipendio e pensione tornano ogni mese, se non dici altrimenti
    if (!r.ogni && /stipendio|pensione/.test(low)) r.ogni = "monthly";
  } else if ((mm = low.match(/^(?:ricordami|ricorda(?:mi)?|promemoria|non dimenticare|devo ricordarmi)\s*:?\s*(?:di\s+|che\s+)?(.*)$/))){
    r.tipo = "prom"; r.titolo = resto.slice(resto.length - mm[1].length).trim();
  } else if (r.ogni){
    r.tipo = "att"; r.titolo = resto;
  } else if (r.entro){
    r.tipo = "ob"; r.titolo = resto;
  } else if ((mm = low.match(/^(?:spesa|lista della spesa|da comprare|(?:devo\s+)?compra(?:re)?|(?:devo\s+)?prendere|prendi)(?!\s+(?:un\s+|l')?appuntamento)\s*:?\s*(.*)$/))){
    r.tipo = "spesa"; r.voci = dividiVoci(resto.slice(resto.length - mm[1].length));
  } else if (!r.data && r.ora === null && !r.importo && /,|\se\s/.test(" " + low + " ") && dividiVoci(resto).every(v => v.split(" ").length <= 3) && dividiVoci(resto).length >= 2
             && !dividiVoci(senzaAccenti(resto)).some(v => /^[a-z]{3,}(are|ere|ire)\b/i.test(v))){    // "chiamare…, sistemare…" non è la spesa
    r.tipo = "spesa"; r.voci = dividiVoci(resto);
  } else if (r.ora !== null){
    r.tipo = "evento"; r.titolo = resto;
  } else if (r.data){
    r.tipo = "prom"; r.titolo = resto;
  } else {
    // niente data e niente ora: un impegno da fissare, te lo propongo io
    r.titolo = resto;
    if (resto) r.tipo = "fissare";
  }

  // soldi senza "euro": per entrate e dare/avere un numero da solo è l'importo
  if ((r.tipo === "entrata" || r.tipo === "conti") && !r.importo){
    if (oraNuda){ r.importo = +oraNuda; r.ora = null; r.fine = null; }   // "mi deve 20.50" non sono le 20:50
    else {
      const n = r.titolo.match(NUDO);
      // in dare e avere solo se c'è il numero e basta ("Marco mi deve 20"), non in "2 casse di vino"
      if (n && (r.tipo === "entrata" || soloNumero(r.titolo))){
        r.importo = +(n[1].replace(/\./g, "") + (n[2] ? "." + n[2] : ""));
        r.titolo = (r.titolo.slice(0, n.index) + " " + r.titolo.slice(n.index + n[0].length)).replace(/\s+/g, " ").trim();
      }
    }
  }
  // "ogni mese il 27" senza un giorno preciso: la prossima volta che è il 27
  if (r.giornoMese && !r.data) r.data = prossimoGiornoMese(r.giornoMese, T);

  // la nota: quello che viene dopo la prima virgola ("…, portare le lastre")
  if (r.tipo !== "spesa" && /,/.test(r.titolo)){
    const i = r.titolo.indexOf(",");
    r.nota = r.titolo.slice(i + 1).trim();
    r.titolo = r.titolo.slice(0, i).trim();
  }
  if (r.tipo === "fissare"){
    let mi;
    if ((mi = senzaAccenti(r.titolo).match(/\b(poco importante|non urgente|quando capita|se riesco|con calma)\b/i))) r.imp = 3;
    else if ((mi = senzaAccenti(r.titolo).match(/\b(importante|urgente|urgentissim[oa]|prioritari[oa])\b/i))) r.imp = 1;
    if (mi) r.titolo = (r.titolo.slice(0, mi.index) + " " + r.titolo.slice(mi.index + mi[0].length)).replace(/\s+/g, " ").replace(/\s*,\s*$/, "");
  }
  r.titolo = pulisciTitolo(r.titolo);
  if (r.tipo === "conti" && !r.titolo && !r.importo) r.titolo = "";
  if (r.tipo === "evento" && r.fine === null && r.ora !== null) r.fine = Math.min(23 * 60 + 59, r.ora + (r.durata || 60));
  return r;
}

// la prossima volta che è il giorno g del mese (il 31 nei mesi corti diventa l'ultimo giorno)
function prossimoGiornoMese(g, T){
  const d0 = fromIso(T);
  const nel = (y, mo) => iso(new Date(y, mo, Math.min(g, new Date(y, mo + 1, 0).getDate())));
  const d = nel(d0.getFullYear(), d0.getMonth());
  return d >= T ? d : nel(d0.getFullYear(), d0.getMonth() + 1);
}

function dividiVoci(s){
  return String(s || "").split(/\s*(?:,|;|\be\b)\s*/i).map(x => pulisciTitolo(x)).filter(Boolean);
}
function pulisciTitolo(s){
  let x = String(s || "").replace(/\s+/g, " ").trim();
  x = x.replace(/^(di|il|la|lo|che|da|a|e|per)\s+/i, "").replace(/\s+(il|la|lo|di|alle|a|e|per)$/i, "").replace(/[\s,.;:!-]+$/, "").trim();
  return x ? x.charAt(0).toUpperCase() + x.slice(1) : "";
}

const TIPI_FRASE = {
  evento:  { nome:"Evento",       quick:"evento" },
  prom:    { nome:"Promemoria",   quick:"prom" },
  att:     { nome:"Attività",     quick:"att" },
  spesa:   { nome:"Spesa",        quick:"spesa" },
  frigo:   { nome:"Frigo",        quick:"frigo" },
  conti:   { nome:"Dare e avere", quick:"conti" },
  entrata: { nome:"Entrata",      quick:"entrata" },
  ob:      { nome:"Obiettivo",    quick:"ob" },
  fissare: { nome:"Da fissare",   quick:"fissare" }
};

// come la salverei: righe da mostrare prima di salvare
function anteprimaFrase(r){
  const righe = [];
  const quando = r.data ? `${dayChip(r.data)}${r.ora !== null ? `, ${toHHMM(r.ora)}${r.fine !== null ? `–${toHHMM(r.fine)}` : ""}` : ""}` : (r.ora !== null ? `oggi, ${toHHMM(r.ora)}` : "");
  if (r.tipo === "spesa") righe.push(["Da comprare", r.voci.join(", ") || r.titolo]);
  else if (r.tipo === "conti"){
    righe.push(["Con chi", r.chi || "—"]);
    righe.push([r.dir === "avere" ? "Ti deve" : "Gli devi", r.importo ? euro(r.importo) : (r.titolo || "—")]);
    if (r.data) righe.push(["Entro", dayChip(r.data)]);
  } else {
    righe.push(["Cosa", r.titolo || "—"]);
    if (r.tipo === "evento") righe.push(["Quando", r.ora === null ? `${dayChip(r.data || today())}, tutto il giorno` : quando]);
    if (r.tipo === "prom") righe.push(["Quando", r.data ? dayChip(r.data) : "oggi"]);
    if (r.tipo === "frigo") righe.push(["Scade", r.data ? dayChip(r.data) : "fra 3 giorni"]);
    if (r.tipo === "entrata"){ righe.push(["Quanto", r.importo ? euro(r.importo) : "—"]); righe.push(["Prevista", r.data ? dayChip(r.data) : "oggi"]); if (r.ogni === "monthly") righe.push(["Ogni", "mese"]); }
    if (r.tipo === "ob") righe.push(["Entro", r.entro === "d" ? (r.data ? dayChip(r.data) : "—") : GPER[r.entro]]);
    if (r.tipo === "fissare"){
      righe.push(["Quanto dura", minutiLabel(r.durata || 60)]);
      if (r.imp) righe.push(["Importanza", r.imp === 1 ? "alta" : "bassa"]);
      const entro = fxEntroDa(r);
      if (entro) righe.push(["Entro", dayChip(entro)]);
      const p = fxProposte({ durata: r.durata || 60, entro }, 1)[0];
      righe.push(["Ti propongo", p ? `${dayChip(p.d)} alle ${toHHMM(p.s)}` : "scegli tu: non trovo un buco"]);
    }
    if (r.tipo === "att"){
      righe.push(["Quando", r.ogni === "weekly" ? (r.giorni.length ? `ogni ${giorniLabel(r.giorni)}` : "ogni settimana") : r.ogni === "everyNDays" ? (r.n === 1 ? "ogni giorno" : `ogni ${r.n} giorni`) : `ogni ${r.n === 1 ? "mese" : r.n + " mesi"}${r.giornoMese ? `, il ${r.giornoMese}` : ""}`]);
      if (r.ora !== null) righe.push(["Fascia", `${toHHMM(r.ora)}–${toHHMM(Math.min(1439, r.ora + 60))}`]);
    }
    if (r.luogo) righe.push(["Dove", r.luogo]);
    if (r.nota) righe.push(["Nota", r.nota]);
  }
  return righe;
}

// salva senza aprire niente, con i valori che ho capito
function salvaFrase(r){
  const T = today(), id = Date.now();
  const titolo = r.titolo || "Senza nome";
  if (r.tipo === "evento"){
    const allDay = r.ora === null;
    S.oneoffs.push({ id:"o" + id, label: titolo, date: r.data || T, endDate: r.data || T,
      start: allDay ? "09:00" : toHHMM(r.ora), end: allDay ? "10:00" : toHHMM(r.fine !== null ? r.fine : Math.min(1439, r.ora + 60)),
      allDay, busy: !allDay, place: r.luogo, note: r.nota, showInMonth: true });
  } else if (r.tipo === "prom"){
    S.reminders.push({ id:"p" + id, text: titolo, body: r.nota || "", when: { type:"date", days:[dow(r.data || T)], date: r.data || T } });
  } else if (r.tipo === "spesa"){
    for (const v of (r.voci.length ? r.voci : [titolo])) addShopItem(v, "");
  } else if (r.tipo === "frigo"){
    S.fridge.push({ id:"fr" + id, name: titolo, exp: r.data || addDays(T, 3), qty:"", note: r.nota || "" });
  } else if (r.tipo === "conti"){
    S.ledger.push({ id:"l" + id, who: r.chi || "Qualcuno", kind: r.importo ? "soldi" : "cosa", dir: r.dir,
      amount: r.importo || "", what: r.importo ? "" : titolo, date: T, due: r.data || "", note: r.nota || "", moves:[], closed:null, snooze:null });
  } else if (r.tipo === "entrata"){
    S.income = S.income || [];
    S.income.push({ id:"in" + id, name: titolo, amount: r.importo || 0, from:"", cat: /stipendio/i.test(titolo) ? "Stipendio" : "Lavoro",
      every: r.ogni === "monthly" ? "m" : "once", next: r.data || T, note: r.nota || "", log:[], closed:null });
  } else if (r.tipo === "fissare"){
    S.dafissare = S.dafissare || [];
    S.dafissare.push({ id:"fx" + id, titolo, durata: r.durata || 60, imp: r.imp || 2, entro: fxEntroDa(r),
      luogo: r.luogo || "", nota: r.nota || "", creato: T, stato:"aperto" });
  } else if (r.tipo === "ob"){
    S.goals.push({ id:"g" + id, name: titolo, per: r.entro === "d" ? "d" : (r.entro || "w"), due: r.entro === "d" ? (r.data || addDays(T, 7)) : "", done:{} });
  } else if (r.tipo === "att"){
    const rec = r.ogni === "weekly" ? { type:"weekly", n:1, start: T }
              : r.ogni === "everyNDays" ? { type:"everyNDays", n: r.n || 1, start: r.data || T }
              : { type:"monthly", n: r.n || 1, day: r.giornoMese || +(r.data || T).slice(8), start: T };
    const days = r.ogni === "weekly" ? (r.giorni.length ? r.giorni : [dow(r.data || T)]) : [0,1,2,3,4,5,6];
    const ws = r.ora !== null ? toHHMM(r.ora) : "21:00";
    S.activities.push({ id:"a" + id, name: titolo, cat:"Varie", imp:2, dur:30, rec, days,
      win:{ start: ws, end: toHHMM(Math.min(1439, toMin(ws) + 60)) }, from: T, moves:{}, skips:{}, handled:{}, lastDone:null, doneCount:0, skipCount:0 });
    runEngine();
  }
  save();
}

// apre il modulo giusto, già compilato con quello che ho capito
function apriFraseNelModulo(r){
  const T = today();
  QUICKPRE = r.titolo || "";
  if (r.tipo === "evento"){
    BOZZA = { tipo:"evento", campi: { date: r.data || T, endDate: r.data || T, start: r.ora !== null ? toHHMM(r.ora) : "17:00",
      end: r.ora !== null ? toHHMM(r.fine !== null ? r.fine : Math.min(1439, r.ora + 60)) : "18:00", allDay: r.ora === null, place: r.luogo, note: r.nota } };
    openOneoff(null);
  } else if (r.tipo === "prom"){
    BOZZA = { tipo:"prom", campi: { body: r.nota || "", when: { type:"date", days:[dow(r.data || T)], date: r.data || T } } };
    openReminderEdit(null);
  } else if (r.tipo === "att"){ salvaFrase(r); openForm(S.activities[S.activities.length - 1].id); }
  else if (r.tipo === "conti"){
    QUICKPRE = r.chi || "";
    BOZZA = { tipo:"conti", campi: { kind: r.importo ? "soldi" : "cosa", dir: r.dir, amount: r.importo || "", what: r.importo ? "" : (r.titolo || ""), due: r.data || "", note: r.nota || "" } };
    openLedgerItem(null);
  } else if (r.tipo === "entrata"){
    BOZZA = { tipo:"entrata", campi: { amount: r.importo || "", next: r.data || T, every: r.ogni === "monthly" ? "m" : "once", note: r.nota || "" } };
    openIncome(null);
  } else if (r.tipo === "ob"){
    BOZZA = { tipo:"ob", campi: { per: r.entro || "w", due: r.data || addDays(T, 7) } };
    openGoal(null);
  } else if (r.tipo === "frigo"){
    BOZZA = { tipo:"frigo", campi: { exp: r.data || addDays(T, 3), note: r.nota || "" } };
    openFridgeItem(null);
  } else if (r.tipo === "fissare"){
    BOZZA = { tipo:"fissare", campi: { durata: r.durata || 60, imp: r.imp || 2, entro: fxEntroDa(r), luogo: r.luogo || "", nota: r.nota || "" } };
    openFx(null);
  } else { salvaFrase(r); render(); }
}

/* ---------- la dettatura ----------
   Nell'app Android usa il riconoscimento vocale del telefono: serve l'app 2.2,
   perché la finestra web dentro l'app da sola non sa dettare. Nel browser usa
   quello di Chrome. Ogni intoppo si dice a parole: niente tasti che non fanno nulla. */
let DETTA_CB = null;
const dettaNativa = () => inApp() && (parseFloat(natVersione()) >= 2.2 || typeof NAT.detta === "function");
// dentro l'app il microfono c'è sempre: se l'app è vecchia, toccandolo spiego cosa serve
const puoDettare = () => inApp() || !!(window.SpeechRecognition || window.webkitSpeechRecognition);

// dove si scarica l'app Android: il deposito del sito
function linkApk(){
  const h = location.hostname, rep = location.pathname.split("/").filter(Boolean)[0];
  if (/\.github\.io$/.test(h) && rep) return `https://github.com/${h.split(".")[0]}/${rep}/releases/download/apk/Coach.apk`;
  return "https://github.com/torassolorenzo03/coach/releases/download/apk/Coach.apk";

const NOVITA_APP = [

const DETTA_ERRORI = {
  "no-speech": "Non ho sentito niente: riprova, o scrivi.",
  "not-allowed": "Il microfono non ha il permesso: dallo nelle impostazioni del sito (il lucchetto accanto all'indirizzo).",
  "service-not-allowed": "Qui la dettatura non è permessa: usa il microfono della tastiera.",
  "audio-capture": "Il microfono non risponde: controlla che non lo stia usando un'altra app.",
  "network": "Per dettare serve la connessione."
};

// cb riceve il testo; stato(true/false) accende e spegne il "ti ascolto" sul tasto
function detta(cb, stato){
  const segna = on => { try { stato && stato(on); } catch(e){} };
  if (inApp()){
    if (!dettaNativa()){ serveAppNuova("Per dettare"); return; }
    DETTA_CB = cb;
    try { NAT.detta(); } catch(e){ DETTA_CB = null; alert("La dettatura non parte: " + e); }
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast("Qui la dettatura non c'è: usa il microfono della tastiera."); return; }
  const rec = new SR();
  rec.lang = "it-IT"; rec.interimResults = false; rec.maxAlternatives = 1;
  let detto = false, errore = false, partito = false;
  // certe finestre web dicono di saper dettare ma poi tacciono: se non parte, lo dico
  const guardia = setTimeout(() => {
    if (partito || detto || errore) return;
    errore = true;
    try { rec.abort(); } catch(e){}
    segna(false);
    toast("La dettatura non risponde: usa il microfono della tastiera.");
  }, 12000);
  rec.onstart = () => { partito = true; };
  rec.onresult = e => { const t = e.results[0] && e.results[0][0] ? e.results[0][0].transcript : ""; if (t){ detto = true; cb(t); } };
  rec.onerror = e => {
    errore = true;
    if (e.error !== "aborted") toast(DETTA_ERRORI[e.error] || "La dettatura non è riuscita: usa il microfono della tastiera.");
  };
  rec.onend = () => { clearTimeout(guardia); segna(false); if (!detto && !errore) toast(DETTA_ERRORI["no-speech"]); };
  try { rec.start(); segna(true); }
  catch(e){ clearTimeout(guardia); segna(false); toast("La dettatura non parte: usa il microfono della tastiera."); }
}

/* ============================================================
   IL WIDGET — quello che si vede sulla schermata Home del telefono
   La pagina gli passa la giornata di oggi e di domani; il widget poi
   da solo capisce cosa c'è adesso e cosa viene dopo, anche ad app chiusa.
   ============================================================ */
function widgetDati(){
  const T = today(), dom = addDays(T, 1);
  const p = progress();
  const voci = [];
  // l'istante di "d alle min minuti": con setHours anche il giorno del cambio d'ora torna giusto
  const istante = (d, min) => { const x = fromIso(d); x.setHours(0, min, 0, 0); return x.getTime(); };
  for (const d of [T, dom]){
    for (const v of vociDelGiorno(d)){
      if (v.k === "routine") continue;
      if ((v.k === "att" || v.k === "gctodo") && vocePronta(v, d)) continue;
      voci.push({ t: v.label, s: istante(d, v.s), e: istante(d, v.e), k: v.k });
    }
  }
  return {
    giorno: T,
    titolo: `${GG[dow(T)]} ${prettyDate(T)}`,
    pct: isPaused() ? -1 : p.pct,
    daFare: Math.max(0, p.total - p.done),
    decidere: missedList().length,
    voci,
    aggiornato: Date.now()
  };
}

function aggiornaWidget(){
  if (!inApp() || !(parseFloat(natVersione()) >= 2.2 || typeof NAT.aggiornaWidget === "function")) return;
  try { NAT.aggiornaWidget(JSON.stringify(widgetDati())); } catch(e){}
}

/* ============================================================
   GLI AVVISI — quando il telefono ti avvisa
   Per ogni cosa con una data scegli quanti giorni prima, anche più di una
   volta, e a che ora. Per quello che ha un orario (eventi e impegni) anche
   quanti minuti prima che cominci, quante volte vuoi, e una sveglia vera.
   Se non scegli niente valgono quelli delle impostazioni.
   ============================================================ */
const AV_GIORNI = [[0,"Il giorno stesso"],[1,"1 giorno prima"],[2,"2 giorni prima"],[3,"3 giorni prima"],
                   [7,"1 settimana prima"],[14,"2 settimane prima"],[30,"1 mese prima"]];
const AV_PRIMA  = [[5,"5 min"],[10,"10 min"],[15,"15 min"],[30,"30 min"],[60,"1 ora"],[120,"2 ore"],[1440,"1 giorno"]];
const AV_SVEGLIA = [[null,"No"],[0,"All'inizio"],[10,"10 min prima"],[30,"30 min prima"],[60,"1 ora prima"],[120,"2 ore prima"]];

// i minuti prima dell'inizio sono una lista (le versioni vecchie ne avevano uno solo)
const primeDi = p => [...new Set((Array.isArray(p) ? p : [p]).map(Number).filter(n => n > 0))].sort((a,b) => b - a);
const svegliaDi = v => (v === null || v === undefined || v === false || v === "") ? null : Math.max(0, Math.round(+v) || 0);

function avvisoOf(obj, campo, tipo){
  const base = { ...AVVISI_DEF[tipo], ...((S.avvisiDef && S.avvisiDef[tipo]) || {}) };
  const x = obj && obj[campo];
  const src = x || base;
  return { giorni: (src.giorni || []).slice(), ora: src.ora || base.ora || "09:00", prima: primeDi(src.prima), sveglia: svegliaDi(src.sveglia) };
}

// due avvisi uguali? Su una voce salvo solo quelli diversi da quelli di partenza:
// così, se cambi i valori di partenza nelle impostazioni, cambiano anche lì.
function avvisoUguale(a, b, conPrima){
  const g = x => x.giorni.slice().sort((p,q) => p - q).join();
  if (a.ora !== b.ora || g(a) !== g(b)) return false;
  return !conPrima || (a.prima.join() === b.prima.join() && a.sveglia === b.sveglia);
}
function avvisoDaSalvare(av, tipo, conPrima){
  return avvisoUguale(av, avvisoOf(null, "", tipo), conPrima) ? undefined : av;
}

const giorniPrimaLabel = g => g === 0 ? "il giorno stesso" : g === 1 ? "il giorno prima" : g === 7 ? "una settimana prima"
  : g === 14 ? "due settimane prima" : g === 30 ? "un mese prima" : `${g} giorni prima`;

// 90 → "1 ora e 30 min", 1440 → "1 giorno"
function minutiLabel(m){
  if (m >= 1440 && m % 1440 === 0) return m === 1440 ? "1 giorno" : `${m / 1440} giorni`;
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return `${r} min`;
  const hh = h === 1 ? "1 ora" : `${h} ore`;
  return r ? `${hh} e ${r} min` : hh;
}
// per il testo delle notifiche: "fra un'ora", "fra mezz'ora", "fra 10 minuti"
function fraMinuti(m){
  if (m === 60) return "fra un'ora";
  if (m === 30) return "fra mezz'ora";
  if (m < 60) return `fra ${m} minuti`;
  if (m === 1440) return "domani a quest'ora";
  return "fra " + minutiLabel(m).replace(/ min$/, " minuti");
}

function avvisoLabel(av, conPrima){
  const parti = [];
  const g = av.giorni.slice().sort((a,b) => b - a).map(giorniPrimaLabel);
  if (g.length) parti.push(`${g.join(", ")}, alle ${av.ora}`);
  if (conPrima && av.prima.length) parti.push(`${elenco(av.prima.map(minutiLabel))} prima dell'inizio`);
  if (conPrima && av.sveglia !== null) parti.push(av.sveglia ? `sveglia ${minutiLabel(av.sveglia)} prima` : "sveglia all'inizio");
  return parti.join(" · ") || "nessun avviso";
}

const fraLabel = g => g === 0 ? "oggi" : g === 1 ? "domani" : g === 7 ? "fra una settimana" : g === 30 ? "fra un mese" : `fra ${g} giorni`;

// la sveglia vera la fa suonare l'app Android dalla 2.3; prima arriva come notifica
const svegliaNativa = () => inApp() && typeof NAT.programmaSveglia === "function";

// Il pezzo di modulo per scegliere gli avvisi. Si usa così:
//   const p = avvisoPicker("id", avviso, { prima:true }); ... p.html ... p.bind(foglio); p.value()
// Con prima:true (le cose con un orario) ci sono anche i minuti prima dell'inizio e la sveglia.
function avvisoPicker(uid, av, opts){
  opts = opts || {};
  const st = { giorni: (av.giorni || []).slice(), ora: av.ora || "09:00", prima: primeDi(av.prima), sveglia: svegliaDi(av.sveglia) };
  const etich = t => `<div style="font-size:13.5px;color:var(--ink-soft);margin:12px 0 7px">${t}</div>`;
  const html = `
    <div id="${uid}">
      ${opts.prima ? `${etich("Prima che cominci").replace("margin:12px", "margin:0")}
      <div class="chips" data-avp></div>
      <div class="segline" style="margin-top:9px">
        <input type="number" data-avpn min="1" max="10080" placeholder="Altro: quanti minuti prima" style="flex:1">
        <button class="btn" data-avpadd style="flex:0 0 auto">Aggiungi</button>
      </div>
      ${etich("Sveglia: suona come quella del mattino, finché non la fermi")}
      <div class="chips" data-avs></div>
      ${etich("E nei giorni prima")}` : ""}
      <div class="chips" data-avg></div>
      <div class="segline" style="margin-top:9px">
        <input type="number" data-avn min="1" max="365" placeholder="Altro: quanti giorni prima" style="flex:1">
        <button class="btn" data-avadd style="flex:0 0 auto">Aggiungi</button>
      </div>
      <div class="segline" style="margin-top:2px">
        <span style="flex:1;font-size:13.5px;color:var(--ink-soft)">A che ora</span>
        <input type="time" data-avora value="${st.ora}" style="flex:0 0 120px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">
      </div>
      <div class="hint" data-avh></div>
    </div>`;
  let root = null;
  function paint(){
    if (!root) return;
    const box = root.querySelector("[data-avg]");
    const extra = st.giorni.filter(g => !AV_GIORNI.some(([v]) => v === g));
    box.innerHTML = AV_GIORNI.map(([v,l]) => `<button class="chip${st.giorni.includes(v) ? " on" : ""}" data-g="${v}">${l}</button>`).join("")
      + extra.map(g => `<button class="chip on" data-g="${g}">${g} giorni prima &times;</button>`).join("");
    box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      const g = +b.dataset.g;
      st.giorni = st.giorni.includes(g) ? st.giorni.filter(x => x !== g) : [...st.giorni, g];
      paint();
    });
    const pb = root.querySelector("[data-avp]");
    if (pb){
      const altri = st.prima.filter(m => !AV_PRIMA.some(([v]) => v === m));
      pb.innerHTML = AV_PRIMA.map(([v,l]) => `<button class="chip${st.prima.includes(v) ? " on" : ""}" data-p="${v}">${l}</button>`).join("")
        + altri.map(m => `<button class="chip on" data-p="${m}">${minutiLabel(m)} &times;</button>`).join("");
      pb.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
        const m = +b.dataset.p;
        st.prima = st.prima.includes(m) ? st.prima.filter(x => x !== m) : primeDi([...st.prima, m]);
        paint();
      });
      const sb = root.querySelector("[data-avs]");
      sb.innerHTML = AV_SVEGLIA.map(([v,l]) => `<button class="chip${st.sveglia === v ? " on" : ""}" data-sv="${v === null ? "" : v}">${l}</button>`).join("")
        + (st.sveglia !== null && !AV_SVEGLIA.some(([v]) => v === st.sveglia) ? `<button class="chip on" data-sv="${st.sveglia}">${minutiLabel(st.sveglia)} prima</button>` : "");
      sb.querySelectorAll("[data-sv]").forEach(b => b.onclick = () => { st.sveglia = svegliaDi(b.dataset.sv); paint(); });
    }
    let h = "Ti avviso: " + avvisoLabel(st, !!opts.prima) + ".";
    if (opts.prima && st.sveglia !== null && !svegliaNativa())
      h += inApp() ? " La sveglia suona con l'app Android 2.3: con questa arriva come notifica." : " La sveglia suona solo nell'app Android.";
    root.querySelector("[data-avh]").textContent = h;
  }
  return {
    html,
    bind(w){
      root = w.querySelector("#" + uid);
      root.querySelector("[data-avora]").onchange = e => { st.ora = e.target.value || "09:00"; paint(); };
      root.querySelector("[data-avadd]").onclick = () => {
        const inp = root.querySelector("[data-avn]");
        const g = Math.round(+inp.value);
        if (g > 0 && !st.giorni.includes(g)) st.giorni.push(g);
        inp.value = ""; paint();
      };
      const pa = root.querySelector("[data-avpadd]");
      if (pa) pa.onclick = () => {
        const inp = root.querySelector("[data-avpn]");
        const m = Math.round(+inp.value);
        if (m > 0) st.prima = primeDi([...st.prima, m]);
        inp.value = ""; paint();
      };
      paint();
    },
    value(){
      return { giorni: [...new Set(st.giorni)].sort((a,b) => b - a), ora: st.ora,
               prima: opts.prima ? primeDi(st.prima) : [], sveglia: opts.prima ? st.sveglia : null };
    }
  };
}

// l'istante di "giorno d, minuto min" (anche negativo: il giorno prima). Con setHours il cambio d'ora torna giusto.
const istanteMin = (d, min) => { const x = fromIso(d); x.setHours(0, min, 0, 0); return x.getTime(); };

// Programma le notifiche di una cosa con una data. testo(giorniPrima, minutiPrima, sveglia)
function schedAvviso(metti, idBase, data, av, titolo, testo, forte, inizioMin){
  for (const g of av.giorni){
    metti(`${idBase}-g${g}`, alle(addDays(data, -g), av.ora), titolo, testo(g, 0, false), forte);
  }
  if (inizioMin === undefined || inizioMin === null) return;
  for (const m of primeDi(av.prima))
    metti(`${idBase}-p${m}`, istanteMin(data, inizioMin - m), titolo, testo(0, m, false), forte);
  const sv = svegliaDi(av.sveglia);
  if (sv !== null)
    metti(`${idBase}-sv`, istanteMin(data, inizioMin - sv), titolo, testo(0, sv, true), true, true);
}

// il testo degli avvisi di un evento: "Comincia fra mezz'ora · Via Roma", "Domani, alle 15:00"
const testoEvento = (quando, luogo, nota) => (g, m, sveglia) => {
  const dove = luogo ? " · " + luogo : "";
  if (sveglia) return (m ? `Comincia ${fraMinuti(m)}` : "Comincia adesso") + dove + ".";
  if (m) return `Comincia ${fraMinuti(m)}${dove}.`;
  return `${g === 0 ? "Oggi" : cap(fraLabel(g))}${quando ? ", " + quando : ""}${dove}${nota ? " · " + nota : ""}.`;
};

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

   IL TELEFONO — notifiche, sveglie e timer, quando l'app gira
   dentro l'involucro Android. Nel browser questo pezzo dorme.

const NAT = (typeof window !== "undefined" && window.CoachNativo) ? window.CoachNativo : null;
const inApp = () => { try { return !!(NAT && NAT.disponibile()); } catch(e){ return false; } };

const alle = (d, hhmm) => {
  const [h,m] = (hhmm || "08:00").split(":").map(Number);
  const x = fromIso(d); x.setHours(h, m, 0, 0);
  return x.getTime();
};

/* Tutto quello che merita una notifica nel prossimo mese. Si riprogramma
   ogni volta che l'app si apre o salva qualcosa. */
function avvisiDaProgrammare(){
  const T = today(), ora = Date.now(), out = [];
  const limite = ora + 31 * 86400000;
  const metti = (id, quando, titolo, testo, forte, sveglia) => {
    if (quando > ora + 60000 && quando < limite) out.push({ id, quando, titolo, testo, forte: !!forte, sveglia: !!sveglia });
  };

  for (let i = 0; i < 14; i++){
    const d = addDays(T, i);
    const acts = planFor(d);

    // il riassunto del mattino: la giornata in breve, la stessa che trovi in Oggi
    if (S.push.on){
      let frasi = [];
      try { frasi = breveFrasi(d); } catch(e){}
      if (frasi.length) metti("giorno-" + d, alle(d, S.push.ora), "La giornata in breve", frasi.join(" "));
    }

    // le cose da fissare: una volta al giorno te le chiedo
    if (S.push.fissare !== false && i < 2){
      const fx = fxDaChiedere(d);
      if (fx.length) metti("fx-" + d, alle(d, S.push.fissareOra || "09:00"), "Da fissare",
        `Riesci a trovare un posto per ${elenco(fx.map(x => `«${x.titolo}»`))}? Ti propongo io ${fx.length === 1 ? "un orario" : "gli orari"}: apri Oggi.`);
    }

    // la revisione della settimana
    if (S.push.revisione !== false && revisioneGiorno(d) && !revFatta(d))
      metti("rev-" + d, alle(d, revConf().ora), "La revisione della settimana", "Cinque minuti: com'è andata, come ti sei sentito, cosa arriva.");

    // le attività, all'inizio della loro fascia
    if (S.push.attivita && i < 7) for (const a of acts){
      if (isDone(d, a.id)) continue;
      metti(`act-${a.id}-${d}`, alle(d, a.win.start), a.name, `Adesso, fino alle ${a.win.end} · ${durLabel(a.dur)}.`, a.imp === 1);
    }

    // la chiusura serale
    if (S.push.sera && !S.closes[d])
      metti("chiusura-" + d, alle(d, S.closeAt || "21:00"), "Chiudi la giornata", "Due minuti per dire com'è andata.");

    // la spesa
    if (shopDay(d) && shopLeft())
      metti("spesa-" + d, alle(d, "17:30"), "Spesa", `${shopLeft()} ${shopLeft() === 1 ? "cosa" : "cose"} in lista.`);

    // la valigia, la sera prima
    for (const t of S.trips){
      const restano = t.items.filter(x => !tripDone(t.id, x.id)).length;
      if (daysBetween(d, t.date) === 1 && restano) metti("vg-" + t.id, alle(d, "20:00"), "Valigia · " + t.name,
        `${restano} ${restano === 1 ? "cosa" : "cose"} da mettere: si parte domani.`, true);
    }

    // frigo: quello che scade quel giorno
    const scad = S.fridge.filter(f => f.exp === d).map(f => f.name);
    if (scad.length) metti("frigo-" + d, alle(d, "10:00"), "Frigo",
      `${scad.slice(0,3).join(", ")} ${scad.length === 1 ? "scade" : "scadono"} oggi.`);
  }

  // eventi scritti qui
  for (const o of S.oneoffs){
    if ((o.endDate || o.date) < T) continue;
    const av = avvisoOf(o, "avviso", "evento");
    schedAvviso(metti, "ev-" + o.id, o.date, o.allDay ? { ...av, prima: [], sveglia: null, giorni: av.giorni.length ? av.giorni : [0] } : av, o.label,
      testoEvento(o.allDay ? "tutto il giorno" : `alle ${o.start}`, o.place, ""), true, o.allDay ? null : toMin(o.start));
  }

  // impegni fissi scritti qui: due settimane di avvisi
  for (let i = 0; i < 15; i++){
    const d = addDays(T, i);
    for (const f of S.fixed){
      if (!f.days.includes(dow(d))) continue;
      schedAvviso(metti, `fx-${f.id}-${d}`, d, avvisoOf(f, "avviso", "fisso"), f.label,
        testoEvento(`alle ${f.start}`, "", ""), false, toMin(f.start));
    }
  }

  // eventi e impegni di Google: gli avvisi di partenza, o quelli che hai scelto tu
  if (S.gcalOn) for (const g of GCAL.list){
    if (g.date < T) continue;
    if (g.recurring && g.date > addDays(T, 14)) continue;        // per quelli che si ripetono bastano due settimane
    const ex = gcxOf(g.key);
    const av = avvisoOf(ex, "avviso", g.recurring ? "fisso" : "evento");
    schedAvviso(metti, `gc-${g.key}-${g.date}`, g.date, g.allDay ? { ...av, prima: [], sveglia: null } : av, g.label,
      testoEvento(g.allDay ? "" : `alle ${g.start}`, g.place, ex.note), ex.imp === 1, g.allDay ? null : g.s);
  }

  // uscite in arrivo
  for (const b of billsOpen()){
    if (!b.next || b.next < T) continue;
    schedAvviso(metti, "bill-" + b.id, b.next, avvisoOf(b, "avviso", "uscita"), b.name,
      g => `${euro(+b.amount || 0)} ${fraLabel(g)}${b.method ? " · " + b.method : ""}.`, false);
  }

  // investimenti: cedole, dividendi, interessi e scadenze
  for (const x of investOpen()){
    if (x.nextPay && x.nextPay >= T)
      schedAvviso(metti, "inv-" + x.id, x.nextPay, avvisoOf(x, "avvisoPay", "pagamento"), x.name,
        g => `${IPAY[x.payType] || "Pagamento"} ${fraLabel(g)}.`, true);
    if (x.maturity && x.maturity >= T)
      schedAvviso(metti, "invm-" + x.id, x.maturity, avvisoOf(x, "avvisoMat", "scadenzaInv"), x.name,
        g => `Scade ${fraLabel(g)}.`, true);
  }

  // obiettivi non ancora fatti
  for (const g of S.goals){
    if (goalDone(g)) continue;
    const fine = goalDue(g);
    if (!fine || fine < T) continue;
    schedAvviso(metti, `goal-${g.id}-${fine}`, fine, avvisoOf(g, "avviso", "obiettivo"), g.name,
      n => n === 0 ? "Ultimo giorno utile." : `Scade ${fraLabel(n)}.`, false);
  }

  // entrate previste: il giorno previsto ti chiedo se sono arrivate
  for (const x of incomeOpen()){
    if (x.next < T) continue;
    schedAvviso(metti, "inc-" + x.id + "-" + x.next, x.next, avvisoOf(x, "avviso", "entrata"), x.name,
      n => n === 0 ? `Dovrebbe arrivare oggi: ${euro(+x.amount || 0)}. È arrivata?` : `${euro(+x.amount || 0)} in arrivo ${fraLabel(n)}.`, false);
  }

  // dare e avere con una scadenza
  for (const e of ledgerOpen()){
    if (!e.due || e.due < T) continue;
    const cosa = e.kind === "soldi" ? euro(ledgerLeft(e)) : e.what;
    const verso = e.dir === "avere" ? `${e.who} ti deve ${cosa}` : `Devi ${cosa} a ${e.who}`;
    schedAvviso(metti, "led-" + e.id, e.due, avvisoOf(e, "avviso", "conti"), "Dare e avere",
      n => `${verso}: scade ${fraLabel(n)}.`, false);
  }

  return out.sort((a,b) => a.quando - b.quando).slice(0, 300);
}

  PUSHTIMER = setTimeout(() => {

      NAT.annullaTutte();

      for (const a of avvisiDaProgrammare()){
        if (a.sveglia && svegliaNativa()) NAT.programmaSveglia(a.id, a.titolo, a.testo, a.quando);
        else NAT.programma(a.id, a.titolo, a.testo, a.quando, a.forte);

  }, 1500);
}

function esportaBackup(){
  const dati = JSON.stringify(S);
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Backup</h3>
    <div class="hint" style="margin-bottom:14px">Due strade: salvi il file, oppure copi il testo e lo incolli dove ti serve.</div>
    <div class="btnrow" style="margin-top:0">
      <button class="btn primary" id="bk-file" style="flex:1">Scarica il file</button>
      <button class="btn" id="bk-copia" style="flex:1">Copia il testo</button>
    </div>
    <div class="field" style="margin-top:16px"><label>Il tuo backup</label>
      <textarea id="bk-t" rows="8" readonly
        style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
               font-size:11px;font-family:ui-monospace,monospace;resize:vertical">${esc(dati)}</textarea>
      <div class="hint" id="bk-stato">${(dati.length/1024).toFixed(0)} kB · tutto quello che c'è dentro l'app.</div></div>
    <div class="btnrow"><button class="btn ghost wide" id="bk-chiudi">Chiudi</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  const stato = w.querySelector("#bk-stato");
  w.querySelector("#bk-chiudi").onclick = () => w.remove();
  w.querySelector("#bk-file").onclick = () => {
    // nell'app Android il file va nella cartella Download del telefono
    if (inApp() && typeof NAT.salvaFile === "function"){
      const r = NAT.salvaFile(b64(dati), "application/json", `coach-${today()}.json`);
      stato.textContent = r === "ok" ? `Salvato in Download come coach-${today()}.json.` : "Non ci sono riuscito: " + r + ". Usa il copia.";
      return;
    }
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([dati], { type:"application/json" }));
      a.download = `coach-${today()}.json`;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      stato.textContent = "Se non è comparso niente, qui dentro i download sono bloccati: usa il copia.";
    } catch(e){ stato.textContent = "Download non riuscito: usa il copia."; }
  };
  w.querySelector("#bk-copia").onclick = async () => {
    const t = w.querySelector("#bk-t");
    try {
      await navigator.clipboard.writeText(dati);
      stato.textContent = "Copiato.";
    } catch(e){
      t.removeAttribute("readonly"); t.focus(); t.select();
      try { document.execCommand("copy"); stato.textContent = "Copiato."; }
      catch(e2){ stato.textContent = "Tieni premuto sul testo e copia a mano."; }
      t.setAttribute("readonly", "readonly");
    }
  };
}

function rimettiBackup(testo){
  try {
    const dati = JSON.parse(testo);
    if (!dati || typeof dati !== "object" || !dati.v) throw new Error("non è un backup");
    if (!confirm("Rimetto dentro questo backup al posto di quello che c'è adesso?")) return false;
    const sync = S.sync;
    S = dati; migrate();
    if (sync && sync.token && !(S.sync && S.sync.token)) S.sync = sync;   // il token resta di questo dispositivo
    applyTheme(); runEngine(); save(); render();
    alert("Fatto: i tuoi dati sono dentro.");
    return true;
  } catch(e){ alert("Questo non è un backup del Coach."); return false; }
}

function importaBackup(){
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Rimetti dentro un backup</h3>
    <div class="hint" style="margin-bottom:14px">Scegli il file che avevi salvato, oppure incolla il testo che avevi copiato.</div>
    <div class="btnrow" style="margin-top:0"><button class="btn primary wide" id="im-file">Scegli il file</button></div>
    <div class="field" style="margin-top:16px"><label>Oppure incolla qui</label>
      <textarea id="im-t" rows="6" placeholder='{"v":1,...'
        style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
               font-size:11px;font-family:ui-monospace,monospace;resize:vertical"></textarea></div>
    <div class="btnrow">
      <button class="btn primary" id="im-ok" style="flex:2">Rimetti dentro</button>
      <button class="btn ghost" id="im-chiudi">Annulla</button>
    </div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#im-chiudi").onclick = () => w.remove();
  w.querySelector("#im-ok").onclick = () => {
    const t = w.querySelector("#im-t").value.trim();
    if (!t){ alert("Incolla il backup, oppure scegli il file."); return; }
    if (rimettiBackup(t)) w.remove();
  };
  w.querySelector("#im-file").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { if (rimettiBackup(r.result)) w.remove(); };
      r.readAsText(f);
    };
    inp.click();
  };
}

/* ============================================================
   SINCRONIZZAZIONE — i dati vivono in un file dentro un tuo
   deposito GitHub privato: così due telefoni vedono le stesse cose
   e ogni salvataggio lascia una copia nello storico.
   ============================================================ */
const SYNCFILE = "stato.json";
let SYNCSTATO = "fermo";
let SYNCTIMER = null;

const syncPronto = () => !!(S.sync && S.sync.repo && S.sync.token);

function b64(testo){
  const byte = new TextEncoder().encode(testo);
  let s = "";
  byte.forEach(b => s += String.fromCharCode(b));
  return btoa(s);
}
function unb64(dati){
  const bin = atob(dati.replace(/\n/g, ""));
  const byte = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(byte);
}

async function ghChiama(metodo, corpo){
  const url = `https://api.github.com/repos/${S.sync.repo}/contents/${SYNCFILE}`;
  const r = await fetch(url, {
    method: metodo,
    headers: {
      "Authorization": "Bearer " + S.sync.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  return r;
}

async function syncScarica(){
  const r = await ghChiama("GET");
  if (r.status === 404) return { vuoto:true };
  if (!r.ok) throw new Error("GitHub ha risposto " + r.status);
  const j = await r.json();
  S.sync.sha = j.sha;
  return { dati: JSON.parse(unb64(j.content)), sha: j.sha };
}

async function syncCarica(messaggio){
  const corpo = {
    message: messaggio || ("coach " + new Date().toISOString()),
    content: b64(JSON.stringify(S))
  };
  if (S.sync.sha) corpo.sha = S.sync.sha;
  let r = await ghChiama("PUT", corpo);
  if (r.status === 409 || r.status === 422){          // qualcuno ha scritto prima di noi
    const giu = await syncScarica();
    if (!giu.vuoto && (giu.dati.updatedAt || 0) > (S.updatedAt || 0)){
      S = giu.dati; migrate(); applyTheme(); runEngine(); render();
      return "preso";
    }
    corpo.sha = S.sync.sha;
    r = await ghChiama("PUT", corpo);
  }
  if (!r.ok) throw new Error("GitHub ha risposto " + r.status);
  const j = await r.json();
  S.sync.sha = j.content && j.content.sha;
  return "mandato";
}

async function sincronizza(forzaInvio){
  if (!syncPronto() || SYNCSTATO === "in corso") return;
  SYNCSTATO = "in corso";
  if (TAB === "opzioni") render();
  try {
    const giu = await syncScarica();
    if (!giu.vuoto && !forzaInvio && (giu.dati.updatedAt || 0) > (S.updatedAt || 0) + 500){
      const sha = S.sync.sha, sync = { ...S.sync };
      S = giu.dati; migrate();
      S.sync = sync; S.sync.sha = sha;
      applyTheme(); runEngine();
      S.sync.last = Date.now();
      salvaSolo();
      SYNCSTATO = "preso";
      render();
      return;
    }
    await syncCarica();
    S.sync.last = Date.now();
    salvaSolo();
    SYNCSTATO = "a posto";
  } catch(e){
    SYNCSTATO = "errore: " + (e && e.message ? e.message : e);
  }
  if (TAB === "opzioni") render();
}

// salva senza far ripartire il giro della sincronizzazione
function salvaSolo(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
}

function syncDopoIlSalvataggio(){
  if (!syncPronto() || !S.sync.auto) return;
  clearTimeout(SYNCTIMER);
  SYNCTIMER = setTimeout(() => sincronizza(true), 4000);
}

/* ============================================================
   6. BOOT
   ============================================================ */
window.addEventListener("error", e => {
  let bar = document.getElementById("errbar");
  if (!bar){
    bar = document.createElement("div");
    bar.id = "errbar";
    bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#8C2F1A;color:#fff;"
      + "font-size:12px;padding:9px 12px;line-height:1.35";
    document.body.appendChild(bar);
  }
  bar.textContent = "Errore: " + (e.message || e) + " — mandalo a Claude.";
});

document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => { PROGSUB = null; OPTSUB = null; TAB = b.dataset.tab; render(); });
document.getElementById("fab").onclick = () => openQuick();

// l'ora in testata si aggiorna da sola, senza ridisegnare niente
setInterval(() => {
  const o = document.getElementById("tb-ora");
  if (o) o.textContent = toHHMM(nowMin());
}, 20000);

// se segui il telefono e lui passa a scuro, cambia con lui
try {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onMq = () => { if (S && S.mode === "auto"){ applyTheme(); if (TAB === "opzioni") render(); } };
  mq.addEventListener ? mq.addEventListener("change", onMq) : mq.addListener(onMq);
} catch(e){}

// il guardiano offline: c'è solo quando l'app vive su un sito vero
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

(async () => {
  await loadState();
  gcalRead();
  runEngine();
  render();
  // con l'app nuova, la prima volta il permesso del calendario lo chiedo io
  if (S.gcalOn && GCAL.status === "permesso" && !S.gcalAsked){
    S.gcalAsked = true; salvaSolo();
    setTimeout(gcalAsk, 800);
  }
  riprogrammaAvvisi();
  if (syncPronto()) sincronizza().then(() => docPrefetch());
  if (window.__azione){ const a = window.__azione; window.__azione = null; window.dalTelefono("azione", a); }
  // il calendario si rilegge ogni dieci minuti mentre l'app è aperta
  setInterval(() => {
    if (document.hidden || !S.gcalOn || !gcalSupported()) return;
    gcalRead(); runEngine();
    if (!document.querySelector(".sheet") && TAB !== "opzioni") render();
  }, 10 * 60 * 1000);
})();

// tornando dentro dopo un po': ricontrolla se un altro dispositivo ha scritto
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (syncPronto() && S.sync.auto && (!S.sync.last || Date.now() - S.sync.last > 60000)) sincronizza();
});

// re-run the engine when the app comes back into view after midnight
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (RUN && !RUN.paused){ RUN.mark = Date.now() - 0; keepAwake(true); drawRun(); }
  if (S && S.lastRun !== today()){ runEngine(); render(); }
  // riaperta al mattino: la giornata in breve, se non l'hai ancora vista
  else if (S && TAB === "oggi" && breveDaAprire()) render();
});
</script>
