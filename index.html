<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6F63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E8E3;
  --surface:#F4F5F2;
  --surface-2:#DDE0DA;
  --ink:#18211E;
  --ink-soft:#5C6862;
  --ink-faint:#7A847E;
  --line:#C8CEC7;
  --accent:#1F6F63;
  --accent-ink:#FFFFFF;
  --warn:#A6522B;
  --done:#4E7A4A;
  --busy:#B9C0B8;
  --radius:14px;
  --pad:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A18; --surface:#1D2523; --surface-2:#273331;
    --ink:#E8EAE6; --ink-soft:#9AA49F; --ink-faint:#6E7A75;
    --line:#2F3A37; --accent:#3FA090; --accent-ink:#0B1211;
    --warn:#D08A5C; --done:#7FB073; --busy:#333F3C;
  }
}
:root[data-theme="dark"]{
  --bg:#141A18; --surface:#1D2523; --surface-2:#273331;
  --ink:#E8EAE6; --ink-soft:#9AA49F; --ink-faint:#6E7A75;
  --line:#2F3A37; --accent:#3FA090; --accent-ink:#0B1211;
  --warn:#D08A5C; --done:#7FB073; --busy:#333F3C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad)}

/* ---- header ---- */
header{padding:26px 0 14px;display:flex;align-items:flex-start;gap:14px}
.h-left{flex:1;min-width:0}
.dayname{font-size:13px;color:var(--ink-soft);letter-spacing:.02em}
.datebig{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.greet{font-size:14px;color:var(--ink-soft);margin-top:6px}
.ring{flex:0 0 66px;width:66px;height:66px;position:relative}
.ring svg{display:block}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;letter-spacing:-.02em}

/* ---- testata: data e ora, notifiche, chiudi giornata, torta ---- */
.topbar{display:flex;gap:9px;align-items:stretch;padding:22px 0 10px}
.tb-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.tb-side{flex:0 0 66px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:9px 4px;
  font-size:10px;font-weight:600;color:var(--ink-soft);letter-spacing:-.01em}
.tb-side svg{display:block}
.tb-side.done{border-color:var(--done);color:var(--done)}
.ora{font-variant-numeric:tabular-nums}
.tb-note{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);margin-top:7px}
.badge{flex:0 0 auto;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;
  padding:1px 7px;font-weight:600;font-variant-numeric:tabular-nums}
.notif{margin:2px 0 4px}
.notif .row{padding:11px 14px}
.notif .rtitle{font-size:14px;font-weight:400}
.nkind{font-size:11px;color:var(--ink-faint);text-transform:lowercase}

/* ---- il blocco promemoria che scorre ---- */
.rem-foot{display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid var(--line)}
.rem-foot .btn{padding:8px 12px;font-size:13px}
.rem-foot .dots{flex:1;margin:0}

/* ---- mattonelle del programma ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);
  padding:14px 13px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile svg{color:var(--accent)}
.tname{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tnote{font-size:12.5px;color:var(--ink-soft);line-height:1.35}
.tile.hot{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.hotdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}

/* ---- il tasto del crono, sempre lì ---- */
.cronobtn{flex:0 0 84px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:12px 6px;font-size:11.5px;font-weight:600;letter-spacing:-.01em}
.dobtn{width:100%;border:1px solid var(--accent);background:transparent;color:var(--accent);
  border-radius:var(--radius);padding:16px;font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:2px}

/* ---- sections ---- */
h2{font-size:13px;font-weight:600;color:var(--ink-soft);margin:26px 0 10px;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}

/* ---- spine ---- */
.spine{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 14px 10px}
.spine-col{flex:0 0 62px;position:relative}
.spine-track{position:relative;width:100%;height:100%;min-height:260px}
.spine-rail{position:absolute;left:44px;top:0;bottom:0;width:8px;background:var(--surface-2);border-radius:4px}
.blk{position:absolute;left:44px;width:8px;background:var(--busy);border-radius:4px}
.hourlab{position:absolute;left:0;width:36px;text-align:right;font-size:11px;color:var(--ink-faint);transform:translateY(-6px)}
.nowline{position:absolute;left:36px;right:-100%;height:2px;background:var(--accent);opacity:.85}
.nowdot{position:absolute;left:44px;width:8px;height:8px;border-radius:50%;background:var(--accent);transform:translate(0,-3px)}
.slots{flex:1;position:relative;min-height:260px}
.slot{position:absolute;left:0;right:0;border-radius:9px;padding:6px 9px;font-size:12.5px;line-height:1.25;overflow:hidden;
  background:var(--accent);color:var(--accent-ink)}
.slot.free{background:transparent;border:1px dashed var(--line);color:var(--ink-faint)}
.slot small{display:block;opacity:.85;font-size:11px}

/* ---- task rows ---- */
.row{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tick{flex:0 0 24px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-faint);
  background:transparent;display:flex;align-items:center;justify-content:center;padding:0;margin-top:1px;transition:background .15s,border-color .15s}
.tick svg{opacity:0;transition:opacity .15s}
.row.done .tick{background:var(--done);border-color:var(--done)}
.row.done .tick svg{opacity:1}
.row.done .rtitle{text-decoration:line-through;color:var(--ink-faint)}
.rbody{flex:1;min-width:0}
.rtitle{font-size:15.5px;font-weight:500;letter-spacing:-.01em}
.rmeta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.rmeta .dot{opacity:.45;padding:0 5px}
.flag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;margin-top:6px;
  background:var(--surface-2);color:var(--ink-soft)}
.flag.moved{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.imp{flex:0 0 3px;align-self:stretch;border-radius:2px;background:var(--line)}
.imp.i1{background:var(--warn)}
.imp.i2{background:var(--accent)}
.imp.i3{background:var(--line)}

.empty{padding:22px 16px;color:var(--ink-soft);font-size:14px}

/* ---- anteprima dei temi ---- */
.swatch{flex:0 0 46px;width:46px;height:34px;border-radius:8px;border:1px solid;
  display:flex;align-items:center;justify-content:center;gap:3px;padding:0 5px}
.swatch span{flex:1;height:16px;border-radius:3px}

/* ---- quello che il coach ha capito ---- */
.advice{padding:11px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);
  line-height:1.45;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.advice b{color:var(--ink);font-weight:600}
.advice button{display:block;margin-top:8px;border:1px solid var(--accent);background:transparent;
  color:var(--accent);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:500}

/* ---- notices ---- */
.notice{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:10px;background:var(--surface);font-size:13.5px;color:var(--ink-soft);margin-bottom:8px}
.notice b{color:var(--ink);font-weight:600}

/* ---- buttons ---- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:11px 15px;font-size:14.5px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.btnrow{display:flex;gap:9px;margin-top:14px}

/* ---- il tasto + ---- */
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:45;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  border:0;padding:0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 22%,transparent)}
.fab:active{transform:scale(.94)}

/* ---- nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:40}
.navin{max-width:560px;margin:0 auto;display:flex}
.navbtn{flex:1;min-width:0;background:none;border:0;padding:7px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-faint);font-size:10px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.navbtn svg{width:18px;height:18px}
.navbtn.on{color:var(--accent)}
.navbtn svg{display:block}

/* ---- form ---- */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field input[type=time],.field select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13.5px;min-width:46px;text-align:center}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.two{display:flex;gap:10px}
.two>*{flex:1}
.hint{font-size:12.5px;color:var(--ink-faint);margin-top:6px;line-height:1.4}

.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);
  z-index:50;overflow-y:auto;padding:0 0 40px}
.sheetin{max-width:560px;margin:0 auto;padding:22px var(--pad) 0}
.sheet h3{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px}

.actrow{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.actrow:last-child{border-bottom:0}
.stat{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border-bottom:0}
.stat span:last-child{color:var(--ink-soft)}

/* ---- pager giornata / mese ---- */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin-top:9px}
.dot2{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dot2.on{background:var(--accent)}
.swipehint{font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:6px}
.monthday{padding:11px 14px;border-bottom:1px solid var(--line)}
.monthday:last-child{border-bottom:0}
.monthday b{font-size:13px;font-weight:600}
.mev{display:flex;gap:9px;font-size:13.5px;color:var(--ink-soft);margin-top:4px}
.mev span:first-child{flex:0 0 88px;font-variant-numeric:tabular-nums}

/* ---- chiusura serale ---- */
.closecard{border:1px solid var(--accent);border-radius:var(--radius);background:var(--surface);
  padding:15px;display:flex;gap:12px;align-items:center;margin-top:4px}
.closecard .rbody{flex:1}
.why{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.why button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:7px 12px;font-size:13px}
.why button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.why button.vuoto{border-style:dashed;color:var(--ink-soft)}
.why button.vuoto.on{background:var(--done);border-color:var(--done);border-style:solid;color:#fff}

/* ---- crono ---- */
.runner{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:26px;text-align:center}
.runner.rest{background:var(--surface-2)}
.r-name{font-size:13px;color:var(--ink-soft)}
.r-seg{font-size:19px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.r-time{font-size:74px;font-weight:300;letter-spacing:-.045em;line-height:1;margin:14px 0 4px;
  font-variant-numeric:tabular-nums}
.r-next{font-size:13.5px;color:var(--ink-soft);min-height:20px}
.r-bar{width:min(320px,86%);height:5px;border-radius:3px;background:var(--surface-2);margin:22px 0 4px;overflow:hidden}
:root[data-theme] .r-bar,.runner.rest .r-bar{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.r-fill{height:100%;background:var(--accent);border-radius:3px;width:0}
.r-steps{display:flex;gap:5px;width:min(320px,86%);margin-top:12px}
.r-step{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.r-step.on{background:var(--accent)}
.r-step.past{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.r-ctrl{display:flex;gap:11px;margin-top:30px}
.r-ctrl .btn{min-width:96px}
.segline{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.segline select{flex:1.2}
.segline input{flex:1}
.segline button{border:1px solid var(--line);background:var(--surface);border-radius:9px;
  width:42px;height:42px;flex:0 0 42px;color:var(--warn);font-size:19px;line-height:1;padding:0}
.totline{font-size:13px;color:var(--ink-soft);margin-top:4px}
</style>
</head>
<body>

<div id="app"></div>

<button class="fab" id="fab" aria-label="Aggiungi">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav>
  <div class="navin">
    <button class="navbtn" data-tab="oggi">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      Oggi</button>
    <button class="navbtn" data-tab="base">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      Base</button>
    <button class="navbtn" data-tab="salute">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 3 10 2-5h7"/></svg>
      Salute</button>
    <button class="navbtn" data-tab="opzioni">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-1-1.4 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.4-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg>
      Impostazioni</button>
  </div>
</nav>

<script>
/* ============================================================
   1. DATE / TIME HELPERS
   ============================================================ */
const GG = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const GG3 = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const MM = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((fromIso(b)-fromIso(a))/86400000);
const dow = s => fromIso(s).getDay();
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const toHHMM = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const today = () => iso(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60+d.getMinutes(); };
const prettyDate = s => { const d = fromIso(s); return `${d.getDate()} ${MM[d.getMonth()]}`; };
const durLabel = m => m >= 60 ? (m%60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m/60}h`) : `${m} min`;

/* ============================================================
   2. STATE
   ============================================================ */
const DEFAULT_STATE = {
  v: 1,
  updatedAt: 0,
  fixed: [

  const t = THEMES[(S && S.skin) || "salvia"];
  if (t.soloScuro) return true;
  const m = (S && S.mode) || "auto";
  if (m === "light") return false;
  if (m === "dark") return true;
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches; } catch(e){ return false; }
}

function applyTheme(){
  const t = THEMES[(S && S.skin) || "salvia"] || THEMES.salvia;
  const scuro = scuroOra();
  const set = scuro ? t.dark : t.light;
  const r = document.documentElement;
  for (const k in set) r.style.setProperty("--" + k, set[k]);
  r.dataset.theme = scuro ? "dark" : "light";
}

/* ============================================================
   3. THE ENGINE
   Finds, for each activity, the first day that is:
     - in its allowed weekdays
     - has enough free room inside its time window
   and moves it forward when a day is missed, within its limit.
   ============================================================ */

// Everything that occupies the day: recurring commitments, one-off ones,
// and — when switched on — the events read from Google Calendar.
function busyLabeled(dateStr){
  const d = dow(dateStr);
  const out = S.fixed.filter(f => f.days.includes(d))
                     .map(f => ({ s: toMin(f.start), e: toMin(f.end), label: f.label, src: "fisso" }));
  for (const o of S.oneoffs){
    if (o.busy === false || o.allDay) continue;          // gli eventi di un giorno intero non bloccano
    const fine = o.endDate || o.date;
    if (dateStr < o.date || dateStr > fine) continue;
    const a = dateStr === o.date ? toMin(o.start) : 0;   // nei giorni di mezzo occupa tutto
    const b = dateStr === fine ? toMin(o.end) : 1439;
    if (b > a) out.push({ s:a, e:b, label:o.label, src:"singolo" });
  }
  if (S.gcalOn) for (const g of (GCAL.byDay[dateStr] || []))
    out.push({ s: g.s, e: g.e, label: g.label, src: "gcal" });
  return out.sort((a,b) => a.s - b.s);
}

// Same thing as merged numeric intervals — what the engine reasons on.
function busyOn(dateStr){
  const raw = busyLabeled(dateStr).map(x => [x.s, x.e]).sort((a,b)=>a[0]-b[0]);
  const out = [];
  for (const [s,e] of raw){
    const last = out[out.length-1];
    if (last && s <= last[1]) last[1] = Math.max(last[1], e);
    else out.push([s,e]);
  }
  return out;
}

// Largest free run (minutes) inside [winStart, winEnd] on that date.
function freeRoom(dateStr, win){
  const a = toMin(win.start), b = toMin(win.end);
  let cuts = busyOn(dateStr).map(([s,e]) => [Math.max(s,a), Math.min(e,b)]).filter(([s,e]) => e > s);
  let best = 0, cursor = a;
  for (const [s,e] of cuts){ best = Math.max(best, s - cursor); cursor = Math.max(cursor, e); }
  return Math.max(best, b - cursor);
}

function dayWorks(dateStr, act){
  if (!act.days.includes(dow(dateStr))) return false;
  return freeRoom(dateStr, act.win) >= act.dur;
}

/* ---------- ricorrenze legate al calendario ----------
   Alcune cose non capitano "ogni tot giorni" ma in date precise: il cambio
   gomme a marzo e a ottobre, un compleanno, la rata del 15 del mese.
   Quelle non cercano un giorno libero: la data è la data. */
const DATE_REC = ["dates", "yearly", "monthly"];
const isDateRec = act => DATE_REC.includes(act.rec && act.rec.type);
const mdOf = d => d.slice(5);

function nextDateOccurrence(act, from){
  const t = act.rec.type;
  if (t === "dates"){
    const list = (act.rec.dates || []).slice().sort();
    if (!list.length) return null;
    const y = +from.slice(0,4);
    for (const anno of [y, y+1])
      for (const md of list){
        const d = `${anno}-${md}`;
        if (d >= from) return d;
      }
    return null;
  }
  if (t === "yearly"){
    if (!act.rec.md) return null;
    const y = +from.slice(0,4);
    for (const anno of [y, y+1]){
      const d = `${anno}-${act.rec.md}`;
      if (d >= from) return d;
    }
    return null;
  }
  if (t === "monthly"){
    const giorno = Math.min(31, Math.max(1, +act.rec.day || 1));
    let d = fromIso(from);
    for (let i = 0; i < 40; i++){
      const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      const cand = iso(new Date(d.getFullYear(), d.getMonth(), Math.min(giorno, ultimo)));
      if (cand >= from) return cand;
      d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    }
    return null;
  }
  return null;
}

// First usable day at or after `from`, searching at most `limit` days.
function nextGoodDay(act, from, limit){
  if (isDateRec(act)) return nextDateOccurrence(act, from);
  for (let i = 0; i <= limit; i++){
    const d = addDays(from, i);
    if (dayWorks(d, act)) return d;
  }
  return null;
}

// Where the next cycle should start, after the activity was done (or written off) on `base`.
function cycleStart(act, base){
  const t = act.rec.type, n = Math.max(1, act.rec.n || 1);
  if (t === "once")      return null;
  if (t === "everyNDays")return addDays(base, n);
  if (t === "weekly")    return addDays(base, 7 * n);
  if (t === "timesWeek") return addDays(base, Math.max(1, Math.round(7 / n)));
  if (t === "dates")     return addDays(base, 1);        // la prossima data della lista
  if (t === "yearly")    return addDays(base, 1);        // ci ripensa l'anno prossimo
  if (t === "monthly")   return addMonths(base, n);
  return addDays(base, 7);
}

function isDone(dateStr, id){ return !!(S.log[dateStr] && S.log[dateStr][id]); }

/* ---------- QUANDO SEI VIA ----------
   Con la pausa accesa il coach non programma, non segna saltate e non chiede
   la chiusura serale. Quei giorni restano fuori dalle medie: non sono giornate
   andate male, sono giornate che non contano. */
function isPaused(){
  if (!S.pause) return false;
  const T = today();
  if (T < S.pause.from) return false;
  if (S.pause.to && T > S.pause.to) return false;
  return true;
}

function pauseDays(){
  if (!S.pause) return 0;
  return Math.max(1, daysBetween(S.pause.from, today()) + 1);
}

function startPause(from, to, label){
  S.pause = { from, to: to || null, label: label || "" };
  S.resume = null;
  runEngine(); save(); render();
}

// Chiude la pausa e mette da parte tutto quello che è rimasto indietro.
function endPause(){
  const p = S.pause;
  if (!p) return;
  const T = today();
  let fine = p.to && p.to < T ? p.to : addDays(T, -1);
  for (let d = p.from, i = 0; d <= fine && i < 400; d = addDays(d, 1), i++) S.pausedDays[d] = true;

  const acts = S.activities
    .filter(a => a.scheduledFor && a.scheduledFor < T && !isDone(a.scheduledFor, a.id))
    .map(a => ({ id:a.id, name:a.name, from:a.scheduledFor, giorni: daysBetween(a.scheduledFor, T) }));

  const rems = S.reminders
    .filter(r => r.when && r.when.type === "date" && r.when.date >= p.from && r.when.date < T && !readToday(r.when.date, r.id))
    .map(r => ({ id:r.id, text:r.text, date:r.when.date }));

  const goals = [];
  for (const g of S.goals){
    const k = pKey(g.per, p.from);
    if (k !== pKey(g.per, T) && !(g.done && g.done[k])) goals.push({ id:g.id, name:g.name, per:g.per });
  }

  const fridge = S.fridge
    .filter(f => f.exp >= p.from && f.exp < T)
    .map(f => ({ id:f.id, name:f.name, exp:f.exp }));

  S.pause = null;
  S.resume = (acts.length || rems.length || goals.length || fridge.length)
    ? { from: p.from, to: fine, label: p.label || "", acts, rems, goals, fridge }
    : null;
  runEngine(); save(); render();
}

// Cosa fare di un'attività rimasta ferma: subito, al prossimo giro, oppure niente.
function resumeAct(id, mode){
  const T = today();
  const a = S.activities.find(x => x.id === id);
  if (a){
    if (mode === "subito"){
      a.scheduledFor = nextGoodDay(a, T, 60);
    } else if (mode === "ciclo"){
      const st = cycleStart(a, a.scheduledFor || T);
      a.scheduledFor = st ? nextGoodDay(a, st > T ? st : T, 60) : null;
    } else {
      const st = cycleStart(a, T);
      a.scheduledFor = st ? nextGoodDay(a, st, 60) : null;
    }
    a.moved = null;
  }
  if (S.resume){
    S.resume.acts = S.resume.acts.filter(x => x.id !== id);
    if (!S.resume.acts.length && !S.resume.rems.length && !S.resume.goals.length && !S.resume.fridge.length) S.resume = null;
  }
  runEngine(); save(); render();
}

function runEngine(){
  const T = today();
  // la pausa con una data di fine si chiude da sola quando quel giorno è passato
  if (S.pause && S.pause.to && T > S.pause.to){ endPause(); return; }
  if (isPaused()){
    S.pausedDays[T] = true;
    S.notices = [];
    S.lastRun = T;
    save();
    return;
  }
  const notices = [];
  // le attività dentro il riepilogo del rientro aspettano te, non il motore
  const hold = new Set(S.resume ? S.resume.acts.map(a => a.id) : []);

  for (const act of S.activities){
    if (hold.has(act.id)) continue;
    // never scheduled yet → place it
    if (!act.scheduledFor){
      act.scheduledFor = nextGoodDay(act, T, 60);
      act.moved = null;
      continue;
    }
    // already done for the day it was scheduled on → move to next cycle
    if (isDone(act.scheduledFor, act.id) ){
      const base = act.scheduledFor;
      const nextStart = cycleStart(act, base);
      if (!nextStart){ act.scheduledFor = null; act.moved = null; continue; }
      if (daysBetween(T, nextStart) <= 0 && base < T){
        act.scheduledFor = nextGoodDay(act, nextStart > T ? nextStart : T, 60);
      } else {
        act.scheduledFor = nextGoodDay(act, nextStart, 60);
      }
      act.moved = null;
      continue;
    }
    // still pending, day has passed → try to move it forward
    if (act.scheduledFor < T){
      const origin = act.moved ? act.moved.from : act.scheduledFor;
      const limit  = act.maxDays - daysBetween(origin, T);
      const target = nextGoodDay(act, T, Math.max(0, limit));
      if (target){
        if (target !== act.scheduledFor){
          act.moved = { from: origin, to: target };
          notices.push({ kind:"moved", id:act.id,
            text:`«${act.name}» non l'hai fatta ${GG[dow(act.scheduledFor)].toLowerCase()}. Spostata a ${GG[dow(target)].toLowerCase()} ${prettyDate(target)}.` });
          act.scheduledFor = target;
        }
      } else {
        act.skipCount = (act.skipCount||0) + 1;
        notices.push({ kind:"skipped", id:act.id,
          text:`«${act.name}» è saltata: nessun giorno utile entro ${act.maxDays} giorni. Riparte dal prossimo ciclo.` });
        const nextStart = cycleStart(act, T);
        act.scheduledFor = nextStart ? nextGoodDay(act, nextStart, 60) : null;
        act.moved = null;
      }
    }
  }

  S.notices = notices;
  S.lastRun = T;
  S.dayPlan[T] = S.activities.filter(a => a.scheduledFor === T).map(a => a.id);
  const cutoff = addDays(T, -60);
  for (const k in S.dayPlan) if (k < cutoff) delete S.dayPlan[k];
  save();
}

/* ============================================================
   4. VIEW MODEL
   ============================================================ */
const todaysActs = () => S.activities.filter(a => a.scheduledFor === today());

function pendingActs(){
  const T = today();
  return S.activities
    .filter(a => a.scheduledFor && a.scheduledFor > T)
    .sort((a,b) => a.scheduledFor.localeCompare(b.scheduledFor) || a.imp - b.imp);
}

// Una fascia può scavalcare la mezzanotte (22:00–01:00). In quel caso
// "dentro la fascia" vuol dire: dopo l'inizio, oppure prima della fine.
const fasciaWrap = r => toMin(r.end) <= toMin(r.start);
function inFascia(r, n){
  const s = toMin(r.start), e = toMin(r.end);
  return fasciaWrap(r) ? (n >= s || n <= e) : (n >= s && n <= e);
}
// A che giornata appartengono le spunte di una fascia: se stiamo vivendo la
// coda dopo mezzanotte di una fascia che scavalca, valgono per ieri.
function fasciaDay(r){
  const T = today();
  if (r && fasciaWrap(r) && nowMin() <= toMin(r.end)) return addDays(T, -1);
  return T;
}
function currentFascia(){
  const n = nowMin();
  return S.routines.find(r => inFascia(r, n)) || null;
}
function nextFascia(){
  const n = nowMin();
  const dopo = S.routines.filter(r => toMin(r.start) > n).sort((a,b)=>toMin(a.start)-toMin(b.start));
  if (dopo.length) return dopo[0];
  return S.routines.slice().sort((a,b)=>toMin(a.start)-toMin(b.start))[0] || null;
}
const rDone = (d,id) => !!(S.rlog[d] && S.rlog[d][id]);
const allRoutineItems = () => S.routines.flatMap(r => r.items.map(i => ({...i, fascia:r})));

const W_ACT = { 1: 6, 2: 4, 3: 2 };   // alta / media / bassa
const W_ROUT = 1;                     // una voce di routine
const W_REM = 2;                      // un promemoria letto
const W_TRIP = 1;                     // una voce della valigia

const readToday = (d,id) => !!(S.remlog[d] && S.remlog[d][id]);

// Un promemoria può valere ogni giorno, solo in certi giorni della settimana,
// oppure una data sola. Fuori da lì non compare e non pesa sulla percentuale.
function remActive(r, d){
  const wn = r.when || { type:"always" };
  if (wn.type === "date") return wn.date === d;
  if (wn.type === "days") return (wn.days || []).includes(dow(d));
  return true;
}
const remindersOn = d => S.reminders.filter(r => remActive(r, d));
function remWhenLabel(r){
  const wn = r.when || { type:"always" };
  if (wn.type === "date"){
    if (!wn.date) return "senza data";
    const d = wn.date, T = today();
    if (d === T) return "solo oggi";
    if (d < T) return `scaduto il ${prettyDate(d)}`;
    return `solo ${GG3[dow(d)]} ${prettyDate(d)}`;
  }
  if (wn.type === "days"){
    const g = (wn.days || []).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));
    if (!g.length) return "nessun giorno scelto";
    if (g.length === 7) return "ogni giorno";
    return g.map(x => GG3[x]).join(" ");
  }
  return "ogni giorno";
}

function planFor(d){
  if (S.dayPlan[d]) return S.dayPlan[d].map(id => S.activities.find(a => a.id === id)).filter(Boolean);
  if (d === today()) return todaysActs();
  return [];
}

// `picks` è facoltativo: serve alla chiusura serale per mostrare subito
// l'effetto di "non c'era nulla da fare", che vale come completata.
function progressOn(d, picks){
  const vuoto = id => picks && picks[id] === R_VUOTO;
  const acts = planFor(d);
  const items = allRoutineItems();
  let tot = 0, got = 0;
  for (const a of acts){ const w = W_ACT[a.imp] || 3; tot += w; if (isDone(d, a.id) || vuoto(a.id)) got += w; }
  for (const i of items){ tot += W_ROUT; if (rDone(d, i.id)) got += W_ROUT; }
  const rem = remindersOn(d);
  for (const r of rem){ tot += W_REM; if (readToday(d, r.id)) got += W_REM; }
  const pack = tripItemsOn(d);
  for (const t of pack){ tot += W_TRIP; if (tripDone(t.tripId, t.id)) got += W_TRIP; }
  if (!tot) return { pct: 0, done: 0, total: 0 };
  const doneCount = acts.filter(a => isDone(d,a.id) || vuoto(a.id)).length
    + items.filter(i => rDone(d,i.id)).length
    + rem.filter(r => readToday(d,r.id)).length
    + pack.filter(t => tripDone(t.tripId, t.id)).length;
  return { pct: Math.round(got / tot * 100), done: doneCount, total: acts.length + items.length + rem.length + pack.length };
}

function progress(){
  const T = today();
  const acts = todaysActs();
  const items = allRoutineItems();
  let tot = 0, got = 0;
  for (const a of acts){ const w = W_ACT[a.imp] || 3; tot += w; if (isDone(T, a.id)) got += w; }
  for (const i of items){ tot += W_ROUT; if (rDone(T, i.id)) got += W_ROUT; }
  const rem = remindersOn(T);
  for (const r of rem){ tot += W_REM; if (readToday(T, r.id)) got += W_REM; }
  const pack = tripItemsOn(T);
  for (const t of pack){ tot += W_TRIP; if (tripDone(t.tripId, t.id)) got += W_TRIP; }
  if (!tot) return { pct: 0, done: 0, total: 0 };
  const doneCount = acts.filter(a => isDone(T,a.id)).length
    + items.filter(i => rDone(T,i.id)).length
    + rem.filter(r => readToday(T,r.id)).length
    + pack.filter(t => tripDone(t.tripId, t.id)).length;
  return { pct: Math.round(got / tot * 100), done: doneCount, total: acts.length + items.length + rem.length + pack.length };
}

function greeting(){
  const m = nowMin();
  if (m < 12*60) return "Buongiorno. Ecco com'è fatta la giornata.";
  if (m < 18*60) return "Pomeriggio. Vediamo cosa resta.";
  return "Sera. Chiudiamo la giornata.";
}

/* la fetta della torta: quanto della giornata è fatto */
function piePath(pct, r){
  const q = Math.max(0, Math.min(100, pct));
  if (q <= 0) return "";
  if (q >= 100) return `M${r},${r} m${-r},0 a${r},${r} 0 1,0 ${r*2},0 a${r},${r} 0 1,0 ${-r*2},0`;
  const a = 2 * Math.PI * (q / 100) - Math.PI / 2;
  const x = r + r * Math.cos(a), y = r + r * Math.sin(a);
  return `M${r},${r} L${r},0 A${r},${r} 0 ${q > 50 ? 1 : 0},1 ${x},${y} Z`;
}

function pieHTML(p, pausa){
  const R = 19;
  return `
  <svg width="${R*2}" height="${R*2}" viewBox="0 0 ${R*2} ${R*2}">
    <circle cx="${R}" cy="${R}" r="${R}" fill="var(--surface-2)"/>
    <path id="pie-arc" d="${pausa ? "" : piePath(p.pct, R)}" fill="var(--accent)"/>
    <circle cx="${R}" cy="${R}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1"/>
  </svg>
  <span id="ring-pct">${pausa ? "via" : p.pct + "%"}</span>`;
}

   Per ora raccolgono quello che l'app sa già: le mosse del motore, gli eventi,
   la valigia, il frigo, i conti in sospeso, gli obiettivi agli sgoccioli. */
let NOTIF_OPEN = false;

function notifiche(){
  const T = today(), out = [];
  if (S.resume) out.push({ k:"rientro", t:"Hai un riepilogo del rientro da sistemare" });
  for (const n of S.notices) out.push({ k:"programma", t:n.text });
  for (const o of eventsOn(T)) out.push({ k:"oggi", t:`${o.label}${o.allDay ? " · tutto il giorno" : ` · ${o.start}`}${o.place ? ` · ${o.place}` : ""}` });
  for (const o of eventsSoon(T)){
    const dd = daysBetween(T, o.date);
    out.push({ k:"in arrivo", t:`${o.label} ${dd === 1 ? "domani" : `fra ${dd} giorni`}` });
  }
  for (const t of tripsOn(T)){
    const n = t.items.filter(i => !tripDone(t.id, i.id)).length;
    if (n) out.push({ k:"valigia", t:`${t.name}: ${n} ${n === 1 ? "cosa" : "cose"} ancora da mettere` });
  }
  if (shopDay(T)) out.push({ k:"spesa", t: shopLeft() ? `Oggi spesa · ${shopLeft()} ${shopLeft() === 1 ? "cosa" : "cose"} in lista` : "Oggi spesa · la lista è vuota" });
  for (const x of billAlerts(T)) out.push({ k:"uscite", t:x.t });
  for (const x of investAlerts(T)) out.push({ k:"investimenti", t:x.t });
  for (const f of fridgeSoon(T)){
    const st = fridgeState(f, T);
    if (st.k === "scaduto" || st.k === "oggi") out.push({ k:"frigo", t:`${f.name} ${st.label}` });
  }
  for (const e of ledgerOpen()){
    const a = ledgerAlert(e, T);
    if (a) out.push({ k:"dare e avere", t:`${e.who} · ${e.kind === "soldi" ? euro(ledgerLeft(e)) : e.what} · ${a}` });
  }
  for (const g of S.goals){
    if (goalDone(g)) continue;
    const l = goalLeft(g);
    if (l <= 2) out.push({ k:"obiettivo", t:`${g.name}: ${l === 0 ? "ultimo giorno utile" : l === 1 ? "manca un giorno" : `mancano ${l} giorni`}` });
  }
  return out;
}

    { id:"vini", ico:"vini", nome:"Vini", hot:false,
      nota: S.wines.length ? `${S.wines.length} in cantina` : "nessuno segnato" }
  ];
}

      ${passate.slice(0, 60).map(d => `

    nome = "Vini"; sotto = "Quelli che hai assaggiato, da che parte vengono e con cosa stanno bene.";

        : `<div class="empty">${S.wines.length ? "Nessuno di questo tipo." : "Segna un vino che ti è piaciuto: nome, da dove viene, con cosa lo berresti. La prossima volta al ristorante te lo ricordi."}</div>`}

let WFILTER = "tutti";
let DITIMER = null;

function bindDiario(){
  const t = el.querySelector("#di-today"), stato = el.querySelector("#di-stato");
  if (!t) return;
  t.oninput = () => {
    clearTimeout(DITIMER);
    if (stato) stato.textContent = "sto scrivendo…";
    DITIMER = setTimeout(() => {
      saveDiary(today(), t.value);
      if (stato) stato.textContent = `salvato alle ${toHHMM(nowMin())}`;
    }, 700);
  };
}

// i comandi della pagina spesa: giorni, data, aggiunta rapida
function bindSpesa(){
  const wn = S.shop.when;
  const paint = () => {
    el.querySelectorAll("#sh-mode .chip").forEach(b => b.classList.toggle("on", b.dataset.m === wn.type));
    el.querySelectorAll("[data-shd]").forEach(b => b.classList.toggle("on", (wn.days||[]).includes(+b.dataset.shd)));
    el.querySelector("#sh-days").style.display = wn.type === "days" ? "" : "none";
    el.querySelector("#sh-date").style.display = wn.type === "date" ? "" : "none";
  };
  el.querySelectorAll("#sh-mode .chip").forEach(b => b.onclick = () => {
    wn.type = b.dataset.m;
    if (wn.type === "date" && !wn.date) wn.date = today();
    save(); paint();
  });
  el.querySelectorAll("[data-shd]").forEach(b => b.onclick = () => {
    const g = +b.dataset.shd;
    wn.days = wn.days || [];
    wn.days = wn.days.includes(g) ? wn.days.filter(x => x !== g) : [...wn.days, g];
    save(); paint();
  });
  const dt = el.querySelector("#sh-dt");
  if (dt) dt.onchange = () => { wn.date = dt.value; save(); };
  const aggiungi = () => {
    const t = el.querySelector("#sh-new"), q = el.querySelector("#sh-qty");
    if (!t.value.trim()) return;
    addShopItem(t.value, q.value);
    render();
  };
  const ab = el.querySelector("#sh-add"); if (ab) ab.onclick = aggiungi;
  const ti = el.querySelector("#sh-new");
  if (ti) ti.onkeydown = e => { if (e.key === "Enter") aggiungi(); };
  paint();
}

  const gp = el.querySelector("#gopause"); if (gp) gp.onclick = () => openPause(gp.dataset.lab);

  // la giornata: scorri per i prossimi 30 giorni
  const pg = el.querySelector("#pager");
  if (pg) pg.onscroll = () => {
    const second = pg.scrollLeft > pg.clientWidth / 2;
    const d0 = el.querySelector("#d0"), d1 = el.querySelector("#d1"), hint = el.querySelector("#swipehint");
    if (d0) d0.classList.toggle("on", !second);
    if (d1) d1.classList.toggle("on", second);
    if (hint) hint.textContent = second ? "scorri indietro per la giornata" : "scorri per i prossimi 30 giorni";
  };

  // i promemoria: oggi, domani, tutti
  const rp = el.querySelector("#rempager");
  if (rp){
    const pagine = [...rp.querySelectorAll(".page")];
    const quale = () => Math.round(rp.scrollLeft / Math.max(1, rp.clientWidth));
    const upd = () => {
      const i = Math.min(2, Math.max(0, quale()));
      el.querySelectorAll("#remdots .dot2").forEach((x,k) => x.classList.toggle("on", k === i));
      const b = el.querySelector("#remnext");
      if (b) b.textContent = REMPAGES[(i + 1) % 3];
      const h = pagine[i] ? pagine[i].scrollHeight : 0;
      if (h) rp.style.height = h + "px";
    };
    rp.onscroll = upd;
    const b = el.querySelector("#remnext");
    if (b) b.onclick = () => {
      const i = (quale() + 1) % 3;
      rp.scrollTo({ left: i * rp.clientWidth, behavior: "smooth" });
      setTimeout(upd, 350);
    };
    upd();
  }
}

/* ============================================================
   OBIETTIVI A SCADENZA — una volta entro la settimana, il mese, l'anno
   ============================================================ */
const GPER = { w:"questa settimana", m:"questo mese", y:"quest'anno" };

function periodEnd(per, d){
  const dt = fromIso(d);
  if (per === "w"){ dt.setDate(dt.getDate() + (7 - ((dt.getDay()+6)%7) - 1)); return iso(dt); }
  if (per === "m"){ dt.setMonth(dt.getMonth()+1, 0); return iso(dt); }
  dt.setMonth(11, 31); return iso(dt);
}
const goalDone = g => !!(g.done && g.done[pKey(g.per, today())]);
const goalLeft = g => daysBetween(today(), periodEnd(g.per, today()));

function goalsHTML(){
  if (!S.goals.length) return `<div class="card">
    <div class="empty">Cose da fare una volta entro la settimana, il mese o l'anno. Il coach ti dice quanto manca.</div>
    <div class="row"><button class="btn ghost wide" id="addgoal">Aggiungi obiettivo</button></div></div>`;
  const sorted = [...S.goals].sort((a,b) => (goalDone(a)?1:0) - (goalDone(b)?1:0) || goalLeft(a) - goalLeft(b));
  return `<div class="card">
    ${sorted.map(g => {
      const done = goalDone(g), left = goalLeft(g);
      const urgente = !done && left <= 3;
      return `<div class="row ${done ? "done" : ""}" data-row="${g.id}">
        <button class="tick" data-gtick="${g.id}" aria-label="Segna come fatto">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
        <div class="rbody">
          <div class="rtitle">${esc(g.name)}</div>
          <div class="rmeta" style="${urgente ? "color:var(--warn)" : ""}">
            ${done ? `fatto ${GPER[g.per]}`
                   : left === 0 ? "ultimo giorno utile"
                   : left === 1 ? "manca 1 giorno"
                   : `mancano ${left} giorni`}${done ? "" : ` · ${GPER[g.per]}`}
          </div>
          ${timeOn(today(), g.id) ? `<span class="flag">${durLabel(timeOn(today(), g.id))} registrati oggi</span>` : ""}
        </div>
        <button class="btn ghost" data-gedit="${g.id}" style="min-width:40px;padding:8px 0" aria-label="Modifica">&#9881;</button>
      </div>`;
    }).join("")}
    <div class="row"><button class="btn ghost wide" id="addgoal">Aggiungi obiettivo</button></div>
  </div>`;
}

function toggleGoal(id){
  const g = S.goals.find(x => x.id === id); if (!g) return;
  const k = pKey(g.per, today());
  g.done = g.done || {};
  if (g.done[k]) delete g.done[k]; else g.done[k] = true;
  save();
  markRow(id, g.done[k]);
  const row = document.querySelector(`[data-row="${id}"] .rmeta`);
  if (row){
    const left = goalLeft(g);
    row.textContent = g.done[k] ? `fatto ${GPER[g.per]}`
      : (left === 0 ? "ultimo giorno utile" : left === 1 ? "manca 1 giorno" : `mancano ${left} giorni`) + ` · ${GPER[g.per]}`;
    row.style.color = (!g.done[k] && left <= 3) ? "var(--warn)" : "";
  }
  patchToday();
}

/* ---------- PROSSIMI 30 GIORNI ---------- */
function monthHTML(){
  const T = today();
  const days = [];
  for (let i = 0; i < 30; i++){
    const d = addDays(T, i);
    const evs = [];
    for (const o of S.oneoffs){
      if (o.showInMonth === false) continue;
      const fine = o.endDate || o.date;
      if (d < o.date || d > fine) continue;
      evs.push({ t: o.allDay ? "tutto il dì" : `${d === o.date ? o.start : "00:00"}–${d === fine ? o.end : "24:00"}`, n:o.label });
    }
    for (const f of S.fixed) if (f.showInMonth && f.days.includes(dow(d)))
      evs.push({ t:`${f.start}–${f.end}`, n:f.label });
    if (S.gcalOn) for (const g of (GCAL.byDay[d] || []))
      evs.push({ t:`${toHHMM(g.s)}–${toHHMM(g.e)}`, n:g.label });
    for (const a of S.activities) if (a.scheduledFor === d)
      evs.push({ t:`${a.win.start}–${a.win.end}`, n:a.name });
    for (let k = evs.length - 1; k >= 0; k--) if (S.hidden.includes(evs[k].n)) evs.splice(k,1);
    if (evs.length){
      evs.sort((x,y) => x.t.localeCompare(y.t));
      days.push({ d, evs });
    }
  }
  const restore = S.hidden.length
    ? `<div class="row"><button class="btn ghost wide" id="unhideall">Rimetti i ${S.hidden.length} nascosti</button></div>` : "";
  if (!days.length) return `<div class="card"><div class="empty">Nessun impegno nei prossimi 30 giorni. Quelli di Google Calendar compaiono qui appena arrivano.</div>${restore}</div>`;
  return `<div class="card" style="max-height:314px;overflow-y:auto">${restore}
    ${days.map(x => `
      <div class="monthday">
        <b>${GG3[dow(x.d)]} ${prettyDate(x.d)}</b>
        ${x.evs.map(e => `<div class="mev"><span>${e.t}</span><span style="flex:1">${esc(e.n)}</span><button data-hide="${esc(e.n)}" style="background:none;border:0;color:var(--ink-faint);font-size:15px;padding:0 4px" aria-label="Nascondi">&times;</button></div>`).join("")}
      </div>`).join("")}
  </div>`;
}

/* ---------- CHIUSURA SERALE ---------- */
const REASONS = [
  ["tempo",  "Non ho avuto tempo"],
  ["voglia", "Non ne avevo voglia"],
  ["altro",  "Si è incastrato altro"],
  ["giorno", "Non era il giorno giusto"]
];
// Caso a parte: la cosa non andava fatta. Non è un fallimento tuo ma della
// programmazione, quindi conta come completata e il coach se ne ricorda.
const R_VUOTO = "vuoto";
const R_VUOTO_LABEL = "Non c'era nulla da fare";

function undoneToday(T){
  const out = [];
  for (const a of planFor(T)) if (!isDone(T, a.id)) out.push({ id:a.id, name:a.name, kind:"attività" });
  for (const i of allRoutineItems()) if (!rDone(T, i.id)) out.push({ id:i.id, name:i.text, kind:"routine" });
  for (const r of remindersOn(T)) if (!readToday(T, r.id)) out.push({ id:r.id, name:r.text, kind:"promemoria" });
  for (const t of tripItemsOn(T)) if (!tripDone(t.tripId, t.id)) out.push({ id:t.id, name:t.text, kind:"valigia · " + t.tripName });
  return out;
}

// La chiusura si può fare dall'ora scelta fino alle 3 di notte.
// Dopo mezzanotte riguarda il giorno appena finito, non quello appena iniziato.
function closeTarget(){
  if (isPaused() || S.resume) return null;
  const n = nowMin();
  if (n < 3 * 60) return addDays(today(), -1);
  if (n >= toMin(S.closeAt)) return today();
  return null;
}

function closeHTML(){
  const d = closeTarget();
  if (!d) return "";
  const ieri = d !== today();
  const done = S.closes[d];
  if (done) return `<div class="closecard"><div class="rbody">
      <div class="rtitle">${ieri ? "Ieri chiuso" : "Giornata chiusa"} al ${done.pct}%</div>
      <div class="rmeta">Ci si rivede stasera.</div></div>
      <button class="btn ghost" id="reopen">Riapri</button></div>`;
  const p = progressOn(d);
  return `<div class="closecard"><div class="rbody">
      <div class="rtitle">Chiudi ${ieri ? "la giornata di ieri" : "la giornata"}</div>
      <div class="rmeta" id="close-meta">${ieri ? `${GG[dow(d)]} ${prettyDate(d)} · ` : ""}${p.pct}%, ${p.done} cose su ${p.total}.</div></div>
      <button class="btn primary" id="doclose">Chiudi</button></div>`;
}

function openClose(){
  const T = closeTarget() || today();
  const left = undoneToday(T);
  const picks = {};
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Come è andata${closeTarget() && closeTarget() !== today() ? " ieri" : " oggi"}</h3>
    <div style="font-size:15px;color:var(--ink-soft);margin-bottom:20px" id="cl-top"></div>
    <div id="cl-list">
      ${left.map(x => `
        <div class="card" style="padding:13px 14px;margin-bottom:9px">
          <div class="rtitle">${esc(x.name)}</div>
          <div class="rmeta">${x.kind}</div>
          <div class="why" data-for="${x.id}">
            ${REASONS.map(([k,l]) => `<button data-r="${k}">${l}</button>`).join("")}
            ${x.kind === "attività" ? `<button data-r="${R_VUOTO}" class="vuoto">${R_VUOTO_LABEL}</button>` : ""}
          </div>
        </div>`).join("")}
    </div>
    <div class="field" style="margin-top:4px"><label>Due righe sulla giornata</label>
      <textarea id="cl-note" rows="3" placeholder="Come è andata, cosa è successo…"
        style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical"></textarea></div>
    <div class="btnrow">
      <button class="btn primary wide" id="cl-save">Chiudi la giornata</button>
    </div>
    <div class="btnrow"><button class="btn ghost wide" id="cl-cancel">Non adesso</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  // "Non c'era nulla da fare" vale come fatta: la percentuale si aggiorna subito.
  const top = w.querySelector("#cl-top");
  function refreshTop(){
    const vuoti = Object.values(picks).filter(r => r === R_VUOTO).length;
    const q = progressOn(T, picks);
    const resta = left.length - vuoti;
    top.textContent = `${q.pct}% della giornata, ${q.done} cose su ${q.total}.`
      + (resta ? ` Restano ${resta} cose. Dimmi perché, con un tocco.`
               : left.length ? " Niente rimasto indietro." : " Non è rimasto niente indietro.");
  }
  refreshTop();

  w.querySelectorAll(".why").forEach(g => {
    g.querySelectorAll("button").forEach(b => b.onclick = () => {
      const id = g.dataset.for, r = b.dataset.r;
      if (picks[id] === r) delete picks[id]; else picks[id] = r;
      g.querySelectorAll("button").forEach(x => x.classList.toggle("on", picks[id] === x.dataset.r));
      refreshTop();
    });
  });
  w.querySelector("#cl-cancel").onclick = () => w.remove();
  w.querySelector("#cl-save").onclick = () => {
    // le cose segnate "non c'era nulla da fare" entrano nel registro come completate
    S.log[T] = S.log[T] || {};
    for (const id in picks) if (picks[id] === R_VUOTO) S.log[T][id] = true;
    const q = progressOn(T);
    S.closes[T] = { pct: q.pct, at: Date.now(), reasons: picks,
                    note: (w.querySelector("#cl-note").value || "").trim() };
    save(); w.remove(); render();
  };
}

/* ============================================================
   STATISTICHE — quello che i dati sanno dire, niente di più
   ============================================================ */
const REASON_LABEL = Object.fromEntries(REASONS);

// quanti degli ultimi n giorni erano in pausa: non sono giornate andate male
function pausedIn(n){
  const T = today();
  let c = 0;
  for (let i = 1; i <= n; i++) if (S.pausedDays[addDays(T, -i)]) c++;
  return c;
}

function closedDays(n){
  const T = today(), out = [];
  for (let i = 1; i <= n; i++){
    const d = addDays(T, -i);
    if (S.closes[d]) out.push({ d, c: S.closes[d] });
  }
  return out;
}

function barHTML(rows){
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `
    <div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px">
        <span>${esc(r.k)}</span><span style="color:var(--ink-soft)">${r.v}</span>
      </div>
      <div style="height:6px;border-radius:3px;background:var(--surface-2);margin-top:4px">
        <div style="height:100%;width:${Math.round(r.v/max*100)}%;background:var(--accent);border-radius:3px"></div>
      </div>
    </div>`).join("");
}

function openStats(){
  const T = today();
  const last30 = closedDays(30), last7 = closedDays(7);
  const avg = a => a.length ? Math.round(a.reduce((s,x)=>s+x.c.pct,0)/a.length) : null;

  // motivi
  const rc = {}, vuoti = {};
  for (const x of last30) for (const id in (x.c.reasons||{})){
    const r = x.c.reasons[id];
    if (r === R_VUOTO){
      const a = S.activities.find(y => y.id === id);
      const nm = a ? a.name : "una cosa tolta";
      vuoti[nm] = (vuoti[nm] || 0) + 1;
    } else rc[r] = (rc[r]||0)+1;
  }
  const reasonRows = Object.entries(rc).map(([k,v]) => ({ k: REASON_LABEL[k] || k, v }))
                           .sort((a,b) => b.v - a.v);
  const vuotoRows = Object.entries(vuoti).map(([k,v]) => ({ k, v })).sort((a,b) => b.v - a.v);

  // attività più saltate
  const skipped = S.activities.filter(a => a.skipCount).sort((a,b) => b.skipCount - a.skipCount).slice(0,5);

  // tempo registrato negli ultimi 30 giorni
  const tt = {};
  for (let i = 0; i < 30; i++){
    const d = addDays(T, -i);
    for (const id in (S.timeLog[d] || {})){
      const a = S.activities.find(x => x.id === id) || S.goals.find(x => x.id === id) || S.oneoffs.find(x => x.id === id);
      const nm = a ? (a.name || a.label) : "altro";
      tt[nm] = (tt[nm] || 0) + S.timeLog[d][id];
    }
  }
  const timeRows = Object.entries(tt).map(([k,v]) => ({ k, v: Math.round(v) })).sort((a,b)=>b.v-a.v).slice(0,6);

  // sonno nei giorni buoni e in quelli storti
  let sleepLine = "";
  const sonno = S.health.find(v => v.type === "sonno");
  if (sonno && last30.length >= 6){
    const media = avg(last30);
    const sopra = [], sotto = [];
    for (const x of last30){
      const s = hVal(x.d, sonno.id);
      if (!s) continue;
      (x.c.pct >= media ? sopra : sotto).push(s.min);
    }
    if (sopra.length >= 3 && sotto.length >= 3){
      const m = a => Math.round(a.reduce((s,x)=>s+x,0)/a.length);
      sleepLine = `Nei giorni chiusi sopra la tua media dormi ${durLabel(m(sopra))}. In quelli sotto, ${durLabel(m(sotto))}.`;
    }
  }

  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Statistiche</h3>

    <h2 style="margin-top:0">Chiusure</h2>
    <div class="card">
      <div class="stat"><span>Media ultimi 7 giorni</span><span>${avg(last7) ?? "—"}${avg(last7)!==null?"%":""}</span></div>
      <div class="stat"><span>Media ultimi 30 giorni</span><span>${avg(last30) ?? "—"}${avg(last30)!==null?"%":""}</span></div>
      <div class="stat"><span>Giorni chiusi su 30</span><span>${last30.length}</span></div>
      ${pausedIn(30) ? `<div class="stat"><span>Giorni in pausa</span><span>${pausedIn(30)}</span></div>` : ""}
    </div>
    ${last30.length < 5 ? `<div class="hint">Servono almeno cinque sere chiuse perché questi numeri dicano qualcosa.</div>` : ""}

    ${(S.fridgeStats.usati || S.fridgeStats.buttati) ? `
    <h2>Frigo</h2>
    <div class="card">
      <div class="stat"><span>Consumato in tempo</span><span>${S.fridgeStats.usati||0}</span></div>
      <div class="stat"><span>Buttato</span><span>${S.fridgeStats.buttati||0}</span></div>
      <div class="stat"><span>Dentro adesso</span><span>${S.fridge.length}</span></div>
    </div>` : ""}

    <h2>Perché le cose restano indietro</h2>
    <div class="card" style="padding:14px">
      ${reasonRows.length ? barHTML(reasonRows)
        : `<div style="color:var(--ink-soft);font-size:14px">Ancora nessun motivo registrato.</div>`}
    </div>
    ${reasonRows.length >= 3 ? `<div class="hint">Il motivo più frequente dice che tipo di problema hai: il tempo si risolve spostando, la voglia no.</div>` : ""}

    ${vuotoRows.length ? `
    <h2>Programmate quando non servivano</h2>
    <div class="card" style="padding:14px">${barHTML(vuotoRows)}</div>
    <div class="hint">Non è roba che hai saltato: era il programma sbagliato. Se una torna spesso, abbassale la frequenza dalla scheda Attività.</div>` : ""}

    <h2>Dove è finito il tempo</h2>
    <div class="card" style="padding:14px">
      ${timeRows.length ? barHTML(timeRows.map(r => ({ k:r.k, v:r.v })))
        : `<div style="color:var(--ink-soft);font-size:14px">Nessun tempo registrato. Fai partire un ciclo dal Crono scegliendo su cosa lavori.</div>`}
    </div>

    <h2>Attività più saltate</h2>
    <div class="card">
      ${skipped.length ? skipped.map(a => `

/* ---------- RESET ---------- */

// Cancella solo lo storico: quello che hai costruito resta.
function resetStats(){
  S.log = {};       // spunte delle attività
  S.rlog = {};      // routine
  S.remlog = {};    // promemoria letti
  S.tlog = {};      // conteggi Extra
  S.hlog = {};      // salute
  S.timeLog = {};   // tempo registrato dal Crono
  S.durLog = {};    // quanto ci metti davvero
  S.closes = {};    // chiusure serali e note
  S.dayPlan = {};
  S.notices = [];
  S.activities.forEach(a => {
    a.doneCount = 0; a.skipCount = 0; a.lastDone = null;
    a.scheduledFor = null; a.moved = null;
  });
  S.goals.forEach(g => { g.done = {}; });
  S.lastRun = null;
  runEngine();
  save();
}

// Riporta l'app a com'era appena aperta: via tutto.
function resetAll(){
  const fresh = structuredClone(DEFAULT_STATE);
  fresh.gcalOn = S.gcalOn;        // il collegamento al calendario resta com'era
  fresh.skin = S.skin;            // e anche i colori che hai scelto
  fresh.mode = S.mode;
  fresh.updatedAt = Date.now();
  S = fresh;
  S.lastRun = null;
  runEngine();
  save();
}

      </div>

/* ============================================================
   VALIGIA — la lista di un viaggio, che esce da sola il giorno prima
   ============================================================ */
const tripDone = (tid, iid) => !!(S.triplog[tid] && S.triplog[tid][iid]);

// Quando si vede: dal numero di giorni prima che hai scelto (di norma uno solo),
// e il giorno della partenza solo se è rimasto qualcosa da mettere in valigia.
function tripVisible(t, d){
  if (!t.date || !(t.items || []).length) return false;
  const dd = daysBetween(d, t.date);
  const lead = Math.max(1, t.lead || 1);
  if (dd >= 1 && dd <= lead) return true;
  if (dd === 0) return t.items.some(i => !tripDone(t.id, i.id));
  return false;
}
const tripsOn = d => S.trips.filter(t => tripVisible(t, d))
                            .sort((a,b) => a.date.localeCompare(b.date));
const tripItemsOn = d => tripsOn(d).flatMap(t => t.items.map(i => ({ ...i, tripId:t.id, tripName:t.name })));

function tripWhenLabel(t, d){
  const dd = daysBetween(d, t.date);
  if (dd === 0) return "si parte oggi";
  if (dd === 1) return "si parte domani";
  return `si parte fra ${dd} giorni`;
}

function tripHTML(T){
  const viaggi = tripsOn(T);
  if (!viaggi.length) return "";
  return viaggi.map(t => {
    const fatte = t.items.filter(i => tripDone(t.id, i.id)).length;
    return `
    <h2 id="h-trip-${t.id}">Valigia · ${esc(t.name)} · ${tripWhenLabel(t, T)} · ${fatte}/${t.items.length}</h2>
    <div class="card">
      ${t.items.map(i => `
        <div class="row ${tripDone(t.id, i.id) ? "done" : ""}" data-row="${i.id}">
          <button class="tick" data-ttick="${i.id}" data-trip="${t.id}" aria-label="Segna come messa in valigia">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
          <div class="rbody"><div class="rtitle">${esc(i.text)}</div></div>
        </div>`).join("")}
      <div class="row"><button class="btn ghost wide" data-tedit="${t.id}">Modifica la lista</button></div>
    </div>`;
  }).join("");
}

function toggleTripItem(tid, iid){
  S.triplog[tid] = S.triplog[tid] || {};
  if (S.triplog[tid][iid]) delete S.triplog[tid][iid]; else S.triplog[tid][iid] = true;
  save();
  markRow(iid, S.triplog[tid][iid]);
  patchToday();
}

function patchTripHead(){
  const T = today();
  for (const t of tripsOn(T)){
    const h = document.getElementById("h-trip-" + t.id);
    if (!h) continue;
    const fatte = t.items.filter(i => tripDone(t.id, i.id)).length;
    h.textContent = `Valigia · ${t.name} · ${tripWhenLabel(t, T)} · ${fatte}/${t.items.length}`;
  }
}

/* ============================================================
   FRIGO — cosa c'è dentro e quando scade
   Non pesa sulla percentuale della giornata: è un avviso, non un compito.
   ============================================================ */
const fridgeSorted = () => S.fridge.slice().sort((a,b) => a.exp.localeCompare(b.exp));
const fridgeWarnDays = () => (S.fridgeWarn >= 0 ? S.fridgeWarn : 3);

function fridgeState(it, T){
  const dd = daysBetween(T, it.exp);
  if (dd < 0)  return { k:"scaduto", dd, label: dd === -1 ? "scaduto ieri" : `scaduto da ${-dd} giorni` };
  if (dd === 0) return { k:"oggi",   dd, label:"scade oggi" };
  if (dd === 1) return { k:"presto", dd, label:"scade domani" };
  return { k: dd <= fridgeWarnDays() ? "presto" : "ok", dd, label:`scade fra ${dd} giorni` };
}
const fridgeSoon = T => fridgeSorted().filter(it => daysBetween(T, it.exp) <= fridgeWarnDays());

function fridgeRowHTML(it, T){
  const st = fridgeState(it, T);
  const col = st.k === "scaduto" ? "var(--warn)" : st.k === "oggi" ? "var(--warn)" : st.k === "presto" ? "var(--accent)" : "var(--line)";
  return `
  <button class="actrow" data-fr="${it.id}">
    <div class="imp" style="min-height:30px;background:${col}"></div>
    <div class="rbody">
      <div class="rtitle">${esc(it.name)}${it.qty ? ` <span style="color:var(--ink-faint);font-weight:400">· ${esc(it.qty)}</span>` : ""}</div>
      <div class="rmeta" style="${st.k === "scaduto" || st.k === "oggi" ? "color:var(--warn)" : ""}">${st.label}<span class="dot">·</span>${prettyDate(it.exp)}</div>
      ${it.note ? `<div class="rmeta" style="color:var(--ink-faint)">${esc(it.note)}</div>` : ""}
    </div>
  </button>`;
}

function fridgeHTML(T){
  const soon = fridgeSoon(T);
  const scaduti = soon.filter(x => daysBetween(T, x.exp) < 0).length;
  return `
  <h2 id="h-frigo">Frigo${soon.length ? ` · ${soon.length} in scadenza${scaduti ? (scaduti === 1 ? ", 1 già scaduto" : `, ${scaduti} già scaduti`) : ""}` : ""}</h2>
  <div class="card">
    ${soon.length ? soon.map(it => fridgeRowHTML(it, T)).join("")
      : `<div class="empty">${S.fridge.length
          ? `Niente in scadenza nei prossimi ${fridgeWarnDays()} giorni.`
          : "Segna cosa metti in frigo con la sua scadenza: te lo ricordo qui qualche giorno prima."}</div>`}
    <div class="row" style="gap:9px">
      <button class="btn ghost" id="addfr" style="flex:2">Aggiungi nel frigo</button>
      ${S.fridge.length ? `<button class="btn ghost" id="allfr" style="flex:1">Tutto · ${S.fridge.length}</button>` : ""}
    </div>
  </div>`;
}

function fridgeRemove(id, esito){
  const it = S.fridge.find(x => x.id === id); if (!it) return;
  S.fridge = S.fridge.filter(x => x.id !== id);
  if (esito === "usato") S.fridgeStats.usati = (S.fridgeStats.usati||0) + 1;
  if (esito === "buttato") S.fridgeStats.buttati = (S.fridgeStats.buttati||0) + 1;
  save(); render();
}

      <input type="text" id="f-q" value="${esc(it.qty||"")}" placeholder="1 confezione, 4 fette…"></div>
    <div class="field"><label>Nota</label>
      <input type="text" id="f-b" value="${esc(it.note||"")}" placeholder="Aperto il 3, da finire…"></div>

      <button class="btn primary" id="f-save" style="flex:2">Salva</button>
      <button class="btn ghost" id="f-cancel">Annulla</button>
    </div>
    ${id ? `<div class="btnrow">
      <button class="btn" id="f-used" style="flex:1">Consumato</button>
      <button class="btn danger" id="f-trash" style="flex:1">Buttato</button>
    </div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelectorAll("#f-quick .chip").forEach(b => b.onclick = () => {
    w.querySelector("#f-e").value = addDays(today(), +b.dataset.q);
  });
  w.querySelector("#f-cancel").onclick = () => w.remove();
  const used = w.querySelector("#f-used");
  if (used) used.onclick = () => { w.remove(); fridgeRemove(id, "usato"); };
  const trash = w.querySelector("#f-trash");
  if (trash) armDelete(trash, "Buttato", () => { w.remove(); fridgeRemove(id, "buttato"); });
  w.querySelector("#f-save").onclick = () => {
    const name = w.querySelector("#f-n").value.trim();
    const exp = w.querySelector("#f-e").value;
    if (!name){ alert("Serve un nome."); return; }
    if (!exp){ alert("Serve la data di scadenza."); return; }
    const next = { ...it, name, exp, qty: w.querySelector("#f-q").value.trim(), note: w.querySelector("#f-b").value.trim() };
    const i = S.fridge.findIndex(x => x.id === it.id);
    if (i >= 0) S.fridge[i] = next; else S.fridge.push(next);
    save(); w.remove(); render();
  };
}

/* ============================================================
   DARE E AVERE — soldi e cose in sospeso con le persone
   Non entra nella percentuale della giornata: è un promemoria, non un compito.
   ============================================================ */
const euro = n => (Math.round(n * 100) / 100).toString().replace(".", ",") + " €";
const ledgerOpen = () => S.ledger.filter(e => !e.closed);
const paid = e => (e.moves || []).reduce((s, m) => s + (+m.amount || 0), 0);
const ledgerLeft = e => e.kind === "soldi" ? Math.max(0, (+e.amount || 0) - paid(e)) : (e.closed ? 0 : 1);

// Quando una voce torna a farsi vedere: vicino alla scadenza, oppure —
// per le cose prestate senza scadenza — quando è in giro da troppo tempo.
function ledgerAlert(e, T){
  if (e.closed) return null;
  if (e.snooze && T < e.snooze) return null;
  if (e.due){
    const dd = daysBetween(T, e.due);
    if (dd < 0)  return `in ritardo di ${-dd} ${-dd === 1 ? "giorno" : "giorni"}`;
    if (dd === 0) return "scade oggi";
    if (dd <= 3) return `scade fra ${dd} giorni`;
    return null;
  }
  const eta = daysBetween(e.date, T);
  if (S.ledgerAge > 0 && eta >= S.ledgerAge) return `in giro da ${eta} giorni`;
  return null;
}

function ledgerTotals(){
  let avere = 0, dare = 0, cose = 0;
  for (const e of ledgerOpen()){
    if (e.kind === "soldi"){ if (e.dir === "avere") avere += ledgerLeft(e); else dare += ledgerLeft(e); }
    else cose++;
  }
  return { avere, dare, cose };
}

function ledgerLine(e, T){
  const al = ledgerAlert(e, T);
  const resto = ledgerLeft(e);
  const parziale = e.kind === "soldi" && paid(e) > 0 && !e.closed;
  const segno = e.kind === "soldi"
    ? (e.dir === "avere" ? "ti deve" : "gli devi")
    : (e.dir === "avere" ? "deve restituirtela" : "devi restituirla");
  return `
  <button class="actrow" data-led="${e.id}">
    <div class="imp" style="min-height:34px;background:${e.closed ? "var(--line)" : (e.dir === "avere" ? "var(--done)" : "var(--warn)")}"></div>
    <div class="rbody">
      <div class="rtitle"${e.closed ? ` style="color:var(--ink-faint)"` : ""}>${esc(e.who)} · ${e.kind === "soldi" ? esc(euro(e.closed ? (+e.amount||0) : resto)) : esc(e.what)}</div>
      <div class="rmeta">${e.closed ? `chiuso il ${prettyDate(e.closed.d)}` : segno}<span class="dot">·</span>dal ${prettyDate(e.date)}${e.due && !e.closed ? `<span class="dot">·</span>entro ${prettyDate(e.due)}` : ""}</div>
      ${parziale ? `<div class="rmeta" style="color:var(--ink-faint)">già rientrati ${euro(paid(e))} su ${euro(+e.amount||0)}</div>` : ""}
      ${al ? `<span class="flag moved">${al}</span>` : ""}
    </div>
  </button>`;
}

function ledgerHTML(T){
  const t = ledgerTotals();
  const sveglie = ledgerOpen().filter(e => ledgerAlert(e, T));
  const testa = (t.avere || t.dare || t.cose)
    ? ` · ${t.avere ? `ti devono ${euro(t.avere)}` : ""}${t.avere && t.dare ? " · " : ""}${t.dare ? `devi ${euro(t.dare)}` : ""}${(t.avere || t.dare) && t.cose ? " · " : ""}${t.cose ? `${t.cose} ${t.cose === 1 ? "cosa" : "cose"}` : ""}`
    : "";
  return `
  <h2 id="h-led">Dare e avere${testa}</h2>
  <div class="card">
    ${sveglie.length ? sveglie.map(e => ledgerLine(e, T)).join("")
      : `<div class="empty">${ledgerOpen().length
          ? "Niente da ricordarti adesso. Le voci si fanno vive quando si avvicina la scadenza o quando sono in giro da troppo."
          : "Soldi prestati, soldi presi, cose date via. Segnali qui e non ci pensi più: te le ricordo io."}</div>`}
    <div class="row" style="gap:9px">
      <button class="btn ghost" id="addled" style="flex:2">Aggiungi</button>
      ${S.ledger.length ? `<button class="btn ghost" id="allled" style="flex:1">Apri tutto · ${ledgerOpen().length}</button>` : ""}
    </div>
  </div>`;
}

function snoozeLedger(id, giorni){
  const e = S.ledger.find(x => x.id === id); if (!e) return;
  e.snooze = addDays(today(), giorni);
  save(); render();
}

function openLedgerAll(){
  const T = today();
  const t = ledgerTotals();
  const aperti = ledgerOpen().slice().sort((a,b) => {
    const A = ledgerAlert(a,T) ? 0 : 1, B = ledgerAlert(b,T) ? 0 : 1;
    return A - B || a.date.localeCompare(b.date);
  });
  // saldo per persona, solo soldi
  const per = {};
  for (const e of ledgerOpen()) if (e.kind === "soldi"){
    per[e.who] = (per[e.who] || 0) + (e.dir === "avere" ? ledgerLeft(e) : -ledgerLeft(e));
  }
  const saldi = Object.entries(per).filter(([k,v]) => Math.abs(v) > 0.001)
                      .sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]));
  const chiusi = S.ledger.filter(e => e.closed)
                   .sort((a,b) => (b.closed.d || "").localeCompare(a.closed.d || ""));
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Dare e avere</h3>
    <div class="card">
      <div class="stat"><span>Ti devono</span><span style="color:var(--done)">${euro(t.avere)}</span></div>
      <div class="stat"><span>Devi</span><span style="color:var(--warn)">${euro(t.dare)}</span></div>
      ${t.cose ? `<div class="stat"><span>Cose in giro</span><span>${t.cose}</span></div>` : ""}
    </div>

    ${saldi.length > 1 ? `<h2>Saldo per persona</h2>
    <div class="card">
      ${saldi.map(([k,v]) => `<div class="stat"><span>${esc(k)}</span><span style="color:${v > 0 ? "var(--done)" : "var(--warn)"}">${v > 0 ? "+" : "−"}${euro(Math.abs(v))}</span></div>`).join("")}
    </div>` : ""}

    <h2>Aperti</h2>
    <div class="card">
      ${aperti.length ? aperti.map(e => ledgerLine(e, T)).join("") : `<div class="empty">Niente in sospeso. Bella cosa.</div>`}
    </div>
    <div class="btnrow"><button class="btn primary wide" id="l-add">Aggiungi una voce</button></div>

    ${chiusi.length ? `
    <details class="card" style="margin-top:16px">
      <summary style="padding:13px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer">Archivio · ${chiusi.length}</summary>
      ${chiusi.slice(0,40).map(e => ledgerLine(e, T)).join("")}
    </details>` : ""}

    <div class="btnrow"><button class="btn ghost wide" id="l-close">Chiudi</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#l-close").onclick = () => w.remove();
  w.querySelector("#l-add").onclick = () => { w.remove(); openLedgerItem(null); };
  w.querySelectorAll("[data-led]").forEach(b => b.onclick = () => { w.remove(); openLedgerItem(b.dataset.led); });
}

function openLedgerItem(id){
  const T = today();
  const e = id ? S.ledger.find(x => x.id === id)
               : { id:"l"+Date.now(), who: preNome(), kind:"soldi", dir:"avere", amount:"", what:"",
                   date: T, due:"", note:"", moves:[], closed:null, snooze:null };
  let kind = e.kind, dir = e.dir;
  const nomi = [...new Set(S.ledger.map(x => x.who).filter(Boolean))].slice(0,8);
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>${id ? (e.closed ? "Voce chiusa" : "Modifica") : "Nuova voce"}</h3>

    <div class="field"><label>Con chi</label>
      <input type="text" id="l-who" value="${esc(e.who)}" placeholder="Marco, mia sorella, il vicino…">
