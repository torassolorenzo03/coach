/* ============================================================
   LA REVISIONE DELLA SETTIMANA — cinque minuti, una volta a settimana
   Di norma la domenica alle 20:00 (si cambia nelle impostazioni).
   Prima i numeri della settimana, poi come ti sei sentito: stress,
   svago, soddisfazione e le domande che scegli tu. Poi la settimana
   che arriva. Le risposte restano e si vedono nel tempo, nella scheda Io.
   ============================================================ */
const REV_DOMANDE_DEF = [
  { id:"stress",  testo:"Livello di stress",                    tipo:"scala", basso:"tranquillo",  alto:"al limite", corto:"stress" },
  { id:"svago",   testo:"Quanto ti sei svagato",                tipo:"scala", basso:"per niente",  alto:"tantissimo", corto:"svago" },
  { id:"soddisf", testo:"Quanto sei soddisfatto della settimana", tipo:"scala", basso:"per niente", alto:"del tutto", corto:"soddisfazione" },
  { id:"energia", testo:"Energia",                              tipo:"scala", basso:"a terra",     alto:"al massimo", corto:"energia" },
  { id:"bene",    testo:"Cosa è andato bene",                   tipo:"testo" },
  { id:"meglio",  testo:"Cosa vuoi fare meglio la prossima settimana", tipo:"testo" }
];
const REV_DEF = { on: true, giorno: 0, ora: "20:00" };

function revConf(){
  const r = S.review || {};
  return { ...REV_DEF, ...r, domande: (r.domande && r.domande.length) ? r.domande : REV_DOMANDE_DEF };
}
// il giorno della revisione che riguarda la data d: l'ultimo "giorno scelto" fino a d compreso
function revGiornoDi(d){
  const g = revConf().giorno;
  let x = d;
  for (let i = 0; i < 7 && dow(x) !== g; i++) x = addDays(x, -1);
  return x;
}
const revisioneGiorno = d => revConf().on && dow(d) === revConf().giorno;
const revFatta = giorno => !!(S.review && S.review.log && S.review.log[giorno]);

// la revisione aspetta: dall'ora scelta del suo giorno fino alla fine del giorno dopo
function revisioneDovuta(){
  const c = revConf();
  if (!c.on || isPaused()) return null;
  const T = today();
  const g = revGiornoDi(T);
  if (revFatta(g)) return null;
  if (g === T && nowMin() >= toMin(c.ora)) return g;
  if (addDays(g, 1) === T) return g;
  return null;
}

function revisioneCardHTML(T){
  const g = revisioneDovuta();
  if (!g) return "";
  return `<div class="card breve" style="border-color:var(--accent)">
    <div class="adlab" style="color:var(--accent)">Revisione della settimana</div>
    <div class="brevetxt">Cinque minuti per vedere com'è andata, come ti sei sentito e cosa arriva.</div>
    <div class="btnrow" style="margin-top:10px"><button class="btn primary" id="rev-apri" style="flex:1">Comincia</button></div>
  </div>`;
}

// i numeri dei sette giorni che finiscono con "fine"
function revNumeri(fine){
  const giorni = [];
  for (let i = 6; i >= 0; i--) giorni.push(addDays(fine, -i));
  const chiusi = giorni.map(d => ({ d, c: S.closes[d] }));
  const conChiusura = chiusi.filter(x => x.c);
  const media = conChiusura.length ? Math.round(conChiusura.reduce((s,x) => s + x.c.pct, 0) / conChiusura.length) : null;
  let fatte = 0, saltate = 0;
  const saltatePer = {};
  for (const a of S.activities){
    for (const d of giorni){
      if (S.pausedDays[d]) continue;
      if (!occOn(a, d).length) continue;
      if (isDone(d, a.id)) fatte++;
      else if (d < today()){ saltate++; saltatePer[a.id] = (saltatePer[a.id] || 0) + 1; }
    }
  }
  const motivi = {};
  for (const x of conChiusura) for (const id in (x.c.reasons || {})){
    const r = x.c.reasons[id];
    if (r !== R_VUOTO) motivi[r] = (motivi[r] || 0) + 1;
  }
  const motivo = Object.entries(motivi).sort((a,b) => b[1] - a[1])[0];
  return { giorni, chiusi, media, fatte, saltate, saltatePer, motivo: motivo ? REASON_LABEL[motivo[0]] : null };
}

function openRevisione(giorno){
  const g = giorno || revGiornoDi(today());
  const c = revConf();
  const N = revNumeri(g);
  const prima = (S.review && S.review.log && S.review.log[g]) || { risposte:{} };
  const risp = { ...(prima.risposte || {}) };
  const prossimi = [];
  for (let i = 1; i <= 7; i++) prossimi.push(addDays(g, i));
  const piene = prossimi.filter(d => dayLoad(d).word === "piena");
  const leggere = prossimi.filter(d => dayLoad(d).word === "leggera");
  let esce = 0, entra = 0;
  for (const b of billsOpen()) if (b.next && b.next > g && b.next <= prossimi[6]) esce += +b.amount || 0;
  for (const x of incomeOpen()) if (x.next && x.next > g && x.next <= prossimi[6]) entra += +x.amount || 0;
  const eventi = prossimi.reduce((n,d) => n + eventsOn(d).length + (S.gcalOn ? gcalOnDay(d).filter(x => !x.recurring).length : 0), 0);
  const indietro = Object.entries(N.saltatePer).map(([id, n]) => ({ a: S.activities.find(x => x.id === id), n })).filter(x => x.a);

  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `<div class="sheetin">
    <div class="rmeta">${GG[dow(g)]} ${prettyDate(g)} · dal ${prettyDate(N.giorni[0])}</div>
    <h3 style="margin-top:4px">Com'è andata la settimana</h3>

    <h2 style="margin-top:0">I numeri</h2>
    <div class="card">
      <div style="display:flex;align-items:flex-end;gap:7px;height:74px;padding:12px 14px 0">
        ${N.chiusi.map(x => `<div style="flex:1;height:${x.c ? Math.max(6, x.c.pct) : 4}%;border-radius:5px 5px 0 0;background:${x.c ? (x.c.pct < 50 ? "var(--warn)" : "var(--accent)") : "var(--line)"}" title="${x.c ? x.c.pct + "%" : "non chiusa"}"></div>`).join("")}
      </div>
      <div style="display:flex;gap:7px;padding:5px 14px 10px;font-size:11px;color:var(--ink-soft)">${N.giorni.map(d => `<span style="flex:1;text-align:center">${GG3[dow(d)].slice(0,1)}</span>`).join("")}</div>

function bindRevImpostazioni(root){
  const salva = patch => { S.review = { ...(S.review || {}), ...patch }; save(); render(); };
  const c = revConf();
  const on = root.querySelector("#rv-on"); if (on) on.onclick = () => salva({ on: !c.on });
  root.querySelectorAll("[data-rvg]").forEach(b => b.onclick = () => salva({ giorno: +b.dataset.rvg }));
  const ora = root.querySelector("#rv-ora"); if (ora) ora.onchange = e => salva({ ora: e.target.value || "20:00" });
  root.querySelectorAll("[data-rqsu]").forEach(b => b.onclick = () => {
    const l = c.domande.slice(), i = +b.dataset.rqsu;
    [l[i-1], l[i]] = [l[i], l[i-1]]; salva({ domande: l });
  });
  root.querySelectorAll("[data-rqx]").forEach(b => armDelete(b, "×", () => {
    const l = c.domande.slice(); l.splice(+b.dataset.rqx, 1); salva({ domande: l.length ? l : [] });
  }));
  let tipo = "scala";
  root.querySelectorAll("#rq-tipo [data-t]").forEach(b => b.onclick = () => {
    tipo = b.dataset.t;
    root.querySelectorAll("#rq-tipo [data-t]").forEach(x => x.classList.toggle("on", x === b));
    root.querySelector("#rq-estremi").style.display = tipo === "scala" ? "" : "none";
  });
  const add = root.querySelector("#rq-add");
  if (add) add.onclick = () => {
    const t = root.querySelector("#rq-t").value.trim();
    if (!t){ root.querySelector("#rq-t").focus(); return; }
    const q = { id: "q" + Date.now(), testo: t, tipo };
    if (tipo === "scala"){ q.basso = root.querySelector("#rq-b").value.trim() || "poco"; q.alto = root.querySelector("#rq-a").value.trim() || "tanto"; }
    salva({ domande: c.domande.concat([q]) });
  };
}

/* ogni mattonella dice come sta messa, e si accende quando ha qualcosa da farti fare */
function baseVoci(){
  const T = today();
  const rvoci = S.routines.reduce((n,r) => n + r.items.length, 0);
  const cur = currentFascia();
  const rRestano = cur ? cur.items.filter(i => !rDone(fasciaDay(cur), i.id)).length : 0;
  const attRestano = todaysActs().filter(a => !isDone(T, a.id)).length;
  const prossimoEv = oneoffList()[0];
  const evOggi = eventsOn(T).length;
  const prossimoVg = S.trips.filter(t => t.date >= T).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const scaduti = fridgeSoon(T).filter(f => fridgeState(f,T).k !== "presto").length;
  const scad = fridgeSoon(T).length;
  const tl = ledgerTotals();
  const contiVivi = ledgerOpen().filter(e => ledgerAlert(e, T)).length;
  const it = investTotals();
  const invVivi = investAlerts(T).length;
  const messoVia = S.piggy.reduce((n,x) => n + piggySaved(x), 0);
  const obScad = S.goals.filter(g => !goalDone(g) && goalLeft(g) <= 2).length;
  const vgOggi = tripsOn(T).reduce((n,t) => n + t.items.filter(i => !tripDone(t.id, i.id)).length, 0);

  return [
    { id:"attivita", ico:"attivita", nome:"Attività", hot: attRestano > 0,
      nota: attRestano ? `${attRestano} da fare oggi` : S.activities.length ? `${S.activities.length} ricorrenti · oggi a posto` : "nessuna ancora" },
    { id:"routine", ico:"routine", nome:"Routine", hot: rRestano > 0,
      nota: rRestano ? `${esc(cur.name)}: ${rRestano} da spuntare` : `${S.routines.length} fasce · ${rvoci} ${rvoci === 1 ? "voce" : "voci"}` },
    { id:"spesa", ico:"spesa", nome:"Spesa", hot: shopDay(T) && shopLeft() > 0,
      nota: shopLeft() ? `${shopLeft()} in lista · ${shopWhenLabel()}` : `lista vuota · ${shopWhenLabel()}` },
    { id:"eventi", ico:"eventi", nome:"Eventi", hot: evOggi > 0,

    { id:"viaggi", ico:"viaggi", nome:"Viaggi", hot: vgOggi > 0,

    { id:"frigo", ico:"frigo", nome:"Frigo", hot: scaduti > 0,
      nota: S.fridge.length ? `${S.fridge.length} dentro${scad ? ` · ${scad} in scadenza` : ""}` : "vuoto" },
    { id:"obiettivi", ico:"obiettivi", nome:"Obiettivi", hot: obScad > 0,
      nota: S.goals.length ? `${S.goals.filter(goalDone).length}/${S.goals.length} fatti` : "nessuno" },
    { id:"impegni", ico:"impegni", nome:"Impegni fissi", hot:false,
      nota: `${S.fixed.length} ${S.fixed.length === 1 ? "impegno" : "impegni"} di ogni settimana` },
    { id:"conti", ico:"conti", nome:"Dare e avere", hot: contiVivi > 0,
      nota: (tl.avere || tl.dare) ? `${euro(tl.avere)} da avere · ${euro(tl.dare)} da dare` : "niente in sospeso" },
    { id:"piggy", ico:"piggy", nome:"Salvadanaio", hot:false,
      nota: S.piggy.length ? `${euro(messoVia)} messi via · ${S.piggy.length} ${S.piggy.length === 1 ? "obiettivo" : "obiettivi"}` : "nessun obiettivo" },
    { id:"invest", ico:"invest", nome:"Investimenti", hot: invVivi > 0,

function layoutArchivio(){
  const salv = ((S.layout && S.layout.archivio) || []).filter(x => ARCH_NOMI[x.id]);
  for (const id of Object.keys(ARCH_NOMI)) if (!salv.some(x => x.id === id)) salv.push({ id, on: true });
  return salv;
}

function archVoci(){
  const T = today();
  const voci = {};
  for (const v of baseVoci()) voci[v.id] = v;
  const rem = remindersOn(T);
  const letti = rem.filter(r => readToday(T, r.id)).length;
  voci.promemoria = { id:"promemoria", ico:"promemoria", nome:"Promemoria", hot: rem.length > letti,
    nota: rem.length ? `${letti}/${rem.length} letti oggi` : S.reminders.length ? `${S.reminders.length} in tutto · oggi niente` : "nessuno" };
  const ia = incomeAlerts(T).length, prev = incomeOpen();
  voci.entrate = { id:"entrate", ico:"entrate", nome:"Entrate", hot: ia > 0,
    nota: ia ? `${ia} da confermare` : prev.length ? `${euro(prev.reduce((s,x) => s + (+x.amount || 0), 0))} previste` : "niente segnato" };
  const fxa = fxAperti().length, fxc = fxDaChiedere(T).length;
  voci.fissare = { id:"fissare", ico:"fissare", nome:"Da fissare", hot: fxc > 0 || fxInAttesa().length > 0,
    nota: fxa ? `${fxa} senza data${fxInAttesa().length ? ` · ${fxInAttesa().length} su Google` : ""}` : fxInAttesa().length ? `${fxInAttesa().length} mandati a Google` : "niente in sospeso" };
  return voci;
}

    const av = billAlerts(T);
    const attive = billsOpen().slice().sort((a,b) => (a.next || "9999").localeCompare(b.next || "9999"));
    const chiuse = S.bills.filter(b => b.closed);
    const perCat = {};
    for (const b of billsOpen()) if (b.every !== "once") perCat[b.cat || "Altro"] = (perCat[b.cat || "Altro"] || 0) + billMonthly(b);

    corpo = `
    ${billsOpen().length ? `<div class="card">
      <div class="stat"><span>Ogni mese</span><span style="color:var(--warn)">${euro(t.mese)}</span></div>

    ${cats.length > 1 ? `<h2>Dove va il fisso</h2>
    <div class="card" style="padding:14px">
      ${barHTML(cats.map(([k,x]) => ({ k, v: Math.round(x) })))}
      <div class="hint" style="margin-top:2px">Euro al mese, categoria per categoria.</div>
    </div>` : ""}

    ${chiuse.length ? `<details class="card" style="margin-top:16px">
      <summary style="padding:13px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer">Disdette · ${chiuse.length}</summary>
      ${chiuse.map(b => billRow(b, T)).join("")}
    </details>` : ""}`;
  }

  else if (v === "diario"){
    nome = "Diario"; sotto = "Una pagina al giorno. Scrivi e basta: si salva da solo.";
    const passate = diaryDays().filter(d => d !== T);
    corpo = `
    <div class="card" style="padding:14px">
      <textarea id="di-today" rows="10" placeholder="Com'è andata oggi…"
        style="width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
               resize:vertical;font-size:16px;line-height:1.6">${esc(S.diary[T] || "")}</textarea>
      <div class="hint" id="di-stato">Si salva da solo mentre scrivi.</div>
    </div>
    ${passate.length ? `<h2>Le pagine di prima</h2>
    <div class="card">
      ${passate.slice(0, 60).map(d => `
        <button class="actrow" data-diary="${d}">
          <div class="rbody">
            <div class="rtitle" style="font-size:14px">${GG3[dow(d)]} ${prettyDate(d)} ${d.slice(0,4)}</div>
            <div class="rmeta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((S.diary[d] || "").replace(/\n/g, " · ").slice(0, 90))}</div>
          </div>
        </button>`).join("")}
    </div>` : ""}`;
  }

  else if (v === "vini"){
    nome = "Vini"; sotto = "Quelli che hai assaggiato, da che parte vengono e con cosa stanno bene.";
    const lista = WFILTER === "tutti" ? S.wines : S.wines.filter(x => x.type === WFILTER);
    corpo = `
    <div class="chips" id="wn-filtro" style="margin-bottom:12px">
      <button class="chip${WFILTER === "tutti" ? " on" : ""}" data-wf="tutti">Tutti</button>
      ${Object.entries(WTYPE).map(([k,t]) => `<button class="chip${WFILTER === k ? " on" : ""}" data-wf="${k}">${t.nome}</button>`).join("")}
    </div>
    <div class="card">
      ${lista.length ? lista.slice().sort((a,b) => (b.rating||0) - (a.rating||0) || a.name.localeCompare(b.name)).map(x => wineRow(x)).join("")
        : `<div class="empty">${S.wines.length ? "Nessuno di questo tipo." : "Segna un vino che ti è piaciuto: nome, da dove viene, con cosa lo berresti. La prossima volta al ristorante te lo ricordi."}</div>`}
      <div class="row"><button class="btn ghost wide" id="addwine">Aggiungi vino</button></div>
    </div>`;
  }

  el.innerHTML = `<div class="wrap">${baseTitolo(nome, sotto)}${corpo}<div style="height:20px"></div></div>`;
  bindAll();
  if (v === "spesa") bindSpesa();

let WFILTER = "tutti";
let DITIMER = null;

function bindDiario(){
  const t = el.querySelector("#di-today"), stato = el.querySelector("#di-stato");
  if (!t) return;
  t.oninput = () => {
    clearTimeout(DITIMER);
    if (stato) stato.textContent = "sto scrivendo…";
    DITIMER = setTimeout(() => {
      saveDiary(today(), t.value);
      if (stato) stato.textContent = `salvato alle ${toHHMM(nowMin())}`;
    }, 700);
  };
}

// i comandi della pagina spesa: giorni, data, aggiunta rapida
function bindSpesa(){
  const wn = S.shop.when;
  const paint = () => {
    el.querySelectorAll("#sh-mode .chip").forEach(b => b.classList.toggle("on", b.dataset.m === wn.type));
    el.querySelectorAll("[data-shd]").forEach(b => b.classList.toggle("on", (wn.days||[]).includes(+b.dataset.shd)));
    el.querySelector("#sh-days").style.display = wn.type === "days" ? "" : "none";
    el.querySelector("#sh-date").style.display = wn.type === "date" ? "" : "none";
  };
  el.querySelectorAll("#sh-mode .chip").forEach(b => b.onclick = () => {
    wn.type = b.dataset.m;
    if (wn.type === "date" && !wn.date) wn.date = today();
    save(); paint();
  });
  el.querySelectorAll("[data-shd]").forEach(b => b.onclick = () => {
    const g = +b.dataset.shd;
    wn.days = wn.days || [];
    wn.days = wn.days.includes(g) ? wn.days.filter(x => x !== g) : [...wn.days, g];
    save(); paint();
  });
  const dt = el.querySelector("#sh-dt");
  if (dt) dt.onchange = () => { wn.date = dt.value; save(); };
  const aggiungi = () => {
    const t = el.querySelector("#sh-new"), q = el.querySelector("#sh-qty");
    if (!t.value.trim()) return;
    addShopItem(t.value, q.value);
    render();
  };
  const ab = el.querySelector("#sh-add"); if (ab) ab.onclick = aggiungi;
  const ti = el.querySelector("#sh-new");
  if (ti) ti.onkeydown = e => { if (e.key === "Enter") aggiungi(); };
  paint();
}

function doRow(a, T){
  const fatta = isDone(T, a.id);
  return `
  <div class="row ${fatta ? "done" : ""}" data-row="${a.id}">
    <div class="imp i${a.imp}"></div>
    <button class="tick" data-tick="${a.id}" aria-label="Segna come fatta">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </button>
    <div class="rbody">
      <div class="rtitle">${esc(a.name)}</div>
      <div class="rmeta">${a.win.start}–${a.win.end}<span class="dot">·</span>${durLabel(a.dur)}<span class="dot">·</span>${esc(a.cat)}</div>
      ${timeOn(T, a.id) ? `<span class="flag">${durLabel(timeOn(T, a.id))} registrati oggi</span>` : ""}
      ${movedFrom(a, T) ? `<span class="flag moved">spostata da ${GG3[dow(movedFrom(a, T))]} ${prettyDate(movedFrom(a, T))}</span>` : ""}
    </div>
    ${fatta ? "" : `<button class="btn ghost" data-do-act="${a.id}" style="min-width:44px;padding:8px 0" aria-label="Fai adesso">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>`}
  </div>`;
}

function openDo(){
  const T = today();
  const oggi = todaysActs().filter(a => !isDone(T, a.id));
  const dopo = S.activities
    .map(a => ({ a, d: nextOcc(a, addDays(T, 1), 13) }))
    .filter(x => x.d)
    .sort((x,y) => x.d.localeCompare(y.d)).slice(0, 12);
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Cosa fai adesso?</h3>
    <div class="hint" style="margin-bottom:14px">Puoi anche portarti avanti con una dei prossimi giorni.</div>
    <h2 style="margin-top:0">Oggi</h2>
    <div class="card">
      ${oggi.length ? oggi.map(a => `
        <button class="actrow" data-pick="${a.id}">
          <div class="imp i${a.imp}" style="min-height:32px"></div>
          <div class="rbody"><div class="rtitle">${esc(a.name)}</div>
            <div class="rmeta">${a.win.start}–${a.win.end}<span class="dot">·</span>${durLabel(a.dur)}</div></div>
        </button>`).join("")
      : `<div class="empty">Oggi non resta niente.</div>`}
    </div>
    ${dopo.length ? `<h2>Nei prossimi giorni</h2>
    <div class="card">
      ${dopo.map(({a, d}) => `
        <button class="actrow" data-pick="${a.id}" data-day="${d}">
          <div class="imp i${a.imp}" style="min-height:32px"></div>
          <div class="rbody"><div class="rtitle">${esc(a.name)}</div>
            <div class="rmeta">${GG3[dow(d)]} ${prettyDate(d)}<span class="dot">·</span>${durLabel(a.dur)}</div></div>
        </button>`).join("")}
    </div>` : ""}
    <div class="btnrow"><button class="btn ghost wide" id="do-cancel">Chiudi</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#do-cancel").onclick = () => w.remove();
  w.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { w.remove(); openDoAct(b.dataset.pick, b.dataset.day); });
}

function openDoAct(id, day){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  const T = today();
  const giorno = day || (occOn(a, T).length ? T : nextOcc(a, T, 60));
  const anticipo = giorno && giorno > T;          // la fai oggi al posto di un giorno che deve ancora venire
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>${esc(a.name)}</h3>
    <div class="card" style="margin-bottom:18px">
      <div class="stat"><span>Quando</span><span>${giorno === T ? "oggi" : giorno ? `${GG3[dow(giorno)]} ${prettyDate(giorno)}` : "—"}, ${a.win.start}–${a.win.end}</span></div>
      <div class="stat"><span>Quanto dura</span><span>${durLabel(a.dur)}</span></div>
      ${timeOn(T, a.id) ? `<div class="stat"><span>Già registrati oggi</span><span>${durLabel(timeOn(T, a.id))}</span></div>` : ""}
    </div>

    <div class="field"><label>Usi il crono?</label>
      ${S.cycles.length ? `<div class="card">
        ${S.cycles.map(c => `<button class="actrow" data-runc="${c.id}">
          <div class="rbody"><div class="rtitle">${esc(c.name)}</div>
            <div class="rmeta">${c.kind === "crono" ? "cronometro, conta in avanti" : `${c.segs.length} fasi · ${durLabel(cycleTotal(c))}`}</div></div>
        </button>`).join("")}
      </div>`
      : `<div class="hint">Non hai ancora nessun ciclo. Creane uno dal tasto Crono e potrai far partire il tempo da qui.</div>`}
    </div>

    <div class="btnrow">
      <button class="btn primary" id="da-done" style="flex:2">${isDone(T, a.id) ? "Toglila da fatte" : anticipo ? "Fatta oggi, in anticipo" : "Segnala fatta"}</button>
      <button class="btn ghost" id="da-no">Senza crono</button>
    </div>
    <div class="btnrow"><button class="btn ghost wide" id="da-edit">Modifica l'attività</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelectorAll("[data-runc]").forEach(b => b.onclick = () => {
    if (anticipo){ moveOcc(a, occOn(a, giorno)[0] || giorno, T); save(); }
    w.remove(); startRun(b.dataset.runc, { id:a.id, name:a.name });
  });
  w.querySelector("#da-no").onclick = () => w.remove();
  w.querySelector("#da-done").onclick = () => {
    // portarsi avanti: il giro di quel giorno viene spostato a oggi e segnato fatto
    if (anticipo && !isDone(T, a.id)) moveOcc(a, occOn(a, giorno)[0] || giorno, T);
    w.remove(); toggleDone(a.id); render();
  };
  w.querySelector("#da-edit").onclick = () => { w.remove(); openForm(a.id); };
}

function openCrono(){
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Crono</h3>
    <div class="hint" style="margin-bottom:14px">Cicli di lavoro e pausa, o un cronometro che conta in avanti. Il tempo di lavoro finisce registrato su quello che scegli.</div>
    <div class="card">
      ${S.cycles.length ? S.cycles.map(c => `
        <div class="row">
          <div class="rbody">
            <div class="rtitle">${esc(c.name)}</div>
            <div class="rmeta">${c.kind === "crono" ? "Cronometro · conta in avanti"
              : `${c.segs.length} fasi<span class="dot">·</span>${durLabel(cycleTotal(c))} in tutto`}</div>
            ${c.kind === "timer" && c.segs.length ? `<div class="rmeta" style="color:var(--ink-faint)">${c.segs.map(g=>`${g.min}′ ${g.kind}`).join(" → ")}</div>` : ""}
          </div>
          <button class="btn primary" data-run="${c.id}">Avvia</button>
          <button class="btn ghost" data-editc="${c.id}" aria-label="Modifica">⋯</button>
        </div>`).join("")
      : `<div class="empty">Nessun ciclo. Creane uno: dagli un nome e componi le fasi, tipo 30 minuti di lavoro e 10 di pausa, ripetute quante vuoi.</div>`}
    </div>
    ${inApp() ? `<div class="btnrow"><button class="btn wide" id="cr-timer">Timer nell'orologio del telefono</button></div>` : ""}
    <div class="btnrow"><button class="btn primary wide" id="cr-add">Nuovo ciclo</button></div>
    <div class="btnrow"><button class="btn ghost wide" id="cr-close">Chiudi</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#cr-close").onclick = () => w.remove();
  w.querySelector("#cr-add").onclick = () => { w.remove(); openCycle(null); };
  const crt = w.querySelector("#cr-timer");
  if (crt) crt.onclick = () => {
    const m = prompt("Quanti minuti?", "25");
    if (m && +m > 0){ timerTelefono(+m, "Coach"); w.remove(); }
  };
  w.querySelectorAll("[data-run]").forEach(b => b.onclick = () => { w.remove(); askTarget(b.dataset.run); });
  w.querySelectorAll("[data-editc]").forEach(b => b.onclick = () => { w.remove(); openCycle(b.dataset.editc); });
}

  el.querySelectorAll("[data-rpmove]").forEach(b => b.onclick = () => doMoveOcc(b.dataset.rpmove, b.dataset.o, b.dataset.d));
  el.querySelectorAll("[data-rpskip]").forEach(b => b.onclick = () => doSkipOcc(b.dataset.rpskip, b.dataset.o));
  el.querySelectorAll("[data-rpopen]").forEach(b => b.onclick = () => openReplan(b.dataset.rpopen, b.dataset.o));
  one("addrem", () => openReminderEdit(null));
  one("addgoal", () => openGoal(null));
  one("addtr", () => openTracker(null));
  one("addfr", () => openFridgeItem(null));
  one("allfr", () => openFridgeAll());
  one("addled", () => openLedgerItem(null));
  one("allled", () => openLedgerAll());
  one("unhideall", () => { S.hidden = []; save(); render(); });
  const gp = el.querySelector("#gopause"); if (gp) gp.onclick = () => openPause(gp.dataset.lab);

  // la giornata: scorri per i prossimi 30 giorni
  const pg = el.querySelector("#pager");
  if (pg) pg.onscroll = () => {
    const second = pg.scrollLeft > pg.clientWidth / 2;
    const d0 = el.querySelector("#d0"), d1 = el.querySelector("#d1"), hint = el.querySelector("#swipehint");
    if (d0) d0.classList.toggle("on", !second);
    if (d1) d1.classList.toggle("on", second);
    if (hint) hint.textContent = second ? "scorri indietro per la giornata" : "scorri per i prossimi 30 giorni";
  };

  // i promemoria: oggi, domani, tutti
  const rp = el.querySelector("#rempager");
  if (rp){
    const pagine = [...rp.querySelectorAll(".page")];
    const quale = () => Math.round(rp.scrollLeft / Math.max(1, rp.clientWidth));
    const upd = () => {
      const i = Math.min(2, Math.max(0, quale()));
      el.querySelectorAll("#remdots .dot2").forEach((x,k) => x.classList.toggle("on", k === i));
      const b = el.querySelector("#remnext");
      if (b) b.textContent = REMPAGES[(i + 1) % 3];
      const h = pagine[i] ? pagine[i].scrollHeight : 0;
      if (h) rp.style.height = h + "px";
    };
    rp.onscroll = upd;
    const b = el.querySelector("#remnext");
    if (b) b.onclick = () => {
      const i = (quale() + 1) % 3;
      rp.scrollTo({ left: i * rp.clientWidth, behavior: "smooth" });
      setTimeout(upd, 350);
    };
    upd();
  }
}

/* ============================================================
   OBIETTIVI A SCADENZA — una volta entro la settimana, il mese, l'anno,
   oppure entro una data precisa
   ============================================================ */
const GPER = { w:"questa settimana", m:"questo mese", y:"quest'anno", d:"" };

function periodEnd(per, d){
  const dt = fromIso(d);
  if (per === "w"){ dt.setDate(dt.getDate() + (7 - ((dt.getDay()+6)%7) - 1)); return iso(dt); }
  if (per === "m"){ dt.setMonth(dt.getMonth()+1, 0); return iso(dt); }
  dt.setMonth(11, 31); return iso(dt);
}
// con una data precisa l'obiettivo si fa una volta sola; gli altri ripartono a ogni periodo
const goalKey  = g => g.per === "d" ? "d" : pKey(g.per, today());
const goalDone = g => !!(g.done && g.done[goalKey(g)]);
const goalDue  = g => g.per === "d" ? (g.due || null) : periodEnd(g.per, today());
const goalLeft = g => { const f = goalDue(g); return f ? daysBetween(today(), f) : 999; };

function goalMeta(g){
  const done = goalDone(g), left = goalLeft(g);
  if (g.per === "d"){
    if (done) return `fatto${typeof g.done.d === "string" ? ` il ${prettyDate(g.done.d)}` : ""} · era entro il ${prettyDate(g.due)}`;
    if (left < 0) return `scaduto da ${-left} ${-left === 1 ? "giorno" : "giorni"} · era entro il ${prettyDate(g.due)}`;
    return `${left === 0 ? "ultimo giorno utile" : left === 1 ? "manca 1 giorno" : `mancano ${left} giorni`} · entro ${GG3[dow(g.due)].toLowerCase()} ${prettyDate(g.due)}`;
  }
  if (done) return `fatto ${GPER[g.per]}`;
  return `${left === 0 ? "ultimo giorno utile" : left === 1 ? "manca 1 giorno" : `mancano ${left} giorni`} · ${GPER[g.per]}`;
}

function goalsHTML(){
  if (!S.goals.length) return `<div class="card">
    <div class="empty">Cose da fare una volta entro la settimana, il mese, l'anno o una data che scegli tu. Il coach ti dice quanto manca e ti avvisa.</div>
    <div class="row"><button class="btn ghost wide" id="addgoal">Aggiungi obiettivo</button></div></div>`;
  const T = today();
  // quelli con data, fatti da più di due settimane, vanno in archivio
  const vivi = S.goals.filter(g => !(g.per === "d" && goalDone(g) && g.due && daysBetween(g.due, T) > 14));
  const archivio = S.goals.filter(g => !vivi.includes(g));
  const sorted = [...vivi].sort((a,b) => (goalDone(a)?1:0) - (goalDone(b)?1:0) || goalLeft(a) - goalLeft(b));
  const riga = g => {
    const done = goalDone(g), left = goalLeft(g);
    const urgente = !done && left <= 3;
    return `<div class="row ${done ? "done" : ""}" data-row="${g.id}">
      <button class="tick" data-gtick="${g.id}" aria-label="Segna come fatto">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <div class="rbody">
        <div class="rtitle">${esc(g.name)}</div>
        <div class="rmeta" style="${urgente ? "color:var(--warn)" : ""}">${esc(goalMeta(g))}</div>
        ${timeOn(T, g.id) ? `<span class="flag">${durLabel(timeOn(T, g.id))} registrati oggi</span>` : ""}
      </div>
      <button class="btn ghost" data-gedit="${g.id}" style="min-width:40px;padding:8px 0" aria-label="Modifica">&#9881;</button>
    </div>`;
  };
  return `<div class="card">
    ${sorted.map(riga).join("")}
    <div class="row"><button class="btn ghost wide" id="addgoal">Aggiungi obiettivo</button></div>
  </div>
  ${archivio.length ? `<details class="card" style="margin-top:16px">
    <summary style="padding:13px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer">Fatti · ${archivio.length}</summary>
    ${archivio.map(riga).join("")}
  </details>` : ""}`;
}

function toggleGoal(id){
  const g = S.goals.find(x => x.id === id); if (!g) return;
  const k = goalKey(g);
  g.done = g.done || {};
  if (g.done[k]) delete g.done[k]; else g.done[k] = g.per === "d" ? today() : true;
  save();
  markRow(id, g.done[k]);
  const row = document.querySelector(`[data-row="${id}"] .rmeta`);
  if (row){
    row.textContent = goalMeta(g);
    row.style.color = (!g.done[k] && goalLeft(g) <= 3) ? "var(--warn)" : "";
  }
  patchToday();
}

/* ---------- PROSSIMI 30 GIORNI ---------- */
function monthHTML(){
  const T = today();
  const days = [];
  for (let i = 0; i < 30; i++){
    const d = addDays(T, i);
    const evs = [];
    for (const o of S.oneoffs){
      if (o.showInMonth === false) continue;
      const fine = o.endDate || o.date;
      if (d < o.date || d > fine) continue;
      evs.push({ t: o.allDay ? "tutto il dì" : `${d === o.date ? o.start : "00:00"}–${d === fine ? o.end : "24:00"}`, n:o.label });
    }
    for (const f of S.fixed) if (f.showInMonth && f.days.includes(dow(d)))
      evs.push({ t:`${f.start}–${f.end}`, n:f.label });
    // da Google: gli eventi sempre, gli impegni ripetuti solo se l'hai chiesto
    if (S.gcalOn) for (const g of gcalOnDay(d)){
      if (g.recurring && !gcxOf(g.key).showInMonth) continue;
      evs.push({ t: g.allDay ? "tutto il dì" : `${toHHMM(g.s)}–${toHHMM(g.e)}`, n:g.label, nuovo: !gcCompletato(g.key) });
    }
    for (const a of actsOn(d))
      evs.push({ t:`${a.win.start}–${a.win.end}`, n:a.name });
    for (let k = evs.length - 1; k >= 0; k--) if (S.hidden.includes(evs[k].n)) evs.splice(k,1);
    if (evs.length){
      evs.sort((x,y) => x.t.localeCompare(y.t));
      days.push({ d, evs });
    }
  }
  const restore = S.hidden.length
    ? `<div class="row"><button class="btn ghost wide" id="unhideall">Rimetti i ${S.hidden.length} nascosti</button></div>` : "";
  if (!days.length) return `<div class="card"><div class="empty">Nessun impegno nei prossimi 30 giorni.</div>${restore}</div>`;
  return `<div class="card" style="max-height:314px;overflow-y:auto">${restore}
    ${days.map(x => `
      <div class="monthday">
        <b>${GG3[dow(x.d)]} ${prettyDate(x.d)}</b>
        ${x.evs.map(e => `<div class="mev"><span>${e.t}</span><span style="flex:1"${e.nuovo ? ` class="gcnuovo"` : ""}>${esc(e.n)}</span><button data-hide="${esc(e.n)}" style="background:none;border:0;color:var(--ink-faint);font-size:15px;padding:0 4px" aria-label="Nascondi">&times;</button></div>`).join("")}
      </div>`).join("")}
  </div>`;
}

/* ---------- DA RIDECIDERE ----------
   Le attività rimaste indietro. Il coach guarda i prossimi giorni, ti dice
   dove starebbero meglio e perché. Finché non scegli, resta tutto com'è. */
function replanTip(a){
  const T = today();
  const prossimo = nextOcc(a, T, 60);
  const gg = prossimo ? daysBetween(T, prossimo) : null;
  // si cerca prima del prossimo giro: dopo non avrebbe senso recuperare
  const quanti = gg === null ? 7 : Math.max(1, Math.min(7, gg));
  const sugg = suggestDays({ from:T, days:quanti, dur:a.dur, win:a.win, actId:a.id, allowed:a.days });
  return { prossimo, gg, sugg, best: sugg.find(x => x.fits) || null };
}

function replanRow(m){
  const { a, orig, day } = m;
  const tip = replanTip(a);
  const saltaMeglio = tip.gg !== null && tip.gg <= 2;
  let consiglio, primo;
  if (saltaMeglio || !tip.best){
    consiglio = saltaMeglio
      ? `Il prossimo giro è già ${tip.gg === 1 ? "domani" : "dopodomani"}: ti consiglio di saltare questo.`
      : `Prima del prossimo giro non trovo spazio nella fascia ${a.win.start}–${a.win.end}. Puoi scegliere un giorno a mano o saltarla.`;
    primo = `<button class="on" data-rpskip="${a.id}" data-o="${orig}">Salta questo giro</button>`;
  } else {
    consiglio = `Ti consiglio <b>${esc(dayChip(tip.best.d).toLowerCase())}</b>: ${esc(whyDay(tip.best))}.`;
    primo = `<button class="on" data-rpmove="${a.id}" data-o="${orig}" data-d="${tip.best.d}">Spostala a ${esc(dayChip(tip.best.d).toLowerCase())}</button>`;
  }
  return `
  <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="rbody">
      <div class="rtitle">${esc(a.name)}</div>
      <div class="rmeta">non fatta ${GG[dow(day)].toLowerCase()} ${prettyDate(day)}${day !== orig ? ` (l'avevi spostata dal ${prettyDate(orig)})` : ""}${tip.prossimo ? `<span class="dot">·</span>prossimo giro ${esc(dayChip(tip.prossimo).toLowerCase())}` : ""}</div>
      <div class="rmeta" style="color:var(--ink);margin-top:6px">${consiglio}</div>
    </div>
    <div class="why" style="margin-top:0">
      ${primo}
      <button data-rpopen="${a.id}" data-o="${orig}">Altre date</button>
      ${saltaMeglio || !tip.best ? "" : `<button data-rpskip="${a.id}" data-o="${orig}">Salta</button>`}
    </div>
  </div>`;
}

function replanHTML(T){
  const lista = missedList();
  if (!lista.length) return "";
  return `<h2 id="h-replan">Da ridecidere · ${lista.length}</h2>

function doMoveOcc(id, orig, d){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  moveOcc(a, orig, d);
  runEngine(); save(); render();
}
function doSkipOcc(id, orig){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  skipOcc(a, orig);
  runEngine(); save(); render();
}

// Il foglio con tutte le possibilità: i giorni consigliati, un giorno a scelta,
// "l'avevo fatta", "salta".
function openReplan(id, orig, opts){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  opts = opts || {};
  const T = today();
  const giorno = (a.moves && a.moves[orig]) || orig;
  const tip = replanTip(a);
  const tutti = suggestDays({ from:T, days:14, dur:a.dur, win:a.win, actId:a.id, allowed:a.days });
  // prima i giorni che vengono prima del prossimo giro; quelli dopo solo se non c'è altro
  const prima = tutti.filter(x => x.fits && (!tip.prossimo || x.d < tip.prossimo));
  const top = (prima.length ? prima : tutti.filter(x => x.fits && x.d !== tip.prossimo)).slice(0, 4);
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>${esc(a.name)}</h3>
    <div class="hint" style="margin-bottom:16px">Doveva essere ${GG[dow(giorno)].toLowerCase()} ${prettyDate(giorno)}, nella fascia ${a.win.start}–${a.win.end}, ${durLabel(a.dur)}.${tip.prossimo ? ` Il prossimo giro normale è ${dayChip(tip.prossimo).toLowerCase()}.` : ""}</div>

    <h2 style="margin-top:0">I giorni che ti consiglio</h2>
    <div class="card">
      ${top.length ? top.map((x,i) => `
        <button class="actrow" data-go="${x.d}">
          <div class="imp" style="min-height:34px;background:${i === 0 ? "var(--accent)" : "var(--line)"}"></div>
          <div class="rbody">
            <div class="rtitle">${esc(dayChip(x.d))}${tip.prossimo && x.d >= tip.prossimo ? ` <span style="font-weight:400;color:var(--ink-faint)">· dopo il prossimo giro</span>` : ""}</div>
            <div class="rmeta">${esc(whyDay(x))}</div>
          </div>
        </button>`).join("")
      : `<div class="empty">Nelle prossime due settimane la fascia ${a.win.start}–${a.win.end} è sempre occupata. Scegli un giorno qui sotto: puoi comunque farla quando vuoi.</div>`}
    </div>

    <div class="field" style="margin-top:16px"><label>Un altro giorno</label>
      <div class="segline">
        <input type="date" id="rp-d" min="${T}" value="${addDays(T, 1)}" style="flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">
        <button class="btn" id="rp-go" style="flex:0 0 auto">Sposta lì</button>
      </div>
      <div class="hint" id="rp-load"></div></div>

    <div class="btnrow"><button class="btn wide" id="rp-done">L'avevo fatta, non l'avevo segnata</button></div>
    <div class="btnrow"><button class="btn ghost wide" id="rp-skip">Salta questo giro</button></div>
    <div class="btnrow"><button class="btn ghost wide" id="rp-close">Decido dopo</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  const fine = () => { w.remove(); if (opts.dopo) opts.dopo(); else { runEngine(); save(); render(); } };
  const inp = w.querySelector("#rp-d"), load = w.querySelector("#rp-load");
  const anteprima = () => {
    const d = inp.value;
    if (!d){ load.textContent = ""; return; }
    const L = dayLoad(d, a.id);
    const room = freeRoom(d, a.win);
    load.textContent = `${loadLine(L)}${room >= a.dur ? "" : ` · nella fascia ${a.win.start}–${a.win.end} non c'è spazio`}.`;
  };
  inp.oninput = anteprima; anteprima();
  w.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { moveOcc(a, orig, b.dataset.go); fine(); });
  w.querySelector("#rp-go").onclick = () => {
    const d = inp.value;
    if (!d || d < T){ alert("Scegli un giorno da oggi in avanti."); return; }
    moveOcc(a, orig, d); fine();
  };
  w.querySelector("#rp-done").onclick = () => {
    S.log[giorno] = S.log[giorno] || {};
    S.log[giorno][a.id] = true;
    a.doneCount = (a.doneCount || 0) + 1;
    if (!a.lastDone || giorno > a.lastDone) a.lastDone = giorno;
    fine();
  };
  w.querySelector("#rp-skip").onclick = () => { skipOcc(a, orig); fine(); };
  w.querySelector("#rp-close").onclick = () => w.remove();
}

/* ---------- CHIUSURA SERALE ---------- */
const REASONS = [
  ["tempo",  "Non ho avuto tempo"],
  ["voglia", "Non ne avevo voglia"],
  ["altro",  "Si è incastrato altro"],
  ["giorno", "Non era il giorno giusto"]
];
// Caso a parte: la cosa non andava fatta. Non è un fallimento tuo ma della
// programmazione, quindi conta come completata e il coach se ne ricorda.
const R_VUOTO = "vuoto";
const R_VUOTO_LABEL = "Non c'era nulla da fare";

function undoneToday(T){
  const out = [];
  for (const a of planFor(T)) if (!isDone(T, a.id)) out.push({ id:a.id, name:a.name, kind:"attività" });
  for (const x of gcalTodosOn(T)) if (!isDone(T, x.id)) out.push({ id:x.id, name:x.name, kind:"dal calendario" });
  for (const i of allRoutineItems()) if (!rDone(T, i.id)) out.push({ id:i.id, name:i.text, kind:"routine" });
  for (const r of remindersOn(T)) if (!readToday(T, r.id)) out.push({ id:r.id, name:r.text, kind:"promemoria" });
  for (const t of tripItemsOn(T)) if (!tripDone(t.tripId, t.id)) out.push({ id:t.id, name:t.text, kind:"valigia · " + t.tripName });
  return out;
}

// La chiusura si può fare dall'ora scelta fino alle 3 di notte.
// Dopo mezzanotte riguarda il giorno appena finito, non quello appena iniziato.
function closeTarget(){
  if (isPaused() || S.resume) return null;
  const n = nowMin();
  if (n < 3 * 60) return addDays(today(), -1);
  if (n >= toMin(S.closeAt)) return today();
  return null;
}

function closeHTML(){
  const d = closeTarget();
  if (!d) return "";
  const ieri = d !== today();
  const done = S.closes[d];
  if (done) return `<div class="closecard"><div class="rbody">
      <div class="rtitle">${ieri ? "Ieri chiuso" : "Giornata chiusa"} al ${done.pct}%</div>
      <div class="rmeta">Ci si rivede stasera.</div></div>
      <button class="btn ghost" id="reopen">Riapri</button></div>`;
  const p = progressOn(d);
  return `<div class="closecard"><div class="rbody">
      <div class="rtitle">Chiudi ${ieri ? "la giornata di ieri" : "la giornata"}</div>
      <div class="rmeta" id="close-meta">${ieri ? `${GG[dow(d)]} ${prettyDate(d)} · ` : ""}${p.pct}%, ${p.done} cose su ${p.total}.</div></div>
      <button class="btn primary" id="doclose">Chiudi</button></div>`;
}

function openClose(){
  const T = closeTarget() || today();
  const left = undoneToday(T);
  const picks = {};
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Come è andata${closeTarget() && closeTarget() !== today() ? " ieri" : " oggi"}</h3>
    <div style="font-size:15px;color:var(--ink-soft);margin-bottom:20px" id="cl-top"></div>
    <div id="cl-list">
      ${left.map(x => `
        <div class="card" style="padding:13px 14px;margin-bottom:9px">
          <div class="rtitle">${esc(x.name)}</div>
          <div class="rmeta">${x.kind}</div>
          <div class="why" data-for="${x.id}">
            ${REASONS.map(([k,l]) => `<button data-r="${k}">${l}</button>`).join("")}
            ${x.kind === "attività" ? `<button data-r="${R_VUOTO}" class="vuoto">${R_VUOTO_LABEL}</button>` : ""}
          </div>
        </div>`).join("")}
    </div>
    <div class="field" style="margin-top:4px"><label>Due righe sulla giornata</label>
      <textarea id="cl-note" rows="3" placeholder="Come è andata, cosa è successo…"
        style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical"></textarea></div>
    <div class="btnrow">
      <button class="btn primary wide" id="cl-save">Chiudi la giornata</button>
    </div>
    <div class="btnrow"><button class="btn ghost wide" id="cl-cancel">Non adesso</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  // "Non c'era nulla da fare" vale come fatta: la percentuale si aggiorna subito.
  const top = w.querySelector("#cl-top");
  function refreshTop(){
    const vuoti = Object.values(picks).filter(r => r === R_VUOTO).length;
    const q = progressOn(T, picks);
    const resta = left.length - vuoti;
    top.textContent = `${q.pct}% della giornata, ${q.done} cose su ${q.total}.`
      + (resta ? ` Restano ${resta} cose. Dimmi perché, con un tocco.`
               : left.length ? " Niente rimasto indietro." : " Non è rimasto niente indietro.");
  }
  refreshTop();

  w.querySelectorAll(".why").forEach(g => {
    g.querySelectorAll("button").forEach(b => b.onclick = () => {
      const id = g.dataset.for, r = b.dataset.r;
      if (picks[id] === r) delete picks[id]; else picks[id] = r;
      g.querySelectorAll("button").forEach(x => x.classList.toggle("on", picks[id] === x.dataset.r));
      refreshTop();
    });
  });
  w.querySelector("#cl-cancel").onclick = () => w.remove();
  w.querySelector("#cl-save").onclick = () => {
    // le cose segnate "non c'era nulla da fare" entrano nel registro come completate
    S.log[T] = S.log[T] || {};
    for (const id in picks) if (picks[id] === R_VUOTO) S.log[T][id] = true;
    const q = progressOn(T);
    S.closes[T] = { pct: q.pct, at: Date.now(), reasons: picks,
                    note: (w.querySelector("#cl-note").value || "").trim() };
    save(); w.remove(); render();
  };
}

/* ============================================================
   STATISTICHE — quello che i dati sanno dire, niente di più
   ============================================================ */
const REASON_LABEL = Object.fromEntries(REASONS);

// quanti degli ultimi n giorni erano in pausa: non sono giornate andate male
function pausedIn(n){
  const T = today();
  let c = 0;
  for (let i = 1; i <= n; i++) if (S.pausedDays[addDays(T, -i)]) c++;
  return c;
}

function closedDays(n){
  const T = today(), out = [];
  for (let i = 1; i <= n; i++){
    const d = addDays(T, -i);
    if (S.closes[d]) out.push({ d, c: S.closes[d] });
  }
  return out;
}

function barHTML(rows){
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `
    <div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px">
        <span>${esc(r.k)}</span><span style="color:var(--ink-soft)">${r.v}</span>
      </div>
      <div style="height:6px;border-radius:3px;background:var(--surface-2);margin-top:4px">
        <div style="height:100%;width:${Math.round(r.v/max*100)}%;background:var(--accent);border-radius:3px"></div>
      </div>
    </div>`).join("");
}

function openStats(){
  const T = today();
  const last30 = closedDays(30), last7 = closedDays(7);
  const avg = a => a.length ? Math.round(a.reduce((s,x)=>s+x.c.pct,0)/a.length) : null;

  // motivi
  const rc = {}, vuoti = {};
  for (const x of last30) for (const id in (x.c.reasons||{})){
    const r = x.c.reasons[id];
    if (r === R_VUOTO){
      const a = S.activities.find(y => y.id === id);
      const nm = a ? a.name : "una cosa tolta";
      vuoti[nm] = (vuoti[nm] || 0) + 1;
    } else rc[r] = (rc[r]||0)+1;
  }
  const reasonRows = Object.entries(rc).map(([k,v]) => ({ k: REASON_LABEL[k] || k, v }))
                           .sort((a,b) => b.v - a.v);
  const vuotoRows = Object.entries(vuoti).map(([k,v]) => ({ k, v })).sort((a,b) => b.v - a.v);

  // attività più saltate
  const skipped = S.activities.filter(a => a.skipCount).sort((a,b) => b.skipCount - a.skipCount).slice(0,5);

  // tempo registrato negli ultimi 30 giorni
  const tt = {};
  for (let i = 0; i < 30; i++){
    const d = addDays(T, -i);
    for (const id in (S.timeLog[d] || {})){
      const a = S.activities.find(x => x.id === id) || S.goals.find(x => x.id === id) || S.oneoffs.find(x => x.id === id);
      const nm = a ? (a.name || a.label) : "altro";
      tt[nm] = (tt[nm] || 0) + S.timeLog[d][id];
    }
  }
  const timeRows = Object.entries(tt).map(([k,v]) => ({ k, v: Math.round(v) })).sort((a,b)=>b.v-a.v).slice(0,6);

  // sonno nei giorni buoni e in quelli storti
  let sleepLine = "";
  const sonno = S.health.find(v => v.type === "sonno");
  if (sonno && last30.length >= 6){
    const media = avg(last30);
    const sopra = [], sotto = [];
    for (const x of last30){
      const s = hVal(x.d, sonno.id);
      if (!s) continue;
      (x.c.pct >= media ? sopra : sotto).push(s.min);
    }
    if (sopra.length >= 3 && sotto.length >= 3){
      const m = a => Math.round(a.reduce((s,x)=>s+x,0)/a.length);
      sleepLine = `Nei giorni chiusi sopra la tua media dormi ${durLabel(m(sopra))}. In quelli sotto, ${durLabel(m(sotto))}.`;
    }
  }

  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Statistiche</h3>

    <h2 style="margin-top:0">Chiusure</h2>
    <div class="card">
      <div class="stat"><span>Media ultimi 7 giorni</span><span>${avg(last7) ?? "—"}${avg(last7)!==null?"%":""}</span></div>
      <div class="stat"><span>Media ultimi 30 giorni</span><span>${avg(last30) ?? "—"}${avg(last30)!==null?"%":""}</span></div>
      <div class="stat"><span>Giorni chiusi su 30</span><span>${last30.length}</span></div>
      ${pausedIn(30) ? `<div class="stat"><span>Giorni in pausa</span><span>${pausedIn(30)}</span></div>` : ""}
    </div>
    ${last30.length < 5 ? `<div class="hint">Servono almeno cinque sere chiuse perché questi numeri dicano qualcosa.</div>` : ""}

    ${(S.fridgeStats.usati || S.fridgeStats.buttati) ? `
    <h2>Frigo</h2>
    <div class="card">
      <div class="stat"><span>Consumato in tempo</span><span>${S.fridgeStats.usati||0}</span></div>
      <div class="stat"><span>Buttato</span><span>${S.fridgeStats.buttati||0}</span></div>
      <div class="stat"><span>Dentro adesso</span><span>${S.fridge.length}</span></div>
    </div>` : ""}

    <h2>Perché le cose restano indietro</h2>
    <div class="card" style="padding:14px">
      ${reasonRows.length ? barHTML(reasonRows)
        : `<div style="color:var(--ink-soft);font-size:14px">Ancora nessun motivo registrato.</div>`}
    </div>
    ${reasonRows.length >= 3 ? `<div class="hint">Il motivo più frequente dice che tipo di problema hai: il tempo si risolve spostando, la voglia no.</div>` : ""}

    ${vuotoRows.length ? `
    <h2>Programmate quando non servivano</h2>
    <div class="card" style="padding:14px">${barHTML(vuotoRows)}</div>
    <div class="hint">Non è roba che hai saltato: era il programma sbagliato. Se una torna spesso, abbassale la frequenza dalla scheda Attività.</div>` : ""}

    <h2>Dove è finito il tempo</h2>
    <div class="card" style="padding:14px">
      ${timeRows.length ? barHTML(timeRows.map(r => ({ k:r.k, v:r.v })))
        : `<div style="color:var(--ink-soft);font-size:14px">Nessun tempo registrato. Fai partire un ciclo dal Crono scegliendo su cosa lavori.</div>`}
    </div>

    <h2>Attività più saltate</h2>
    <div class="card">
      ${skipped.length ? skipped.map(a => `
        <div class="stat"><span>${esc(a.name)}</span><span>${a.skipCount} volte</span></div>`).join("")
        : `<div class="empty">Nessuna attività saltata. Buon segno.</div>`}
    </div>

    ${sleepLine ? `<h2>Sonno e giornate</h2><div class="card"><div class="empty" style="color:var(--ink)">${esc(sleepLine)}</div></div>
      <div class="hint">È solo una coincidenza nei numeri, non una spiegazione.</div>` : ""}

    ${last30.some(x => x.c.note) ? `
    <h2>Le tue note</h2>
    <div class="card">
      ${last30.filter(x => x.c.note).slice(0,10).map(x => `
        <div class="monthday"><b>${GG3[dow(x.d)]} ${prettyDate(x.d)} · ${x.c.pct}%</b>
          <div class="mev"><span style="flex:1">${esc(x.c.note)}</span></div></div>`).join("")}
    </div>` : ""}

    <h2>Riparti da zero</h2>
    <div class="card">
      <div class="row">
        <div class="rbody">
          <div class="rtitle">Azzera le statistiche</div>
          <div class="rmeta">Cancella chiusure, note, tempo registrato, spunte e conteggi. Attività, impegni, routine e cicli restano.</div>
        </div>
      </div>
      <div class="row"><button class="btn danger wide" id="st-reset">Azzera le statistiche</button></div>
    </div>
    <div class="btnrow"><button class="btn ghost wide" id="st-close">Chiudi</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#st-close").onclick = () => w.remove();
  armDelete(w.querySelector("#st-reset"), "Azzera le statistiche", () => {
    resetStats(); w.remove(); render();
  });
}

/* ---------- RESET ---------- */

// Cancella solo lo storico: quello che hai costruito resta.
function resetStats(){
  S.log = {};       // spunte delle attività
  S.rlog = {};      // routine
  S.remlog = {};    // promemoria letti
  S.tlog = {};      // conteggi Extra
  S.hlog = {};      // salute
  S.timeLog = {};   // tempo registrato dal Crono
  S.durLog = {};    // quanto ci metti davvero
  S.closes = {};    // chiusure serali e note
  S.dayPlan = {};
  S.notices = [];
  const T0 = today();
  S.activities.forEach(a => {
    a.doneCount = 0; a.skipCount = 0; a.lastDone = null;
    a.handled = {}; a.skips = {};
    // gli spostamenti già decisi per i prossimi giorni restano
    const mv = {};
    for (const o in (a.moves || {})) if (a.moves[o] >= T0) mv[o] = a.moves[o];
    a.moves = mv;
    // da oggi si riparte: niente giri "saltati" nel passato
    if (!a.from || a.from < T0) a.from = T0;
  });
  S.goals.forEach(g => { g.done = {}; });
  S.lastRun = null;
  runEngine();
  save();
}

// Riporta l'app a com'era appena aperta: via tutto.
function resetAll(){
  const fresh = structuredClone(DEFAULT_STATE);
  fresh.gcalOn = S.gcalOn;        // il collegamento al calendario resta com'era
  fresh.skin = S.skin;            // e anche i colori che hai scelto
  fresh.mode = S.mode;
  fresh.updatedAt = Date.now();
  S = fresh;
  S.lastRun = null;
  runEngine();
  save();
}

/* ============================================================
   VALIGIA — la lista di un viaggio, che esce da sola il giorno prima
   ============================================================ */
const tripDone = (tid, iid) => !!(S.triplog[tid] && S.triplog[tid][iid]);

// Quando si vede: dal numero di giorni prima che hai scelto (di norma uno solo),
// e il giorno della partenza solo se è rimasto qualcosa da mettere in valigia.
function tripVisible(t, d){
  if (!t.date || !(t.items || []).length) return false;
  const dd = daysBetween(d, t.date);
  const lead = Math.max(1, t.lead || 1);
  if (dd >= 1 && dd <= lead) return true;
  if (dd === 0) return t.items.some(i => !tripDone(t.id, i.id));
  return false;
}
const tripsOn = d => S.trips.filter(t => tripVisible(t, d))
                            .sort((a,b) => a.date.localeCompare(b.date));
const tripItemsOn = d => tripsOn(d).flatMap(t => t.items.map(i => ({ ...i, tripId:t.id, tripName:t.name })));

function tripWhenLabel(t, d){
  const dd = daysBetween(d, t.date);
  if (dd === 0) return "si parte oggi";
  if (dd === 1) return "si parte domani";
  return `si parte fra ${dd} giorni`;
}

function tripHTML(T){
  const viaggi = tripsOn(T);
  if (!viaggi.length) return "";
  return viaggi.map(t => {
    const fatte = t.items.filter(i => tripDone(t.id, i.id)).length;
    return `
    <h2 id="h-trip-${t.id}">Valigia · ${esc(t.name)} · ${tripWhenLabel(t, T)} · ${fatte}/${t.items.length}</h2>
    <div class="card">
      ${t.items.map(i => `
        <div class="row ${tripDone(t.id, i.id) ? "done" : ""}" data-row="${i.id}">
          <button class="tick" data-ttick="${i.id}" data-trip="${t.id}" aria-label="Segna come messa in valigia">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
          <div class="rbody"><div class="rtitle">${esc(i.text)}</div></div>
        </div>`).join("")}
      ${(t.docs || []).length ? docsListHTML(t, false) : ""}
      <div class="row"><button class="btn ghost wide" data-tedit="${t.id}">Modifica la lista</button></div>
    </div>`;
  }).join("");
}

function toggleTripItem(tid, iid){
  S.triplog[tid] = S.triplog[tid] || {};
  if (S.triplog[tid][iid]) delete S.triplog[tid][iid]; else S.triplog[tid][iid] = true;
  save();
  markRow(iid, S.triplog[tid][iid]);
  patchToday();
}

function patchTripHead(){
  const T = today();
  for (const t of tripsOn(T)){
    const h = document.getElementById("h-trip-" + t.id);
    if (!h) continue;
    const fatte = t.items.filter(i => tripDone(t.id, i.id)).length;
    h.textContent = `Valigia · ${t.name} · ${tripWhenLabel(t, T)} · ${fatte}/${t.items.length}`;
  }
}

    <div class="field"><label>Cosa preparare</label>
      <div id="v-items"></div>
      <button class="btn wide ghost" id="v-add" style="margin-top:4px">Aggiungi voce</button></div>
    <div class="field"><label>Documenti</label>
      <div class="card" id="v-docs" style="margin-bottom:9px"></div>
      <button class="btn wide ghost" id="v-docadd">Aggiungi documenti</button>
      <div class="hint" id="v-docstato">${syncPronto()
        ? "Biglietti, prenotazioni, assicurazione: si salvano nel tuo deposito privato e restano anche qui, per aprirli senza rete."
        : "La sincronizzazione è spenta: i documenti restano solo su questo dispositivo. Accendila nelle impostazioni per ritrovarli ovunque."}</div></div>
    <div class="btnrow">
      <button class="btn primary" id="v-save" style="flex:2">Salva</button>
      <button class="btn ghost" id="v-cancel">Annulla</button>
    </div>
    ${id ? `<div class="btnrow"><button class="btn ghost wide" id="v-clear">Togli tutte le spunte</button></div>
            <div class="btnrow"><button class="btn danger wide" id="v-del">Elimina viaggio</button></div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  let lead = Math.max(1, t.lead || 1);
  function paintLead(){ w.querySelectorAll("#v-lead .chip").forEach(b => b.classList.toggle("on", +b.dataset.l === lead)); }
  w.querySelectorAll("#v-lead .chip").forEach(b => b.onclick = () => { lead = +b.dataset.l; paintLead(); });
  paintLead();

  const box = w.querySelector("#v-items");
  function draw(){
    box.innerHTML = items.map((it,i) => `
      <div class="segline">
        <input type="text" data-t="${i}" value="${esc(it.text)}" placeholder="Cosa metti in valigia" style="flex:1">
        <button data-x="${i}" aria-label="Togli voce">×</button>

    box.querySelectorAll("[data-t]").forEach(inp => inp.oninput = () => items[+inp.dataset.t].text = inp.value);
    box.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { items.splice(+b.dataset.x,1); draw(); });

  draw();
  w.querySelector("#v-add").onclick = () => {
    items.push({ id:"vi"+Date.now()+Math.floor(Math.random()*999), text:"" }); draw();
    const last = box.querySelector(".segline:last-child input"); if (last) last.focus();
  };
  // i documenti si salvano subito, anche prima di premere Salva
  const docBox = w.querySelector("#v-docs"), docStato = w.querySelector("#v-docstato");
  const vivo = () => S.trips.find(x => x.id === t.id);
  function drawDocs(){
    const tv = vivo();
    docBox.innerHTML = (tv && docsListHTML(tv, true)) || `<div class="empty" style="padding:13px 14px">Nessun documento.</div>`;
    bindDocs(docBox, drawDocs);
  }
  drawDocs();
  w.querySelector("#v-docadd").onclick = () => {
    if (!vivo()){
      // viaggio nuovo: lo salvo adesso, così i documenti hanno dove stare
      const name = w.querySelector("#v-name").value.trim(), date = w.querySelector("#v-d").value;
      if (!name || !date){ alert("Prima scrivi dove vai e il giorno della partenza."); return; }
      S.trips.push({ ...t, name, date, lead, items: items.filter(i => i.text.trim()), docs: [] });
      save();
    }
    const inp = document.createElement("input");
    inp.type = "file"; inp.multiple = true;
    inp.onchange = async () => {
      const files = [...(inp.files || [])];

        docStato.textContent = `Salvo ${f.name}…`;
        try { await docAdd(vivo(), f); save(); }
        catch(e){ alert(`${f.name}: non sono riuscito a caricarlo (${e && e.message || e}).`); }
        drawDocs();
      }
      docStato.textContent = files.length ? `Fatto: ${files.length} ${files.length === 1 ? "documento aggiunto" : "documenti aggiunti"}.` : docStato.textContent;
    };
    inp.click();
  };

  w.querySelector("#v-cancel").onclick = () => { w.remove(); render(); };
  const clr = w.querySelector("#v-clear");

  if (id) armDelete(w.querySelector("#v-del"), "Elimina viaggio", () => {
    const tv = vivo();
    if (tv) for (const d of (tv.docs || []).slice()) docRemove(tv, d.id);
    S.trips = S.trips.filter(x => x.id !== id);
    delete S.triplog[id];

  });
  w.querySelector("#v-save").onclick = () => {
    const name = w.querySelector("#v-name").value.trim();
    const date = w.querySelector("#v-d").value;
    if (!name){ alert("Serve un nome."); return; }
    if (!date){ alert("Serve il giorno della partenza."); return; }
    const next = { ...t, ...(vivo() || {}), name, date, lead, items: items.filter(i => i.text.trim()) };
    const i = S.trips.findIndex(x => x.id === t.id);
    if (i >= 0) S.trips[i] = next; else S.trips.push(next);
    S.trips.sort((a,b) => a.date.localeCompare(b.date));
    save(); w.remove(); render();
  };
}

/* ============================================================
   DOCUMENTI DEI VIAGGI — biglietti, prenotazioni, PDF, foto
   Il file vive nel tuo deposito privato (lo stesso della sincronizzazione),
   così lo ritrovi su ogni dispositivo. Una copia resta anche qui dentro,
   per aprirlo senza rete: in aeroporto non si sa mai.
   ============================================================ */
const DOCDB = { db: null };

function docDb(){
  if (DOCDB.db) return Promise.resolve(DOCDB.db);
  return new Promise((ok, ko) => {
    try {
      const r = indexedDB.open("coach-documenti", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("file");
      r.onsuccess = () => { DOCDB.db = r.result; ok(r.result); };
      r.onerror = () => ko(r.error);
    } catch(e){ ko(e); }
  });
}
async function docPut(id, blob){
  const db = await docDb();
  return new Promise((ok, ko) => {
    const t = db.transaction("file", "readwrite");
    t.objectStore("file").put(blob, id);
    t.oncomplete = () => ok(true); t.onerror = () => ko(t.error);
  });
}
async function docGet(id){
  try {
    const db = await docDb();
    return await new Promise((ok) => {
      const r = db.transaction("file").objectStore("file").get(id);
      r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null);
    });
  } catch(e){ return null; }
}
async function docDel(id){
  try {
    const db = await docDb();
    db.transaction("file", "readwrite").objectStore("file").delete(id);
  } catch(e){}
}

const blobToB64 = blob => new Promise((ok, ko) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => ko(r.error);
  r.readAsDataURL(blob);
});

const kb = n => n >= 1048576 ? `${(n / 1048576).toFixed(1).replace(".", ",")} MB` : `${Math.max(1, Math.round(n / 1024))} kB`;
const docPathSafe = s => String(s || "documento").replace(/[^\w.\-]+/g, "_").slice(-80);

async function ghDoc(metodo, path, corpo, raw){
  const url = `https://api.github.com/repos/${S.sync.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
  return fetch(url, {
    method: metodo,
    headers: {
      "Authorization": "Bearer " + S.sync.token,
      "Accept": raw ? "application/vnd.github.raw" : "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
}

// Aggiunge un file a un viaggio: copia qui, poi su GitHub se la sincronizzazione c'è.
async function docAdd(trip, file){
  const id = "doc" + Date.now() + Math.floor(Math.random() * 999);
  const doc = { id, name: file.name || "documento", type: file.type || "application/octet-stream", size: file.size || 0, at: Date.now() };
  await docPut(id, file);
  if (syncPronto()){
    const path = `documenti/viaggi/${trip.id}/${id}-${docPathSafe(doc.name)}`;
    const r = await ghDoc("PUT", path, { message: `documento ${doc.name}`, content: await blobToB64(file) });
    if (!r.ok) throw new Error(`GitHub ha risposto ${r.status}`);
    const j = await r.json();
    doc.path = path; doc.sha = j.content && j.content.sha;
  } else doc.local = true;
  trip.docs = trip.docs || [];
  trip.docs.push(doc);
  return doc;
}

// Il file: dalla copia qui dentro se c'è, altrimenti da GitHub (e poi resta qui).
async function docBlob(doc){
  let b = await docGet(doc.id);
  if (b) return b;
  if (!doc.path || !syncPronto()) return null;
  const r = await ghDoc("GET", doc.path, null, true);
  if (!r.ok) throw new Error(`GitHub ha risposto ${r.status}`);
  b = await r.blob();
  if (doc.type) b = new Blob([b], { type: doc.type });
  try { await docPut(doc.id, b); } catch(e){}
  return b;
}

async function docOpen(doc){
  try {
    const b = await docBlob(doc);
    if (!b){ alert(doc.local ? "Questo documento è rimasto sull'altro dispositivo: era stato aggiunto senza sincronizzazione." : "Non riesco a scaricarlo: serve la rete e la sincronizzazione accesa."); return; }
    if (inApp() && typeof NAT.apriFile === "function"){
      const r = NAT.apriFile(await blobToB64(b), doc.type || b.type || "", doc.name);
      if (r && r !== "ok") alert("Non riesco ad aprirlo: " + r);
      return;
    }
    const u = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = u; a.target = "_blank"; a.rel = "noopener";
    if (!/^(application\/pdf|image\/)/.test(doc.type || "")) a.download = doc.name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 60000);
  } catch(e){ alert("Non riesco ad aprirlo: " + (e && e.message || e)); }
}

async function docRemove(trip, docId){
  const doc = (trip.docs || []).find(x => x.id === docId);
  trip.docs = (trip.docs || []).filter(x => x.id !== docId);
  docDel(docId);
  if (doc && doc.path && doc.sha && syncPronto()){
    try { await ghDoc("DELETE", doc.path, { message: `tolto ${doc.name}`, sha: doc.sha }); } catch(e){}
  }
}

// Prima di partire i documenti si scaricano da soli, così ci sono anche offline.
async function docPrefetch(){
  if (!syncPronto()) return;
  const T = today();
  for (const t of S.trips){
    if (daysBetween(T, t.date) > 14 || daysBetween(T, t.date) < -30) continue;
    for (const d of (t.docs || [])){
      if (await docGet(d.id)) continue;
      try { await docBlob(d); } catch(e){}
    }
  }
}

function docsListHTML(t, modificabile){
  const docs = t.docs || [];
  if (!docs.length) return "";
  return docs.map(d => `
    <div class="row" style="align-items:center">
      <div class="rbody">
        <div class="rtitle" style="font-size:14.5px;word-break:break-word">${esc(d.name)}</div>
        <div class="rmeta" data-docstato="${d.id}">${kb(d.size || 0)}${d.local ? "<span class=\"dot\">·</span>solo su questo dispositivo" : ""}</div>
      </div>
      <button class="btn" data-doc="${d.id}" data-trip="${t.id}" style="flex:0 0 auto;padding:8px 13px">Apri</button>
      ${modificabile ? `<button class="btn ghost" data-docx="${d.id}" data-trip="${t.id}" style="flex:0 0 auto;min-width:38px;padding:8px 0;color:var(--warn)" aria-label="Togli">&times;</button>` : ""}
    </div>`).join("");
}

// segna quali documenti sono già qui, pronti anche senza rete
async function docMarkOffline(root){
  for (const n of root.querySelectorAll("[data-docstato]")){
    if (await docGet(n.dataset.docstato)) n.innerHTML += `<span class="dot">·</span>anche offline`;
  }
}

function bindDocs(root, dopo){
  root.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => {
    const t = S.trips.find(x => x.id === b.dataset.trip);
    const d = t && (t.docs || []).find(x => x.id === b.dataset.doc);
    if (d){ b.textContent = "…"; docOpen(d).finally(() => { b.textContent = "Apri"; }); }
  });
  root.querySelectorAll("[data-docx]").forEach(b => {
    armDelete(b, "×", async () => {
      const t = S.trips.find(x => x.id === b.dataset.trip);
      if (t){ await docRemove(t, b.dataset.docx); save(); }
      if (dopo) dopo();
    });
  });
  docMarkOffline(root);
}

/* ============================================================
   FRIGO — cosa c'è dentro e quando scade
   Non pesa sulla percentuale della giornata: è un avviso, non un compito.
   ============================================================ */
const fridgeSorted = () => S.fridge.slice().sort((a,b) => a.exp.localeCompare(b.exp));
const fridgeWarnDays = () => (S.fridgeWarn >= 0 ? S.fridgeWarn : 3);

function fridgeState(it, T){
  const dd = daysBetween(T, it.exp);
  if (dd < 0)  return { k:"scaduto", dd, label: dd === -1 ? "scaduto ieri" : `scaduto da ${-dd} giorni` };
  if (dd === 0) return { k:"oggi",   dd, label:"scade oggi" };
  if (dd === 1) return { k:"presto", dd, label:"scade domani" };
  return { k: dd <= fridgeWarnDays() ? "presto" : "ok", dd, label:`scade fra ${dd} giorni` };
}
const fridgeSoon = T => fridgeSorted().filter(it => daysBetween(T, it.exp) <= fridgeWarnDays());

function fridgeRowHTML(it, T){
  const st = fridgeState(it, T);
  const col = st.k === "scaduto" ? "var(--warn)" : st.k === "oggi" ? "var(--warn)" : st.k === "presto" ? "var(--accent)" : "var(--line)";
  return `
  <button class="actrow" data-fr="${it.id}">
    <div class="imp" style="min-height:30px;background:${col}"></div>
    <div class="rbody">
      <div class="rtitle">${esc(it.name)}${it.qty ? ` <span style="color:var(--ink-faint);font-weight:400">· ${esc(it.qty)}</span>` : ""}</div>
      <div class="rmeta" style="${st.k === "scaduto" || st.k === "oggi" ? "color:var(--warn)" : ""}">${st.label}<span class="dot">·</span>${prettyDate(it.exp)}</div>
      ${it.note ? `<div class="rmeta" style="color:var(--ink-faint)">${esc(it.note)}</div>` : ""}
    </div>
  </button>`;
}

function fridgeHTML(T){
  const soon = fridgeSoon(T);
  const scaduti = soon.filter(x => daysBetween(T, x.exp) < 0).length;
  return `
  <h2 id="h-frigo">Frigo${soon.length ? ` · ${soon.length} in scadenza${scaduti ? (scaduti === 1 ? ", 1 già scaduto" : `, ${scaduti} già scaduti`) : ""}` : ""}</h2>
  <div class="card">
    ${soon.length ? soon.map(it => fridgeRowHTML(it, T)).join("")

  if (esito === "buttato") S.fridgeStats.buttati = (S.fridgeStats.buttati||0) + 1;
  save(); render();
}

/* ============================================================
   DARE E AVERE — soldi e cose in sospeso con le persone
   Non entra nella percentuale della giornata: è un promemoria, non un compito.
   ============================================================ */
const euro = n => (Math.round(n * 100) / 100).toString().replace(".", ",") + " €";
const ledgerOpen = () => S.ledger.filter(e => !e.closed);
const paid = e => (e.moves || []).reduce((s, m) => s + (+m.amount || 0), 0);
const ledgerLeft = e => e.kind === "soldi" ? Math.max(0, (+e.amount || 0) - paid(e)) : (e.closed ? 0 : 1);

// Quando una voce torna a farsi vedere: vicino alla scadenza, oppure —
// per le cose prestate senza scadenza — quando è in giro da troppo tempo.
function ledgerAlert(e, T){
  if (e.closed) return null;
  if (e.snooze && T < e.snooze) return null;
  if (e.due){
    const dd = daysBetween(T, e.due);
    if (dd < 0)  return `in ritardo di ${-dd} ${-dd === 1 ? "giorno" : "giorni"}`;
    if (dd === 0) return "scade oggi";
    if (dd <= 3) return `scade fra ${dd} giorni`;
    return null;
  }
  const eta = daysBetween(e.date, T);
  if (S.ledgerAge > 0 && eta >= S.ledgerAge) return `in giro da ${eta} giorni`;
  return null;
}

function ledgerTotals(){
  let avere = 0, dare = 0, cose = 0;
  for (const e of ledgerOpen()){
    if (e.kind === "soldi"){ if (e.dir === "avere") avere += ledgerLeft(e); else dare += ledgerLeft(e); }
    else cose++;
  }
  return { avere, dare, cose };
}

function ledgerLine(e, T){
  const al = ledgerAlert(e, T);
  const resto = ledgerLeft(e);
  const parziale = e.kind === "soldi" && paid(e) > 0 && !e.closed;
  const segno = e.kind === "soldi"
    ? (e.dir === "avere" ? "ti deve" : "gli devi")
    : (e.dir === "avere" ? "deve restituirtela" : "devi restituirla");
  return `
  <button class="actrow" data-led="${e.id}">
    <div class="imp" style="min-height:34px;background:${e.closed ? "var(--line)" : (e.dir === "avere" ? "var(--done)" : "var(--warn)")}"></div>
    <div class="rbody">
      <div class="rtitle"${e.closed ? ` style="color:var(--ink-faint)"` : ""}>${esc(e.who)} · ${e.kind === "soldi" ? esc(euro(e.closed ? (+e.amount||0) : resto)) : esc(e.what)}</div>
      <div class="rmeta">${e.closed ? `chiuso il ${prettyDate(e.closed.d)}` : segno}<span class="dot">·</span>dal ${prettyDate(e.date)}${e.due && !e.closed ? `<span class="dot">·</span>entro ${prettyDate(e.due)}` : ""}</div>
      ${parziale ? `<div class="rmeta" style="color:var(--ink-faint)">già rientrati ${euro(paid(e))} su ${euro(+e.amount||0)}</div>` : ""}
      ${al ? `<span class="flag moved">${al}</span>` : ""}
    </div>
  </button>`;
}

function ledgerHTML(T){
  const t = ledgerTotals();
  const sveglie = ledgerOpen().filter(e => ledgerAlert(e, T));
  const testa = (t.avere || t.dare || t.cose)
    ? ` · ${t.avere ? `ti devono ${euro(t.avere)}` : ""}${t.avere && t.dare ? " · " : ""}${t.dare ? `devi ${euro(t.dare)}` : ""}${(t.avere || t.dare) && t.cose ? " · " : ""}${t.cose ? `${t.cose} ${t.cose === 1 ? "cosa" : "cose"}` : ""}`
    : "";
  return `
  <h2 id="h-led">Dare e avere${testa}</h2>
  <div class="card">
    ${sveglie.length ? sveglie.map(e => ledgerLine(e, T)).join("")
      : `<div class="empty">${ledgerOpen().length
          ? "Niente da ricordarti adesso. Le voci si fanno vive quando si avvicina la scadenza o quando sono in giro da troppo."
          : "Soldi prestati, soldi presi, cose date via. Segnali qui e non ci pensi più: te le ricordo io."}</div>`}
    <div class="row" style="gap:9px">
      <button class="btn ghost" id="addled" style="flex:2">Aggiungi</button>
      ${S.ledger.length ? `<button class="btn ghost" id="allled" style="flex:1">Apri tutto · ${ledgerOpen().length}</button>` : ""}
    </div>
  </div>`;
}

function snoozeLedger(id, giorni){
  const e = S.ledger.find(x => x.id === id); if (!e) return;
  e.snooze = addDays(today(), giorni);
  save(); render();
}

function openLedgerAll(){
  const T = today();
  const t = ledgerTotals();
  const aperti = ledgerOpen().slice().sort((a,b) => {
    const A = ledgerAlert(a,T) ? 0 : 1, B = ledgerAlert(b,T) ? 0 : 1;
    return A - B || a.date.localeCompare(b.date);
  });
  // saldo per persona, solo soldi
  const per = {};
  for (const e of ledgerOpen()) if (e.kind === "soldi"){
    per[e.who] = (per[e.who] || 0) + (e.dir === "avere" ? ledgerLeft(e) : -ledgerLeft(e));
  }
  const saldi = Object.entries(per).filter(([k,v]) => Math.abs(v) > 0.001)
                      .sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]));
  const chiusi = S.ledger.filter(e => e.closed)
                   .sort((a,b) => (b.closed.d || "").localeCompare(a.closed.d || ""));
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>Dare e avere</h3>
    <div class="card">
      <div class="stat"><span>Ti devono</span><span style="color:var(--done)">${euro(t.avere)}</span></div>
      <div class="stat"><span>Devi</span><span style="color:var(--warn)">${euro(t.dare)}</span></div>
      ${t.cose ? `<div class="stat"><span>Cose in giro</span><span>${t.cose}</span></div>` : ""}
    </div>

    ${saldi.length > 1 ? `<h2>Saldo per persona</h2>
    <div class="card">
      ${saldi.map(([k,v]) => `<div class="stat"><span>${esc(k)}</span><span style="color:${v > 0 ? "var(--done)" : "var(--warn)"}">${v > 0 ? "+" : "−"}${euro(Math.abs(v))}</span></div>`).join("")}
    </div>` : ""}

    <h2>Aperti</h2>
    <div class="card">
      ${aperti.length ? aperti.map(e => ledgerLine(e, T)).join("") : `<div class="empty">Niente in sospeso. Bella cosa.</div>`}
    </div>
    <div class="btnrow"><button class="btn primary wide" id="l-add">Aggiungi una voce</button></div>

    ${chiusi.length ? `
    <details class="card" style="margin-top:16px">
      <summary style="padding:13px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer">Archivio · ${chiusi.length}</summary>
      ${chiusi.slice(0,40).map(e => ledgerLine(e, T)).join("")}
    </details>` : ""}

    <div class="btnrow"><button class="btn ghost wide" id="l-close">Chiudi</button></div>
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#l-close").onclick = () => w.remove();
  w.querySelector("#l-add").onclick = () => { w.remove(); openLedgerItem(null); };
  w.querySelectorAll("[data-led]").forEach(b => b.onclick = () => { w.remove(); openLedgerItem(b.dataset.led); });
}

function openLedgerItem(id){
  const T = today();
  const e = id ? S.ledger.find(x => x.id === id)
               : { id:"l"+Date.now(), who: preNome(), kind:"soldi", dir:"avere", amount:"", what:"",
                   date: T, due:"", note:"", moves:[], closed:null, snooze:null, ...prendiBozza("conti") };
  let kind = e.kind, dir = e.dir;
  const pAv = avvisoPicker("l-av", avvisoOf(e, "avviso", "conti"));
  const nomi = [...new Set(S.ledger.map(x => x.who).filter(Boolean))].slice(0,8);

  w.className = "sheet";
  w.innerHTML = `

      <div class="card" style="margin-bottom:9px">
        ${(e.moves||[]).length ? e.moves.map((m,i) => `

          : `<div class="empty" style="padding:13px 14px">Ancora niente. Restano ${euro(ledgerLeft(e))}.</div>`}
      </div>
      <div class="segline">
        <input type="number" id="l-mv" min="0" step="0.5" placeholder="Quanto è rientrato" style="flex:1">

      <div class="hint">Restano ${euro(ledgerLeft(e))} su ${euro(+e.amount||0)}.</div></div>` : ""}

      <button class="btn ghost" id="l-cancel">Annulla</button>

      <button class="btn" id="l-done" style="flex:2">${e.kind === "soldi" ? "Saldato" : "Restituito"}</button>

  w.querySelectorAll("#l-dir .chip").forEach(b => b.onclick = () => { dir = b.dataset.d; paint(); });

    e.moves.splice(+b.dataset.mx, 1); save(); w.remove(); openLedgerItem(id);

  w.querySelector("#l-cancel").onclick = () => w.remove();
  const dn = w.querySelector("#l-done");
  if (dn) dn.onclick = () => { e.closed = { d: today() }; save(); w.remove(); render(); };
  const sn = w.querySelector("#l-snooze");
  if (sn) sn.onclick = () => { w.remove(); snoozeLedger(e.id, 7); };
  const ro = w.querySelector("#l-reopen");
  if (ro) ro.onclick = () => { e.closed = null; e.snooze = null; save(); w.remove(); render(); };
  if (id) armDelete(w.querySelector("#l-del"), "Elimina voce", () => {
    S.ledger = S.ledger.filter(x => x.id !== id);
    save(); w.remove(); render();
  });
  w.querySelector("#l-save").onclick = () => {
    const who = w.querySelector("#l-who").value.trim();
    if (!who){ alert("Serve un nome."); return; }
    const amt = +w.querySelector("#l-amt").value || 0;
    const what = w.querySelector("#l-what").value.trim();
