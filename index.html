    <div class="field"><label>Cosa</label>
      <div class="chips" id="l-kind">
        <button class="chip" data-k="soldi">Soldi</button>
        <button class="chip" data-k="cosa">Una cosa</button>
      </div></div>

    <div class="field"><label>Da che parte</label>
      <div class="chips" id="l-dir">
        <button class="chip" data-d="avere">Devo avere</button>
        <button class="chip" data-d="dare">Devo dare</button>
      </div></div>

    <div class="field" id="l-soldibox"><label>Quanto</label>
      <input type="number" id="l-amt" min="0" step="0.5" value="${e.amount}" placeholder="50"></div>

    <div class="field" id="l-cosabox"><label>Che cosa</label>
      <input type="text" id="l-what" value="${esc(e.what || "")}" placeholder="Il trapano, il libro di…"></div>

    <div class="two">
      <div class="field"><label>Dal giorno</label>
        <input type="date" id="l-date" value="${e.date}" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"></div>
      <div class="field"><label>Entro il (facoltativo)</label>
        <input type="date" id="l-due" value="${e.due || ""}" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"></div>
    </div>
    <div class="hint" style="margin-top:-6px">Senza scadenza te lo ricordo dopo ${S.ledgerAge} giorni, come hai scelto nelle impostazioni.</div>

    <div class="field" style="margin-top:15px"><label>Nota</label>
      <input type="text" id="l-note" value="${esc(e.note || "")}" placeholder="Cena del 12, prestato per il trasloco…"></div>

    ${id && e.kind === "soldi" && !e.closed ? `
    <div class="field"><label>Rimborsi</label>
      <div class="card" style="margin-bottom:9px">
        ${(e.moves||[]).length ? e.moves.map((m,i) => `
          <div class="stat"><span>${prettyDate(m.d)}</span><span>${euro(+m.amount||0)} <button data-mx="${i}" style="background:none;border:0;color:var(--warn);font-size:15px;padding:0 4px">&times;</button></span></div>`).join("")
          : `<div class="empty" style="padding:13px 14px">Ancora niente. Restano ${euro(ledgerLeft(e))}.</div>`}
      </div>
      <div class="segline">
        <input type="number" id="l-mv" min="0" step="0.5" placeholder="Quanto è rientrato" style="flex:1">
        <button class="btn" id="l-mvadd" style="flex:0 0 auto">Segna</button>
      </div>
      <div class="hint">Restano ${euro(ledgerLeft(e))} su ${euro(+e.amount||0)}.</div></div>` : ""}

    <div class="btnrow">
      <button class="btn primary" id="l-save" style="flex:2">Salva</button>
      <button class="btn ghost" id="l-cancel">Annulla</button>
    </div>
    ${id && !e.closed ? `
    <div class="btnrow">
      <button class="btn" id="l-done" style="flex:2">${e.kind === "soldi" ? "Saldato" : "Restituito"}</button>
      <button class="btn ghost" id="l-snooze">Tra una settimana</button>
    </div>` : ""}
    ${id && e.closed ? `<div class="btnrow"><button class="btn wide" id="l-reopen">Riapri</button></div>` : ""}
    ${id ? `<div class="btnrow"><button class="btn danger wide" id="l-del">Elimina voce</button></div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  function paint(){
    w.querySelectorAll("#l-kind .chip").forEach(b => b.classList.toggle("on", b.dataset.k === kind));
    w.querySelectorAll("#l-dir .chip").forEach(b => b.classList.toggle("on", b.dataset.d === dir));
    w.querySelector("#l-soldibox").style.display = kind === "soldi" ? "" : "none";
    w.querySelector("#l-cosabox").style.display = kind === "cosa" ? "" : "none";
  }
  w.querySelectorAll("#l-kind .chip").forEach(b => b.onclick = () => { kind = b.dataset.k; paint(); });
  w.querySelectorAll("#l-dir .chip").forEach(b => b.onclick = () => { dir = b.dataset.d; paint(); });
  w.querySelectorAll("#l-nomi .chip").forEach(b => b.onclick = () => { w.querySelector("#l-who").value = b.dataset.n; });
  paint();

  const mvAdd = w.querySelector("#l-mvadd");
  if (mvAdd) mvAdd.onclick = () => {
    const v = +w.querySelector("#l-mv").value;
    if (!(v > 0)) return;
    e.moves = e.moves || [];
    e.moves.push({ d: today(), amount: v });
    if (ledgerLeft(e) <= 0) e.closed = { d: today() };
    save(); w.remove(); render();
    if (!e.closed) openLedgerItem(id);
  };
  w.querySelectorAll("[data-mx]").forEach(b => b.onclick = () => {
    e.moves.splice(+b.dataset.mx, 1); save(); w.remove(); openLedgerItem(id);
  });

  w.querySelector("#l-cancel").onclick = () => w.remove();
  const dn = w.querySelector("#l-done");
  if (dn) dn.onclick = () => { e.closed = { d: today() }; save(); w.remove(); render(); };
  const sn = w.querySelector("#l-snooze");
  if (sn) sn.onclick = () => { w.remove(); snoozeLedger(e.id, 7); };
  const ro = w.querySelector("#l-reopen");
  if (ro) ro.onclick = () => { e.closed = null; e.snooze = null; save(); w.remove(); render(); };
  if (id) armDelete(w.querySelector("#l-del"), "Elimina voce", () => {
    S.ledger = S.ledger.filter(x => x.id !== id);
    save(); w.remove(); render();
  });
  w.querySelector("#l-save").onclick = () => {
    const who = w.querySelector("#l-who").value.trim();
    if (!who){ alert("Serve un nome."); return; }
    const amt = +w.querySelector("#l-amt").value || 0;
    const what = w.querySelector("#l-what").value.trim();
    if (kind === "soldi" && !(amt > 0)){ alert("Serve un importo."); return; }
    if (kind === "cosa" && !what){ alert("Serve di che cosa si tratta."); return; }
    const next = { ...e, who, kind, dir, amount: kind === "soldi" ? amt : "", what: kind === "cosa" ? what : "",
                   date: w.querySelector("#l-date").value || today(),
                   due: w.querySelector("#l-due").value || "",
                   note: w.querySelector("#l-note").value.trim(),
                   snooze: null };
    const i = S.ledger.findIndex(x => x.id === e.id);
    if (i >= 0) S.ledger[i] = next; else S.ledger.push(next);
    save(); w.remove(); render();
  };
}

/* ---------- EXTRA: conteggi personali ---------- */
const PER_LABEL = { d:"al giorno", w:"a settimana", m:"al mese", y:"all'anno" };
const PER_PREV  = { d:"ieri", w:"settimana scorsa", m:"mese scorso", y:"anno scorso" };

function pKey(per, d){
  if (per === "w"){ const dt = fromIso(d); dt.setDate(dt.getDate() - ((dt.getDay()+6)%7)); return "W" + iso(dt); }
  if (per === "m") return d.slice(0,7);
  if (per === "y") return d.slice(0,4);
  return d;
}
function pPrevDate(per, d){
  const dt = fromIso(d);
  if (per === "w"){ dt.setDate(dt.getDate()-7); return iso(dt); }
  if (per === "m"){ dt.setMonth(dt.getMonth()-1);  return iso(dt); }
  if (per === "y"){ dt.setFullYear(dt.getFullYear()-1); return iso(dt); }
  dt.setDate(dt.getDate()-1); return iso(dt);
}
const trVal  = (t,d) => (S.tlog[pKey(t.per||"d", d)] || {})[t.id] || 0;
function trNote(t, T){
  const prev = (S.tlog[pKey(t.per||"d", pPrevDate(t.per||"d", T))] || {})[t.id];
  let s = PER_LABEL[t.per||"d"];
  s += prev === undefined ? " · primo periodo" : ` · ${PER_PREV[t.per||"d"]} ${prev}`;
  if (t.dir !== "none" && t.target !== "" && t.target != null)
    s += ` · ${t.dir === "giu" ? "max" : "min"} ${t.target}`;
  return s;
}

function trackerHTML(t, T){
  const v = trVal(t, T);
  let cls = "";
  if (t.dir === "giu" && t.target !== "" && t.target != null && v > t.target) cls = "color:var(--warn)";
  if (t.dir === "su"  && t.target !== "" && t.target != null && v >= t.target) cls = "color:var(--done)";
  return `
  <div class="row" data-trrow="${t.id}">
    <div class="rbody">
      <div class="rtitle">${esc(t.name)}</div>
      <div class="rmeta" data-trnote="${t.id}">${trNote(t, T)}</div>
    </div>
    <div style="display:flex;align-items:center;gap:7px">
      <button class="btn" data-tr="${t.id}" data-by="-1" style="min-width:40px;padding:8px 0">&minus;</button>
      <input type="number" inputmode="numeric" data-trin="${t.id}" value="${v}"
        style="width:58px;text-align:center;font-size:19px;font-weight:600;padding:7px 2px;
               border:1px solid var(--line);border-radius:9px;background:var(--surface);${cls}">
      <button class="btn" data-tr="${t.id}" data-by="1" style="min-width:40px;padding:8px 0">+</button>
      <button class="btn ghost" data-tredit="${t.id}" style="min-width:40px;padding:8px 0" aria-label="Modifica o elimina">&#9881;</button>
    </div>
  </div>`;
}

// updates only this row, so the page does not jump
function paintTracker(id){
  const t = S.trackers.find(x => x.id === id); if (!t) return;
  const T = today(), v = trVal(t, T);
  const inp = document.querySelector(`[data-trin="${id}"]`);
  const note = document.querySelector(`[data-trnote="${id}"]`);
  if (inp){
    inp.value = v;
    inp.style.color = "";
    if (t.dir === "giu" && t.target !== "" && t.target != null && v > t.target) inp.style.color = "var(--warn)";
    if (t.dir === "su"  && t.target !== "" && t.target != null && v >= t.target) inp.style.color = "var(--done)";
  }
  if (note) note.textContent = trNote(t, T);
}

function setTracker(id, val){
  const t = S.trackers.find(x => x.id === id); if (!t) return;
  const k = pKey(t.per || "d", today());
  S.tlog[k] = S.tlog[k] || {};
  S.tlog[k][id] = Math.max(0, Math.round(val) || 0);
  save(); paintTracker(id);
}
function bumpTracker(id, by){
  const t = S.trackers.find(x => x.id === id); if (!t) return;
  setTracker(id, trVal(t, today()) + by);
}

function openTracker(id){
  const t = id ? S.trackers.find(x => x.id === id)
               : { id:"t"+Date.now(), name:"", per:"d", target:"", dir:"none" };
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>${id ? "Modifica conteggio" : "Nuovo conteggio"}</h3>
    <div class="field"><label>Nome</label>
      <input type="text" id="t-n" value="${esc(t.name)}" placeholder="Sigarette, bicchieri d'acqua, km…"></div>
    <div class="field"><label>Si azzera</label>
      <select id="t-p">
        <option value="d" ${(t.per||"d")=="d"?"selected":""}>Ogni giorno</option>
        <option value="w" ${t.per=="w"?"selected":""}>Ogni settimana</option>
        <option value="m" ${t.per=="m"?"selected":""}>Ogni mese</option>
        <option value="y" ${t.per=="y"?"selected":""}>Ogni anno</option>

        <input type="number" id="t-t" min="0" value="${t.target ?? ""}">

      <div class="hint">Resta fuori dalla percentuale della giornata. È solo tuo.</div></div>
    <div class="btnrow">
      <button class="btn primary" id="t-save" style="flex:2">Salva</button>
      <button class="btn ghost" id="t-cancel">Annulla</button>
    </div>
    ${id ? `<div class="btnrow"><button class="btn danger wide" id="t-del">Elimina conteggio</button></div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  const dSel = w.querySelector("#t-d"), tIn = w.querySelector("#t-t");

  w.querySelector("#t-cancel").onclick = () => w.remove();
  if (id) armDelete(w.querySelector("#t-del"), "Elimina conteggio", () => {
    S.trackers = S.trackers.filter(x => x.id !== id);
    for (const k in S.tlog) if (S.tlog[k]) delete S.tlog[k][id];
    save(); w.remove(); render();
  });
  w.querySelector("#t-save").onclick = () => {
    const name = w.querySelector("#t-n").value.trim();

                   target: dir === "none" || tv === "" ? "" : +tv };
    const i = S.trackers.findIndex(x => x.id === t.id);
    if (i >= 0) S.trackers[i] = next; else S.trackers.push(next);
    save(); w.remove(); render();
  };
}

function upcomingHTML(){
  const all = pendingActs();
  if (!all.length) return `<div class="empty">Nessuna attività in programma nei prossimi giorni.</div>`;
  const pick = [...all].sort((a,b) => a.imp - b.imp || a.scheduledFor.localeCompare(b.scheduledFor)).slice(0,4);
  pick.sort((a,b) => a.scheduledFor.localeCompare(b.scheduledFor) || a.imp - b.imp);
  const rest = all.length - pick.length;
  return pick.map(a => `
    <div class="row">
      <div class="imp i${a.imp}"></div>
      <div class="rbody">
        <div class="rtitle">${esc(a.name)}</div>

/* the day spine: work blocks on the rail, activities beside it */
function spineHTML(T, acts){
  const H0 = Math.floor(awakeFrom() / 60), H1 = Math.min(24, Math.ceil(awakeTo() / 60));
  const SPAN = Math.max(60, (H1 - H0) * 60), PX = 300;
  const y = m => Math.max(0, Math.min(PX, (m - H0*60) / SPAN * PX));
  const busy = busyOn(T);

  let rail = "";
  for (let h = H0; h <= H1; h += 3) rail += `<div class="hourlab" style="top:${y(h*60)}px">${String(h).padStart(2,"0")}:00</div>`;
  rail += busy.map(([s,e]) => `<div class="blk" style="top:${y(s)}px;height:${Math.max(6,y(e)-y(s))}px"></div>`).join("");

  const n = nowMin();
  if (n >= H0*60 && n <= H1*60){
    rail += `<div class="nowline" style="top:${y(n)}px"></div><div class="nowdot" style="top:${y(n)}px"></div>`;
  }

  let slots = busyLabeled(T)
    .slice()
    .sort((a,b) => (b.e - b.s) - (a.e - a.s))     // i lunghi per primi: i corti restano leggibili sopra
    .map(b => {
      const lungo = (b.e - b.s) >= 8 * 60;
      return `<div class="slot" style="top:${y(b.s)}px;height:${Math.max(26,y(b.e)-y(b.s))}px${lungo ? ";opacity:.5" : ""}">${esc(b.label || "Impegno")}<small>${toHHMM(b.s)}–${toHHMM(b.e)}</small></div>`;
    }).join("");

  slots += acts.map(a => {
    const s = toMin(a.win.start), e = toMin(a.win.end);
    const done = isDone(T, a.id);
    return `<div class="slot free" style="top:${y(s)}px;height:${Math.max(26,y(e)-y(s))}px;${done?"opacity:.45":""}">${esc(a.name)}<small>${a.win.start}–${a.win.end}</small></div>`;
  }).join("");

  return `<div class="spine">
    <div class="spine-col"><div class="spine-track" style="height:${PX+14}px"><div class="spine-rail"></div>${rail}</div></div>
    <div class="slots" style="height:${PX+14}px">${slots}</div>
  </div>`;
}

/* ---------- aggiornamenti mirati ----------
   Spuntare qualcosa cambia una riga e qualche numero: ridisegnare tutta
   la pagina la faceva saltare in cima. Qui si tocca solo quello che cambia. */

function markRow(id, done){
  const row = document.querySelector(`[data-row="${id}"]`);
  if (row) row.classList.toggle("done", !!done);
}

function patchToday(){
  const T = today(), p = progress();
  const pct = document.getElementById("ring-pct");
  if (pct && !isPaused()) pct.textContent = p.pct + "%";
  const arc = document.getElementById("pie-arc");
  if (arc && !isPaused()) arc.setAttribute("d", piePath(p.pct, 19));
  const acts = todaysActs();
  const ha = document.getElementById("h-acts");
  if (ha) ha.textContent = "Da fare oggi" + (acts.length ? ` · ${acts.filter(a=>isDone(T,a.id)).length}/${acts.length}` : "");
  const hr = document.getElementById("h-rem");
  const rem = remindersOn(T);
  if (hr) hr.textContent = "Promemoria" + (rem.length ? ` · ${rem.filter(r=>readToday(T,r.id)).length}/${rem.length} letti` : "");
  patchTripHead();
  const hg = document.getElementById("h-goals");
  if (hg) hg.textContent = "Obiettivi" + (S.goals.length ? ` · ${S.goals.filter(goalDone).length}/${S.goals.length}` : "");
  const cm = document.getElementById("close-meta");
  if (cm){
    const d = closeTarget();
    if (d){ const q = progressOn(d); cm.textContent = `${d !== T ? `${GG[dow(d)]} ${prettyDate(d)} · ` : ""}${q.pct}%, ${q.done} cose su ${q.total}.`; }
  }
}

function toggleDone(id){
  const T = today();
  S.log[T] = S.log[T] || {};
  const a = S.activities.find(x => x.id === id);
  if (S.log[T][id]){
    delete S.log[T][id];
    if (a) a.doneCount = Math.max(0, (a.doneCount||0) - 1);
  } else {
    S.log[T][id] = true;
    if (a){ a.doneCount = (a.doneCount||0) + 1; a.lastDone = T; a.moved = null; }
  }
  save();
  markRow(id, S.log[T][id]);
  patchToday();
}

const MM3 = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const mdLabel = md => `${+md.slice(3)} ${MM3[+md.slice(0,2) - 1]}`;

function recLabel(r){
  const n = r.n || 1;
  if (r.type === "weekly")     return n === 1 ? "ogni settimana" : `ogni ${n} settimane`;
  if (r.type === "everyNDays") return n === 1 ? "ogni giorno" : `ogni ${n} giorni`;
  if (r.type === "timesWeek")  return `${n} volte a settimana`;
  if (r.type === "yearly")     return r.md ? `una volta l'anno, il ${mdLabel(r.md)}` : "una volta l'anno";
  if (r.type === "monthly")    return `${n === 1 ? "ogni mese" : `ogni ${n} mesi`}, il ${r.day || 1}`;
  if (r.type === "dates")      return (r.dates || []).length ? `nelle date: ${(r.dates||[]).slice().sort().map(mdLabel).join(", ")}` : "date da scegliere";
  return "una volta sola";
}

let RUN = null, RUNTICK = null, WAKE = null;

function beep(times){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ac = new Ctx();
    for (let i = 0; i < times; i++){
      const o = ac.createOscillator(), g = ac.createGain();
      const t = ac.currentTime + i * 0.33;
      o.frequency.value = 660; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.3);
    }
    setTimeout(() => { try{ ac.close(); }catch(e){} }, times * 400 + 600);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(times > 1 ? [250,120,250,120,250] : [220]); }catch(e){}
}

async function keepAwake(on){
  try{
    if (on && "wakeLock" in navigator && !WAKE) WAKE = await navigator.wakeLock.request("screen");
    if (!on && WAKE){ await WAKE.release(); WAKE = null; }
  }catch(e){ WAKE = null; }
}

// cose su cui si può registrare il tempo: attività di oggi, obiettivi, appuntamenti di oggi
function runTargets(){
  const T = today(), d = dow(T);
  const out = [], seen = new Set();
  const push = (id, name, kind) => {
    if (!name || seen.has(id)) return;
    seen.add(id); out.push({ id, name, kind });
  };
  for (const a of todaysActs()) push(a.id, a.name, "attività di oggi");
  for (const g of S.goals) if (!goalDone(g)) push(g.id, g.name, "obiettivo");
  for (const o of S.oneoffs) if (o.date === T) push(o.id, o.label, "appuntamento di oggi");
  for (const f of S.fixed) if (f.days.includes(d)) push(f.id, f.label, "impegno fisso");
  if (S.gcalOn) for (const g of (GCAL.byDay[T] || [])) push("gc:" + g.label, g.label, "dal calendario");
  for (const r of S.reminders) push(r.id, r.text, "promemoria");
  for (const a of S.activities) if (a.scheduledFor !== T) push(a.id, a.name, "altra attività");
  for (const o of S.oneoffs) if (o.date > T) push(o.id, o.label, `appuntamento ${prettyDate(o.date)}`);
  return out;
}

function logTime(ref, minutes){
  if (!ref || minutes < 1) return;
  const T = today();
  S.timeLog[T] = S.timeLog[T] || {};
  S.timeLog[T][ref.id] = Math.round((S.timeLog[T][ref.id] || 0) + minutes);
  // se è un'attività, tiene anche la durata di questa singola sessione:
  // è così che l'app impara quanto ci metti davvero
  if (S.activities.some(a => a.id === ref.id)){
    const arr = S.durLog[ref.id] = S.durLog[ref.id] || [];
    arr.push(Math.round(minutes));
    if (arr.length > 12) arr.splice(0, arr.length - 12);
  }
  save();
}
const timeOn = (d, id) => (S.timeLog[d] || {})[id] || 0;

/* ---------- la durata che si tara da sola ----------
   Dopo tre sessioni cronometrate, se la mediana è lontana da quello che
   avevi scritto, l'app te lo dice e si corregge con un tocco.
   Mediana e non media: una sessione dimenticata accesa non falsa tutto. */
function median(a){
  const s = [...a].sort((x,y) => x - y), n = s.length;
  return n % 2 ? s[(n-1)/2] : Math.round((s[n/2 - 1] + s[n/2]) / 2);
}

function durSuggestion(a){
  const arr = S.durLog[a.id] || [];
  if (arr.length < 3) return null;
  const m = Math.max(5, Math.round(median(arr) / 5) * 5);
  if (!a.dur) return null;
  const scarto = Math.abs(m - a.dur) / a.dur;
  if (scarto < 0.25) return null;                 // differenza piccola: non vale disturbarti
  return { min: m, n: arr.length, su: m > a.dur };
}

function applyDur(id){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  const s = durSuggestion(a); if (!s) return;
  a.dur = s.min;
  a.scheduledFor = null; a.moved = null;
  runEngine(); save(); render();
}

// quante volte, negli ultimi 60 giorni, quella cosa non andava proprio fatta
function vuotoCount(id){
  let n = 0;
  for (const d in S.closes){
    const r = S.closes[d].reasons || {};
    if (r[id] === R_VUOTO) n++;
  }
  return n;
}

function startRun(id, ref){
  const c = S.cycles.find(x => x.id === id);
  if (!c) return;
  RUN = { c, idx:0, paused:false, elapsed:0, mark:Date.now(), ref: ref || null, worked:0 };
  keepAwake(true);
  drawRun();
  clearInterval(RUNTICK);
  RUNTICK = setInterval(tickRun, 200);
}

function segSeconds(){ return RUN.c.segs[RUN.idx].min * 60; }

function tickRun(){
  if (!RUN || RUN.paused) return;
  const now = Date.now();
  const delta = (now - RUN.mark) / 1000;
  RUN.elapsed += delta;
  RUN.mark = now;
  const lavorando = RUN.c.kind !== "timer" || RUN.c.segs[RUN.idx].kind === "lavoro";
  if (lavorando) RUN.worked += delta / 60;
  if (RUN.c.kind === "timer" && RUN.elapsed >= segSeconds()){
    const last = RUN.idx >= RUN.c.segs.length - 1;
    beep(last ? 3 : 1);
    if (last){ finishRun(true); return; }
    RUN.idx++; RUN.elapsed = 0;
  }
  drawRun();
}

function finishRun(done){
  clearInterval(RUNTICK); RUNTICK = null;
  if (RUN && RUN.ref) logTime(RUN.ref, RUN.worked || 0);
  const node = document.querySelector(".runner");
  if (node) node.remove();
  RUN = null;
  keepAwake(false);
  if (done) render();
}

function drawRun(){
  if (!RUN) return;
  const isTimer = RUN.c.kind === "timer";
  const seg = isTimer ? RUN.c.segs[RUN.idx] : null;
  const left = isTimer ? segSeconds() - RUN.elapsed : RUN.elapsed;
  const pct = isTimer ? Math.min(100, RUN.elapsed / segSeconds() * 100) : 0;
  const nextSeg = isTimer && RUN.c.segs[RUN.idx + 1];

  let node = document.querySelector(".runner");
  if (!node){
    node = document.createElement("div");
    node.className = "runner";
    node.innerHTML = `
      <div class="r-name"></div>
      <div class="r-seg"></div>
      <div class="r-time"></div>
      <div class="r-next"></div>
      <div class="r-bar"><div class="r-fill"></div></div>
      <div class="r-steps"></div>
      <div class="r-ctrl">
        <button class="btn primary" data-a="pause">Pausa</button>
        <button class="btn" data-a="skip">Avanti</button>
        <button class="btn ghost" data-a="stop">Chiudi</button>
      </div>`;
    document.body.appendChild(node);
    node.querySelector('[data-a="stop"]').onclick = () => finishRun(false);
    node.querySelector('[data-a="pause"]').onclick = () => {
      RUN.paused = !RUN.paused; RUN.mark = Date.now();
      keepAwake(!RUN.paused); drawRun();
    };
    node.querySelector('[data-a="skip"]').onclick = () => {
      if (!isTimer){ RUN.elapsed = 0; drawRun(); return; }
      if (RUN.idx >= RUN.c.segs.length - 1){ finishRun(true); return; }
      RUN.idx++; RUN.elapsed = 0; drawRun();
    };
  }

  node.classList.toggle("rest", isTimer && seg.kind === "pausa");
  node.querySelector(".r-name").textContent = RUN.ref ? `${RUN.c.name} · ${RUN.ref.name}` : RUN.c.name;
  node.querySelector(".r-seg").textContent = isTimer
    ? (seg.kind === "lavoro" ? "Lavoro" : "Pausa") + ` · fase ${RUN.idx+1} di ${RUN.c.segs.length}`
    : "Cronometro";
  node.querySelector(".r-time").textContent = clock(left);
  node.querySelector(".r-next").textContent = isTimer
    ? (nextSeg ? `poi ${nextSeg.min} minuti di ${nextSeg.kind}` : "ultima fase")
    : "";
  node.querySelector(".r-fill").style.width = pct + "%";
  node.querySelector(".r-steps").innerHTML = isTimer
    ? RUN.c.segs.map((s,i) => `<div class="r-step ${i===RUN.idx?"on":(i<RUN.idx?"past":"")}"></div>`).join("") : "";
  node.querySelector('[data-a="pause"]').textContent = RUN.paused ? "Riprendi" : "Pausa";
  node.querySelector('[data-a="skip"]').textContent = isTimer ? "Avanti" : "Azzera";
}

/* ============================================================
   GOOGLE CALENDAR — sola lettura, solo quando l'app è aperta
   ============================================================ */
const GCAL = { byDay:{}, count:0, status:"idle", err:null, at:null, unsub:null };

function gcalIngest(payload){
  const evs = (payload && payload.events) || [];
  const byDay = {};
  let n = 0;
  for (const ev of evs){
    if (ev.status === "cancelled") continue;
    if (ev.availability === "AVAILABILITY_FREE" || ev.transparency === "transparent") continue;
    const sd = ev.start && ev.start.dateTime, ed = ev.end && ev.end.dateTime;
    if (!sd || !ed) continue;                      // eventi di un giorno intero: non bloccano
    const day = sd.slice(0,10);
    const s = toMin(sd.slice(11,16));
    let e = ed.slice(0,10) === day ? toMin(ed.slice(11,16)) : 1439;
    if (e <= s) continue;
    (byDay[day] = byDay[day] || []).push({ s, e, label: ev.summary || "Impegno" });
    n++;
  }
  GCAL.byDay = byDay; GCAL.count = n; GCAL.status = "ok"; GCAL.err = null; GCAL.at = Date.now();
  S.activities.forEach(a => { a.moved = null; });
  runEngine(); render();
}

async function gcalStart(){
  if (!S.gcalOn) return;
  let mcp = null;
  try { mcp = await claude.use("mcp"); } catch(e){}
  if (!mcp){ GCAL.status = "nodisp"; if (TAB === "opzioni") render(); return; }

  const T = today();
  const input = {
    startTime: T + "T00:00:00+02:00",
    endTime: addDays(T, 30) + "T23:59:59+02:00",
    timeZone: "Europe/Rome",
    orderBy: "startTime",
    pageSize: 250
  };
  GCAL.status = "loading";
  if (TAB === "opzioni") render();
  try {
    GCAL.unsub = mcp.watchTool("Google Calendar", "list_events", input, ev => {
      if (ev.type === "data"){ gcalIngest(ev.result && ev.result.payload); return; }
      const code = ev.error && ev.error.code;
      if (code === "needs_reauth" || code === "server_not_connected" || code === "selection_required"){
        GCAL.byDay = {}; GCAL.count = 0;            // dati ritirati: non tenerli
      }
      GCAL.status = "err"; GCAL.err = code || "errore";
      render();
    }, { refetchInterval: 15 * 60 * 1000 });
  } catch(e){ GCAL.status = "err"; GCAL.err = "avvio"; }
}

function gcalMessage(){
  if (!S.gcalOn) return "Spento. Il coach usa solo gli impegni scritti qui.";
  switch (GCAL.status){
    case "loading": return "Sto leggendo il calendario…";
    case "ok": return `${GCAL.count} impegni letti dal calendario, prossimi 30 giorni.`;
    case "nodisp": return "Non disponibile in questa vista. Apri l'app dal link di Claude.";
    case "err":
      if (GCAL.err === "needs_reauth") return "Il collegamento è scaduto. Ricollega Google Calendar dalle impostazioni di Claude.";
      if (GCAL.err === "server_not_connected") return "Google Calendar non risulta collegato al tuo account Claude.";
      if (GCAL.err === "selection_required") return "Hai più account Google collegati: scegline uno in Claude.";
      if (GCAL.err === "not_granted") return "Permesso non dato. Ricarica la pagina e accetta la richiesta.";
      return "Il calendario non risponde. Riprova più tardi: gli impegni scritti qui funzionano lo stesso.";
    default: return "In attesa…";
  }
}

/* ============================================================
   SALUTE — voci che segni giorno per giorno
   ============================================================ */
const HTYPES = {
  sonno:  "Orari (a letto e sveglia)",
  durata: "Durata in minuti",
  numero: "Un numero",
  sino:   "Fatto o non fatto"
};

const hVal = (d, id) => (S.hlog[d] || {})[id];

function hShow(v, type){
  if (v === undefined || v === null) return "—";
  if (type === "sonno") return `${v.from}–${v.to} · ${durLabel(v.min)}`;
  if (type === "durata") return durLabel(v);
  if (type === "sino") return v ? "sì" : "no";
  return String(v);
}

function hRecap(v){
  const T = today();
  const vals = [];
  for (let i = 1; i <= 7; i++){
    const x = hVal(addDays(T, -i), v.id);
    if (x !== undefined && x !== null) vals.push(x);
  }
  if (!vals.length) return "nessun dato negli ultimi 7 giorni";
  if (v.type === "sonno"){
    const avg = Math.round(vals.reduce((s,x) => s + x.min, 0) / vals.length);
    return `media ultimi ${vals.length} giorni: ${durLabel(avg)}`;
  }
  if (v.type === "durata"){
    return `ultimi 7 giorni: ${durLabel(vals.reduce((s,x)=>s+x,0))} in ${vals.length} ${vals.length===1?"giorno":"giorni"}`;
  }
  if (v.type === "sino"){
    return `${vals.filter(Boolean).length} giorni su 7`;
  }
  return `totale 7 giorni: ${vals.reduce((s,x)=>s+x,0)}`;
}

function renderSalute(){

  el.innerHTML = `
  <div class="wrap">

      <div class="greet">Quello che vuoi tenere d'occhio, senza che entri nella percentuale della giornata.</div>

/* segna il valore di oggi */
function openHealthValue(id){
  const v = S.health.find(x => x.id === id); if (!v) return;
  const T = today();
  const cur = hVal(T, v.id);
  const w = document.createElement("div");
  w.className = "sheet";
  let body = "";
  if (v.type === "sonno"){
    body = `<div class="field"><label>A letto e sveglia</label>
      <div class="two">
        <input type="time" id="h-a" value="${cur ? cur.from : "23:30"}">
        <input type="time" id="h-b" value="${cur ? cur.to : "07:00"}">
      </div>
      <div class="hint" id="h-calc"></div></div>`;
  } else if (v.type === "durata"){
    body = `<div class="field"><label>Minuti</label>
      <input type="number" id="h-n" min="0" step="5" value="${cur ?? 30}"></div>`;
  } else if (v.type === "numero"){
    body = `<div class="field"><label>Quanto</label>
      <input type="number" id="h-n" min="0" value="${cur ?? 0}"></div>`;
  } else {
    body = `<div class="field"><label>Oggi</label>
      <div class="chips" id="h-yn">
        <button class="chip ${cur === true ? "on" : ""}" data-v="1">Sì</button>
        <button class="chip ${cur === false ? "on" : ""}" data-v="0">No</button>
      </div></div>`;
  }
  w.innerHTML = `
  <div class="sheetin">
    <h3>${esc(v.name)}</h3>
    ${body}
    <div class="btnrow">
      <button class="btn primary" id="h-save" style="flex:2">Salva</button>
      <button class="btn ghost" id="h-cancel">Annulla</button>
    </div>
    ${cur !== undefined ? `<div class="btnrow"><button class="btn danger wide" id="h-clear">Cancella il dato di oggi</button></div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);

  let yn = cur === true ? 1 : (cur === false ? 0 : null);
  if (v.type === "sino"){
    const calc = () => {};
    w.querySelectorAll("#h-yn .chip").forEach(c => c.onclick = () => {
      yn = +c.dataset.v;
      w.querySelectorAll("#h-yn .chip").forEach(x => x.classList.toggle("on", x === c));
    });
  }
  if (v.type === "sonno"){
    const a = w.querySelector("#h-a"), b = w.querySelector("#h-b"), out = w.querySelector("#h-calc");
    const calc = () => {
      if (!a.value || !b.value){ out.textContent = "Metti tutti e due gli orari."; return; }
      let m = toMin(b.value) - toMin(a.value);
      if (m <= 0) m += 1440;                     // si dorme oltre la mezzanotte
      out.textContent = `Fanno ${durLabel(m)}.`;
    };
    a.oninput = calc; b.oninput = calc; calc();
  }

  w.querySelector("#h-cancel").onclick = () => w.remove();
  if (cur !== undefined) armDelete(w.querySelector("#h-clear"), "Cancella il dato di oggi", () => {
    if (S.hlog[T]) delete S.hlog[T][v.id];
    save(); w.remove(); render();
  });
  w.querySelector("#h-save").onclick = () => {
    let val;
    if (v.type === "sonno"){
      const from = w.querySelector("#h-a").value, to = w.querySelector("#h-b").value;
      if (!from || !to){ w.remove(); return; }
      let m = toMin(to) - toMin(from);
      if (m <= 0) m += 1440;
      val = { from, to, min: m };
    } else if (v.type === "sino"){
      if (yn === null){ w.remove(); return; }
      val = yn === 1;
    } else {
      val = Math.max(0, +w.querySelector("#h-n").value || 0);
    }
    S.hlog[T] = S.hlog[T] || {};
    S.hlog[T][v.id] = val;
    save(); w.remove(); render();
  };
}

/* crea o elimina una voce */
function openHealthEdit(id){
  const v = id ? S.health.find(x => x.id === id) : { id:"h"+Date.now(), name:"", type:"numero" };
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = `
  <div class="sheetin">
    <h3>${id ? "Modifica voce" : "Nuova voce"}</h3>
    <div class="field"><label>Nome</label>
      <input type="text" id="hv-n" value="${esc(v.name)}" placeholder="Sonno, sport, acqua…"></div>
    <div class="field"><label>Cosa segni</label>
      <select id="hv-t">
        ${Object.entries(HTYPES).map(([k,l]) => `<option value="${k}" ${v.type===k?"selected":""}>${l}</option>`).join("")}
      </select>
      ${id ? `<div class="hint">Cambiare tipo può rendere illeggibili i dati già segnati.</div>` : ""}</div>
    <div class="btnrow">
      <button class="btn primary" id="hv-save" style="flex:2">Salva</button>
      <button class="btn ghost" id="hv-cancel">Annulla</button>
    </div>
    ${id ? `<div class="btnrow"><button class="btn danger wide" id="hv-del">Elimina voce</button></div>` : ""}
    <div style="height:30px"></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#hv-cancel").onclick = () => w.remove();
  if (id) armDelete(w.querySelector("#hv-del"), "Elimina voce", () => {
    S.health = S.health.filter(x => x.id !== id);
    for (const k in S.hlog) if (S.hlog[k]) delete S.hlog[k][id];
    save(); w.remove(); render();
  });
  w.querySelector("#hv-save").onclick = () => {
    const name = w.querySelector("#hv-n").value.trim();
    if (!name){ w.querySelector("#hv-n").style.borderColor = "var(--warn)"; return; }
    const next = { ...v, name, type: w.querySelector("#hv-t").value };
    const i = S.health.findIndex(x => x.id === v.id);
    if (i >= 0) S.health[i] = next; else S.health.push(next);
    save(); w.remove(); render();
  };
}

}

/* ---------- APPUNTAMENTI ED EVENTI ---------- */
// quelli di oggi (anche se durano più giorni e sono cominciati prima)
function eventsOn(d){
  return S.oneoffs.filter(o => d >= o.date && d <= (o.endDate || o.date))
    .sort((a,b) => (a.allDay?1:0) - (b.allDay?1:0) || (a.start||"").localeCompare(b.start||""));
}
// quelli che arrivano, dentro la finestra di preavviso che hai scelto per ognuno
function eventsSoon(d){
  return S.oneoffs.filter(o => {
    if (!o.warn || o.date <= d) return false;
    return daysBetween(d, o.date) <= o.warn;
  }).sort((a,b) => a.date.localeCompare(b.date));
}

function evWhen(o, d){
  const fine = o.endDate || o.date;
  const piuGiorni = fine !== o.date;
  if (o.allDay) return piuGiorni ? `tutto il giorno · fino al ${prettyDate(fine)}` : "tutto il giorno";
  if (!piuGiorni) return `${o.start}–${o.end}`;
  if (d === o.date) return `dalle ${o.start} · fino al ${prettyDate(fine)}`;
  if (d === fine)   return `fino alle ${o.end}`;
  return `tutto il giorno · fino al ${prettyDate(fine)}`;
}

function eventRow(o, d, futuro){
  const dd = futuro ? daysBetween(d, o.date) : 0;
  return `
  <button class="actrow" data-ev="${o.id}">
    <div class="imp" style="min-height:34px;background:${futuro ? "var(--line)" : "var(--accent)"}"></div>
    <div class="rbody">
      <div class="rtitle">${esc(o.label)}</div>
      <div class="rmeta">${futuro
        ? `${GG3[dow(o.date)]} ${prettyDate(o.date)} · ${dd === 1 ? "domani" : `fra ${dd} giorni`}${o.allDay ? "" : ` · ${o.start}`}`
        : evWhen(o, d)}${o.place ? `<span class="dot">·</span>${esc(o.place)}` : ""}${o.busy === false && !o.allDay ? `<span class="dot">·</span>non occupa il tempo` : ""}</div>
      ${o.note ? `<div class="rmeta" style="color:var(--ink-faint)">${esc(o.note)}</div>` : ""}
    </div>

}

function eventsHTML(T){
  const oggi = eventsOn(T), presto = eventsSoon(T);
  if (!oggi.length && !presto.length) return "";
  return `
  ${oggi.length ? `<h2>Oggi hai</h2>
  <div class="card">${oggi.map(o => eventRow(o, T, false)).join("")}</div>` : ""}
  ${presto.length ? `<h2>Sta arrivando</h2>
  <div class="card">${presto.map(o => eventRow(o, T, true)).join("")}</div>` : ""}`;
}

/* ---------- la giornata sveglio ----------
   Il tempo libero non è "dalle 7 alle 23" per tutti: dipende da quanto
   dormi. Da qui esce sia il conto delle ore libere sia la barra di Oggi. */
function awakeFrom(){ return toMin(S.wake || "07:00"); }
function awakeTo(){
  const h = Math.min(14, Math.max(3, S.sleepH || 7));
  return Math.min(1440, awakeFrom() + Math.round((24 - h) * 60));
}

function freeMinutesOn(d){
  const a = awakeFrom(), b = awakeTo();
  const occupato = busyOn(d)
    .map(([s,e]) => [Math.max(s,a), Math.min(e,b)])
    .filter(([s,e]) => e > s)
    .reduce((sum,[s,e]) => sum + (e - s), 0);
  return Math.max(0, (b - a) - occupato);
}

  }).join("");
}

// quanto hai dormito davvero, dalla scheda Salute
function sonnoMedio(){
  const v = S.health.find(x => x.type === "sonno");
  if (!v) return null;
  const T = today(), vals = [];
  for (let i = 1; i <= 14; i++){
    const x = hVal(addDays(T, -i), v.id);
    if (x && x.min) vals.push(x.min);
  }
  if (vals.length < 3) return null;
  return { min: Math.round(vals.reduce((s,x)=>s+x,0) / vals.length), n: vals.length };
}

/* ============================================================
   SALVADANAIO — obiettivi di denaro, aggiornati a mano
   ============================================================ */
const piggySaved = x => (x.moves || []).reduce((s,m) => s + (+m.amount || 0), 0);
const piggyLeft  = x => Math.max(0, (+x.target || 0) - piggySaved(x));
const piggyPct   = x => (+x.target > 0) ? Math.min(100, Math.round(piggySaved(x) / x.target * 100)) : 0;

// quanto mettere via al mese per arrivarci entro la data
function piggyRate(x){
  if (!x.due) return null;
  const gg = daysBetween(today(), x.due);
  if (gg <= 0 || piggyLeft(x) <= 0) return null;
  const mesi = Math.max(1, Math.round(gg / 30));
  return { mesi, al: Math.ceil(piggyLeft(x) / mesi) };
}

function piggyBar(x){
  const q = piggyPct(x);
  return `<div style="height:7px;border-radius:4px;background:var(--surface-2);margin-top:8px;overflow:hidden">
    <div style="height:100%;width:${q}%;background:${q >= 100 ? "var(--done)" : "var(--accent)"};border-radius:4px"></div>
  </div>`;
}

function piggyRow(x){
  const r = piggyRate(x);
  const fatto = piggyLeft(x) <= 0;
  return `
  <button class="actrow" data-pig="${x.id}" style="display:block">
    <div class="rbody">
      <div class="rtitle">${esc(x.name)}${fatto ? " · raggiunto" : ""}</div>
      <div class="rmeta">${euro(piggySaved(x))} su ${euro(+x.target || 0)}<span class="dot">·</span>${fatto ? "ci sei" : `mancano ${euro(piggyLeft(x))}`}${x.due ? `<span class="dot">·</span>entro ${prettyDate(x.due)}` : ""}</div>
      ${piggyBar(x)}
      ${r ? `<div class="rmeta" style="color:var(--ink-faint);margin-top:6px">circa ${euro(r.al)} al mese per ${r.mesi} ${r.mesi === 1 ? "mese" : "mesi"}</div>` : ""}
    </div>
  </button>`;
}

/* ============================================================
   INVESTIMENTI — cosa hai messo dove, quando paga, quando scade
   L'app non legge i mercati: i numeri sono quelli che scrivi tu.
   ============================================================ */
const IKIND = { obbligazione:"Obbligazione", azione:"Azione", etf:"ETF", fondo:"Fondo",
                conto:"Conto deposito", pac:"Piano di accumulo", altro:"Altro" };
const IPAY  = { nessuna:"Non paga niente", cedola:"Cedola", dividendo:"Dividendo", interessi:"Interessi" };
const IEVERY = { 1:"ogni mese", 3:"ogni 3 mesi", 6:"ogni 6 mesi", 12:"una volta l'anno" };

function addMonths(sIso, n){
  const d = fromIso(sIso), giorno = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(giorno, ultimo));
  return iso(d);
}

const investOpen = () => S.invest.filter(x => !x.closed);
const investCashed = x => (x.payments || []).reduce((s,m) => s + (+m.amount || 0), 0);

function investTotals(){
  let messo = 0, incassato = 0;
  for (const x of investOpen()) messo += (+x.amount || 0);
  for (const x of S.invest) incassato += investCashed(x);
  return { messo, incassato };
}

// il prossimo appuntamento: una cedola da incassare o una scadenza
function investNext(x){
  const T = today(), out = [];
  if (x.nextPay && x.nextPay >= T) out.push({ d:x.nextPay, k:"pagamento" });
  if (x.maturity && x.maturity >= T) out.push({ d:x.maturity, k:"scadenza" });
  out.sort((a,b) => a.d.localeCompare(b.d));
  return out[0] || null;
}

function investAlerts(T){
  const out = [];
  for (const x of investOpen()){
    if (x.nextPay){
      const dd = daysBetween(T, x.nextPay);
      if (dd >= 0 && dd <= 7) out.push({ id:x.id, t:`${x.name}: ${IPAY[x.payType] || "pagamento"} ${dd === 0 ? "oggi" : dd === 1 ? "domani" : `fra ${dd} giorni`}` });
      else if (dd < 0) out.push({ id:x.id, t:`${x.name}: ${IPAY[x.payType] || "pagamento"} era il ${prettyDate(x.nextPay)}, da segnare` });
    }
    if (x.maturity){
      const dd = daysBetween(T, x.maturity);
      if (dd >= 0 && dd <= 30) out.push({ id:x.id, t:`${x.name} scade ${dd === 0 ? "oggi" : `fra ${dd} giorni`}` });
    }
  }
  return out;
}

function investRow(x){
  const T = today();
  const nx = investNext(x);
  const inc = investCashed(x);
  return `
  <button class="actrow" data-inv="${x.id}">
    <div class="imp" style="min-height:38px;background:${x.closed ? "var(--line)" : "var(--accent)"}"></div>

      <div class="rmeta">${IKIND[x.kind] || "Altro"}<span class="dot">·</span>${euro(+x.amount || 0)}${x.broker ? `<span class="dot">·</span>${esc(x.broker)}` : ""}</div>
      <div class="rmeta" style="color:var(--ink-faint)">
        ${x.closed ? `chiuso il ${prettyDate(x.closed.d)}`
          : nx ? `${nx.k === "pagamento" ? (IPAY[x.payType] || "pagamento") : "scadenza"} ${prettyDate(nx.d)}${daysBetween(T, nx.d) <= 7 ? " · a giorni" : ""}`
               : "nessuna data in vista"}${inc ? `<span class="dot">·</span>incassati ${euro(inc)}` : ""}</div>
    </div>
  </button>`;
}

/* ============================================================
   USCITE — abbonamenti, spese fisse e uscite straordinarie
   ============================================================ */
const OGNI = {
  w:    { nome:"Ogni settimana", mesi:0,  giorni:7 },
  m:    { nome:"Ogni mese",      mesi:1 },
  "2m": { nome:"Ogni 2 mesi",    mesi:2 },
  "3m": { nome:"Ogni 3 mesi",    mesi:3 },
  "6m": { nome:"Ogni 6 mesi",    mesi:6 },
  y:    { nome:"Una volta l'anno", mesi:12 },
  once: { nome:"Una tantum",     mesi:0 }
};
const BCAT = ["Casa","Telefono e internet","Streaming","Assicurazioni","Auto","Salute","Sport","Lavoro","Altro"];

const billsOpen = () => S.bills.filter(b => !b.closed);

// quanto pesa al mese: tutto ridotto alla stessa misura
function billMonthly(b){
  const a = +b.amount || 0;
  if (b.every === "w") return a * 4.345;
  if (b.every === "once") return 0;
  const m = OGNI[b.every] ? OGNI[b.every].mesi : 1;
  return m ? a / m : 0;
}

function billTotals(){
  let mese = 0, anno = 0, unaTantum = 0;
  for (const b of billsOpen()){
    if (b.every === "once"){ unaTantum += +b.amount || 0; continue; }
    mese += billMonthly(b);
  }
  anno = mese * 12;
  return { mese: Math.round(mese * 100) / 100, anno: Math.round(anno), unaTantum };
}

function billNextDate(b){
  if (!b.next) return "";
  if (b.every === "w") return addDays(b.next, 7);
  const m = OGNI[b.every] ? OGNI[b.every].mesi : 0;
  return m ? addMonths(b.next, m) : "";
}

function billAlerts(T){
  const out = [];
  for (const b of billsOpen()){
    if (!b.next) continue;
    const dd = daysBetween(T, b.next);
    const soglia = (b.warn >= 0 ? b.warn : S.billWarn);
    if (dd < 0) out.push({ id:b.id, t:`${b.name}: ${euro(+b.amount||0)} era il ${prettyDate(b.next)}` });
    else if (dd <= soglia) out.push({ id:b.id, t:`${b.name}: ${euro(+b.amount||0)} ${dd === 0 ? "oggi" : dd === 1 ? "domani" : `fra ${dd} giorni`}` });
  }
  return out;
}

function billRow(b, T){
  const dd = b.next ? daysBetween(T, b.next) : null;
  const vicino = dd !== null && dd <= (b.warn >= 0 ? b.warn : S.billWarn);
  return `
  <button class="actrow" data-bill="${b.id}">
    <div class="imp" style="min-height:38px;background:${b.closed ? "var(--line)" : vicino ? "var(--warn)" : "var(--busy)"}"></div>
    <div class="rbody">
      <div class="rtitle"${b.closed ? ` style="color:var(--ink-faint)"` : ""}>${esc(b.name)} · ${euro(+b.amount || 0)}</div>
      <div class="rmeta">${OGNI[b.every] ? OGNI[b.every].nome.toLowerCase() : ""}${b.cat ? `<span class="dot">·</span>${esc(b.cat)}` : ""}${b.method ? `<span class="dot">·</span>${esc(b.method)}` : ""}</div>
      <div class="rmeta" style="color:${vicino && !b.closed ? "var(--warn)" : "var(--ink-faint)"}">
        ${b.closed ? `disdetto il ${prettyDate(b.closed.d)}`
          : b.next ? `${dd < 0 ? `scaduta da ${-dd} ${-dd === 1 ? "giorno" : "giorni"}` : dd === 0 ? "esce oggi" : dd === 1 ? "esce domani" : `esce fra ${dd} giorni`} · ${prettyDate(b.next)}`
                   : "senza data"}${b.every !== "once" && !b.closed ? `<span class="dot">·</span>${euro(Math.round(billMonthly(b) * 100) / 100)} al mese` : ""}</div>
    </div>
  </button>`;
}

   IL TELEFONO — notifiche, sveglie e timer, quando l'app gira
   dentro l'involucro Android. Nel browser questo pezzo dorme.
   ============================================================ */
const NAT = (typeof window !== "undefined" && window.CoachNativo) ? window.CoachNativo : null;
const inApp = () => { try { return !!(NAT && NAT.disponibile()); } catch(e){ return false; } };

const alle = (d, hhmm) => {
  const [h,m] = (hhmm || "08:00").split(":").map(Number);
  const x = fromIso(d); x.setHours(h, m, 0, 0);
  return x.getTime();
};

/* Tutto quello che merita una notifica nei prossimi sette giorni. */
function avvisiDaProgrammare(){
  const T = today(), ora = Date.now(), out = [];
  const metti = (id, quando, titolo, testo, forte) => {
    if (quando > ora + 60000) out.push({ id, quando, titolo, testo, forte: !!forte });
  };

  for (let i = 0; i < 7; i++){
    const d = addDays(T, i);

    // il riassunto del mattino
    if (S.push.on){
      const acts = planFor(d).length, rem = remindersOn(d).length;
      if (acts || rem){
        const pezzi = [];
        if (acts) pezzi.push(`${acts} ${acts === 1 ? "attività" : "attività"}`);
        if (rem) pezzi.push(`${rem} ${rem === 1 ? "promemoria" : "promemoria"}`);
        metti("giorno-" + d, alle(d, S.push.ora), "La giornata", pezzi.join(" e ") + " da fare oggi.");
      }
    }

    // la chiusura serale
    if (S.push.sera && !S.closes[d])
      metti("chiusura-" + d, alle(d, S.closeAt || "21:00"), "Chiudi la giornata", "Due minuti per dire com'è andata.");

    // la spesa
    if (shopDay(d) && shopLeft())
      metti("spesa-" + d, alle(d, "17:30"), "Spesa", `${shopLeft()} ${shopLeft() === 1 ? "cosa" : "cose"} in lista.`);

    // eventi del giorno, mezz'ora prima
    for (const o of eventsOn(d)){
      if (o.allDay) metti("ev-" + o.id + "-" + d, alle(d, "08:30"), o.label, o.place || "Oggi.", true);
      else metti("ev-" + o.id + "-" + d, alle(d, o.start) - 30*60000, o.label,
                 `Alle ${o.start}${o.place ? " · " + o.place : ""}.`, true);
    }
    // eventi in arrivo, il giorno del preavviso
    for (const o of eventsSoon(d)){
      const dd = daysBetween(d, o.date);
      if (dd === o.warn) metti("evpre-" + o.id, alle(d, "09:00"), o.label,
        `Fra ${dd} ${dd === 1 ? "giorno" : "giorni"}${o.place ? " · " + o.place : ""}.`);
    }

    // la valigia, la sera prima
    for (const t of S.trips){
      const dd = daysBetween(d, t.date);
      const restano = t.items.filter(x => !tripDone(t.id, x.id)).length;
      if (dd === 1 && restano) metti("vg-" + t.id, alle(d, "20:00"), "Valigia · " + t.name,
        `${restano} ${restano === 1 ? "cosa" : "cose"} da mettere: si parte domani.`, true);
    }

    // uscite in arrivo
    for (const b of billsOpen()){
      if (!b.next) continue;
      const soglia = (b.warn >= 0 ? b.warn : S.billWarn);
      if (daysBetween(d, b.next) === soglia)
        metti("bill-" + b.id, alle(d, "09:00"), b.name, `${euro(+b.amount||0)} il ${prettyDate(b.next)}.`);
    }

    // investimenti: cedole e scadenze
    for (const x of investOpen()){
      if (x.nextPay && daysBetween(d, x.nextPay) === 2)
        metti("inv-" + x.id, alle(d, "09:00"), x.name, "Pagamento fra due giorni.");
      if (x.maturity && daysBetween(d, x.maturity) === 30)
        metti("invm-" + x.id, alle(d, "09:00"), x.name, "Scade fra un mese.");
    }

    // frigo: quello che scade quel giorno
    const scad = S.fridge.filter(f => f.exp === d).map(f => f.name);
    if (scad.length) metti("frigo-" + d, alle(d, "10:00"), "Frigo",
      `${scad.slice(0,3).join(", ")} ${scad.length === 1 ? "scade" : "scadono"} oggi.`);
  }

  return out.sort((a,b) => a.quando - b.quando).slice(0, 48);
}

      document.body.appendChild(a); a.click();

function rimettiBackup(testo){
  try {
    const dati = JSON.parse(testo);
    if (!dati || typeof dati !== "object" || !dati.v) throw new Error("non è un backup");
    if (!confirm("Rimetto dentro questo backup al posto di quello che c'è adesso?")) return false;
    const sync = S.sync;
    S = dati; migrate();
    if (sync && sync.token && !(S.sync && S.sync.token)) S.sync = sync;   // il token resta di questo dispositivo
    applyTheme(); runEngine(); save(); render();
    alert("Fatto: i tuoi dati sono dentro.");
    return true;
  } catch(e){ alert("Questo non è un backup del Coach."); return false; }
}

/* ============================================================
   SINCRONIZZAZIONE — i dati vivono in un file dentro un tuo
   deposito GitHub privato: così due telefoni vedono le stesse cose
   e ogni salvataggio lascia una copia nello storico.
   ============================================================ */
const SYNCFILE = "stato.json";
let SYNCSTATO = "fermo";
let SYNCTIMER = null;

const syncPronto = () => !!(S.sync && S.sync.repo && S.sync.token);

function b64(testo){
  const byte = new TextEncoder().encode(testo);
  let s = "";
  byte.forEach(b => s += String.fromCharCode(b));
  return btoa(s);
}
function unb64(dati){
  const bin = atob(dati.replace(/\n/g, ""));
  const byte = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(byte);
}

async function ghChiama(metodo, corpo){
  const url = `https://api.github.com/repos/${S.sync.repo}/contents/${SYNCFILE}`;
  const r = await fetch(url, {
    method: metodo,
    headers: {
      "Authorization": "Bearer " + S.sync.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  return r;
}

async function syncScarica(){
  const r = await ghChiama("GET");
  if (r.status === 404) return { vuoto:true };
  if (!r.ok) throw new Error("GitHub ha risposto " + r.status);
  const j = await r.json();
  S.sync.sha = j.sha;
  return { dati: JSON.parse(unb64(j.content)), sha: j.sha };
}

async function syncCarica(messaggio){
  const corpo = {
    message: messaggio || ("coach " + new Date().toISOString()),
    content: b64(JSON.stringify(S))
  };
  if (S.sync.sha) corpo.sha = S.sync.sha;
  let r = await ghChiama("PUT", corpo);
  if (r.status === 409 || r.status === 422){          // qualcuno ha scritto prima di noi
    const giu = await syncScarica();
    if (!giu.vuoto && (giu.dati.updatedAt || 0) > (S.updatedAt || 0)){
      S = giu.dati; migrate(); applyTheme(); runEngine(); render();
      return "preso";
    }
    corpo.sha = S.sync.sha;
    r = await ghChiama("PUT", corpo);
  }
  if (!r.ok) throw new Error("GitHub ha risposto " + r.status);
  const j = await r.json();
  S.sync.sha = j.content && j.content.sha;
  return "mandato";
}

async function sincronizza(forzaInvio){
  if (!syncPronto() || SYNCSTATO === "in corso") return;
  SYNCSTATO = "in corso";
  if (TAB === "opzioni") render();
  try {
    const giu = await syncScarica();
    if (!giu.vuoto && !forzaInvio && (giu.dati.updatedAt || 0) > (S.updatedAt || 0) + 500){
      const sha = S.sync.sha, sync = { ...S.sync };
      S = giu.dati; migrate();
      S.sync = sync; S.sync.sha = sha;
      applyTheme(); runEngine();
      S.sync.last = Date.now();
      salvaSolo();
      SYNCSTATO = "preso";
      render();
      return;
    }
    await syncCarica();
    S.sync.last = Date.now();
    salvaSolo();
    SYNCSTATO = "a posto";
  } catch(e){
    SYNCSTATO = "errore: " + (e && e.message ? e.message : e);
  }
  if (TAB === "opzioni") render();
}

// salva senza far ripartire il giro della sincronizzazione
function salvaSolo(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
}

function syncDopoIlSalvataggio(){
  if (!syncPronto() || !S.sync.auto) return;
  clearTimeout(SYNCTIMER);
  SYNCTIMER = setTimeout(() => sincronizza(true), 4000);
}

  let bar = document.getElementById("errbar");
  if (!bar){
    bar = document.createElement("div");
    bar.id = "errbar";
    bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#8C2F1A;color:#fff;"
      + "font-size:12px;padding:9px 12px;line-height:1.35";
    document.body.appendChild(bar);
  }
  bar.textContent = "Errore: " + (e.message || e) + " — mandalo a Claude.";
});

document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => { PROGSUB = null; TAB = b.dataset.tab; render(); });
document.getElementById("fab").onclick = () => openQuick();

// l'ora in testata si aggiorna da sola, senza ridisegnare niente
setInterval(() => {
  const o = document.getElementById("tb-ora");
  if (o) o.textContent = toHHMM(nowMin());
}, 20000);

// se segui il telefono e lui passa a scuro, cambia con lui
try {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onMq = () => { if (S && S.mode === "auto"){ applyTheme(); if (TAB === "opzioni") render(); } };
  mq.addEventListener ? mq.addEventListener("change", onMq) : mq.addListener(onMq);
} catch(e){}

// il guardiano offline: c'è solo quando l'app vive su un sito vero
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

(async () => {
  await loadState();
  runEngine();
  render();
  gcalStart();
  riprogrammaAvvisi();
  if (syncPronto()) sincronizza();
})();

// tornando dentro dopo un po': ricontrolla se un altro dispositivo ha scritto
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (syncPronto() && S.sync.auto && (!S.sync.last || Date.now() - S.sync.last > 60000)) sincronizza();
});

// re-run the engine when the app comes back into view after midnight
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (RUN && !RUN.paused){ RUN.mark = Date.now() - 0; keepAwake(true); drawRun(); }
  if (S && S.lastRun !== today()){ runEngine(); render(); }
});
</script>
</body>
